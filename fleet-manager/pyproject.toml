[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-manager"
version = "0.1.0-dev1"
description = "Standalone, preservation-safe fleet configuration and capacity planner."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "setuptools>=83.0.0", "wheel"]

[project.scripts]
fleet-manager = "fleet_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["client_distribution_full: additional native artifact build/refusal matrix for full/manual validation"]
