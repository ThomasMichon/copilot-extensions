[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
agent-procutil = { path = "../libs/agent-procutil", editable = true }

[project]
name = "fleet-manager"
version = "0.1.0-dev1"
description = "Standalone fleet planner and opt-in authenticated Gateway runtime and SDK."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
release-verification = ["cryptography>=46,<47"]
construction = ["pip>=25.1,<26"]
auth = ["PyJWT>=2.10,<3", "cryptography>=44", "jwcrypto>=1.5.6,<2", "joserfc>=1.7.5,<2"]
server = ["agent-procutil>=0.1.0.dev7", "PyJWT>=2.10,<3", "cryptography>=44", "jwcrypto>=1.5.6,<2", "joserfc>=1.7.5,<2"]
service-gateway = ["agent-procutil>=0.1.0.dev7", "aiohttp>=3.14.4,<4", "PyJWT>=2.10,<3", "cryptography>=44", "jwcrypto>=1.5.6,<2", "joserfc>=1.7.5,<2"]
komodo-host = ["agent-procutil>=0.1.0.dev7", "aiohttp>=3.14.4,<4"]
ssh-client = ["aiohttp>=3.14.4,<4", "PyJWT>=2.10,<3", "cryptography>=44", "jwcrypto>=1.5.6,<2", "joserfc>=1.7.5,<2", "agent-ssh>=0.1.1.dev2", "agent-single-instance-lease"]
runtime-authentication = ["joserfc>=1.7.5,<2"]
dev = ["agent-procutil>=0.1.0.dev7", "pytest", "pytest-timeout>=2.4,<3", "setuptools>=83.0.0", "wheel", "pip>=25.1,<26", "PyJWT>=2.10,<3", "cryptography>=46,<47", "jwcrypto>=1.5.6,<2", "joserfc>=1.7.5,<2", "aiohttp>=3.14.4,<4", "agent-ssh>=0.1.1.dev2", "agent-single-instance-lease"]

[project.scripts]
fleet-manager = "fleet_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fleet_manager = ["ssh-client-contract.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "client_distribution_full: additional native artifact build/refusal matrix for full/manual validation",
    "observation_retention_full: production-size durable replay retention window for full/manual validation",
]
