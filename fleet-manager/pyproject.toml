[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[project]
name = "fleet-manager"
version = "0.1.0-dev1"
description = "Standalone fleet planner and opt-in authenticated Gateway runtime and SDK."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
release-verification = ["cryptography>=46,<47"]
auth = ["PyJWT>=2.10,<3", "cryptography>=44", "jwcrypto>=1.5.6,<2", "joserfc>=1.7.5,<2"]
server = ["PyJWT>=2.10,<3", "cryptography>=44", "jwcrypto>=1.5.6,<2", "joserfc>=1.7.5,<2"]
service-gateway = ["aiohttp>=3.14.4,<4", "PyJWT>=2.10,<3", "cryptography>=44", "jwcrypto>=1.5.6,<2", "joserfc>=1.7.5,<2"]
runtime-authentication = ["joserfc>=1.7.5,<2"]
dev = ["pytest", "setuptools>=83.0.0", "wheel", "PyJWT>=2.10,<3", "cryptography>=46,<47", "jwcrypto>=1.5.6,<2", "joserfc>=1.7.5,<2", "aiohttp>=3.14.4,<4"]

[project.scripts]
fleet-manager = "fleet_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "client_distribution_full: additional native artifact build/refusal matrix for full/manual validation",
    "observation_retention_full: production-size durable replay retention window for full/manual validation",
]
