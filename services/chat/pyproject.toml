[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
agent-single-instance-lease = { path = "../../libs/single-instance-lease", editable = true }
agent-endpoint-rendezvous = { path = "../../libs/endpoint-rendezvous", editable = true }
agent-procutil = { path = "../../libs/agent-procutil", editable = true }

[project]
name = "agent-chat-service"
version = "0.1.0-dev1"
description = "Bounded conversation core with explicit installed client and local hosting roles."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
service = ["agent-single-instance-lease>=0.1.0.dev1", "agent-endpoint-rendezvous>=0.1.0.dev6"]
client = ["agent-procutil>=0.1.0.dev7"]
dev = [
    "pytest>=8", "setuptools>=83.0.0", "wheel", "psutil>=7.0",
    "agent-single-instance-lease>=0.1.0.dev1", "agent-endpoint-rendezvous>=0.1.0.dev6",
    "agent-procutil>=0.1.0.dev7",
]

[project.scripts]
agent-chat-service = "agent_chat_service.hosting:main"
agent-chat = "agent_chat_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 99
