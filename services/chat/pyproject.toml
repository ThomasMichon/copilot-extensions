[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[project]
name = "agent-chat-service"
version = "0.1.0-dev1"
description = "Portable, bounded conversation state and RPC core for agent-chat."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "setuptools>=83.0.0", "wheel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 99
