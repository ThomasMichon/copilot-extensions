[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[project]
name = "agent-pull-requests-service"
version = "0.1.0-dev1"
description = "Independent foreground PR watcher and durable subscription registrar."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["agent-pull-requests[fleet]>=0.1.0.dev5"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "setuptools>=83.0.0", "wheel"]

[project.scripts]
agent-pull-requests-service = "agent_pull_requests_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 99
