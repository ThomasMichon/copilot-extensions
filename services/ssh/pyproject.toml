[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[project]
name = "agent-ssh-service"
version = "0.1.0-dev1"
description = "Gateway-registered SSH enrollment and public-directory service."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fleet-manager[service-gateway]>=0.1.0.dev1",
    "agent-single-instance-lease",
    "agent-procutil",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.3.0", "setuptools>=83.0.0", "wheel"]

[project.scripts]
agent-ssh-service = "agent_ssh_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 99
