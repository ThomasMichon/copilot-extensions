[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-index-service"
version = "0.1.0-dev1"
description = "Standalone local API and master controller for agent-index."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "agent-index>=0.10.12.dev1",
    "pyyaml>=6.0",
    "packaging>=23",
]

[project.optional-dependencies]
native = ["agent-index[store,server]>=0.10.12.dev1"]
test = [
    "pytest",
    "httpx>=0.27",
    "setuptools>=83.0.0",
    "wheel",
]

[project.scripts]
agent-index-service = "agent_index_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
