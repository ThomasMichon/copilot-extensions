]

[[plugins]]
name = "copilot-extensions-harness"
kind = "knowledge"
summary = "Contributing-to / diagnosing the copilot-extensions harness itself."
steps = [
    { id = "enable", what = "Skills/instructions only — active once the plugin is enabled; no build step." },
]

[[plugins]]
name = "wsl-setup"
kind = "knowledge"
summary = "WSL environment setup + networking troubleshooting guidance."
steps = [
