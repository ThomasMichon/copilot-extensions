[[plugins]]
name = "harness-knowledge"
kind = "knowledge"
summary = "Binds a knowledge repo + assembles per-plugin knowledge fragments."
depends_on = ["agent-worktrees"]
steps = [
    { id = "enable", what = "Skills/instructions only; its own bind_knowledge configurator is run on demand via the binding-knowledge skill — no install-time build step." },
]
