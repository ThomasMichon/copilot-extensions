# agent-worktrees psmux keystroke passthrough (per-session).
#
# Sourced by the launcher via `psmux source-file -t <session> <this file>` at
# each session create/join, so it applies to THAT session's psmux server only.
# psmux runs one server per wt-<id> (key tables are per-server), so this is
# effectively per-session and never leaks onto a personal psmux session.
#
# WHY a sourced fragment and not command-line binds: on psmux, command-line
# `bind-key`/`unbind-key` (with or without -t) silently NO-OP -- only directives
# applied via source-file (or read from a startup config) actually take effect.
# Verified on psmux 3.3.3 and 3.3.6.
#
# psmux-only. tmux (one shared server) uses the opt-in apply-mux-keybinds.sh so
# worktree tuning never leaks onto a user's personal tmux sessions.

# Only the prefix (Ctrl+B) is intercepted; every unprefixed key/mouse event
# passes straight through to the inner Copilot (so PageUp/PageDown and arrows
# reach the app instead of entering psmux copy-mode).
set -g prefix C-b
unbind-key -a -T root
# Re-add mouse-wheel passthrough (cleared by the unbind above); relay the wheel
# event to the pane instead of psmux copy-mode.
bind-key -T root WheelUpPane   send-keys -M
bind-key -T root WheelDownPane send-keys -M
# Disable Windows Ctrl+V paste interception (psmux fires this outside the key
# table, so clearing the root table alone does not stop it).
set -g paste-detection off
