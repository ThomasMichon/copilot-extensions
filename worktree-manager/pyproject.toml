[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[project]
name = "copilot-extensions-worktree-manager"
version = "0.1.0-dev97"
description = "Standalone, out-of-plugin control plane (installer, configurator & worktree launcher) for the copilot-extensions harness."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Thomas Michon" }]
# Textual is the visual-wizard toolkit the Phase 4 configurator UI uses; declared
# now so the packaging/venv is validated against the real dependency, even
# though the Phase 0 skeleton does not yet import it.
dependencies = [
    "agent-process-telemetry",
    "textual>=8.2.8",
    # Read the installer-owned catalog (data/plugins.toml). tomllib is stdlib on
    # 3.11+; tomli backports it for 3.10.
    "tomli>=2 ; python_version < '3.11'",
    # Read the harness's own YAML registries/config (repos.yaml, projects.yaml,
    # per-project config.yaml) for the Manager state views.
    "pyyaml>=6",
    # Manager-owned same-machine Agent Host Protocol provider.
    "websocket-client>=1.8.0",
    # Optional-at-runtime native Linux shutdown notification/FD transport.
    "dbus-next==0.2.3 ; sys_platform == 'linux'",
    # Resolve a repo's own committed Copilot/Claude plugin config so AHP
    # sessions can replicate it (client-contributed plugins), the same way
    # agent-bridge stages a repo's plugin stack for a standalone launch.
    "agent-plugin-resolve",
    # Shared Windows-headless / detached process-spawn kwargs (module
    # ``agent_procutil``). This is a `uv`-editable canonical reference
    # (vendor-pointer-generalization effort, Phase 1): `path` escapes this
    # plugin's own root and resolves live to `libs/agent-procutil`, so this
    # `dev`-branch checkout has nothing to keep manually in sync -- only a
    # real `main`-branch release (tools/materialize_main.py) ever gets a
    # real local copy. Used by the production Picker's SSH/maintenance/task
    # subprocess spawns (copilot-extensions#3359).
    "agent-procutil",
    # Resilient scan authority, entry decisions, and bounded warning tracking
    # for filesystem registries (module ``dropin_registry``). Used by the
    # production Picker's pivot-registry scan/materialization
    # (copilot-extensions#3359).
    "agent-dropin-registry",
    # Effective global-or-adopted-project plugin eligibility and
    # identity-verified roots for attributed registry entries (module
    # ``plugin_activation``). Used by the production Picker's pivot-registry
    # scan/materialization (copilot-extensions#3359).
    "agent-plugin-activation",
    # Coalesce/refcount/idle-exit daemon wire protocol + client (module
    # ``work_coalescing_singleton``). Used by the Manager mux-companion
    # daemon (``mux_daemon.py``, Phase 3b Sub-slice 3 Step 2) to serve
    # ``mux-status-v1`` requests from agent-worktrees, mirroring
    # ``agent_worktrees.mux_link``'s own use of the same shared library.
    "agent-work-coalescing-singleton",
    # Zero-downtime active/passive cutover primitives (routing table +
    # orchestrator). This is a `uv`-editable canonical reference on `dev`
    # (shared with the runtime plugins), and only a materialized `main`
    # payload carries the real local vendored tree. Used by the resident
    # mux-daemon update path.
    "agent-zdd",
    # Shared POSIX login-shell command wrapping for remote SSH exec (module
    # ``remote_login_shell``, copilot-extensions#5207).
    "agent-remote-login-shell",
    # Shared machines.yaml registry parsing, canonicalized local-machine
    # identity, and local-vs-SSH transport resolution (module
    # ``machine_transport``). Used by the production Picker's
    # local-vs-remote dispatch decisions (data_local.is_local/data_ssh.is_local).
    "agent-machine-transport",
    # Shared update-run telemetry: JSONL events, folded status file, and the
    # update exit-code table (module ``update_telemetry``). Used by
    # ``worktree-manager update``, which owns the run the engine joins.
    "agent-update-telemetry",
    "agent-update-driver",
    "agent-worktree-identity",
]

[tool.uv.sources]
agent-process-telemetry = { path = "../libs/process-telemetry", editable = true }
# TODO: REMOVE ON 2026-10-28 OR LATER, once native UV accepts dbus-next==0.2.3
# from the affected mirror with exclude-newer="7 days". Remove the bundled
# wheel and _bundled_dbus_next exception too; see vendor/README.md and #7461.
dbus-next = { path = "vendor/dbus_next-0.2.3-py3-none-any.whl" }
agent-worktree-identity = { path = "../libs/worktree-identity", editable = true }
# Always resolve the vendored lib from the local path, never an index.
# Copilot CLI + Claude plugin resolution -- marketplaces, plugins, repo settings
# (module ``plugin_resolve``). Vendored per the harness's shared-lib convention
# (dotfiles#929); kept byte-identical to every other copy by
# tools/check-vendored-libs-sync.py.
agent-plugin-resolve = { path = "../libs/plugin-resolve", editable = true }
# `path` escapes this plugin's own root and resolves live to
# `libs/agent-procutil`, so this `dev`-branch checkout has nothing to keep
# manually in sync -- only a real `main`-branch release
# (tools/materialize_main.py) ever gets a real local copy.
agent-procutil = { path = "../libs/agent-procutil", editable = true }
# Resilient scan authority, entry decisions, and bounded warning tracking for
# filesystem registries (module ``dropin_registry``).
agent-dropin-registry = { path = "../libs/dropin-registry", editable = true }
# Effective global-or-adopted-project plugin eligibility and identity-verified
# roots for attributed registry entries (module ``plugin_activation``).
agent-plugin-activation = { path = "../libs/plugin-activation", editable = true }
# Coalesce/refcount/idle-exit daemon wire protocol + client (module
# ``work_coalescing_singleton``). This is a `uv`-editable canonical reference
# (vendor-pointer-generalization effort, Phase 1): `path` escapes this
# project's own root and resolves live to `libs/work-coalescing-singleton`,
# so this `dev`-branch checkout has nothing to keep manually in sync -- only
# a real `main`-branch release (tools/materialize_main.py) ever gets a real
# local copy.
agent-work-coalescing-singleton = { path = "../libs/work-coalescing-singleton", editable = true }
# Zero-downtime active/passive cutover primitives (module ``zdd``). This is a
# `uv`-editable canonical reference (vendor-pointer-generalization effort,
# Phase 1): `path` escapes this project's own root and resolves live to
# `libs/zdd`, so this `dev`-branch checkout has nothing to keep manually in
# sync -- only a real `main`-branch release (tools/materialize_main.py)
# ever gets a real local copy.
agent-zdd = { path = "../libs/zdd", editable = true }
# Shared POSIX login-shell command wrapping for remote SSH exec (module
# ``remote_login_shell``, copilot-extensions#5207). This is a `uv`-editable
# canonical reference (vendor-pointer-generalization effort, Phase 1): `path`
# escapes this project's own root and resolves live to
# `libs/remote-login-shell`, so this `dev`-branch checkout has nothing to
# keep manually in sync -- only a real `main`-branch release
# (tools/materialize_main.py) ever gets a real local copy.
agent-remote-login-shell = { path = "../libs/remote-login-shell", editable = true }
# Shared machines.yaml registry parsing, canonicalized local-machine
# identity, and local-vs-SSH transport resolution (module
# ``machine_transport``). This is a `uv`-editable canonical reference
# (vendor-pointer-generalization effort, Phase 1): `path` escapes this
# project's own root and resolves live to `libs/machine-transport`, so this
# `dev`-branch checkout has nothing to keep manually in sync -- only a real
# `main`-branch release (tools/materialize_main.py) ever gets a real local
# copy.
agent-machine-transport = { path = "../libs/machine-transport", editable = true }
# Shared update-run telemetry (module ``update_telemetry``). This is a
# `uv`-editable canonical reference (vendor-pointer-generalization effort,
# Phase 1): `path` escapes this project's own root and resolves live to
# `libs/update-telemetry`, so this `dev`-branch checkout has nothing to keep
# manually in sync -- only a real `main`-branch release
# (tools/materialize_main.py) ever gets a real local copy.
agent-update-telemetry = { path = "../libs/update-telemetry", editable = true }
agent-update-driver = { path = "../libs/update-driver", editable = true }

[project.scripts]
worktree-manager = "worktree_manager.__main__:console_entry"

[project.optional-dependencies]
dev = ["pytest>=8", "setuptools>=83.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the declarative plugin-knowledge catalog inside the package.
worktree_manager = ["data/*.toml"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
# Cold construction is prepared under the existing bounded native group before
# explicit file selection; its assertions keep the normal per-item deadline.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "native"]
markers = [
    "guard: fast structural and contract checks",
    "contract(name): behavioral contract attribution",
]

[tool.ruff.lint.per-file-ignores]
"src/worktree_manager/production_picker/picker_tui/engine.py" = [
    "RUF001", "RUF002", "RUF003", "B007", "RUF005", "RUF059",
]
