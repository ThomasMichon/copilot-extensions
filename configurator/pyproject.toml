[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-extensions-configurator"
version = "0.1.0-dev4"
description = "Standalone, out-of-plugin installer & configurator for the copilot-extensions harness."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Thomas Michon" }]
# Textual is the visual-wizard toolkit the Phase 4 configurator uses; declared
# now so the packaging/venv is validated against the real dependency, even
# though the Phase 0 skeleton does not yet import it.
dependencies = [
    "textual>=0.80",
    # Read the installer-owned catalog (data/plugins.toml). tomllib is stdlib on
    # 3.11+; tomli backports it for 3.10.
    "tomli>=2 ; python_version < '3.11'",
    # Read the harness's own YAML registries/config (repos.yaml, projects.yaml,
    # per-project config.yaml) for the Manager state views.
    "pyyaml>=6",
]

[project.scripts]
configurator = "configurator.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the declarative plugin-knowledge catalog inside the package.
configurator = ["data/*.toml"]

[tool.ruff]
target-version = "py310"
line-length = 99
