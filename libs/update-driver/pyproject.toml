[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-update-driver"
version = "0.1.0-dev1"
description = "Durable, execution-owned installation transaction queue"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["agent-procutil", "agent-single-instance-lease"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
agent-procutil = { path = "../agent-procutil", editable = true }
agent-single-instance-lease = { path = "../single-instance-lease", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
update_driver = ["participant.ps1"]

[tool.ruff]
target-version = "py310"
line-length = 99
