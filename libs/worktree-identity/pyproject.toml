[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[project]
name = "agent-worktree-identity"
version = "0.1.0-dev1"
description = "Dependency-free decoding of explicit worktree machine identity metadata"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Thomas Michon" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
