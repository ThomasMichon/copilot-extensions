[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is namespaced (agent-machine-transport) to prevent
# dependency-confusion; the import module is ``machine_transport``.
# Mirrors agent-remote-login-shell / agent-procutil.
name = "agent-machine-transport"
version = "0.1.0-dev1"
description = "Shared machines.yaml registry parsing, canonicalized local-machine identity, and local-vs-SSH transport resolution across Copilot CLI plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "pyyaml>=6.0.3",
    "agent-remote-login-shell",
]

[tool.uv.sources]
# Always resolve the vendored login-shell-wrapping lib from the local path,
# never an index -- same canonical pointer every other consumer uses.
agent-remote-login-shell = { path = "../remote-login-shell", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert` (pytest); `shell=` here is a plain
# dataclass field name (SSHEnvironment.shell), never subprocess shell=True.
"tests/**" = ["S101", "S604"]

[tool.pytest.ini_options]
testpaths = ["tests"]
