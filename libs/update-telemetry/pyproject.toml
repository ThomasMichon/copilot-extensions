[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is namespaced (agent-update-telemetry) to prevent
# dependency-confusion; the import module is ``update_telemetry``.
# Mirrors agent-remote-login-shell / agent-procutil.
name = "agent-update-telemetry"
version = "0.1.0-dev1"
description = "Shared update-run telemetry (JSONL events, folded status file, exit codes) across Copilot CLI plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
# Pure stdlib; no runtime dependencies.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert` (pytest) and spawn this interpreter.
"tests/**" = ["S101", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
