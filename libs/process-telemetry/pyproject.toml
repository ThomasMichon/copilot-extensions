[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-process-telemetry"
version = "0.1.0-dev1"
description = "Optional bounded diagnostic emission through existing callable sinks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
exclude-newer = "7 days"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99
