# In-repo agent-worktrees config for copilot-extensions (CANONICAL).
#
# This is the repo's own committed config -- the BASE layer for its
# agent-worktrees settings, shared by every machine that checks out the repo.
# It carries repo-level settings only (no machine paths). Precedence, highest
# wins (see plugins/agent-worktrees config.py `load_config`):
#
#   ~/.copilot-extensions/config.yaml        (machine-local override / adapter)
#   <repo>/.agent-worktrees/config.yaml      (THIS file -- the repo's own config)
#   ~/.agent-worktrees/config.yaml           (machine-wide defaults)
#
# A machine that checks out this repo resolves its anchor from
# ~/.agent-worktrees/repos.yaml and reads this file for the repo settings, so
# the only machine-local config it needs is the project marker (repo_name +
# headless). Read by agent-worktrees >= v1.5.3-dev34.

default_branch: dev
remote: origin

# `main` is still this repo's actual GitHub default branch (releases are cut
# from it), but `dev` is the contribution branch every agent forks worktrees
# from and targets with PRs (see `default_branch` above + the PR workflow
# note below). The pre-commit hook guard must therefore protect BOTH names
# from direct in-worktree commits, not just `default_branch` -- list both
# explicitly rather than relying on the single-branch default.
protected_branches: [main, dev]

# PR workflow (agent-worktrees hook facility + create-pr flow) — REQUIRED.
#
# copilot-extensions lands changes through pull requests, not direct pushes to
# `dev` (the contribution branch -- see below). This is enforced on four
# layers that agree:
#
#   1. This config (`required: true`) — `push-changes` REFUSES direct-to-`dev`
#      and steers every change through `create-pr`. `required` implies
#      `enabled`, which also arms the plugin's PR-workflow git-hook shims
#      (installed by `agent-worktrees register`, armed via
#      `AGENT_WORKTREES_HOOKS=1` for `pr.enabled` repos): they block committing
#      to `dev` from a worktree and block pushing a worktree branch directly.
#      The legitimate `create-pr` / `push-changes` push bypasses the pre-push
#      guard via `AGENT_WORKTREES_PR_PUSH=1`.
#   2. A GitHub repository ruleset ("dev branch policy: PR-required",
#      id 23904550) with a `pull_request` rule -- the FORMAL branch policy
#      that blocks direct pushes to `dev` server-side, so the enforcement
#      holds even for a tool/path that predates or bypasses layer 1. (One
#      nuance: a commit that is the head of an OPEN PR can still
#      fast-forward `dev` because GitHub counts it as "made through a PR"; an
#      unassociated direct commit is rejected. Layer 1 keeps agents off that
#      path regardless.)
#   3. The review job in `.github/workflows/workflow-lockdown-guard.yml`
#      requests a **non-blocking**
#      Copilot review on every PR authored by a Maintainer (see
#      CONTRIBUTING.md's "Contribution flow" for why it's Maintainer-only,
#      not "any invited collaborator"). It is a review, not a required
#      status check, so it never gates the merge. (The ruleset-native
#      `copilot_code_review` rule that used to do this unconditionally for
#      anyone has been removed -- it had no "collaborators only" condition.)
#   4. Workflow/CODEOWNERS lockdown: `.github/workflows/workflow-lockdown-guard.yml`
#      (a required status check, no bypass actors, its own ruleset) hard-fails
#      any PR touching `.github/workflows/`, `.github/actions/`, or
#      `.github/CODEOWNERS` unless the PR's registered author is ThomasMichon
#      -- see CONTRIBUTING.md's "Contribution flow" for the accepted
#      residual risks and structural limitations this layer does NOT close.
#
# `dev` is the contribution branch; `main` ships releases. Plugins are
# published/deployed from `main`, so `dev` is periodically promoted to `main`
# through the release pipeline -- never by an individual contributor's PR.
# The ONLY sanctioned exception is unsticking a broken release pipeline itself
# (e.g. `main` needs a direct hotfix because the promotion job is down); that
# is a deliberate, explicitly-called-out operator action, never a routine
# contribution, and every other agent still defaults to `dev`.
#
# Flow for every agent (see CONTRIBUTING.md § "Waiting for a verdict"):
#   copilot-extensions create  ->  edit  ->  create-pr  (auto_open opens the PR)
#   ->  wait for Copilot's review, address findings, re-request as needed
#   until a passing verdict lands (a genuine Approve for a contributor PR; a
#   clean Comment -- zero Medium/High findings open -- for this repo's own
#   owner-authored PRs; an actual Approve also satisfies that gate)  ->  the
#   submitter merges: agent-worktrees pr-merge <#> --now (direct squash
#   merge onto `dev`)
#
# This repo is a **submitter-self-merge** repo: it is PR-required, and the
# authorized submitter merges their reviewed PR directly rather
# than waiting on a separate human or a consent-label gate. The matrix
# below makes that contract legible to the pr-* verbs, which classify it
# as the `pr-self-merge` flow profile:
#
#   - no `automerge_label` bound (there is no consent-label gate here);
#   - `self_approve: true` + `merge_actor: submitter-direct` -> pr-self-merge;
#   - `reviewer: copilot`, `review_blocking: false` accepts the documented
#     comment-shaped review for assessment; it does not waive findings,
#     reviewer change requests or required CI. CONTRIBUTING.md owns the
#     verdict and contributor-acceptance rules.
#   - the provider attempts a normal head-pinned merge first; its authorized
#     fallback verifies required checks. A missing additional CODEOWNER vote
#     alone is not a new operator-confirmation gate for an exempt Maintainer.
#   - `pr-merge <#> --now` performs the sanctioned direct squash-merge, so an
#     agent never falls back to a raw `gh pr merge`.
#
# `head_scheme` defaults to `refspec` (PR head `pr/<slug>`); the shared hooks
# honor the mediated push. Completion reconciles the tracked published head,
# including when the provider has deleted the merged source branch.
pr:
  enabled: true
  required: true
  # Push is a short transport boundary, not the repository CI runner.
  push_timeout_seconds: 30
  provider: github
  auto_open: true
  strategy: keep-alive  # keep the worktree to shepherd the PR to merge; detach is the rare opt-out
  # Hidden source markers carry raw machine/worktree/session identifiers.
  # This public repo must never publish the raw marker (source_attribution:
  # true); closed-circuit repos may opt into that. This repo relies on the
  # implicit "codename" default (codename-attribution-by-default) --
  # source_attribution is deliberately OMITTED, not set explicitly to
  # "codename": an explicit codename value sets
  # source_attribution_configured=True, which (per may_publish_codename's
  # round-32 rule) permits a KNOWN "custom" codename_source to publish --
  # a legacy/unrecognized codename_source still never publishes either way.
  # Explicit "codename" would still authorize a custom-vocabulary codename
  # this repo has never manually verified; omitting the key keeps this
  # repo's fail-closed posture even for that narrower case. Every
  # WorktreeRecord's own persisted codename_source stays authoritative,
  # exactly as before this key was removed.
  # PR-flow legibility matrix (surfaced as reminders by the pr-* verbs) -->
  # classifies this repo as `pr-self-merge`.
  self_approve: true
  merge_actor: submitter-direct
  reviewer: copilot
  review_blocking: false
  review_latency_hint: "~2m"
  conflict_retriggers_review: true
  notes: >-
    Authorized Maintainers own completion: after a passing Copilot review,
    required green CI and no outstanding reviewer change request, use the
    managed pr-merge --now path. Provider-confirmed authority to omit an
    additional CODEOWNER approval is the expected workflow, not a new
    permission request. It never waives blocking feedback, required checks,
    draft/hold state or conflicts. Until the consent controller is enabled,
    no auto-merge label is required for this direct-submit flow.
  # Prefer the direct managed completion path, not native auto-merge waiting
  # indefinitely for an additional approval the authorized actor need not obtain.
  prefer_auto_merge: false
