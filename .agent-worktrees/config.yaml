# In-repo agent-worktrees config for copilot-extensions (CANONICAL).
#
# This is the repo's own committed config -- the BASE layer for its
# agent-worktrees settings, shared by every machine that checks out the repo.
# It carries repo-level settings only (no machine paths). Precedence, highest
# wins (see plugins/agent-worktrees config.py `load_config`):
#
#   ~/.copilot-extensions/config.yaml        (machine-local override / adapter)
#   <repo>/.agent-worktrees/config.yaml      (THIS file -- the repo's own config)
#   ~/.agent-worktrees/config.yaml           (machine-wide defaults)
#
# A machine that checks out this repo resolves its anchor from
# ~/.agent-worktrees/repos.yaml and reads this file for the repo settings, so
# the only machine-local config it needs is the project marker (repo_name +
# headless). Read by agent-worktrees >= v1.5.3-dev34.

default_branch: main
remote: origin

# PR workflow (agent-worktrees hook facility + create-pr flow) — REQUIRED.
#
# copilot-extensions lands changes through pull requests, not direct pushes to
# `main`. This is enforced on three layers that agree:
#
#   1. This config (`required: true`) — `push-changes` REFUSES direct-to-`main`
#      and steers every change through `create-pr`. `required` implies
#      `enabled`, which also arms the plugin's PR-workflow git-hook shims
#      (installed by `agent-worktrees register`, armed via
#      `AGENT_WORKTREES_HOOKS=1` for `pr.enabled` repos): they block committing
#      to `main` from a worktree and block pushing a worktree branch directly.
#      The legitimate `create-pr` / `push-changes` push bypasses the pre-push
#      guard via `AGENT_WORKTREES_PR_PUSH=1`.
#   2. A GitHub repository ruleset ("Default-branch policy: PR-required +
#      non-blocking Copilot review", id 18553911) with a `pull_request` rule --
#      the FORMAL branch policy that blocks direct pushes to `main` server-side,
#      so the enforcement holds even for a tool/path that predates or bypasses
#      layer 1. (One nuance: a commit that is the head of an OPEN PR can still
#      fast-forward `main` because GitHub counts it as "made through a PR"; an
#      unassociated direct commit is rejected. Layer 1 keeps agents off that
#      path regardless.)
#   3. The same ruleset's `copilot_code_review` rule auto-requests a
#      **non-blocking** Copilot review on every PR (review_on_push: true). It is
#      a review, not a required status check, so it never gates the merge.
#
# Flow for every agent (see CONTRIBUTING.md § "Contribution flow"):
#   copilot-extensions create  ->  edit  ->  create-pr  (auto_open opens the PR)
#   ->  Copilot posts its (non-blocking) review  ->  the submitter self-merges:
#       agent-worktrees pr-merge <#> --now      (direct squash merge)
#
# This repo is a **submitter-self-merge** repo: it is PR-required, but the only
# review is a NON-BLOCKING Copilot pass, so the PR author (the owner) approves
# and merges their own PR directly rather than waiting on a separate human or a
# consent-label gate. The matrix below makes that contract legible to the pr-*
# verbs, which classify it as the `pr-self-merge` flow profile:
#
#   - no `automerge_label` bound (there is no consent-label gate here);
#   - `self_approve: true` + `merge_actor: submitter-direct` -> pr-self-merge;
#   - `reviewer: copilot`, `review_blocking: false` -> the review never gates;
#   - `pr-merge <#> --now` performs the sanctioned direct squash-merge, so an
#     agent never falls back to a raw `gh pr merge`.
#
# `head_scheme` defaults to `refspec` (PR head `pr/<slug>`); the shared hooks
# honor the mediated push. Merge does NOT delete the source branch, so
# `finalize` can affirm the merge against the head.
pr:
  enabled: true
  required: true
  provider: github
  auto_open: true
  # Hidden source markers carry raw machine/worktree/session identifiers.
  # This public repo must never publish them; closed-circuit repos may opt in.
  source_attribution: false
  strategy: detach
  # PR-flow legibility matrix (surfaced as reminders by the pr-* verbs) -->
  # classifies this repo as `pr-self-merge`.
  self_approve: true
  merge_actor: submitter-direct
  reviewer: copilot
  review_blocking: false
  review_latency_hint: "~2m"
  conflict_retriggers_review: true
  # Merge/update policy (#225). This repo's bot review is non-blocking and is a
  # review, not a required status check, so nothing gates the merge -- the owner
  # self-merges immediately. Opt out of prefer-auto-merge so `pr-merge --now`
  # performs the intended immediate squash self-merge rather than arming a
  # CI-gated auto-merge that has no required check to wait on.
  prefer_auto_merge: false
