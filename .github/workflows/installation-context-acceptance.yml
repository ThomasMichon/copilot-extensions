    name: Installer latency contracts (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps: &installer-latency-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Validator tooling only
        run: python tools/seasoned_uv.py --uv uv --registry-only -- --system pytest pyyaml
      - name: Signed-copy seeding policy and actual unseeded UV install
        run: python -m pytest -q tools/test_installer_venv_seeding.py
      - name: Short TEMP alias reaches real daemon-registry admission
        if: runner.os == 'Windows'
        run: python -m pytest -q tools/test_run_plugin_tests.py::test_short_temp_alias_reaches_real_daemon_registry
      - name: Exact batched closure, retries, warm edits and recovery
        run: >-
          python tools/run-plugin-tests.py agent-codespaces
          --allow-explicit-tiers
          --test-file tests/test_installer_engine_adoption.py
          -k "library_install_order_retry_and_errors or native_batch_installs_cold or signed_venv_recovery"
          --test-timeout 180 --timeout 300

  installer-latency-windows:
    if: ${{ inputs.dependency_compile }}
    name: Installer latency contracts (Windows)
    runs-on: windows-latest
    timeout-minutes: 6
    steps: *installer-latency-steps

  logger-installer-latency-linux:
    if: ${{ inputs.dependency_compile }}
    name: Logger installer batches (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps: &logger-installer-latency-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Two governed batches, failure refusal, reuse and native warm refresh
        run: >-
          python tools/run-plugin-tests.py agent-logger
          --allow-explicit-tiers
          --test-file tests/test_install_batch.py
          --test-timeout 300 --timeout 300

