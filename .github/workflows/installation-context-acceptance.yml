name: Installation context native acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derived-diagnostics:
    name: Native copies (${{ matrix.os }}, ${{ matrix.mode }}, ${{ matrix.pointer }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mode: [legacy, active]
        pointer: [absent, retained]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: All derived native copies
        env:
          INSTALLATION_CONTEXT_POWERSHELL: ${{ runner.os == 'Windows' && 'powershell' || '' }}
        run: >-
          uv run --with pytest python -m pytest -q --durations=15
          libs/payload-invocation/tests/test_derived_diagnostic_cli.py
          -k "${{ matrix.mode }} and ${{ matrix.pointer }}"
