name: Installation context native acceptance

on:
  workflow_dispatch:
    inputs:
      immutable_runtime:
        description: Qualify native POSIX Worktrees development lifecycle at an immutable source
        type: boolean
        default: false
      immutable_runtime_ref:
        description: Full immutable 40-hex commit for runtime qualification (empty uses the dispatch SHA)
        type: string
        default: ""
      guardian_followthrough:
        description: Run only the bounded native macOS guardian and disclosed regression packet
        type: boolean
        default: false
      guardian_ref:
        description: Full immutable 40-hex commit for the guardian packet (empty uses the dispatch SHA)
        type: string
        default: ""
      interactive_completion:
        description: Exercise owned foreground completion on Linux, macOS and Windows
        type: boolean
        default: false
      watch_owner:
        description: Run PR-owner native-account and contained owner-boundary acceptance instead
        type: boolean
        default: false
      dispatch_delegation:
        description: Run isolated Dispatch PR-watch callback and replay contracts instead
        type: boolean
        default: false
      pr_service:
        description: Run isolated PR serving and observation lifecycle contracts instead
        type: boolean
        default: false
      ssh_service:
        description: Run isolated SSH enrollment, native relay and real Gateway lifecycle contracts
        type: boolean
        default: false
      pr_artifacts:
        description: Build and verify first-party PR/Fleet artifacts and install them offline
        type: boolean
        default: false
      dependency_compile:
        description: Exercise retained lock export and existing install seasoning with real UV
        type: boolean
        default: false
      candidate_profiles:
        description: Exercise role-selectable candidate construction and immutable reuse with real UV
        type: boolean
        default: false
      chat_construction:
        description: Qualify standalone Chat construction, retained invocation and Python floors
        type: boolean
        default: false
      ssh_snapshot:
        description: Run read-only SSH snapshot, native session writer and same-cell peer acceptance
        type: boolean
        default: false
      wheel_inputs:
        description: Exercise bounded wheel-byte inspection and trusted promotion validation
        type: boolean
        default: false
      runtime_profiles:
        description: Exercise actual owner-bound runtime-profile policy readers without installation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  derived-diagnostics-posix:
    if: ${{ !inputs.interactive_completion && !inputs.immutable_runtime && !inputs.guardian_followthrough && !inputs.watch_owner && !inputs.dispatch_delegation && !inputs.pr_service && !inputs.ssh_service && !inputs.pr_artifacts && !inputs.dependency_compile && !inputs.candidate_profiles && !inputs.chat_construction && !inputs.ssh_snapshot && !inputs.wheel_inputs && !inputs.runtime_profiles }}
    name: Native POSIX copies (${{ matrix.mode }}, ${{ matrix.pointer }})
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        mode: [mode_legacy, mode_active]
        pointer: [pointer_absent, pointer_retained]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: All derived native copies
        run: |
          python tools/seasoned_uv.py --uv uv -- --system pytest
          python -m pytest -q --durations=15 libs/payload-invocation/tests/test_derived_diagnostic_cli.py -k "${{ matrix.mode }} and ${{ matrix.pointer }}"

  derived-diagnostics-windows:
    if: ${{ !inputs.interactive_completion && !inputs.immutable_runtime && !inputs.guardian_followthrough && !inputs.watch_owner && !inputs.dispatch_delegation && !inputs.pr_service && !inputs.ssh_service && !inputs.pr_artifacts && !inputs.dependency_compile && !inputs.candidate_profiles && !inputs.chat_construction && !inputs.ssh_snapshot && !inputs.wheel_inputs && !inputs.runtime_profiles }}
    name: Native Windows copies (${{ matrix.mode }}, ${{ matrix.pointer }})
    runs-on: windows-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        mode: [mode_legacy, mode_active]
        pointer: [pointer_absent, pointer_retained]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: All derived native copies
        env:
          INSTALLATION_CONTEXT_POWERSHELL: powershell
        run: |
          python tools/seasoned_uv.py --uv uv -- --system pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q --durations=15 libs/payload-invocation/tests/test_derived_diagnostic_cli.py -k "${{ matrix.mode }} and ${{ matrix.pointer }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  immutable-runtime-linux:
    if: ${{ inputs.immutable_runtime }}
    name: Native immutable runtime (Linux, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [legacy, namespaced]
    env:
      UV_PYTHON: "3.11"
    steps: &immutable-runtime-steps
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate immutable runtime commit before checkout
        id: runtime-source
        env:
          IMMUTABLE_RUNTIME_REF: ${{ inputs.immutable_runtime_ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re

          sha = os.environ["IMMUTABLE_RUNTIME_REF"] or os.environ["DISPATCH_SHA"]
          if re.fullmatch(r"[0-9a-fA-F]{40}", sha) is None:
              raise SystemExit("immutable_runtime_ref must be empty or a full immutable 40-hex commit")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={sha.lower()}\n")
          PY
      - uses: actions/checkout@v4
        id: runtime-checkout
        with:
          ref: ${{ steps.runtime-source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record actual immutable runtime qualification identity
        env:
          EXPECTED_SHA: ${{ steps.runtime-source.outputs.sha }}
        run: |
          python - <<'PY'
          import os
          import platform
          import subprocess
          import sys

          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != os.environ["EXPECTED_SHA"]:
              raise SystemExit("runtime checkout does not match the selected immutable commit")
          print(f"Checkout: {actual}", flush=True)
          print(subprocess.check_output(
              ["git", "show", "-s", "--format=Parents: %P", "HEAD"], text=True,
          ).strip(), flush=True)
          print(f"Python: {sys.version}", flush=True)
          print(f"OS: {platform.platform()}", flush=True)
          PY
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Qualify isolated native development lifecycle
        env:
          RUNTIME_MODE: ${{ matrix.mode }}
        run: python tools/run-plugin-tests.py agent-worktrees --test-file tests/test_python_runtime_dev_live.py -k "$RUNTIME_MODE" --timeout 2500 --plugin-timeout 2700

  immutable-runtime-macos:
    if: ${{ inputs.immutable_runtime }}
    name: Native immutable runtime (macOS, ${{ matrix.mode }})
    runs-on: macos-latest
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [legacy, namespaced]
    env:
      UV_PYTHON: "3.11"
    steps: *immutable-runtime-steps

  runtime-profile-policy-linux:
    if: ${{ inputs.runtime_profiles }}
    name: Native runtime-profile policy (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps: &runtime-profile-policy-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Test dependencies
        run: python tools/seasoned_uv.py --uv uv -- --system pytest
      - name: Fresh configured authority and isolated CLI
        run: python -m pytest -q libs/installation-context/tests/test_runtime_profile_policy.py libs/installation-context/tests/test_runtime_deployment.py
      - name: Management profile hold and unchanged custody controls
        run: python -m pytest -q libs/payload-invocation/tests/test_cell_management.py -k "management_profile_hold or management_lease_borrows_exact or borrower_rejects_changed_custody"
      - name: Native POSIX policy parsing
        if: runner.os == 'Linux'
        run: python -m pytest -q libs/installation-context/tests/test_runtime_deployment_adapters.py -k "native_policy and profile and not powershell and not posix32"
      - name: Native Windows policy parsing
        if: runner.os == 'Windows'
        env:
          INSTALLATION_CONTEXT_POWERSHELL: powershell
          INSTALLATION_CONTEXT_POLICY_TRACE: "1"
        run: python -m pytest -q -rP --durations=10 libs/installation-context/tests/test_runtime_deployment_adapters.py -k "native_policy and profile and not posix"

  runtime-profile-policy-windows:
    if: ${{ inputs.runtime_profiles }}
    name: Native runtime-profile policy (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps: *runtime-profile-policy-steps

  guardian-followthrough-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.guardian_followthrough }}
    name: Native macOS guardian follow-through
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate immutable guardian commit before checkout
        id: guardian-source
        env:
          GUARDIAN_REF: ${{ inputs.guardian_ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re

          sha = os.environ["GUARDIAN_REF"] or os.environ["DISPATCH_SHA"]
          if re.fullmatch(r"[0-9a-fA-F]{40}", sha) is None:
              raise SystemExit("guardian_ref must be empty or a full immutable 40-hex commit")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={sha.lower()}\n")
          PY
      - uses: actions/checkout@v4
        id: guardian-checkout
        with:
          ref: ${{ steps.guardian-source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record actual native qualification identity
        env:
          EXPECTED_SHA: ${{ steps.guardian-source.outputs.sha }}
        run: |
          python - <<'PY'
          import os
          import platform
          import subprocess
          import sys

          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != os.environ["EXPECTED_SHA"]:
              raise SystemExit("guardian checkout does not match the selected immutable commit")
          print(f"Checkout: {actual}", flush=True)
          print(subprocess.check_output(
              ["git", "show", "-s", "--format=Parents: %P", "HEAD"], text=True,
          ).strip(), flush=True)
          print(f"Python: {sys.version}", flush=True)
          print(f"OS: {platform.platform()}", flush=True)
          PY
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Prepare seasoned shared-library test tooling
        id: guardian-tooling
        run: python tools/seasoned_uv.py --uv uv --registry-only -- --system pytest "pytest-timeout>=2.3,<3" psutil
      - name: Full caller-owned native capture and Darwin census controls
        if: ${{ !cancelled() && steps.guardian-tooling.outcome == 'success' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import sys
          import tempfile

          root = Path.cwd()
          sys.path.insert(0, str(root / "tools"))
          from plugin_test_containment import Limits, isolated_environment, run_contained

          sandbox = Path(tempfile.mkdtemp(prefix=".guardian-caller-", dir=root))
          print(
              f"Caller-owned sandbox (retained unless containment returns normally): {sandbox}",
              flush=True,
          )
          env = isolated_environment(os.environ, sandbox)
          env["PYTHONPATH"] = os.pathsep.join((
              str(root / "tools"), str(root / "libs/agent-procutil/src"),
          ))
          result = run_contained(
              [
                  sys.executable, "-m", "pytest", "-q", "--durations=15",
                  "-p", "pytest_portfolio_guard", "--timeout=30",
                  f"--basetemp={sandbox / 'pytest'}",
                  "libs/agent-procutil/tests/test_caller_owned.py",
              ],
              cwd=root, env=env, sandbox=sandbox, limits=Limits(wall_seconds=300),
          )
          shutil.rmtree(sandbox)
          raise SystemExit(result)
          PY
      - name: Full installer guardian controls
        if: ${{ !cancelled() && steps.guardian-tooling.outcome == 'success' }}
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          --test-file tests/test_installer_guardian.py
      - name: Companion lifecycle retained through guidance and concurrent embody
        if: ${{ !cancelled() && steps.guardian-tooling.outcome == 'success' }}
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          --test-file tests/test_creation_tail_repair.py
          -k test_creation_retains_companion_lifecycle_through_guidance_against_cmd_embody
      - name: Explicit canonical inline allowlist guard
        if: ${{ !cancelled() && steps.guardian-tooling.outcome == 'success' }}
        run: >-
          python tools/run-plugin-tests.py customizing-copilot
          --test-file tests/test_instruction_delivery.py
          -k test_shipped_inline_allowlist_is_explicit_and_substantive
      - name: Windows shim simulation without shared platform mutation
        if: ${{ !cancelled() && steps.guardian-tooling.outcome == 'success' }}
        run: >-
          python tools/run-plugin-tests.py copilot-extensions-harness
          --test-file tests/test_reviewer_source.py
          -k test_windows_command_shim_uses_cmd

  interactive-completion-linux:
    if: ${{ inputs.interactive_completion }}
    name: Owned foreground completion (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps: &interactive-completion-steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify real descendant and controlling-terminal ownership
        run: |
          python tools/seasoned_uv.py --uv uv -- --system pytest psutil
          python -m pytest -q libs/agent-procutil/tests/test_interactive.py libs/agent-procutil/tests/test_interactive_session_native.py
      - name: Qualify warm UI lifetime in a private native mux
        if: ${{ runner.os == 'Linux' }}
        run: |
          if ! command -v tmux; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          python tools/run-plugin-tests.py worktree-manager --test-file tests/native/test_warm_picker_lifetime.py

  interactive-completion-macos:
    if: ${{ inputs.interactive_completion }}
    name: Owned foreground completion (macOS)
    runs-on: macos-latest
    timeout-minutes: 6
    steps: *interactive-completion-steps

  interactive-completion-windows:
    if: ${{ inputs.interactive_completion }}
    name: Owned foreground completion (Windows)
    runs-on: windows-latest
    timeout-minutes: 6
    steps: *interactive-completion-steps

  candidate-profiles-linux:
    if: ${{ inputs.candidate_profiles }}
    name: Native candidate profiles (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps: &candidate-profile-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Isolated role construction, origins and reuse
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          --test-file tests/test_python_installer_engine.py --timeout 600
          -k "local_role or local_package or role_health or selected_extras
          or selected_extra_dependency or dev_candidate_refuses_nonbase or construction_identity"

  candidate-profiles-windows:
    if: ${{ inputs.candidate_profiles }}
    name: Native candidate profiles (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps: *candidate-profile-steps

  chat-construction-linux:
    if: ${{ inputs.chat_construction }}
    name: Chat construction (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy: &chat-construction-strategy
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    steps: &chat-construction-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: chat-python
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Independent artifacts and native Chat acceptance
        env:
          UV_PYTHON: ${{ steps.chat-python.outputs.python-path }}
        run: >-
          python tools/run-standalone-tests.py services/chat --prepare
          --chat-suite acceptance --timeout 180
      - name: Complete native Chat portfolio on the same candidate
        run: >-
          python tools/run-standalone-tests.py services/chat
          --chat-suite full --timeout 600

  chat-construction-windows:
    if: ${{ inputs.chat_construction }}
    name: Chat construction (Windows, Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy: *chat-construction-strategy
    steps: *chat-construction-steps

  ssh-snapshot-native-linux:
    if: ${{ inputs.ssh_snapshot }}
    name: Read-only SSH snapshot (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps: &ssh-snapshot-native-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Fresh and resumed native session guidance without actuation
        run: >-
          python tools/run-plugin-tests.py agent-ssh
          --test-file tests/test_session_snapshot.py
          --test-file tests/test_write_session_guidance.py
          --test-file tests/test_maintenance_guidance.py
          --test-file tests/test_snapshot_windows_visibility.py
          --test-file tests/test_mesh.py
          --test-file tests/test_mesh_refresh.py
          --test-file tests/test_fragment_registry.py
      - name: Real isolated peer process and foreign receipt refusal
        run: >-
          python tools/run-plugin-tests.py agent-dispatch
          --test-file tests/test_procutil.py
          -k "ssh_snapshot or (namespaced_sibling_resolution and agent-ssh)"

  ssh-snapshot-native-windows:
    if: ${{ inputs.ssh_snapshot }}
    name: Read-only SSH snapshot (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      AGENT_SSH_WINDOWS_VISIBILITY: "1"
    steps: *ssh-snapshot-native-steps

  watch-owner-native-linux:
    if: ${{ inputs.watch_owner }}
    name: Native PR owner (Linux, ${{ matrix.scenario.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy: &watch-owner-native-strategy
      fail-fast: false
      matrix:
        scenario:
          - name: normal-upgrade
            selector: >-
              test_normal_payload_init_refreshes_receipt or legacy_staging
              or bootstrap_admission or session_start_never_runs_legacy_reconciler
          - name: two-shipped-cells
            selector: test_two_normal_shipped_cells
          - name: peer-roundtrip
            selector: test_normal_payload_peer_roundtrip
          - name: lease-only-endpoint-live
            selector: native_account_lease_only_owner and endpoint_live
          - name: lease-only-endpoint-missing
            selector: native_account_lease_only_owner and endpoint_missing
    steps: &watch-owner-native-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Normal payloads in the actual disposable OS account
        env:
          APR_NATIVE_OS_ACCOUNT_ACCEPTANCE: "1"
        run: >-
          python tools/run-plugin-tests.py agent-pull-requests
          --allow-host-state --allow-explicit-tiers
          --timeout 1200 --plugin-timeout 1800
          -k "${{ matrix.scenario.selector }}"

  watch-owner-native-windows:
    if: ${{ inputs.watch_owner }}
    name: Native PR owner (Windows, ${{ matrix.scenario.name }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy: *watch-owner-native-strategy
    steps: *watch-owner-native-steps

  watch-owner-macos-refusal:
    if: ${{ inputs.watch_owner }}
    name: Native macOS PR-owner identity refusal
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Unsupported native evidence refuses without control or state adoption
        run: >-
          python tools/run-plugin-tests.py agent-pull-requests
          --allow-explicit-tiers --timeout 300 --plugin-timeout 600
          -k native_macos_governed_watch_refuses_unprovable_identity

  watch-owner-boundaries-linux:
    if: ${{ inputs.watch_owner }}
    name: Contained PR-owner boundaries (Linux, ${{ matrix.scenario.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy: &watch-owner-boundaries-strategy
      fail-fast: false
      matrix:
        scenario:
          - name: controller-death
            selector: >-
              actual_controller_death_recovers or bound_passive_endpoint_recovery
              or completed_receipt_parallel_reads_keep_native_identity
          - name: concurrent-upgrade
            selector: actual_installer_upgrade_drains_handlers_poll_ack
    steps: &watch-owner-boundaries-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Owned processes and disposable installation profiles
        run: >-
          python tools/run-plugin-tests.py agent-pull-requests
          --allow-explicit-tiers --timeout 1200 --plugin-timeout 1800
          -k "${{ matrix.scenario.selector }}"

  watch-owner-boundaries-windows:
    if: ${{ inputs.watch_owner }}
    name: Contained PR-owner boundaries (Windows, ${{ matrix.scenario.name }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy: *watch-owner-boundaries-strategy
    steps: *watch-owner-boundaries-steps

  dispatch-delegation-linux:
    if: ${{ inputs.dispatch_delegation }}
    name: Isolated Dispatch PR delegation (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps: &dispatch-delegation-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Receipt-bound callbacks, service replay and process fallback
        run: >-
          python tools/run-plugin-tests.py agent-dispatch
          --test-file tests/test_delegated_waiter_cli.py
          --test-file tests/test_delegated_waiter_context.py
          --test-file tests/test_delegated_waiter_fences.py
          --test-file tests/test_delegated_waiter_owner_contract.py
          --test-file tests/test_delegated_replay_consumer.py
          --test-file tests/test_delegated_replay_binding.py
          --test-file tests/test_delegated_replay_transport.py
          --test-file tests/test_delegated_replay_credentials.py
          --test-file tests/test_waiter_maintenance.py
          --max-files-per-sub-suite 2

  dispatch-delegation-windows:
    if: ${{ inputs.dispatch_delegation }}
    name: Isolated Dispatch PR delegation (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps: *dispatch-delegation-steps

  pr-service-linux:
    if: ${{ inputs.pr_service }}
    name: Isolated PR service lifecycle (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps: &pr-service-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Writer, drain, observation and real Gateway reconnect
        run: >-
          python tools/run-plugin-tests.py agent-pull-requests
          --test-file tests/test_watch_replay_store.py
          --test-file tests/test_watch_service.py
          --test-file tests/test_watch_gateway.py
          --test-file tests/test_watch_gateway_transport.py
          --test-file tests/test_watch_observer.py
          --test-file tests/test_watch_replay_client.py
          --test-file tests/test_watch_replay_binding.py
          --test-file tests/test_watch_replay_client_transport.py
          --max-files-per-sub-suite 2
      - name: Independent installed PR service and real process transport
        run: >-
          python tools/run-standalone-tests.py services/pr
          --prepare --timeout 180 --admission-wait 30

  ssh-service-linux:
    if: ${{ inputs.ssh_service }}
    name: Isolated SSH service and native relay (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Admit native prerequisites in this disposable runner only
        run: |
          command -v sshd
          command -v ssh-keygen
          sudo install -d -o root -g root -m 0755 /run/sshd
      - name: Installed SSH host, native custody and real authenticated forwards
        env:
          SSH_SERVICE_NATIVE_ACCEPTANCE: "1"
        run: >-
          python tools/run-standalone-tests.py services/ssh
          --prepare --timeout 180 --admission-wait 30
      - name: Native target authorization with StrictModes and disposable-account ancestry
        env:
          AGENT_SSH_NATIVE_DISPOSABLE: "1"
        run: >-
          python tools/run-plugin-tests.py agent-ssh
          --test-file tests/test_gateway_authorization_native.py
          --test-file tests/test_gateway_sshd_native.py
          --allow-host-state --allow-explicit-tiers

  ssh-service-windows:
    if: ${{ inputs.ssh_service }}
    name: Isolated SSH control-plane service (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Installed host and real authenticated Gateway transport
        run: >-
          python tools/run-standalone-tests.py services/ssh
          --prepare --timeout 180 --admission-wait 30

  pr-artifacts-linux:
    if: ${{ inputs.pr_artifacts }}
    name: First-party PR artifacts (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps: &pr-artifacts-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Validator tooling only
        run: python tools/seasoned_uv.py --uv uv --registry-only -- --system packaging
      - name: Locked builds, source verification and offline standalone install
        run: python tools/smoke_public_toolchain.py --standalone

  pr-artifacts-windows:
    if: ${{ inputs.pr_artifacts }}
    name: First-party PR artifacts (Windows)
    runs-on: windows-latest
    timeout-minutes: 6
    steps: *pr-artifacts-steps

  pr-service-windows:
    if: ${{ inputs.pr_service }}
    name: Isolated PR service lifecycle (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps: *pr-service-steps

  dependency-compile-linux:
    if: ${{ inputs.dependency_compile }}
    name: Retained dependency compile (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps: &dependency-compile-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Validator tooling only
        run: python tools/seasoned_uv.py --uv uv --registry-only -- --system pytest pyyaml
      - name: Real retained compile, transitive age and unchanged install isolation
        run: >-
          python -m pytest -q
          tools/test_installer_dependency_compile.py
          tools/test_installer_dependency_policy.py
          tools/test_runtime_source_lock.py
          tools/test_runtime_source_authentication.py
          tools/test_runtime_source_feed.py
          -k "compile or real_uv_registry_transitive_and_isolated_build_age or runtime_source_lock or runtime_source_authentication or runtime_source_feed"

  dependency-compile-windows:
    if: ${{ inputs.dependency_compile }}
    name: Retained dependency compile (Windows)
    runs-on: windows-latest
    timeout-minutes: 6
    steps: *dependency-compile-steps

  source-build-linux:
    if: ${{ inputs.dependency_compile }}
    name: Admitted source build (Linux, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix: &source-build-matrix
        suite: [profiles, refusals, manager]
        include:
          - suite: profiles
            expression: not (unadmitted_source_build_inputs or rejected_native_source_settings or built_metadata_must_match or backend_timeout or revoked_source_policy)
          - suite: refusals
            expression: unadmitted_source_build_inputs or rejected_native_source_settings or built_metadata_must_match or backend_timeout or revoked_source_policy
    steps: &source-build-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Validator tooling only
        run: python tools/seasoned_uv.py --uv uv --registry-only -- --system pytest pyyaml packaging
      - name: Real authenticated source, admitted tools, offline build and health
        if: ${{ matrix.suite != 'manager' }}
        run: >-
          python -m pytest -q
          tools/test_runtime_source_build.py
          -k "${{ matrix.expression }}"
      - name: Persisted Manager admission and fresh-process offline reuse
        if: ${{ matrix.suite == 'manager' }}
        run: >-
          python -m pytest -q
          tools/test_manager_source_install.py
          tools/test_manager_source_native.py
          tools/test_runtime_source_reuse.py
          worktree-manager/tests/test_manager_update_check.py
          libs/versioned-runtime/tests/test_runtime_source_identity.py::test_source_and_repair_slots_preserve_the_declared_package_version

  marketplace-source-linux:
    if: ${{ inputs.dependency_compile }}
    name: Registered marketplace source (Linux, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix: &marketplace-source-matrix
        include:
          - suite: provider-selection
            test: tools/test_runtime_marketplace_source.py
            expression: not source_and_configuration
          - suite: provider-mutation
            test: tools/test_runtime_marketplace_source.py
            expression: source_and_configuration
          - suite: inventory-cache
            test: libs/plugin-resolve/tests/test_native_git_inventory.py
            expression: native_git_cache and not (refuse or prevents or permission or invalid or timeout or cyclic or excluded)
          - suite: inventory-selection
            test: libs/plugin-resolve/tests/test_native_git_inventory.py
            expression: not native_git_cache and not (refuse or prevents or permission or invalid or timeout or cyclic or excluded)
          - suite: inventory-refusal
            test: libs/plugin-resolve/tests/test_native_git_inventory.py
            expression: refuse or prevents or permission or invalid or timeout or cyclic or excluded
    steps: &marketplace-source-steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Validator tooling only
        run: python tools/seasoned_uv.py --uv uv --registry-only -- --system pytest pyyaml packaging
      - name: Actual registered Git source and independent exact acquisition
        run: python -m pytest -q ${{ matrix.test }} -k "${{ matrix.expression }}"

  marketplace-source-windows:
    if: ${{ inputs.dependency_compile }}
    name: Registered marketplace source (Windows, ${{ matrix.suite }})
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix: *marketplace-source-matrix
    steps: *marketplace-source-steps

  source-build-windows:
    if: ${{ inputs.dependency_compile }}
    name: Admitted source build (Windows, ${{ matrix.suite }})
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix: *source-build-matrix
    steps: *source-build-steps

  installer-latency-linux:
