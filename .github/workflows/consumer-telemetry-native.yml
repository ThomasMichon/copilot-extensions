name: Consumer telemetry command native acceptance

on:
  workflow_dispatch:
  push:
    branches: ["pr/**"]
    paths:
      - ".github/workflows/consumer-telemetry-native.yml"
      - "libs/process-telemetry/**"
      - "libs/agent-procutil/src/agent_procutil/command_pipe.py"
      - "libs/agent-procutil/src/agent_procutil/_windows_caller_owned.py"
      - "libs/agent-procutil/tests/sdk_visibility_sources.py"
      - "libs/agent-procutil/tests/test_command_pipe.py"
      - "libs/ssh-manager/src/ssh_manager/carrier_requests.py"
      - "libs/ssh-manager/src/ssh_manager/carrier_protocol.py"
      - "libs/ssh-manager/tests/test_carrier_request_preflight.py"
      - "plugins/agent-bridge/src/agent_bridge/**"
      - "plugins/agent-bridge/pyproject.toml"
      - "plugins/agent-bridge/tests/test_bridge_send_cli.py"
      - "plugins/agent-bridge/tests/test_bridge_remote_send_cli.py"
      - "plugins/agent-bridge/tests/test_native_bound_prompt.py"
      - "plugins/agent-bridge/tests/test_remote_result_snapshot.py"
      - "plugins/agent-bridge/tests/test_bridge_observation_cli.py"
      - "plugins/agent-bridge/tests/test_remote_native_prompt.py"
      - "plugins/agent-bridge/tests/test_remote_live_prompt.py"
      - "plugins/agent-bridge/tests/test_remote_native_prompt_http.py"
      - "plugins/agent-bridge/tests/test_native_send_admission.py"
      - "plugins/agent-bridge/tests/test_consumer_telemetry_command.py"
      - "plugins/agent-bridge/tests/test_consumer_telemetry_lifetimes.py"
      - "plugins/agent-bridge/tests/test_consumer_telemetry_performance.py"
      - "plugins/agent-bridge/tests/test_worktree_inventory_posix.py"
      - "plugins/agent-bridge/tests/test_inventory_runtime_continuity.py"
      - "tools/performance/consumer_telemetry_probe.py"
      - "plugins/agent-dispatch/src/agent_dispatch/**"
      - "plugins/agent-dispatch/pyproject.toml"
      - "plugins/agent-dispatch/tests/test_consumer_telemetry_command.py"
      - "plugins/agent-dispatch/tests/test_consumer_telemetry_wake_contention.py"

permissions:
  contents: read

jobs:
  command-linux:
    name: Command receiver (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Qualify exact source through the contained plugin owner
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "Native checkout differs from its immutable dispatch" }
          Write-Output "Candidate: $actual"
          python tools/run-plugin-tests.py agent-bridge `
            --test-file tests/test_bridge_send_cli.py `
            --test-file tests/test_bridge_remote_send_cli.py `
            --test-file tests/test_native_bound_prompt.py `
            --test-file tests/test_remote_result_snapshot.py `
            --test-file tests/test_bridge_observation_cli.py `
            --test-file tests/test_remote_native_prompt.py `
            --test-file tests/test_remote_live_prompt.py `
            --test-file tests/test_remote_native_prompt_http.py `
            --test-file tests/test_native_send_admission.py `
            --test-file tests/test_worktree_inventory_posix.py `
            --test-file tests/test_consumer_telemetry_command.py `
            --test-file tests/test_consumer_telemetry_lifetimes.py `
            --test-file tests/test_consumer_telemetry_performance.py `
            --test-file tests/test_telemetry.py `
            --test-file tests/test_process_telemetry.py `
            --allow-explicit-tiers --timeout 180 --plugin-timeout 600 `
            --junit-dir "$env:RUNNER_TEMP/consumer-telemetry-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run-plugin-tests.py agent-dispatch `
            --test-file tests/test_consumer_telemetry_command.py `
            --test-file tests/test_consumer_telemetry_wake_contention.py `
            --test-file tests/test_telemetry.py `
            --test-file tests/test_handoff_claim_release.py `
            -k "(telemetry or health_only) and not wall_cpu_tail and not incompatible_reader" `
            --allow-explicit-tiers --timeout 120 --plugin-timeout 600 `
            --junit-dir "$env:RUNNER_TEMP/dispatch-consumer-telemetry-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run-plugin-tests.py agent-dispatch `
            --test-file tests/test_consumer_telemetry_command.py `
            -k "wall_cpu_tail or incompatible_reader" `
            --allow-explicit-tiers --timeout 120 --plugin-timeout 600 `
            --junit-dir "$env:RUNNER_TEMP/dispatch-performance-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run-plugin-tests.py agent-procutil `
            --test-file tests/test_command_pipe.py `
            --timeout 120 --plugin-timeout 300 `
            --junit-dir "$env:RUNNER_TEMP/command-pipe-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run-plugin-tests.py ssh-manager `
            --test-file tests/test_carrier.py `
            --test-file tests/test_carrier_request_preflight.py `
            --allow-explicit-tiers --timeout 120 --plugin-timeout 600 `
            --junit-dir "$env:RUNNER_TEMP/carrier-request-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-telemetry-ubuntu-latest-${{ github.sha }}
          path: |
            ${{ runner.temp }}/consumer-telemetry-results
            ${{ runner.temp }}/dispatch-consumer-telemetry-results
            ${{ runner.temp }}/dispatch-performance-results
            ${{ runner.temp }}/command-pipe-results
            ${{ runner.temp }}/carrier-request-results
          if-no-files-found: warn
          retention-days: 14

  command-windows:
    name: Command receiver (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTEST_ADDOPTS: "--durations=15"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Qualify exact source through the contained plugin owner
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "Native checkout differs from its immutable dispatch" }
          Write-Output "Candidate: $actual"
          python tools/run-plugin-tests.py agent-bridge `
            --test-file tests/test_bridge_send_cli.py `
            --test-file tests/test_bridge_remote_send_cli.py `
            --test-file tests/test_native_bound_prompt.py `
            --test-file tests/test_remote_result_snapshot.py `
            --test-file tests/test_bridge_observation_cli.py `
            --test-file tests/test_remote_native_prompt.py `
            --test-file tests/test_remote_live_prompt.py `
            --test-file tests/test_remote_native_prompt_http.py `
            --test-file tests/test_native_send_admission.py `
            --test-file tests/test_consumer_telemetry_command.py `
            --test-file tests/test_consumer_telemetry_lifetimes.py `
            --test-file tests/test_consumer_telemetry_performance.py `
            --test-file tests/test_telemetry.py `
            --test-file tests/test_process_telemetry.py `
            --allow-explicit-tiers --timeout 180 --plugin-timeout 600 `
            --junit-dir "$env:RUNNER_TEMP/consumer-telemetry-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run-plugin-tests.py agent-dispatch `
            --test-file tests/test_consumer_telemetry_command.py `
            --test-file tests/test_consumer_telemetry_wake_contention.py `
            --test-file tests/test_telemetry.py `
            --test-file tests/test_handoff_claim_release.py `
            -k "(telemetry or health_only) and not wall_cpu_tail and not incompatible_reader" `
            --allow-explicit-tiers --timeout 120 --plugin-timeout 600 `
            --junit-dir "$env:RUNNER_TEMP/dispatch-consumer-telemetry-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run-plugin-tests.py agent-dispatch `
            --test-file tests/test_consumer_telemetry_command.py `
            -k "wall_cpu_tail or incompatible_reader" `
            --allow-explicit-tiers --timeout 120 --plugin-timeout 600 `
            --junit-dir "$env:RUNNER_TEMP/dispatch-performance-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run-plugin-tests.py agent-procutil `
            --test-file tests/test_command_pipe.py `
            --timeout 120 --plugin-timeout 300 `
            --junit-dir "$env:RUNNER_TEMP/command-pipe-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run-plugin-tests.py ssh-manager `
            --test-file tests/test_carrier.py `
            --test-file tests/test_carrier_request_preflight.py `
            --allow-explicit-tiers --timeout 120 --plugin-timeout 600 `
            --junit-dir "$env:RUNNER_TEMP/carrier-request-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-telemetry-windows-latest-${{ github.sha }}
          path: |
            ${{ runner.temp }}/consumer-telemetry-results
            ${{ runner.temp }}/dispatch-consumer-telemetry-results
            ${{ runner.temp }}/dispatch-performance-results
            ${{ runner.temp }}/command-pipe-results
            ${{ runner.temp }}/carrier-request-results
          if-no-files-found: warn
          retention-days: 14
