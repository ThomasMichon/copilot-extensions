# Delayed fallback for Maintainer-authored PRs only. Native automatic review
# is deliberately disabled by repository policy; enabling it is a separate
# trust/billing decision. Manual/native requests get five minutes to start
# before this job nudges once. No author-seat inference or post-write polling.
#
# pull_request_target executes trusted base-branch workflow code. This job
# never checks out or executes PR content. GITHUB_TOKEN performs all reads;
# MAINTAINER_REVIEW_PAT performs only the one licensed-account review write.
# The latter is needed because github-actions[bot] review requests can silently
# no-op for non-owner authors. Neither token is exposed in output.
name: Copilot review gate

on:
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, ready_for_review, synchronize, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # Retain an active request and coalesce queued events to the latest pending
  # run per PR. Never cancel in flight across the request write.
  group: copilot-review-request-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-review:
    name: request-review-if-maintainer
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Determine collaborator / Maintainer status
        id: status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            // Public read permission does not prove collaborator membership.
            try {
              await github.rest.repos.checkCollaborator({
                ...context.repo,
                username: author,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info("Author is not an invited collaborator; automatic review skipped.");
              core.setOutput("is_maintainer", "false");
              return;
            }
            const { data } = await github.rest.repos.getContent({
              ...context.repo,
              path: ".github/CODEOWNERS",
              ref: context.payload.pull_request.base.ref,
            });
            const text = Buffer.from(data.content, "base64").toString("utf8");
            const root = text.split("\n").map(line => line.trim())
              .find(line => line.split(/\s+/)[0] === "*");
            if (!root) throw new Error("CODEOWNERS has no root Maintainer roster.");
            const roster = root.split(/\s+/).slice(1).map(owner => owner.replace(/^@/, ""));
            core.setOutput("is_maintainer", String(roster.includes(author)));

      - name: Request Copilot review as a licensed Maintainer account
        if: steps.status.outputs.is_maintainer == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_READ_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ secrets.MAINTAINER_REVIEW_PAT }}
          script: |
            // github-script bundles Octokit; its dependencies are not require-able.
            const reader = new github.constructor({
              auth: process.env.REVIEW_READ_TOKEN,
              retry: { enabled: false },
            });
            const pull_number = context.payload.pull_request.number;
            const request = { ...context.repo, pull_number };
            // One grace-period sleep, not a polling loop. Independent PRs
            // remain concurrent; queued runs inspect the latest live head.
            await new Promise(resolve => setTimeout(resolve, 5 * 60_000));
            const { data: livePr } = await reader.rest.pulls.get(request);
            if (livePr.state !== "open" || livePr.draft || livePr.base.ref !== "dev") {
              core.info("PR is closed, draft, or retargeted away from dev; no nudge.");
              return;
            }
            const { data: pending } = await reader.rest.pulls.listRequestedReviewers(request);
            const bot = "copilot-pull-request-reviewer[bot]";
            // Timeline/request APIs use "Copilot"; reviews use the app login.
            const isCopilot = user => user?.type === "Bot" &&
              [bot, "Copilot"].includes(user.login);
            if (pending.users.some(isCopilot)) {
              core.info("Copilot review is pending; no nudge.");
              return;
            }
            const events = await reader.paginate(reader.rest.issues.listEventsForTimeline, {
              ...context.repo,
              issue_number: pull_number,
              per_page: 100,
            });
            let reviewEpochAt = 0;
            let lastRequestAt = 0;
            for (const event of events) {
              const epoch = ["base_ref_changed", "reopened"].includes(event.event);
              const requestEvent = event.event === "review_requested" &&
                isCopilot(event.requested_reviewer);
              if (!epoch && !requestEvent) continue;
              const timestamp = Date.parse(event.created_at);
              if (!Number.isFinite(timestamp) || timestamp > Date.now()) {
                throw new Error("Review timeline has an invalid or future timestamp.");
              }
              if (epoch) reviewEpochAt = Math.max(reviewEpochAt, timestamp);
              if (requestEvent) lastRequestAt = Math.max(lastRequestAt, timestamp);
            }
            const reviews = await reader.paginate(reader.rest.pulls.listReviews, {
              ...request,
              per_page: 100,
            });
            if (reviews.some(review =>
              isCopilot(review.user) &&
              ["APPROVED", "COMMENTED", "CHANGES_REQUESTED"].includes(review.state) &&
              review.commit_id === livePr.head.sha &&
              review.submitted_at &&
              Date.parse(review.submitted_at) > reviewEpochAt
            )) {
              core.info("Copilot reviewed the current diff; no nudge.");
              return;
            }
            if (lastRequestAt && Date.now() - lastRequestAt < 5 * 60_000) {
              core.info("A Copilot request is within its five-minute grace period; no nudge.");
              return;
            }
            // If this run's triggering head has been superseded, the latest
            // queued synchronize run owns its own full five-minute grace.
            if (livePr.head.sha !== context.payload.pull_request.head.sha) {
              core.info("A newer push superseded this event; latest queued run owns the nudge.");
              return;
            }
            try {
              await github.rest.pulls.requestReviewers({
                ...request,
                reviewers: [bot],
              });
            } catch (error) {
              core.setFailed(`Could not request Copilot review: ${error.message}`);
              const headers = error.response?.headers ?? {};
              if (headers["retry-after"] || headers["x-ratelimit-remaining"] === "0") {
                core.warning(
                  `GitHub rate-limit backoff: retry-after=${headers["retry-after"] ?? "unspecified"}; ` +
                  `reset-epoch=${headers["x-ratelimit-reset"] ?? "unspecified"}. No automatic write retry.`,
                );
              }
              return;
            }
            core.info(
              "Copilot nudge accepted by GitHub. Review start/completion is not verified " +
              "by this job; observe the PR review gate. No confirmation polling.",
            );
