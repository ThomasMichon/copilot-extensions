name: Promote trigger (dev-advancement filter)

# One trusted CI-completion invocation hosts independent jobs. The dev
# ancestry filter must remain outside validate-and-promote's concurrency group:
# irrelevant PR completions must not evict real dev advancements. Do not infer
# ancestry from workflow_run.head_branch or dispatch mutable workflow code.
# The scanner reads PR objects as inert data. Baseline maintenance updates dev
# only, using trusted default-branch tooling; no job depends on another.

# GitHub's documented fork-safe pattern for privileged PR follow-up is:
#   (1) run untrusted build/test work under `pull_request`, then
#   (2) react from a separate privileged `workflow_run` workflow that loads its
#       own YAML from the default branch and may use secrets/write APIs.
# See:
#   - docs.github.com/actions/.../events-that-trigger-workflows#workflow_run
#   - securitylab.github.com/resources/github-actions-preventing-pwn-requests/
#
# This workflow deliberately NEVER checks out the PR head for execution. It
# checks out only the trusted default-branch revision of this workflow/tooling,
# then reads the PR head's changed file contents as inert git data (`git show`)
# before running the trusted scanner and reporting a custom Check Run on the PR
# head SHA.
#
# --- Repository-secret administration ---
# This check is a no-op (`neutral` Check Run, "not yet configured") until at
# least one of these two repository secrets is set:
#   - FORBIDDEN_IDS_FACILITY
#   - FORBIDDEN_IDS_WORK
# Format (identical for both): newline- or `;`-separated `token|reason`
# entries, e.g. `some-private-name|Private org codename -- use a generic
# placeholder instead`. Blank lines are skipped; `#`-prefixed comment lines
# are NOT skipped (they become literal tokens) -- never paste a commented
# source file directly into the secret value, strip comments/blank lines
# first. See `tools/check-no-internal-identifiers.py`'s own docstring
# (`_load_ci_identifiers`) for the exact parser this feeds.
# Tokens are case-insensitive literal substrings by default. For a bounded
# match, prefix a Python regular expression with `regex:` (e.g.
# `regex:\bexample\b|Use a generic placeholder`). Semicolons/newlines
# delimit entries and cannot appear inside a pattern or reason. Double
# alternation pipes (`||`) inside a regex; the first single `|` separates
# its reason.
# Provision/rotate a secret with (never a bare `gh`; route through this
# repo's resolved account):
#   agent-worktrees repos gh ThomasMichon/copilot-extensions -- \
#     secret set FORBIDDEN_IDS_FACILITY --repo ThomasMichon/copilot-extensions \
#     < path/to/clean-token-reason-list.txt
# Both secrets are additive (their contents are concatenated before
# scanning) and assembled/owned independently by each private context they
# protect -- neither harness needs visibility into the other's source list.
on:
  workflow_run:
    workflows: ["CI", "Validate and promote dev to main"]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  refresh-module-baseline:
    name: refresh committed dev module baseline
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    environment: main-promotion
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: module-size-baseline-widen-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted workflow tooling without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Check out committed dev input as data without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh and validate using only trusted tooling
        run: |
          python -I trusted/tools/check-module-size.py --repository candidate --refresh-baseline --widen-only
          python -I trusted/tools/check-module-size.py --repository candidate
      - id: baseline
        name: Fence stale dev inputs and restrict the publication diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_SHA: ${{ github.event.workflow_run.head_sha }}
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          live_sha="$(gh api "repos/$REPO/git/ref/heads/dev" --jq '.object.sha')"
          if [[ ! "$live_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Current dev identity is unavailable or invalid."
            exit 1
          fi
          if [ "$live_sha" != "$INPUT_SHA" ]; then
            echo "::notice::dev advanced; its latest CI completion owns baseline maintenance."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git --no-pager -C candidate diff --no-ext-diff --no-textconv --name-only)"
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$changed" = "tools/module-size-baseline.json" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Baseline maintenance changed unexpected paths."
            exit 1
          fi
      - name: Open a baseline-only PR against dev
        if: steps.baseline.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.APERTURE_RELEASE_TOKEN }}
          path: candidate
          base: dev
          branch: automation/module-size-baseline-widen-dev
          add-paths: tools/module-size-baseline.json
          delete-branch: true
          commit-message: "tools: refresh committed dev module-size baseline (automated)"
          title: "tools: refresh committed dev module-size baseline (automated)"
          body: |
            Mechanical baseline-only refresh of committed dev, using trusted
            default-branch tooling. Existing ceilings may widen to current
            sizes; shrinking/graduated entries are never lowered or removed.
            New offenders are never automatically grandfathered. Tightening
            remains a deliberate manual refresh, not automated maintenance.

            This targets dev and requires ordinary current-head CI and review.
            It never advances generated main or rebases a promotion candidate.

            ## Documentation impact
            None: baseline data only; no documented behavior changes.

  filter-and-dispatch:
    name: filter (dev-ancestry) and dispatch
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event != 'pull_request' &&
       ((github.event.workflow_run.name == 'CI' &&
         github.event.workflow_run.conclusion == 'success') ||
        github.event.workflow_run.name == 'Validate and promote dev to main')) ||
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'closed' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.user.login == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}
      - name: Resolve genuine or deferred Dev advancement without losing active-PR ownership
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETED_WORKFLOW: ${{ github.event.workflow_run.name }}
          COMPLETED_RUN: ${{ github.event.workflow_run.id }}
          COMPLETED_SHA: ${{ github.event.workflow_run.head_sha }}
          CLOSED_PR: ${{ github.event.pull_request.number }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            args+=(--closed-main-pr "$CLOSED_PR")
          elif [ "$COMPLETED_WORKFLOW" = "CI" ]; then
            [[ "$COMPLETED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::CI completion has no valid source identity."
              exit 1
            }
            git fetch origin dev
            if ! git merge-base --is-ancestor "$COMPLETED_SHA" origin/dev; then
              echo "::notice::CI completion is not a genuine Dev ancestor; no promotion is dispatched."
              exit 0
            fi
            args+=(--source-ci-run "$COMPLETED_RUN")
          elif [ "$COMPLETED_WORKFLOW" = "Validate and promote dev to main" ]; then
            args+=(--completed-promotion-run "$COMPLETED_RUN")
          else
            echo "::error::Unexpected promotion scheduling event."
            exit 1
          fi
          python -I -B tools/promotion_lifecycle.py --repository "$GITHUB_REPOSITORY" \
            "${args[@]}" --github-output "$GITHUB_OUTPUT"
      - name: Check dev ancestry and dispatch if genuine
        if: steps.source.outputs.dispatch_sha != ''
        env:
          # Explicit API dispatch retains the trusted default-branch workflow
          # definition; the receiving gate independently pins current dev.
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.dispatch_sha }}
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor "$SHA" origin/dev; then
            echo "::notice::$SHA is a genuine dev advancement -- dispatching validate-and-promote.yml."
            gh api "repos/${{ github.repository }}/dispatches" --input - <<EOF
          {"event_type": "dev-advanced", "client_payload": {"sha": "$SHA"}}
          EOF
          else
            echo "::notice::$SHA is not on origin/dev's history -- this CI completion was for a different branch/PR; skipping."
          fi

  scan-and-report:
    name: scan + report
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: write
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        continue-on-error: true
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1

      - id: guard
        if: steps.checkout.outcome == 'success'
        uses: ./.github/actions/identifier-leak-guard
        continue-on-error: true
        with:
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          head-sha: ${{ github.event.workflow_run.head_sha }}
          facility-identifiers: ${{ secrets.FORBIDDEN_IDS_FACILITY }}
          work-identifiers: ${{ secrets.FORBIDDEN_IDS_WORK }}

      # A local action cannot report a checkout or action-loading failure.
      - name: Report unavailable trusted scanner
        if: always() && (steps.checkout.outcome != 'success' || steps.guard.outcome != 'success')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER),
            });
            if (pr.head.sha !== process.env.PR_HEAD_SHA) {
              core.notice("PR head moved on; skipping stale infrastructure reporting.");
              return;
            }
            await github.rest.checks.create({
              ...context.repo, name: "identifier leak guard",
              head_sha: process.env.PR_HEAD_SHA, status: "completed", conclusion: "failure",
              output: {
                title: "Identifier leak guard unavailable",
                summary: "Trusted checkout or scanner action failed; no scan result is available.",
                text: `Checkout: ${process.env.CHECKOUT_OUTCOME}; action: ${process.env.GUARD_OUTCOME}.`,
              },
            });
