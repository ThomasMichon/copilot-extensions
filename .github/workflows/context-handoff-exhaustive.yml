name: Context Handoff Exhaustive

# The context-handoff worktree-sync-lock matrix spins up real git repos,
# child processes, and timing-sensitive lock races -- too slow and too
# flaky-prone to run unconditionally on every PR (see ci.yml's "JS unit
# tests" step, which only globs plugins/*/tests/*.test.mjs, one directory
# level, and therefore never matches this tests/exhaustive/ suite).
# Instead it runs nightly, on demand, and on any PR that actually touches
# the lock/sync code or the suite itself.

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/context-handoff/extensions/context-handoff/handoff-core.mjs"
      - "plugins/context-handoff/tests/exhaustive/**"

permissions:
  contents: read

jobs:
  exhaustive:
    name: lock/process matrix (real git + child-process)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run exhaustive context-handoff lock/process suite
        run: node --test plugins/context-handoff/tests/exhaustive/*.test.mjs
