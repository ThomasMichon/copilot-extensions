    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      item_number:
        description: Issue number to process (report-failure's own automated dispatch call)
        required: false
        type: string
    types: []

permissions: {}

