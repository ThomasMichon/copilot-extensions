# Detection-only periodic validation, never a promotion or required-PR gate.
# Linux runs the nine displaced default full plugin suites through the canonical
# hardened container wrapper. Windows execution is disabled until a native
# container route is enrolled; a skipped job is not validation evidence.
# Explicit-tier/environment-gated families are not implied exercised; see
# the residual inventory at
# tools/periodic-integration-inventory.json.
#
# The scheduled daily run always validates `dev`. A manual
# `workflow_dispatch` may additionally target any other ref via its `ref`
# input -- e.g. to inspect Linux integration at an exact reviewed ref
# without making that execution a required PR gate or waiting for the
# next `dev` rotation. A manual run against a non-`dev` ref never files
# the shared tracking issue (see the `report` job) -- that stays reserved
# for genuine `dev`-rotation findings, not one-off PR validation noise.
name: Windows coverage rotation

on:
  schedule:
    # One existing daily event owns both the Linux portfolio and Windows rotation.
    - cron: "41 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override the rotation date (YYYY-MM-DD); defaults to today (UTC)."
        required: false
        type: string
      ref:
        description: >-
          Branch/ref to validate (defaults to dev). Manual dispatch only --
          the scheduled daily rotation always runs against dev regardless
          of this input. Non-dev inspection supplies Linux evidence only;
          native Windows execution remains unenrolled.
        required: false
        type: string
        default: dev

concurrency:
  # A scheduled run and a manually dispatched run could otherwise overlap;
  # serialize rather than cancel a run already mid-suite.
  group: windows-coverage-rotation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    name: select today's rotation
    runs-on: ubuntu-latest
    # The scheduled daily rotation always targets dev (the active
    # integration branch regressions should be caught on, independently
    # of the release's unit-only portfolio). A manual dispatch may target a ref via
    # the `ref` input (default dev) for Linux integration inspection.
    # The retained Windows command is disabled, not a validation witness.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      plugins: ${{ steps.select.outputs.plugins }}
      ref: ${{ steps.resolve-ref.outputs.ref }}
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - id: resolve-ref
        name: Resolve the ref to validate
        env:
          # Passed through env, never interpolated directly into the
          # script body -- inputs.ref is attacker-shaped (anyone who can
          # dispatch this workflow controls it), and inline `${{ }}`
          # interpolation into `run:` would let a crafted value (command
          # substitution, embedded newlines) execute as shell source
          # instead of being treated as inert data.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          ref="${INPUT_REF:-dev}"
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            ref="dev"
          fi
          # A legitimate Git ref name never contains CR/LF (Git itself
          # rejects control characters in ref names). Reject any value
          # that does before it ever reaches $GITHUB_OUTPUT -- writing an
          # unsanitized value containing an embedded newline there would
          # let a crafted ref inject extra, attacker-controlled
          # key=value lines into this step's own output set.
          case "$ref" in
            *$'\n'*|*$'\r'*)
              echo "::error::ref input contains a CR or LF; refusing" >&2
              exit 1
              ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}
          fetch-depth: 1
      - id: resolve-sha
        name: Pin the exact commit this run validates
        # Resolve to an immutable SHA right after checkout, once, so a
        # push to a mutable branch ref between here and a later matrix
        # job can never make `select` and `test` silently disagree on
        # which commit they each actually looked at.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: select
        name: Compute today's rotation picks
        env:
          OVERRIDE_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$OVERRIDE_DATE" ]; then
            python tools/select_windows_rotation.py --date "$OVERRIDE_DATE" --format github-output >> "$GITHUB_OUTPUT"
          else
            python tools/select_windows_rotation.py --format github-output >> "$GITHUB_OUTPUT"
          fi
      - name: Publish routing status, not validation or platform qualification
        if: always()
        shell: bash
        run: |
          {
            echo '### Periodic integration routing status (not qualification)'
            echo '- Linux: canonical hardened-container route enrolled; execution outcomes and evidence belong to the per-plugin Linux jobs.'
            echo '- Windows: UNAVAILABLE / container capacity unenrolled. The preserved hosted Windows job is disabled by a literal false condition.'
            echo '- No Windows validation evidence is produced. Skipped Windows execution is not a pass; Linux success cannot qualify Windows or all platforms.'
            echo '- Residual owners and unavailable/not-enrolled tiers: tools/periodic-integration-inventory.json. None is a promotion or required-PR dependency.'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Windows UNAVAILABLE - container capacity unenrolled - ${{ matrix.plugin }}
    needs: select
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.select.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The immutable SHA `select` resolved, not the (possibly
          # mutable) ref -- every matrix job tests the exact same commit
          # `select` computed its rotation picks from.
          ref: ${{ needs.select.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Full suite - ${{ matrix.plugin }} (windows-latest)
        run: python tools/run-plugin-tests.py ${{ matrix.plugin }}

  linux-full:
    name: full (Linux isolated) - ${{ matrix.plugin }}
    needs: select
    if: needs.select.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - agent-bridge
          - agent-codespaces
          - agent-containers
          - agent-dispatch
          - agent-logger
          - agent-mcp
          - agent-ssh
          - agent-vault
          - agent-worktrees
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run default full suite in the canonical hardened container
        id: full
        shell: bash
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          directory="$RUNNER_TEMP/periodic-integration/$PLUGIN"
          mkdir -p "$directory"
          set +e
          {
            command -v docker &&
            command -v devcontainer &&
            docker info --format '{{.ServerVersion}}' &&
            touch "$directory/wrapper-invoked" &&
            python tools/run_tests_in_devcontainer.py "$PLUGIN"
          } 2>&1 | tee "$directory/execution.log"
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          if [ "$status" -eq 0 ] && [ "${statuses[1]}" -ne 0 ]; then
            status=${statuses[1]}
          fi
          set -e
          printf '%s\n' "$status" > "$directory/exit-code"
          exit "$status"
      - name: Record exact execution scope and outcome
        if: always()
        shell: bash
        env:
          PLUGIN: ${{ matrix.plugin }}
          TESTED_SHA: ${{ needs.select.outputs.sha }}
          EXECUTION_OUTCOME: ${{ steps.full.outcome }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ["RUNNER_TEMP"]) / "periodic-integration" / os.environ["PLUGIN"]
          directory.mkdir(parents=True, exist_ok=True)
          profile = Path(".devcontainer/test-isolation/devcontainer.json")
          inventory = Path("tools/periodic-integration-inventory.json")
          exit_code = directory / "exit-code"
          record = {
              "version": 1,
              "plugin": os.environ["PLUGIN"],
              "tested_sha": os.environ["TESTED_SHA"],
              "platform": "linux",
              "qualification_scope": "Linux default-full only; Windows execution unavailable and not validated",
              "command": ["python", "tools/run_tests_in_devcontainer.py", os.environ["PLUGIN"]],
              "outcome": os.environ["EXECUTION_OUTCOME"],
              "exit_code": int(exit_code.read_text()) if exit_code.is_file() else None,
              "wrapper_invoked": (directory / "wrapper-invoked").is_file(),
              "declared_container_profile": str(profile),
              "profile_sha256": hashlib.sha256(profile.read_bytes()).hexdigest() if profile.is_file() else None,
              "inventory": str(inventory),
              "inventory_sha256": hashlib.sha256(inventory.read_bytes()).hexdigest() if inventory.is_file() else None,
              "scope": "default full plugin invocation; explicit-tier/environment-gated skips are not passes",
              "failure_owner": "Test Portfolio Rationalization #1303",
              "release_dependency": False,
          }
          if profile.is_file():
              (directory / "container-profile.jsonc").write_bytes(profile.read_bytes())
          if inventory.is_file():
              (directory / "inventory.json").write_bytes(inventory.read_bytes())
          (directory / "execution.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Retain full execution log and scope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: periodic-linux-${{ matrix.plugin }}-${{ needs.select.outputs.sha }}
          path: ${{ runner.temp }}/periodic-integration/${{ matrix.plugin }}/
          if-no-files-found: error

  report:
    name: track periodic failures, not platform qualification
    needs: [select, test, linux-full]
    # Only a genuine `dev`-rotation failure (scheduled, or a manual
    # dispatch explicitly validating `dev`) files/updates the shared
    # tracking issue -- a manual dispatch validating some other PR
    # branch's candidate head is one-off evidence-gathering, not a signal
    # about `dev`'s own health, and must not pollute that issue.
    if: always() && (needs.test.result == 'failure' || needs.linux-full.result == 'failure') && needs.select.outputs.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Ensure the tracking label exists
        if: needs.test.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh label create windows-rotation-failure --repo "${{ github.repository }}"
          --color B60205
          --description "A plugin's full suite failed on windows-latest in the daily rotation"
          --force
      - name: File or update the tracking issue
        if: needs.test.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "${{ github.repository }}" --label windows-rotation-failure --state open --json number --jq '.[0].number // empty')
          body="A plugin in the daily Windows coverage rotation failed its full suite on \`windows-latest\`. See the run: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "Windows coverage rotation: a plugin failed on windows-latest" --body "$body" --label windows-rotation-failure
          fi
      - name: Ensure the Linux periodic failure label exists
        if: needs.linux-full.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh label create periodic-linux-integration-failure --repo "${{ github.repository }}"
          --color B60205
          --description "Detection-only Linux integration failure; portfolio owner #1303"
          --force
      - name: File or update the Linux portfolio tracking issue
        if: needs.linux-full.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTED_SHA: ${{ needs.select.outputs.sha }}
        run: |
          existing=$(gh issue list --repo "${{ github.repository }}" --label periodic-linux-integration-failure --state open --json number --jq '.[0].number // empty')
          body="The periodic default-full Linux container portfolio failed at $TESTED_SHA. Run and per-plugin execution artifacts: $RUN_URL. Failure owner: Test Portfolio Rationalization #1303; assign the affected plugin specialist during triage. This is not a promotion or required-PR gate. Windows execution is disabled pending container enrollment and supplies no validation evidence. Unprovided explicit-tier, native-platform and filesystem prerequisites remain tracked in tools/periodic-integration-inventory.json, not claimed as passes."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "Periodic Linux integration: plugin portfolio failure" --body "$body" --label periodic-linux-integration-failure
          fi
