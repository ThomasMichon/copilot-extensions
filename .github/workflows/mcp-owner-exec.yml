name: MCP owner exec source controls

on:
  workflow_dispatch:
  push:
    branches: ["pr/**"]
    paths:
      - ".github/workflows/mcp-owner-exec.yml"
      - "plugins/agent-mcp/src/agent_mcp/owner_exec.py"
      - "plugins/agent-mcp/src/agent_mcp/owner_bootstrap.py"
      - "plugins/agent-mcp/src/agent_mcp/owner_entry.py"
      - "plugins/agent-mcp/src/agent_mcp/owner_section.py"
      - "plugins/agent-mcp/src/agent_mcp/owner_section_native.py"
      - "plugins/agent-mcp/src/agent_mcp/owner_snapshot.py"
      - "plugins/agent-mcp/src/agent_mcp/owner_section.cs"
      - "plugins/agent-mcp/pyproject.toml"
      - "plugins/agent-worktrees/scripts/native-seed-process.ps1"
      - "plugins/agent-worktrees/scripts/native-seed-process.cs"
      - "plugins/agent-mcp/src/agent_mcp/owner_handoff.py"
      - "plugins/agent-mcp/src/agent_mcp/owner_capabilities.py"
      - "plugins/agent-mcp/src/agent_mcp/execution_context.py"
      - "plugins/agent-mcp/src/agent_mcp/custody_lifetime.py"
      - "plugins/agent-mcp/src/agent_mcp/checkpoint.py"
      - "plugins/agent-mcp/src/agent_mcp/backend.py"
      - "plugins/agent-mcp/src/agent_mcp/custody_contract.py"
      - "plugins/agent-mcp/src/agent_mcp/custody_connector.py"
      - "plugins/agent-mcp/src/agent_mcp/custody_session.py"
      - "plugins/agent-mcp/src/agent_mcp/custody_host.py"
      - "plugins/agent-mcp/src/agent_mcp/custody_conduit.py"
      - "plugins/agent-mcp/src/agent_mcp/custody_launch.py"
      - "plugins/agent-mcp/tests/test_owner_exec.py"
      - "plugins/agent-mcp/tests/test_owner_entry.py"
      - "plugins/agent-mcp/tests/test_owner_bootstrap_windows.py"
      - "plugins/agent-mcp/tests/test_owner_entry_windows.py"
      - "plugins/agent-mcp/tests/test_owner_section.py"
      - "plugins/agent-mcp/tests/test_owner_snapshot.py"
      - "plugins/agent-mcp/tests/owner_section_security.py"
      - "plugins/agent-mcp/tests/test_custody_host.py"
      - "plugins/agent-mcp/tests/test_custody_conduit.py"
      - "plugins/agent-mcp/tests/test_custody_launch.py"
      - "plugins/agent-mcp/tests/test_incoming_execution.py"
      - "plugins/agent-mcp/tests/test_custody_lifetime.py"
      - "plugins/agent-mcp/tests/test_session_checkpoint.py"
      - "plugins/agent-mcp/tests/test_backend.py"
      - "plugins/agent-mcp/tests/test_custody_connector.py"
      - "plugins/agent-mcp/tests/test_custody_session.py"
      - "plugins/agent-mcp/tests/test_generation_handover.py"
      - "plugins/agent-mcp/tests/generation_native_fixture.py"
      - "plugins/agent-mcp/tests/native/test_owner_exec_copilot.py"
      - "plugins/agent-mcp/tests/native/test_owner_bootstrap_copilot_windows.py"
      - "plugins/agent-mcp/tests/native/test_generation_handover_copilot.py"
      - "plugins/agent-mcp/tests/native/generation_copilot_provider.py"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Exercise actual exec identity and anonymous overlay in containment
        run: >-
          python tools/run-plugin-tests.py agent-mcp
          --test-file tests/test_owner_exec.py
          --test-file tests/test_owner_handoff.py
          --test-file tests/test_owner_entry.py
          --test-file tests/test_owner_section.py
          --test-file tests/test_owner_snapshot.py
          --test-file tests/test_owner_capabilities.py
          --test-file tests/test_custody_host.py
          --test-file tests/test_custody_conduit.py
          --test-file tests/test_custody_launch.py
          --test-file tests/test_incoming_execution.py
          --test-file tests/test_custody_lifetime.py
          --test-file tests/test_session_checkpoint.py
          --test-file tests/test_backend.py
          --test-file tests/test_custody_connector.py
          --test-file tests/test_custody_session.py
          --junit-dir "${{ runner.temp }}/mcp-owner-exec-${{ github.run_id }}"
      - name: Retain source controls, not installed-client acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-owner-exec-source-controls
          path: ${{ runner.temp }}/mcp-owner-exec-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7

      - name: Exercise trace-varying physical and optional-receiver handover
        run: >-
          python tools/run-plugin-tests.py agent-mcp
          --test-file tests/test_generation_handover.py --allow-explicit-tiers
          --timeout 240 --plugin-timeout 260 --test-timeout 180
          --junit-dir "${{ runner.temp }}/mcp-trace-custody-${{ github.run_id }}"
      - name: Retain physical custody source qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-trace-custody-source-controls
          path: ${{ runner.temp }}/mcp-trace-custody-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare pinned native client on this disposable runner only
        env:
          COPILOT_ASSET_URL: https://github.com/github/copilot-cli/releases/download/v1.0.105/copilot-linux-x64.tar.gz
          COPILOT_ASSET_SHA256: aba1f06f27bc0447656647f76e0a4cf58b4b2a341c75ff04a750982b6aeb6bd2
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import tarfile
          import urllib.request
          root = Path(os.environ["RUNNER_TEMP"]) / (
              "mcp-owner-native-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          )
          root.mkdir()
          archive = root / "copilot.tar.gz"
          with urllib.request.urlopen(os.environ["COPILOT_ASSET_URL"], timeout=60) as source:
              with archive.open("wb") as target:
                  shutil.copyfileobj(source, target)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ["COPILOT_ASSET_SHA256"]:
              raise SystemExit("Native client digest mismatch")
          target = root / "copilot"
          with tarfile.open(archive) as contents:
              members = [member for member in contents if member.isfile() and Path(member.name).name == "copilot"]
              if len(members) != 1:
                  raise SystemExit("Expected one native client executable")
              with contents.extractfile(members[0]) as source, target.open("xb") as output:
                  shutil.copyfileobj(source, output)
          target.chmod(0o700)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("COPILOT_NATIVE_TEST_EXECUTABLE=" + str(target) + "\n")
          PY
      - name: Exercise actual offline native client consumption and physical handover
        run: >-
          python tools/run-plugin-tests.py agent-mcp
          --allow-explicit-tiers --test-timeout 180 --timeout 240 --plugin-timeout 260
          --test-file tests/native/test_owner_exec_copilot.py
          --test-file tests/native/test_generation_handover_copilot.py
          --junit-dir "${{ runner.temp }}/mcp-owner-copilot-${{ github.run_id }}"
      - name: Retain native client qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-owner-native-client
          path: ${{ runner.temp }}/mcp-owner-copilot-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7

  windows-publication:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Exercise native publication, snapshots and pre-effect Windows entry
        run: >-
          python tools/run-plugin-tests.py agent-mcp
          --test-file tests/test_owner_section.py
          --test-file tests/test_owner_snapshot.py
          --test-file tests/test_owner_bootstrap_windows.py
          --test-file tests/test_owner_entry_windows.py
          --test-file tests/test_owner_entry.py
          --test-file tests/test_owner_capabilities.py
          --junit-dir "${{ runner.temp }}/mcp-owner-publication-${{ github.run_id }}"
      - name: Retain native publication source controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-owner-native-publication
          path: ${{ runner.temp }}/mcp-owner-publication-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare pinned Windows client in disposable runner storage
        shell: python
        env:
          COPILOT_ASSET_URL: https://github.com/github/copilot-cli/releases/download/v1.0.105/copilot-win32-x64.zip
          COPILOT_ASSET_SHA256: 34e16e9cf47de0e1534920171d6f39fa246638bddbb6ece820870b382bcc061a
        run: |
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import urllib.request
          import zipfile
          root = Path(os.environ["RUNNER_TEMP"]) / (
              "mcp-owner-native-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          )
          root.mkdir()
          archive = root / "copilot.zip"
          with urllib.request.urlopen(os.environ["COPILOT_ASSET_URL"], timeout=60) as source:
              with archive.open("xb") as target:
                  shutil.copyfileobj(source, target)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ["COPILOT_ASSET_SHA256"]:
              raise SystemExit("Native client digest mismatch")
          target = root / "copilot.exe"
          with zipfile.ZipFile(archive) as contents:
              members = [member for member in contents.infolist()
                         if not member.is_dir() and Path(member.filename).name == "copilot.exe"]
              if len(members) != 1:
                  raise SystemExit("Expected one native client executable")
              with contents.open(members[0]) as source, target.open("xb") as output:
                  shutil.copyfileobj(source, output)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("COPILOT_NATIVE_TEST_EXECUTABLE=" + str(target) + "\n")
      - name: Exercise actual Windows client after publisher exit
        run: >-
          python tools/run-plugin-tests.py agent-mcp
          --test-file tests/native/test_owner_bootstrap_copilot_windows.py
          --allow-explicit-tiers --test-timeout 120 --timeout 180 --plugin-timeout 200
          --junit-dir "${{ runner.temp }}/mcp-owner-windows-client-${{ github.run_id }}"
      - name: Exercise actual Windows client physical replacement and rollback
        run: >-
          python tools/run-plugin-tests.py agent-mcp
          --test-file tests/native/test_generation_handover_copilot.py
          --allow-explicit-tiers --test-timeout 180 --timeout 240 --plugin-timeout 260
          --junit-dir "${{ runner.temp }}/mcp-owner-windows-handover-${{ github.run_id }}"
      - name: Retain actual Windows client source controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-owner-windows-client
          path: ${{ runner.temp }}/mcp-owner-windows-client-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
      - name: Retain Windows physical handover qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-owner-windows-handover
          path: ${{ runner.temp }}/mcp-owner-windows-handover-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
