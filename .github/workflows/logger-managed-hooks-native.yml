name: Logger managed hooks native

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/logger-managed-hooks-native.yml
      - plugins/agent-logger/scripts/hook-bootstrap-python.sh
      - plugins/agent-logger/scripts/hook-bootstrap-python.ps1
      - plugins/agent-logger/scripts/write-session-guidance.sh
      - plugins/agent-logger/scripts/write-session-guidance.ps1
      - plugins/agent-logger/scripts/register-cold-store-provider.sh
      - plugins/agent-logger/scripts/register-cold-store-provider.ps1
      - plugins/agent-logger/tests/test_managed_hook_readers.py

permissions:
  contents: read

jobs:
  native-hooks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            selector: powershell or pwsh or windows_bash
            cases: 18
            reports: 4
          - os: ubuntu-latest
            selector: bash and not windows_bash
            cases: 16
            reports: 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
      - name: Prepare disposable managed interpreter
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'logger-hook-python'
          uv python install --no-bin --no-registry cpython@3.11.18
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UV_PYTHON_INSTALL_DIR=$env:UV_PYTHON_INSTALL_DIR" >> $env:GITHUB_ENV
      - name: Qualify actual offline hooks
        run: >-
          python tools/run-plugin-tests.py agent-logger
          --test-file tests/test_managed_hook_readers.py --allow-explicit-tiers
          -k "${{ matrix.selector }}"
          --test-timeout 60 --timeout 240 --plugin-timeout 240
          --junit-dir qualification-evidence/logger-hooks
      - name: Require every native control and repeated measurement
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/logger-hooks').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(cases)==${{ matrix.cases }};
          assert all(c.find(t) is None for c in cases for t in ('skipped','failure','error'));
          reports=[json.loads(p.attrib['value']) for c in cases
          for p in c.findall('properties/property') if p.attrib['name']=='logger_managed_hook_performance'];
          assert len(reports)==${{ matrix.reports }};
          assert all(len(r['samples_seconds'])==2 and max(r['samples_seconds']) <
          (10 if r['entry']=='provider-bash' else 45) for r in reports)"
