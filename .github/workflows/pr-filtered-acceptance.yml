name: Filtered PR population acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-filtered-linux:
    name: Filtered PR population foreground (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Filtered demand and finite native acquisition
        run: >-
          python tools/run-plugin-tests.py agent-pull-requests
          --test-file tests/test_filtered_subscriptions.py
          --test-file tests/test_filtered_native.py
      - name: Actual filtered foreground host and supported CLI
        env:
          PYTEST_ADDOPTS: "-k filtered"
        run: >-
          python tools/run-standalone-tests.py services/pr
          --prepare --timeout 180 --admission-wait 30
