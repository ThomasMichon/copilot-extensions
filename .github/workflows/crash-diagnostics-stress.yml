name: context-handoff crash-diagnostics stress

# Runs the full crash-diagnostics.test.mjs subprocess suite (every case, not
# just the world-readable-file/symlink/FIFO attack simulations) on a
# schedule and on manual dispatch, regardless of what any given PR touched.
# The required `guards + lint` CI lane (ci.yml) only runs this file's full
# suite when a PR's own diff touches plugins/context-handoff/, and only on
# ubuntu-latest -- this workflow additionally runs on windows-latest so the
# Windows-specific branches in crash-diagnostics.mjs (the non-POSIX
# file-validation skip, and the rotation/reopen path) are exercised too,
# not just the POSIX-only attack simulations that already skip there.

on:
  schedule:
    - cron: "37 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-linux:
    name: full subprocess suite (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the full crash-diagnostics subprocess suite
        env:
          CONTEXT_HANDOFF_CRASH_DIAGNOSTICS_STRESS: "1"
        run: >-
          node --test
          plugins/context-handoff/tests/crash-diagnostics.test.mjs

  stress-windows:
    name: full subprocess suite (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the full crash-diagnostics subprocess suite
        env:
          CONTEXT_HANDOFF_CRASH_DIAGNOSTICS_STRESS: "1"
        run: >-
          node --test
          plugins/context-handoff/tests/crash-diagnostics.test.mjs
