name: Cold roster native acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/worktrees-roster-native.yml
      - plugins/agent-worktrees/src/agent_worktrees/list_arguments.py
      - plugins/agent-worktrees/src/agent_worktrees/worktrees_client.py
      - plugins/agent-worktrees/src/agent_worktrees/worktrees_feed.py
      - plugins/agent-worktrees/src/agent_worktrees/worktrees_feed_client.py
      - plugins/agent-worktrees/src/agent_worktrees/worktrees_runtime.py
      - plugins/agent-worktrees/tests/test_worktrees_client.py
      - plugins/agent-worktrees/tests/test_worktrees_feed.py
      - plugins/agent-worktrees/tests/test_worktrees_runtime.py
      - plugins/agent-worktrees/tests/test_worktrees_recovery.py
      - worktree-manager/src/worktree_manager/worktree_feed_contract.py
      - worktree-manager/src/worktree_manager/resident_transport.py
      - worktree-manager/src/worktree_manager/production_picker/picker_tui/loader_current_feed.py
      - worktree-manager/tests/production_picker/test_current_worktrees_feed.py
      - worktree-manager/tests/production_picker/test_resident_transport.py

permissions:
  contents: read

jobs:
  roster-linux:
    name: Cold roster (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Current roster, cold bootstrap and native API/CLI recovery
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          --test-file tests/test_worktrees_client.py
          --test-file tests/test_worktrees_feed.py
          --test-file tests/test_worktrees_runtime.py
          --test-file tests/test_worktrees_recovery.py
      - name: Actual Manager consumer, saved continuity and negotiated transport
        run: >-
          python tools/run-plugin-tests.py worktree-manager
          --test-file tests/production_picker/test_current_worktrees_feed.py
          --test-file tests/production_picker/test_resident_transport.py
  roster-windows:
    name: Cold roster (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Current roster, cold bootstrap and native API/CLI recovery
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          --test-file tests/test_worktrees_client.py
          --test-file tests/test_worktrees_feed.py
          --test-file tests/test_worktrees_runtime.py
          --test-file tests/test_worktrees_recovery.py
      - name: Actual Manager consumer, saved continuity and negotiated transport
        run: >-
          python tools/run-plugin-tests.py worktree-manager
          --test-file tests/production_picker/test_current_worktrees_feed.py
          --test-file tests/production_picker/test_resident_transport.py
