name: Payload CWD contract

on:
  workflow_dispatch:
  schedule:
    - cron: "27 11 * * 3"

permissions:
  contents: read

jobs:
  routing-status:
    name: Routing inventory only - no native validation evidence
    runs-on: ubuntu-latest
    steps:
      - run: echo "Payload CWD integration is unenrolled pending a hardened root-tools container route; portfolio issue 1303 owns it."
  linux:
    name: Unenrolled Linux root-tools integration
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Full contract matrix
        run: >-
          python tools/seasoned_uv.py --uv uv -- --system pytest &&
          python -m pytest tools/test_payload_cwd_contract.py -q

  windows:
    name: Unenrolled native Windows integration
    if: false
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Full contract matrix
        run: >-
          python tools/seasoned_uv.py --uv uv -- --system pytest &&
          python -m pytest tools/test_payload_cwd_contract.py -q
