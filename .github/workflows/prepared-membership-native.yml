name: Prepared membership native acceptance

on:
  workflow_dispatch:
  push:
    branches: ["pr/**"]
    paths:
      - ".github/workflows/prepared-membership-native.yml"
      - "plugins/agent-worktrees/scripts/managed-session.ps1"
      - "plugins/agent-worktrees/scripts/managed_session.py"
      - "plugins/agent-worktrees/scripts/pre-tool-hook.ps1"
      - "plugins/agent-worktrees/scripts/hook-read-policy.json"
      - "plugins/agent-worktrees/scripts/guarded_anchor_map.py"
      - "plugins/agent-worktrees/scripts/tool_call_forms.py"
      - "tools/render-hook-read-policy.py"
      - "plugins/agent-worktrees/scripts/registry_root.py"
      - "plugins/agent-worktrees/tests/test_managed_session.py"
      - "plugins/agent-worktrees/tests/test_native_shell_arguments.py"
      - "plugins/agent-worktrees/scripts/hook-facts.ps1"
      - "plugins/agent-worktrees/scripts/post-tool-hook.ps1"
      - "plugins/agent-worktrees/tests/test_post_tool_shell.py"
      - "plugins/agent-worktrees/src/agent_worktrees/hook_ipc.py"
      - "plugins/agent-worktrees/src/agent_worktrees/status_monitor_wake.py"

permissions:
  contents: read

jobs:
  prepared-write-windows:
    name: Prepared file-local write (${{ matrix.packet }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - packet: admission-and-safe
            select: "prepared_native_membership_reuses_original_association or (registered_file_local_write_reuses_original_guard_facts and (ordinary or create or path-alias or json-args or cell or batch-read-only) and not (structured or write-name or patch or argument-))"
          - packet: fallback
            select: "registered_file_local_write_reuses_original_guard_facts and not (ordinary or create or path-alias or json-args or cell or batch-read-only or structured or write-name or patch or literal-batch or argument-)"
            residual: "registered_file_local_write_reuses_original_guard_facts and literal-batch and not cell"
            arguments: "native_shell_arguments or argument-shell-attribution or argument-batch-attribution"
          - packet: structured
            select: "registered_file_local_write_reuses_original_guard_facts and structured and not (write-name or (patch and not structured-patch))"
          - packet: write-names
            select: "registered_file_local_write_reuses_original_guard_facts and write-name and not (real-policy or protected)"
          - packet: write-name-fallback
            select: "registered_file_local_write_reuses_original_guard_facts and write-name and protected"
          - packet: write-name-policy
            select: "registered_file_local_write_reuses_original_guard_facts and write-name and real-policy"
          - packet: patch-positive
            select: "registered_file_local_write_reuses_original_guard_facts and (patch-input or patch-patch or patch-command or patch-json or patch-freeform or patch-crlf or patch-headers or patch-union or patch-batch or patch-duplicates or patch-limit or patch-field-bound) and not (protected or overflow or nonobject)"
          - packet: patch-protected
            select: "registered_file_local_write_reuses_original_guard_facts and patch and protected"
          - packet: patch-fallback
            select: "registered_file_local_write_reuses_original_guard_facts and patch and (invalid or targetless or fragment or malformed or unknown-header or overflow or foreign or nested or anchor or oversized or nonobject)"
          - packet: patch-policy
            select: "registered_file_local_write_reuses_original_guard_facts and patch-real-policy"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Qualify native writes and original policy fallback
        env:
          AGENT_WORKTREES_REQUIRE_NATIVE_MEMBERSHIP: "1"
          PYTHONUTF8: "0"
          PYTEST_ADDOPTS: "-vv --tb=short --durations=10"
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          --test-file tests/test_managed_session.py
          -k "${{ matrix.select }}"
          --allow-explicit-tiers --test-timeout 30 --timeout 300
      - name: Qualify literal batches on the same fallback worker
        if: ${{ !cancelled() && matrix.residual != '' }}
        env:
          AGENT_WORKTREES_REQUIRE_NATIVE_MEMBERSHIP: "1"
          PYTHONUTF8: "0"
          PYTEST_ADDOPTS: "-vv --tb=short --durations=10"
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          --test-file tests/test_managed_session.py
          -k "${{ matrix.residual }}"
          --allow-explicit-tiers --test-timeout 30 --timeout 300
      - name: Qualify original argument predicates and registered entries on the same fallback worker
        if: ${{ !cancelled() && matrix.arguments != '' }}
        env:
          AGENT_WORKTREES_REQUIRE_NATIVE_MEMBERSHIP: "1"
          PYTHONUTF8: "0"
          PYTEST_ADDOPTS: "-vv --tb=short --durations=10"
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          --test-file tests/test_managed_session.py
          --test-file tests/test_native_shell_arguments.py
          -k "${{ matrix.arguments }}"
          --allow-explicit-tiers --test-timeout 30 --timeout 300

  prepared-membership-windows:
    name: Prepared cell membership (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Require actual Windows PowerShell and PowerShell 7 membership and post-tool controls
        env:
          AGENT_WORKTREES_REQUIRE_NATIVE_MEMBERSHIP: "1"
          PYTHONUTF8: "0"
          PYTEST_ADDOPTS: "-vv -rP --tb=short --durations=10"
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          --test-file tests/test_managed_session.py
          --test-file tests/test_post_tool_shell.py
          -k "prepared_cell_membership or registered_prepared_cell or send_debits_allocation or prepared_json_engine_retains_shell_semantics"
          --allow-explicit-tiers --test-timeout 30 --timeout 300
      - name: Qualify mixed-batch registered entries and original receiver
        env:
          PYTHONUTF8: "0"
          PYTEST_ADDOPTS: "-vv --tb=short --durations=10"
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          --test-file tests/test_post_tool_shell.py
          --test-file tests/test_hook_ipc.py
          --test-file tests/test_status_monitor.py
          -k "(mixed and not registered_prepared_cell) or batch-unknown or batch-malformed"
          --allow-explicit-tiers --test-timeout 30 --timeout 300

  prepared-membership-linux:
    name: Selected cell membership producer (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Qualify original stamped cell publication and isolation
        shell: bash
        run: |
          runner=tools/run-plugin-tests.py
          if command -v docker >/dev/null && command -v devcontainer >/dev/null; then
            runner=tools/run_tests_in_devcontainer.py
          fi
          python "$runner" agent-worktrees \
            --test-file tests/test_managed_session.py \
            -k real_installation_cells_do_not_share_admission_or_fall_back \
            --allow-explicit-tiers --test-timeout 30 --timeout 180
