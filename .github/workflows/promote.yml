name: Promote dev to main

# Phase 3/5 of the dev-branch-release-pipeline effort
# (ThomasMichon/copilot-extensions#3336): once `Validation Gate`
# (.github/workflows/validation-gate.yml, itself chained after `CI` going
# green) finishes GREEN on `dev`, generate a single wholesale-replace commit
# and land it on `main` -- never a merge of `dev` into `main` -- via
# tools/promote_release.py. See that effort's README (Plan > Phase 3/5) for
# the full design.
#
# Admin-escalation gate: this job runs under the `main-promotion` GitHub
# Environment. That environment itself is NOT something this workflow file
# can configure -- a repo admin must add required reviewers to it
# (Settings > Environments > main-promotion) before this gate actually
# blocks anything unattended. Until that's done, the job runs without a
# human approval step (but every other guard below still applies).
#
# `main` carries a zero-bypass "pull request required" ruleset (a personal
# GitHub account cannot grant the GitHub Actions app -- or any other actor
# -- a bypass the way an organization can), so this job can never push to
# `main` directly. It pushes the generated commit to a throwaway
# `release/promote-<run id>` branch instead, opens a PR against `main`, and
# squash-merges it via the `gh` CLI (the same sanctioned path every other
# change to this repo already lands through) -- then tags the REAL,
# post-merge commit on `main` (a squash-merge produces a new sha; the
# pre-merge candidate commit this job built locally is never the thing
# that actually lands).
#
# Token: uses the `APERTURE_RELEASE_TOKEN` repository secret (a
# fine-grained PAT scoped to this repo, Contents: Read and write +
# Pull requests: Read and write), NOT the default `github.token`. GitHub
# never fires other workflow events (including `pull_request`) for content
# pushed/authored with the default `GITHUB_TOKEN` -- a documented
# anti-recursion safeguard -- so a `GITHUB_TOKEN`-authored candidate PR
# never triggers `ci.yml`'s required `main source gate` check and `gh pr
# merge --auto` sits permanently blocked (confirmed live on the very first
# real --push run, #3533 -- had to be merged with a manual admin bypass).
# A PAT-authored push/PR does trigger downstream workflows normally, making
# the merge genuinely turn-key.
#
# Emergency rollback: `python tools/rollback_release.py pause --reason "..."
# --push` BEFORE `revert --reason "..." --push` -- run by a human operator
# with their own `gh` credentials (see tools/rollback_release.py's own
# docstring), not from this workflow. `tools/promote_release.py` itself
# refuses to run while paused, and refuses to re-promote the exact `dev`
# state a rollback just reverted (the non-incremental-update guard) unless
# `--force` is passed after `dev` has moved forward with a real fix.

on:
  workflow_run:
    workflows: ["Validation Gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the generated commit + tag to main (default: true)"
        required: false
        default: "true"

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  promote:
    name: Promote dev -> main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: main-promotion
    env:
      GH_TOKEN: ${{ secrets.APERTURE_RELEASE_TOKEN }}
      CANDIDATE_BRANCH: release/promote-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.APERTURE_RELEASE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git identity for the generated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Download the commit Validation Gate actually validated
        id: validated-sha
        # `github.event.workflow_run.head_sha` is Validation Gate's OWN run
        # metadata -- and Validation Gate is itself triggered via
        # `workflow_run`, so its top-level `head_sha` is subject to the exact
        # same GitHub-documented unreliability the comment below describes
        # (ThomasMichon/copilot-extensions#3567: it reflects whatever `main`'s
        # tip was at trigger time, never the commit Validation Gate actually
        # re-derived, checked out, and tested). Download the artifact
        # Validation Gate's `gate` job uploaded with the commit it actually
        # confirmed, instead of trusting that event field one hop removed.
        #
        # `continue-on-error: true`: Validation Gate's own `gate` job only
        # uploads this artifact when ITS `is_dev` check was true -- a
        # Validation Gate run legitimately completes with overall
        # `conclusion: success` (the `gate` job itself succeeded) even when
        # `is_dev` was false (e.g. the triggering CI run was for main's own
        # generated promotion commit, not a real dev push), in which case no
        # artifact was ever uploaded and this download is expected to fail.
        # Treat that as "nothing to check" below rather than a hard failure.
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: validated-sha
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.APERTURE_RELEASE_TOKEN }}
      - name: Confirm this run is genuinely for a dev commit
        id: gate
        # `branches: [dev]` on the workflow_run trigger above looks like the
        # obvious filter, but it is unreliable in practice: GitHub's
        # workflow_run event consistently reports `head_branch` as the
        # repository's *default* branch (main), never the branch that
        # actually produced the triggering Validation Gate run -- confirmed
        # empirically across many real runs (dev-branch-release-pipeline
        # effort, promote-trigger finding: this left the whole pipeline
        # dead, 0 real triggers ever). Verify real dev-ancestry with git
        # instead of trusting that event metadata -- and, per #3567, verify
        # the SHA Validation Gate actually validated (downloaded above), not
        # its own run's `head_sha`.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f validated_sha.txt ]; then
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No validated-sha artifact from the triggering Validation Gate run -- it wasn't for a dev commit (is_dev was false there too), skipping."
            exit 0
          fi
          git fetch origin dev
          sha="$(cat validated_sha.txt)"
          if git merge-base --is-ancestor "$sha" origin/dev; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$sha is not on origin/dev's history -- skipping (this Validation Gate completion was for a different branch/PR)."
          fi
      - name: Promote (push a candidate branch; report-only if push=false)
        id: promote
        if: steps.gate.outputs.is_dev == 'true'
        env:
          PUSH_INPUT: ${{ github.event.inputs.push }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$PUSH_INPUT" = "false" ]; then
            python tools/promote_release.py --dev-ref origin/dev --main-ref origin/main
            echo "land=false" >> "$GITHUB_OUTPUT"
          else
            output=$(python tools/promote_release.py --dev-ref origin/dev --main-ref origin/main \
              --push --candidate-branch "$CANDIDATE_BRANCH")
            echo "$output"
            echo "land=true" >> "$GITHUB_OUTPUT"
            # Machine-readable list of the .changefiles/*.json this run
            # consumed (tools/promote_release.py's own "changefile-consumed:"
            # marker lines) -- the "Clear consumed changefiles" step below
            # deletes exactly these from dev, so a later promotion never
            # re-reads and re-bumps the same already-landed changefiles
            # against dev's still-unbumped plugin.json (see that tool's own
            # comment for the confirmed-live collision this prevents).
            {
              echo "consumed_changefiles<<CHANGEFILES_EOF"
              echo "$output" | sed -n 's/^  changefile-consumed: //p'
              echo "CHANGEFILES_EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Land the candidate branch on main via PR + squash-merge
        id: land
        if: steps.promote.outputs.land == 'true'
        run: |
          if ! git ls-remote --exit-code --heads origin "$CANDIDATE_BRANCH" > /dev/null; then
            echo "No candidate branch pushed (nothing to promote) -- skipping."
            echo "candidate_pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "candidate_pushed=true" >> "$GITHUB_OUTPUT"
          # `gh pr create` has no --json/--jq flags (those belong to `gh pr
          # view`/`gh pr list`); it prints the PR URL on success. Extract the
          # number from that URL instead of piping create straight into --jq
          # (confirmed live: this workflow's first real --push run failed
          # here with "unknown flag: --json").
          pr_url=$(gh pr create --base main --head "$CANDIDATE_BRANCH" \
            --title "release: promote dev to main ($CANDIDATE_BRANCH)" \
            --body "Generated by tools/promote_release.py. Do not edit by hand.")
          pr_number=$(basename "$pr_url")
          gh pr merge "$pr_number" --squash --auto
      - name: Tag the real post-merge commit
        if: steps.promote.outputs.land == 'true' && steps.land.outputs.candidate_pushed == 'true'
        run: |
          git fetch origin main
          new_sha=$(git rev-parse origin/main)
          tag_name="promote-$(date -u +%Y%m%d%H%M%S)-${new_sha:0:8}"
          git tag -a "$tag_name" -m "release: promote dev to main ($CANDIDATE_BRANCH -> $new_sha)" "$new_sha"
          git push origin "$tag_name"
      - name: Clear consumed changefiles on dev
        # promote_release.py deliberately NEVER touches dev's own tree
        # (only the isolated scratch worktree that becomes main's
        # snapshot) -- so without this step, every already-landed
        # changefile stays on dev forever, and each future promotion
        # re-reads and re-consumes it, recomputing the SAME target version
        # from dev's still-unbumped plugin.json every time (confirmed
        # live: two consecutive real promotions both computed identical
        # "agent-bridge 0.4.0-dev551 -> 0.4.1-dev1"). Lands as an ordinary
        # PR through dev's own normal ruleset (PR + CI required, no
        # bypass) -- ci.yml's changefile-presence guard only requires a
        # NEW changefile for touched plugin content, and this PR touches
        # only .changefiles/ deletions, so it passes trivially.
        if: >-
          steps.promote.outputs.land == 'true' &&
          steps.land.outputs.candidate_pushed == 'true' &&
          steps.promote.outputs.consumed_changefiles != ''
        run: |
          git fetch origin dev
          cleanup_branch="chore/consume-changefiles-${{ github.run_id }}"
          git switch -c "$cleanup_branch" origin/dev
          removed=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if [ -f ".changefiles/$name" ]; then
              git rm -q -- ".changefiles/$name"
              removed=$((removed + 1))
            fi
          done <<< "${{ steps.promote.outputs.consumed_changefiles }}"
          if [ "$removed" -eq 0 ] || git diff --cached --quiet; then
            echo "Nothing to remove (already cleared by an earlier run) -- skipping."
            exit 0
          fi
          git commit -m "chore: clear changefiles consumed by promotion ${{ github.run_id }}"
          git push origin "HEAD:$cleanup_branch"
          pr_url=$(gh pr create --base dev --head "$cleanup_branch" \
            --title "chore: clear changefiles consumed by promotion ${{ github.run_id }}" \
            --body "Generated by tools/promote_release.py via promote.yml. Removes changefiles already consumed by the just-completed promotion, so a future promotion never re-bumps the same plugin(s) to the same already-shipped target version. Do not edit by hand.")
          pr_number=$(basename "$pr_url")
          gh pr merge "$pr_number" --squash --auto
