name: Promote dev to main

# Phase 3 of the dev-branch-release-pipeline effort
# (ThomasMichon/copilot-extensions#3336): once `CI` (.github/workflows/ci.yml)
# finishes GREEN on `dev`, generate a single wholesale-replace commit onto
# `main` -- never a merge of `dev` into `main` -- via tools/promote_release.py.
# See that effort's README (Plan > Phase 3, and the Phase 2 sequencing note)
# for the full design and for what remains deliberately NOT wired yet
# (the changefile-presence guard, CONTRIBUTING.md/AGENTS.md going live, and
# branch protection on `main` are all still gated on this pipeline being
# demonstrated end-to-end first).
#
# Admin-escalation gate (Phase 3's last checklist item): this job runs under
# the `main-promotion` GitHub Environment. That environment itself is NOT
# something this workflow file can configure -- a repo admin must add
# required reviewers to it (Settings > Environments > main-promotion) before
# this can ever auto-promote unattended. Until that's done, this workflow
# will simply wait indefinitely for that environment's approval on every run,
# which is the intended fail-safe default, not a bug.
#
# A SECOND, deliberate belt-and-suspenders layer on top of that (not required
# by the Plan): the automatic `workflow_run` trigger always runs in
# report-only mode (no `--push`), regardless of environment approval. Real
# pushes to `main` only ever happen from an explicit `workflow_dispatch` with
# `push: true`.
#
# This is not just extra caution -- it is currently load-bearing. A real
# dry run (2026-09-23) against this repo's actual origin/dev confirmed
# origin/main is running AHEAD of origin/dev (nobody targets `dev` yet, so
# it goes stale relative to real development). Flipping the automatic
# trigger to `--push` before Phase 5's real cutover (once `dev` is the
# trunk every PR actually targets) would regress `main` to `dev`'s older
# content. Do not flip this until Phase 5 is live -- update this comment and
# the effort's Plan/Journal in the same change when it is.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the generated commit + tag to main (default: dry run)"
        required: false
        default: "false"

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    name: Promote dev -> main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: main-promotion
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git identity for the generated commit
        run: |
          git config user.name "copilot-extensions-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
      - name: Dry run (report only; no push)
        if: github.event_name == 'workflow_run' || github.event.inputs.push != 'true'
        run: python tools/promote_release.py --dev-ref origin/dev --main-ref origin/main
      - name: Promote (push generated commit + tag)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true'
        run: python tools/promote_release.py --dev-ref origin/dev --main-ref origin/main --push
