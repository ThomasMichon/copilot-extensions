name: Focused Windows qualification
run-name: winqual ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Opaque request ID from tools/windows-qualification.py
        required: true
        type: string
      request:
        description: Versioned typed request; no commands or credentials
        required: true
        type: string

permissions: {}

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.admit.outputs.source_sha }}
    steps:
      - name: Require original and rerun owner on default-branch control
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_PROTECTED: ${{ github.ref_protected }}
        shell: bash
        run: |
          test "${ACTOR,,}" = "${OWNER,,}"
          test "${TRIGGERING_ACTOR,,}" = "${OWNER,,}"
          test "$REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$REF_PROTECTED" = "true"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate protected request contract
        id: admit
        run: python tools/windows_qualification_worker.py admit

  windows:
    needs: admit
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout protected controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Prepare controller tooling, not candidate test environments
        run: >-
          python control/tools/seasoned_uv.py --uv uv --registry-only --
          --system pytest pytest-timeout pytest-asyncio pyyaml packaging
      - name: Execute typed selection through canonical bounded owners
        run: >-
          python control/tools/windows_qualification_worker.py execute
          --candidate candidate --output evidence
      - name: Retain request-bound evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: winqual-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: warn
          retention-days: 7
