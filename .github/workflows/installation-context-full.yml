name: Installation context full

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      portfolio:
        description: Explicit isolated installation qualification portfolio
        type: choice
        options:
          - context
          - foundation
        default: context

permissions:
  contents: read

jobs:
  exhaustive:
    if: github.event_name != 'workflow_dispatch' || inputs.portfolio != 'foundation'
    name: exhaustive adapters
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - run: python tools/seasoned_uv.py --uv uv -- --system pytest
      - name: Run exhaustive installation-context portfolio
        env:
          INSTALLATION_CONTEXT_EXHAUSTIVE_ADAPTERS: "1"
        run: >-
          python -m pytest -q --durations=50
          libs/installation-context/tests
  foundation-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'foundation'
    name: foundation construction (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UPDATE_DRIVER_FOUNDATION_BUILD: "1"
      UPDATE_DRIVER_NATIVE_LINUX_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify Linux native operation and child custody across exec
        env:
          PYTHONPATH: libs/single-instance-lease/src:libs/agent-procutil/src
        run: |
          python tools/seasoned_uv.py --uv uv -- --system pytest psutil setuptools
          python -m pytest -q libs/single-instance-lease/tests/test_operation.py libs/single-instance-lease/tests/test_native_operation_linux.py
          python -m pytest -q libs/agent-procutil/tests/test_native_child.py libs/agent-procutil/tests/test_caller_owned.py libs/agent-procutil/tests/test_caller_owned_native.py
          python -m pytest -q libs/agent-procutil/tests/test_native_owned_shell.py libs/agent-procutil/tests/test_native_daemon_shell.py
      - name: Qualify same-boot queue settlement and legacy compatibility
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_settlement.py
          --test-file tests/test_recovery.py
          --test-file tests/test_operator_recovery.py
          --test-file tests/test_process.py
          --test-file tests/test_settled_failure_process.py
          --test-file tests/test_legacy_record_readback.py
      - name: Qualify older-client source-bootstrap repair entry
        run: >-
          python tools/run-plugin-tests.py worktree-manager
          --test-file tests/test_bootstrap_repair_recovery.py
          --test-timeout 120 --timeout 240
      - name: Qualify actual immutable foundation construction and custody
        # Reap and clean each module's private runtimes within the existing storage cap.
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_foundation_inputs.py
          --test-file tests/test_foundation_state.py
          --test-file tests/test_foundation_native_process.py
          --test-file tests/test_foundation_progress_process.py
          --test-file tests/test_foundation_linux_process.py
          --test-file tests/test_foundation_producer_process.py
          --test-file tests/test_foundation_upgrade_process.py
          --test-file tests/test_foundation_genesis_process.py
          --test-file tests/test_native_participant.py
          --test-file tests/test_foundation_build_process.py
          --test-file tests/test_source_removal.py
          --test-file tests/test_first_use.py
          --test-file tests/test_first_use_native.py
          --max-files-per-sub-suite 1 --test-timeout 300 --timeout 600
      - name: Qualify Python-free Linux genesis and retained upgrade
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_foundation_linux_genesis.py
          --test-file tests/test_first_use_genesis.py
          --test-file tests/test_first_use_vault.py
          --test-file tests/test_first_use_vault_command.py
          --test-file tests/test_first_use_vault_bootstrap.py
          --max-files-per-sub-suite 1 --test-timeout 900 --timeout 1080
      - name: Qualify Vault bootstrap routing and publication admission
        run: >-
          python tools/run-plugin-tests.py agent-vault
          --test-file tests/test_bootstrap_driver.py
          --test-file tests/test_bootstrap_check_reconcile_always_on.py
          --test-file tests/test_payload_invocation.py
          --test-timeout 120 --timeout 360
      - name: Qualify actual bootstrap policy and retained snapshot consumers
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_bootstrap_publication.py
          --test-file tests/test_command_binding.py
          --test-file tests/test_bridge_first_use_publication.py
          -k "agent-vault or test_snapshot_retains_every_byte or test_snapshot_surfaces_file_read_failure or (test_bridge_actual_first_use_publication and legacy-managed-payload)"
          --allow-explicit-tiers --test-timeout 120 --timeout 540
  foundation-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'foundation'
    name: foundation construction (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      UPDATE_DRIVER_FOUNDATION_BUILD: "1"
      UPDATE_DRIVER_NATIVE_FOUNDATION_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify same-boot queue settlement and legacy compatibility
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_settlement.py
          --test-file tests/test_recovery.py
          --test-file tests/test_operator_recovery.py
          --test-file tests/test_process.py
          --test-file tests/test_settled_failure_process.py
          --test-file tests/test_legacy_record_readback.py
      - name: Qualify older-client source-bootstrap repair entry
        run: >-
          python tools/run-plugin-tests.py worktree-manager
          --test-file tests/test_bootstrap_repair_recovery.py
          --test-timeout 120 --timeout 240
      - name: Qualify actual immutable foundation construction and custody
        # Reap and clean each module's private runtimes within the existing storage cap.
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_foundation_inputs.py
          --test-file tests/test_foundation_state.py
          --test-file tests/test_foundation_native_process.py
          --test-file tests/test_foundation_progress_process.py
          --test-file tests/test_foundation_linux_process.py
          --test-file tests/test_foundation_producer_process.py
          --test-file tests/test_foundation_upgrade_process.py
          --test-file tests/test_foundation_genesis_process.py
          --test-file tests/test_native_participant.py
          --test-file tests/test_foundation_build_process.py
          --test-file tests/test_source_removal.py
          --test-file tests/test_first_use.py
          --test-file tests/test_first_use_native.py
          --max-files-per-sub-suite 1 --test-timeout 1200 --timeout 1380
      - name: Qualify Python-free Windows genesis and actual Vault bootstrap
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_genesis.py
          --test-file tests/test_first_use_vault.py
          --test-file tests/test_first_use_vault_command.py
          --test-file tests/test_first_use_vault_bootstrap.py
          --max-files-per-sub-suite 1 --test-timeout 1200 --timeout 1380
      - name: Qualify Vault bootstrap routing and publication admission
        run: >-
          python tools/run-plugin-tests.py agent-vault
          --test-file tests/test_bootstrap_driver.py
          --test-file tests/test_bootstrap_check_reconcile_always_on.py
          --test-file tests/test_payload_invocation.py
          --test-timeout 120 --timeout 360
      - name: Qualify actual bootstrap policy and retained snapshot consumers
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_bootstrap_publication.py
          --test-file tests/test_command_binding.py
          --test-file tests/test_bridge_first_use_publication.py
          -k "agent-vault or test_snapshot_retains_every_byte or test_snapshot_surfaces_file_read_failure or (test_bridge_actual_first_use_publication and legacy-managed-payload)"
          --allow-explicit-tiers --test-timeout 120 --timeout 540
