name: Installation context full

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      portfolio:
        description: Explicit isolated installation qualification portfolio
        type: choice
        options:
          - context
          - foundation
          - pull-requests-commands
          - pull-requests-bootstrap
          - ssh-recipes
          - ssh-bootstrap
          - ssh-commands
          - codespaces-recipes
          - codespaces-bootstrap
          - logger-recipes
          - bridge-contracts
        default: context

permissions:
  contents: read

jobs:
  bridge-contracts-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'bridge-contracts'
    name: Bridge historical source proof (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Validate canonical historical evidence
        run: python tools/check-agent-bridge-contracts.py
      - name: Exercise immutable bytes and historical publication guards
        run: >-
          python tools/run-plugin-tests.py agent-bridge
          --test-file tests/test_http48_source_retention.py
          --test-file tests/test_http48_capture_guards.py
          --test-file tests/test_http47_capture_guards.py
          -k "http48 or shared_capture_seed_has_owned_committed_inputs or capture_reproducible_real_commit_preserves_history"

  logger-recipes-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'logger-recipes'
    name: Logger fixed recipes (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UPDATE_DRIVER_NATIVE_LINUX_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify fixed Logger recipes, concurrent cold callers and installed consumers
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_logger.py
          --test-timeout 900 --timeout 1200
      - name: Qualify Logger caller loss and ordinary durable result
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_genesis.py -k owning_logger
          --test-timeout 900 --timeout 1080
  logger-recipes-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'logger-recipes'
    name: Logger fixed recipes (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      UPDATE_DRIVER_NATIVE_FOUNDATION_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify fixed Logger recipes, concurrent cold callers and installed consumers
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_logger.py
          --test-timeout 900 --timeout 1200
      - name: Qualify Logger caller loss and ordinary durable result
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_genesis.py -k owning_logger
          --test-timeout 900 --timeout 1080
  codespaces-bootstrap-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'codespaces-bootstrap'
