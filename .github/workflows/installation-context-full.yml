      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify Linux native operation and child custody across exec
        env:
          PYTHONPATH: libs/single-instance-lease/src:libs/agent-procutil/src
        run: |
          python tools/seasoned_uv.py --uv uv -- --system pytest psutil setuptools
          python -m pytest -q libs/single-instance-lease/tests/test_operation.py libs/single-instance-lease/tests/test_native_operation_linux.py
          python -m pytest -q libs/agent-procutil/tests/test_native_child.py libs/agent-procutil/tests/test_caller_owned.py libs/agent-procutil/tests/test_caller_owned_native.py
          python -m pytest -q libs/agent-procutil/tests/test_native_owned_shell.py libs/agent-procutil/tests/test_native_daemon_shell.py
      - name: Qualify same-boot queue settlement and legacy compatibility
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_settlement.py
          --test-file tests/test_recovery.py
          --test-file tests/test_operator_recovery.py
