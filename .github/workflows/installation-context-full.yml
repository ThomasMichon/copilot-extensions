    if: github.event_name != 'workflow_dispatch' || inputs.portfolio == 'context'
    name: exhaustive adapters
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - run: python tools/seasoned_uv.py --uv uv -- --system pytest
      - name: Run exhaustive installation-context portfolio
        env:
          INSTALLATION_CONTEXT_EXHAUSTIVE_ADAPTERS: "1"
        run: >-
          python -m pytest -q --durations=50
          libs/installation-context/tests
