  bridge-contracts-linux:
    if: github.event_name == 'workflow_dispatch' && (inputs.portfolio == 'bridge-contracts' || inputs.portfolio == 'bridge-http52-capture')
    name: Bridge historical source proof (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.portfolio == 'bridge-http52-capture' && 30 || 10 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Pin current capture source
        if: inputs.portfolio == 'bridge-http52-capture'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          source = os.environ["SOURCE_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", source)
          assert source == os.environ["GITHUB_SHA"]
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == source
          PY
      - name: Prepare declared isolated capture dependencies
        if: inputs.portfolio == 'bridge-http52-capture'
        timeout-minutes: 5
        run: python tools/run-plugin-tests.py agent-bridge --prepare-only
      - name: Check controlled artifact input boundaries
        if: inputs.portfolio == 'bridge-http52-capture' || inputs.portfolio == 'bridge-contracts'
        timeout-minutes: 3
        run: >-
          python tools/run-plugin-tests.py agent-bridge --allow-explicit-tiers
          --test-file tests/test_http52_artifact.py
          --plugin-timeout 120 --timeout 90 --test-timeout 30
      - name: Check the immutable peer-prefix consumer
        if: inputs.portfolio == 'bridge-http52-capture' || inputs.portfolio == 'bridge-contracts'
        timeout-minutes: 5
        run: >-
          python tools/run-plugin-tests.py agent-pull-requests --allow-explicit-tiers
          --test-file tests/test_watch_peer.py
          -k cli_peer_prefix_uses_immutable_snapshot_not_management_payload
          --plugin-timeout 180 --timeout 120 --test-timeout 90
      - name: Capture current HTTP-52 controlled source evidence
        if: inputs.portfolio == 'bridge-http52-capture'
        timeout-minutes: 10
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python -I -B - <<'PY'
          import os, runpy, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path[:0] = [str(root / "libs/agent-procutil/src"), str(root / "tools")]
          sys.argv = ["tools/capture_bridge_http52.py", "--source-commit", os.environ["SOURCE_SHA"], "--write"]
          runpy.run_path(sys.argv[0], run_name="__main__")
          PY
      - name: Independently verify current HTTP-52 controlled source evidence
        if: inputs.portfolio == 'bridge-http52-capture'
        timeout-minutes: 10
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python -I -B - <<'PY'
          import os, runpy, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path[:0] = [str(root / "libs/agent-procutil/src"), str(root / "tools")]
          sys.argv = ["tools/capture_bridge_http52.py", "--source-commit", os.environ["SOURCE_SHA"]]
          runpy.run_path(sys.argv[0], run_name="__main__")
          PY
      - name: Exercise immutable bytes and historical publication guards
        env:
          PYTEST_ADDOPTS: "--maxfail=1 -vv --durations=20"
        run: >-
          python tools/run-plugin-tests.py agent-bridge
          --test-file tests/test_http48_source_retention.py
          --test-file tests/test_http48_capture_guards.py
          --test-file tests/test_http47_capture_guards.py
          -k "http48 or shared_capture_seed_has_owned_committed_inputs or capture_reproducible_real_commit_preserves_history"
          --junit-dir "${{ runner.temp }}/bridge-historical-guard-junit"
      - name: Retain historical publication guard outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-historical-guard-outcomes-${{ github.run_id }}
          path: ${{ runner.temp }}/bridge-historical-guard-junit
          if-no-files-found: warn
      - name: Validate canonical historical evidence
        run: python tools/check-agent-bridge-contracts.py
      - name: Export only canonical current outputs and source preimages
        if: inputs.portfolio == 'bridge-http52-capture'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python tools/bridge_http52_artifact.py export --source-commit "$SOURCE_SHA" --artifact-dir http52-qualified-artifact
      - name: Retain qualified current HTTP-52 outputs
        if: inputs.portfolio == 'bridge-http52-capture'
        uses: actions/upload-artifact@v4
        with:
          name: http52-qualified-${{ github.sha }}
          path: http52-qualified-artifact
          if-no-files-found: error

