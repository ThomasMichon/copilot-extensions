  pane-argv-windows:
    if: github.event_name == 'workflow_dispatch' && (inputs.portfolio == 'pane-argv' || inputs.portfolio == 'mux-companion')
    name: Native PSMux 3.3.6 (isolated session)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Prepare pinned disposable PSMux
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $null = Get-Command pwsh -CommandType Application -ErrorAction Stop
          $root = Join-Path $env:RUNNER_TEMP 'pane-argv-psmux'
          $null = New-Item -ItemType Directory -Path $root
          $archive = Join-Path $root 'psmux.zip'
          Invoke-WebRequest -Uri 'https://github.com/psmux/psmux/releases/download/v3.3.6/psmux-v3.3.6-windows-x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'a56a890ea0829567818b9a368f16dcbd39c087f27328573df17c10dd39618947') {
            throw 'Pinned PSMux archive digest mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $binaries = @(Get-ChildItem -LiteralPath $root -Filter psmux.exe -Recurse -File)
          if ($binaries.Count -ne 1) { throw 'Expected exactly one pinned PSMux binary' }
          "PSMUX_TEST_BIN=$($binaries[0].FullName)" >> $env:GITHUB_ENV
      - name: Qualify actual pane producers and owned teardown
        if: inputs.portfolio == 'pane-argv'
        env:
          PSMUX_FILE_LAUNCH_E2E: "1"
          UV_PYTHON: "3.12"
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          python -c "import os,subprocess,sys; actual=subprocess.check_output(['git','rev-parse','HEAD'],creationflags=subprocess.CREATE_NO_WINDOW,text=True).strip(); assert actual == os.environ['EXPECTED_SOURCE'], (actual,os.environ['EXPECTED_SOURCE']); print('Source:',actual); print('Python:',sys.version)"
          python tools/run-plugin-tests.py worktree-manager --test-file tests/test_pane_args_file.py -k real_psmux --allow-explicit-tiers
      - name: Qualify native Companion attention and navigation
        if: inputs.portfolio == 'mux-companion'
        env:
          UV_PYTHON: "3.12"
        run: >-
          python tools/run-plugin-tests.py worktree-manager
          --test-file tests/native/test_companion_pane_native.py
          --test-file tests/test_companion_attention.py
          --test-file tests/test_companion_attention_ui.py
          --allow-explicit-tiers --test-timeout 120

