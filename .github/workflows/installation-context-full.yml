  path-captures:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'path-captures'
    name: Path and exemplar diagnostics (ubuntu-latest, ${{ matrix.phase }})
    runs-on: ubuntu-latest
    strategy: &path-capture-strategy
      fail-fast: false
      matrix:
        phase: [paths, producers, slots]
    timeout-minutes: 20
    steps: &path-capture-steps
