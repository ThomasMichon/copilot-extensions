name: Installation context full

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive:
    name: exhaustive adapters
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --upgrade pip pytest
      - name: Run exhaustive installation-context portfolio
        env:
          INSTALLATION_CONTEXT_EXHAUSTIVE_ADAPTERS: "1"
        run: >-
          python -m pytest -q --durations=50
          libs/installation-context/tests
