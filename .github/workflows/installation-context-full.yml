  generic-mux-windows:
    if: github.event_name == 'workflow_dispatch' && (inputs.portfolio == 'generic-mux' || inputs.portfolio == 'resume-pane' || inputs.portfolio == 'mux-continuity')
    name: PSMux ${{ inputs.portfolio == 'mux-continuity' && '3.4.0' || '3.3.8' }} consumer qualification (isolated sessions)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Prepare preferred disposable PSMux
        shell: pwsh
        env:
          PORTFOLIO: ${{ inputs.portfolio }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'generic-mux-psmux'
          $null = New-Item -ItemType Directory -Path $root
          $archive = Join-Path $root 'psmux.zip'
          $version = '3.3.8'
          $digest = '1ad127ba937194a890b933a73d9b023e297bd73dc742abd841bf159984c2effe'
          if ($env:PORTFOLIO -eq 'mux-continuity') {
            $version = '3.4.0'
            $digest = 'a66b6be7c13c6fa0dc3660a267b9e34eaa91a4eb7f07fbd55a0468018bd0f721'
          }
          try {
            Invoke-WebRequest -Uri "https://github.com/psmux/psmux/releases/download/v$version/psmux-v$version-windows-x64.zip" -OutFile $archive -TimeoutSec 60
          } catch {
            if ([int]$_.Exception.Response.StatusCode -notin @(429, 500, 502, 503, 504)) { throw }
            Write-Host 'Retrying pinned PSMux acquisition through its public release API'
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/psmux/psmux/releases/tags/v$version" -TimeoutSec 30
            $assets = @($release.assets | Where-Object name -eq "psmux-v$version-windows-x64.zip")
            if ($assets.Count -ne 1 -or $assets[0].id -le 0) { throw 'Pinned PSMux asset is unavailable' }
            Invoke-WebRequest -Uri ("https://api.github.com/repos/psmux/psmux/releases/assets/" + [long]$assets[0].id) -Headers @{ Accept = 'application/octet-stream' } -OutFile $archive -TimeoutSec 60
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $digest) {
            throw 'Pinned PSMux archive digest mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $binaries = @(Get-ChildItem -LiteralPath $root -Filter psmux.exe -Recurse -File)
          if ($binaries.Count -ne 1) { throw 'Expected exactly one pinned PSMux binary' }
          "PSMUX_TEST_BIN=$($binaries[0].FullName)" >> $env:GITHUB_ENV
          $binaries[0].DirectoryName >> $env:GITHUB_PATH
      - name: Qualify concurrent Resume consumers before controller activation
        if: inputs.portfolio == 'resume-pane' || inputs.portfolio == 'mux-continuity'
        env:
          UV_PYTHON: "3.12"
        shell: pwsh
        run: |
          python tools/run-plugin-tests.py worktree-manager --test-file tests/native/test_resume_pane_startup.py --allow-explicit-tiers --junit-dir "$env:RUNNER_TEMP\resume-evidence" --timeout 360 --plugin-timeout 600 --test-timeout 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain native Resume evidence
        if: always() && (inputs.portfolio == 'resume-pane' || inputs.portfolio == 'mux-continuity')
        uses: actions/upload-artifact@v4
        with:
          name: native-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resume-evidence
          if-no-files-found: error
          retention-days: 2
      - name: Qualify generic creation and truthful verification
        if: inputs.portfolio == 'generic-mux'
        env:
          PSMUX_FILE_LAUNCH_E2E: "1"
          UV_PYTHON: "3.12"
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          python -c "import os,subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'],creationflags=subprocess.CREATE_NO_WINDOW,text=True).strip(); assert actual == os.environ['EXPECTED_SOURCE']; print('Source:',actual)"
          python tools/run-plugin-tests.py agent-worktrees --test-file tests/native/test_generic_mux_startup.py --test-file tests/test_empty_mux_listing.py --test-file tests/test_mux_creation_admission.py --test-file tests/test_embody.py --allow-explicit-tiers

