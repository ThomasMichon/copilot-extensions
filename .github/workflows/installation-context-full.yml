name: Installation context full

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      portfolio:
        description: Explicit isolated installation qualification portfolio
        type: choice
        options:
          - context
          - foundation
        default: context

permissions:
  contents: read

jobs:
  exhaustive:
    if: github.event_name != 'workflow_dispatch' || inputs.portfolio != 'foundation'
    name: exhaustive adapters
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - run: python tools/seasoned_uv.py --uv uv -- --system pytest
      - name: Run exhaustive installation-context portfolio
        env:
          INSTALLATION_CONTEXT_EXHAUSTIVE_ADAPTERS: "1"
        run: >-
          python -m pytest -q --durations=50
          libs/installation-context/tests
  foundation-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'foundation'
    name: foundation construction (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPDATE_DRIVER_FOUNDATION_BUILD: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify Linux native operation custody and exec handoff
        env:
          PYTHONPATH: libs/single-instance-lease/src:libs/agent-procutil/src
        run: |
          python tools/seasoned_uv.py --uv uv -- --system pytest
          python -m pytest -q libs/single-instance-lease/tests/test_operation.py libs/single-instance-lease/tests/test_native_operation_linux.py
      - name: Qualify actual immutable foundation construction and custody
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_foundation_inputs.py
          --test-file tests/test_foundation_state.py
          --test-file tests/test_foundation_native_process.py
          --test-file tests/test_foundation_progress_process.py
          --test-file tests/test_foundation_producer_process.py
          --test-file tests/test_foundation_upgrade_process.py
          --test-file tests/test_foundation_genesis_process.py
          --test-file tests/test_native_participant.py
          --test-file tests/test_foundation_build_process.py
          --test-timeout 300 --timeout 600
  foundation-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'foundation'
    name: foundation construction (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      UPDATE_DRIVER_FOUNDATION_BUILD: "1"
      UPDATE_DRIVER_NATIVE_FOUNDATION_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify actual immutable foundation construction and custody
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_foundation_inputs.py
          --test-file tests/test_foundation_state.py
          --test-file tests/test_foundation_native_process.py
          --test-file tests/test_foundation_progress_process.py
          --test-file tests/test_foundation_producer_process.py
          --test-file tests/test_foundation_upgrade_process.py
          --test-file tests/test_foundation_genesis_process.py
          --test-file tests/test_native_participant.py
          --test-file tests/test_foundation_build_process.py
          --test-timeout 1200 --timeout 1380
