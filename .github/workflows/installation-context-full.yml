name: Installation context full

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      portfolio:
        description: Explicit isolated installation qualification portfolio
        type: choice
        options:
          - context
          - foundation
          - mux-companion
          - pull-requests-commands
          - pull-requests-bootstrap
          - ssh-recipes
          - ssh-bootstrap
          - ssh-commands
          - pr-sweep
          - codespaces-recipes
          - codespaces-bootstrap
          - logger-recipes
          - logger-bootstrap
          - logger-commands
          - bridge-recipes
          - bridge-bootstrap
          - bridge-snapshots
          - bridge-commands
          - bridge-contracts
          - bridge-binding
          - dispatch-binding
          - dispatch-maintenance
          - promotion-controls
          - pane-argv
          - manager-uninstall
        default: context

permissions:
  contents: read

jobs:
  bridge-commands-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'bridge-commands'
    name: Bridge commands (Ubuntu, ${{ matrix.packet.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        packet: &bridge-command-packets
          - name: refusal-driver
            select: refusal and (missing-driver or old-driver or old-resolver or old-dispatcher)
          - name: refusal-policy
            select: refusal and (managed or malformed-policy or no-self or nested)
          - name: refusal-source
            select: refusal and (unselected or unavailable or missing-provenance or malformed-provenance)
          - name: refusal-context
            select: refusal and (pinned or custom-root or cell or ordinary-copy)
          - {name: payload, select: original_operation and payload}
          - {name: primary, select: original_operation and primary}
          - {name: ordinary, select: original_operation and ordinary}
          - {name: concurrent, select: concurrent}
          - {name: failed, select: failed}
          - {name: transport, select: cold_wait}
    env:
      UPDATE_DRIVER_NATIVE_LINUX_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps: &bridge-command-steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify one bounded real command packet
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge_command.py
          -k "${{ matrix.packet.select }}" --test-timeout 900 --timeout 1080
  bridge-commands-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'bridge-commands'
    name: Bridge commands (Windows, ${{ matrix.packet.name }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        packet: *bridge-command-packets
        include:
          - packet: {name: cmd, select: original_operation and cmd}
    env:
      UPDATE_DRIVER_NATIVE_FOUNDATION_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps: *bridge-command-steps
  bridge-command-publication-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'bridge-commands'
    name: Bridge publication (Ubuntu, ${{ matrix.packet }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy: &bridge-command-publication-packets
      fail-fast: false
      matrix:
        packet:
          - "cell_stamp and available"
          - "cell_stamp and pointer and not publisher"
          - "cell_stamp and publisher and not pointer"
          - "cell_stamp and publisher-and-pointer and not deactivated"
          - "cell_stamp and deactivated"
          - "actual and legacy and payload"
          - "actual and selected-cell and payload"
          - "actual and catalog"
          - "actual and stamped-global"
          - "actual and stamped-unavailable"
          - "actual and stamped-no-pointer"
    env:
      UV_PYTHON: "3.12"
    steps: &bridge-command-publication-steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Preserve one bounded publication and selected-cell packet
        run: >-
          python tools/run-plugin-tests.py payload-invocation --allow-explicit-tiers
          --test-file tests/test_bridge_first_use_publication.py
          -k "${{ matrix.packet }}" --test-timeout 60 --timeout 900
  bridge-command-publication-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'bridge-commands'
    name: Bridge publication (Windows, ${{ matrix.packet }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy: *bridge-command-publication-packets
    env:
      UV_PYTHON: "3.12"
    steps: *bridge-command-publication-steps
  bridge-command-controls-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'bridge-commands'
    name: Bridge command controls (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UV_PYTHON: "3.12"
    steps: &bridge-command-control-steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Preserve native binary, prompt and exit contracts
        run: >-
          python tools/run-plugin-tests.py agent-bridge --allow-explicit-tiers
          --test-file tests/test_payload_invocation.py
          --test-timeout 120 --timeout 600
      - name: Preserve canonical bootstrap and source recipe admission
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge_snapshot.py -k "not actual"
          --test-timeout 90 --timeout 600
  bridge-command-controls-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'bridge-commands'
    name: Bridge command controls (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      UV_PYTHON: "3.12"
    steps: *bridge-command-control-steps
  bridge-snapshots-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'bridge-snapshots'
    name: Bridge selected snapshots (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UPDATE_DRIVER_NATIVE_LINUX_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps: &bridge-snapshots-steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify selected-source admission and frozen-input refusals
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge_snapshot.py
          -k "not actual" --test-timeout 90 --timeout 600
      - name: Qualify actual source preparation, caller loss and native consumers
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge_snapshot.py
          -k "actual and not actual_stamp" --test-timeout 900 --timeout 1080
      - name: Preserve canonical source archive and immutable preparation
        run: >-
          python tools/run-plugin-tests.py runtime-source
          --test-file tests/test_prepare_runtime_source.py
          --test-file tests/test_source_snapshot_publication.py
          --test-timeout 120 --timeout 600
      - name: Preserve native waitable owner exit status
        run: >-
          python tools/run-plugin-tests.py agent-procutil
          --test-file tests/test_native_daemon_shell.py
          -k waitable --test-timeout 90 --timeout 180
      - name: Qualify source-qualified native stamp in its own storage boundary
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge_snapshot.py
          -k actual_stamp --test-timeout 900 --timeout 1080
      - name: Preserve installed-source fixed recipes and native lifecycle
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge.py
          -k "not native_caller_loss" --test-timeout 900 --timeout 900
      - name: Preserve shared Logger selected-source refusal behavior
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_logger_snapshot.py
          -k "not actual" --test-timeout 90 --timeout 600
      - name: Preserve canonical-installed-only bootstrap publication
        env:
          UPDATE_DRIVER_BRIDGE_BOOTSTRAP_ACCEPTANCE: "1"
        run: >-
          python tools/run-plugin-tests.py agent-bridge
          --test-file tests/test_bootstrap_driver.py
          --test-timeout 60 --timeout 180
  bridge-snapshots-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'bridge-snapshots'
    name: Bridge selected snapshots (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      UPDATE_DRIVER_NATIVE_FOUNDATION_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps: *bridge-snapshots-steps
  bridge-bootstrap-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'bridge-bootstrap'
    name: Bridge bootstrap (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UPDATE_DRIVER_BRIDGE_BOOTSTRAP_ACCEPTANCE: "1"
      UPDATE_DRIVER_NATIVE_LINUX_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps: &bridge-bootstrap-steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify actual materialization, refusal and independent guidance
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge_bootstrap.py
          -k "not hook_deadline" --test-timeout 900 --timeout 900
      - name: Qualify actual cold hooks within their own storage boundary
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge_bootstrap.py
          -k hook_deadline --test-timeout 900 --timeout 1080
      - name: Preserve fixed recipes, native lifecycle and hook contracts
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge.py
          -k "not native_caller_loss" --test-timeout 900 --timeout 900
      - name: Prepare bounded readiness test tooling
        run: python tools/seasoned_uv.py --uv uv --registry-only -- --system pytest packaging
      - name: Qualify source-aware selected readiness
        run: >-
          python -m pytest -q libs/versioned-runtime/tests/test_bootstrap_selected_readiness.py
      - name: Preserve bootstrap and unattended repair boundaries
        run: >-
          python tools/run-plugin-tests.py agent-bridge
          --test-file tests/test_bootstrap_driver.py
          --test-file tests/test_install_ps1_s4u_recovery.py
          --test-file tests/test_install_lifecycle_emit.py
          --test-timeout 60 --timeout 360
      - name: Preserve Bridge bootstrap publication admission
        run: >-
          python tools/run-plugin-tests.py payload-invocation --allow-explicit-tiers
          --test-file tests/test_bootstrap_publication.py -k agent-bridge
          --test-timeout 120 --timeout 600
  bridge-bootstrap-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'bridge-bootstrap'
    name: Bridge bootstrap (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      UPDATE_DRIVER_BRIDGE_BOOTSTRAP_ACCEPTANCE: "1"
      UPDATE_DRIVER_NATIVE_FOUNDATION_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps: *bridge-bootstrap-steps
  manager-uninstall-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'manager-uninstall'
    name: Manager installed uninstall (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Record exact native source
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          python -c "import os,subprocess,sys; actual=subprocess.check_output(['git','rev-parse','HEAD'],creationflags=subprocess.CREATE_NO_WINDOW,text=True).strip(); assert actual == os.environ['EXPECTED_SOURCE']; print('Source:',actual); print('Python:',sys.version)"
      - name: Qualify actual installed removal and reinstall
        run: >-
          python tools\run-manager-runtime-acceptance.py --root .validation --contract uninstall

  mux-companion-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'mux-companion'
    name: Mux Companion native tmux 3.4 (isolated session)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Record immutable source and native prerequisite
        run: |
          git show --no-patch --format='source=%H parents=%P'
          tmux -V
          case "$(tmux -V)" in "tmux 3.4"*) ;; *) exit 1 ;; esac
      - name: Qualify real tmux observer navigation
        run: >-
          python tools/run-plugin-tests.py worktree-manager --allow-explicit-tiers
          --test-file tests/native/test_companion_pane_tmux.py
          --test-file tests/test_companion_topology.py
          --test-file tests/test_companion_observations.py
          --test-file tests/test_companion_attention.py
          --test-file tests/test_companion_attention_ui.py
          --test-file tests/test_companion_topology_ui.py --test-timeout 120
      - name: Qualify bounded root attention process contract
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          --test-file tests/test_session_attention.py
          --test-file tests/test_session_attention_cli.py --test-timeout 120

  bridge-recipes-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'bridge-recipes'
    name: Bridge fixed native recipes (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UPDATE_DRIVER_NATIVE_LINUX_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify Bridge admission and materialized stamp
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge.py
          -k "not native_caller_loss"
          --test-timeout 900 --timeout 900
      - name: Qualify Bridge cold provision within its own storage boundary
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge.py
          -k "native_caller_loss and provision"
          --test-timeout 900 --timeout 1080
      - name: Qualify Bridge cold install within its own storage boundary
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge.py
          -k "native_caller_loss and install"
          --test-timeout 900 --timeout 1080
      - name: Preserve native lifecycle and unattended repair boundaries
        run: >-
          python tools/run-plugin-tests.py agent-bridge
          --test-file tests/test_install_ps1_s4u_recovery.py
          --test-file tests/test_install_lifecycle_emit.py
          --test-timeout 60 --timeout 180
  bridge-recipes-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'bridge-recipes'
    name: Bridge fixed native recipes (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      UPDATE_DRIVER_NATIVE_FOUNDATION_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify Bridge admission and materialized stamp
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge.py
          -k "not native_caller_loss"
          --test-timeout 900 --timeout 900
      - name: Qualify Bridge cold provision within its own storage boundary
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge.py
          -k "native_caller_loss and provision"
          --test-timeout 900 --timeout 1080
      - name: Qualify Bridge cold install within its own storage boundary
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_bridge.py
          -k "native_caller_loss and install"
          --test-timeout 900 --timeout 1080
      - name: Preserve native lifecycle and unattended repair boundaries
        run: >-
          python tools/run-plugin-tests.py agent-bridge
          --test-file tests/test_install_ps1_s4u_recovery.py
          --test-file tests/test_install_lifecycle_emit.py
          --test-timeout 60 --timeout 180
  promotion-controls:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'promotion-controls'
    name: Promotion control retirement (actual Git)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Install seasoned integration tooling
        run: python tools/seasoned_uv.py --uv uv -- --system pytest packaging pyyaml
      - name: Record immutable integration source
        run: git show --no-patch --format='source=%H parents=%P'
      - name: Exercise real composition and repeated retirement
        env:
          PYTHONPATH: tools
        run: >-
          timeout --signal=TERM --kill-after=10s 100s python -m pytest -q
          tools/test_promotion_control.py::test_main_deleted_control_stays_deleted_across_promotions
          tools/test_promotion_control.py::test_explicit_retirement_returns_path_to_dev_composition
          tools/test_promotion_control.py::test_preservation_uses_pinned_main_not_live_main_or_dev
          tools/test_promotion_control.py::test_trusted_artifact_recomposition_uses_same_control_tree
          tools/test_promotion_control.py::test_real_git_witness_is_manual_bounded_and_outside_required_unit_ci
          tools/test_promotion_control.py::test_manifest_removal_cannot_reactivate_deleted_dev_workflow

  logger-commands-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'logger-commands'
    name: Logger command publishers (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UPDATE_DRIVER_NATIVE_LINUX_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify real command admission, caller loss and installed consumers
        env:
          PYTEST_ADDOPTS: "--capture=tee-sys"
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_logger_command.py
          --test-timeout 900 --timeout 1800
      - name: Preserve healthy dispatch and native wrapper publication
        run: >-
          python tools/run-plugin-tests.py agent-logger
          --test-file tests/test_runtime_gate.py
          --test-file tests/test_install_binstub.py
          --max-files-per-sub-suite 1 --test-timeout 120 --timeout 600
  logger-commands-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'logger-commands'
    name: Logger command publishers (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      UPDATE_DRIVER_NATIVE_FOUNDATION_GENESIS: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify real command admission, caller loss and installed consumers
        env:
          PYTEST_ADDOPTS: "--capture=tee-sys"
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_logger_command.py
          --test-timeout 900 --timeout 1800
      - name: Preserve healthy dispatch and native wrapper publication
        run: >-
          python tools/run-plugin-tests.py agent-logger
          --test-file tests/test_runtime_gate.py
          --test-file tests/test_install_binstub.py
          --max-files-per-sub-suite 1 --test-timeout 120 --timeout 600
  dispatch-binding-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'dispatch-binding'
    name: Dispatch scoped-stamp binding (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify actual scoped stamps and retained legacy commands
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_dispatch_scoped_publication.py
          --allow-explicit-tiers --test-timeout 60 --timeout 540

  dispatch-binding-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'dispatch-binding'
    name: Dispatch scoped-stamp binding (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify actual scoped stamps and retained legacy commands
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_dispatch_scoped_publication.py
          --allow-explicit-tiers --test-timeout 60 --timeout 540

  dispatch-maintenance-policy-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'dispatch-maintenance'
    name: Dispatch maintenance policy (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      PYTEST_ADDOPTS: "-ra"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - &dispatch-maintenance-preflight
        name: Verify native Windows and immutable qualification source
        shell: pwsh
        run: |
          if (-not $IsWindows) { throw 'Native Windows qualification requires Windows' }
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) { throw 'PowerShell is required' }
          $actual = git rev-parse HEAD
          if ($actual -cne $env:GITHUB_SHA) { throw 'Qualification source differs from dispatch SHA' }
      - name: Qualify real policy refusal and captured cutover environment
        run: >-
          python tools/run-plugin-tests.py agent-dispatch
          --test-file tests/test_action_native_ps1.py
          --test-file tests/test_action_native_policy.py
          --test-file tests/test_cutover_spawn_env.py
          --test-file tests/test_conditional_deploy.py
