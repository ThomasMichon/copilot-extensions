name: Installation context full

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      portfolio:
        description: Explicit isolated installation qualification portfolio
        type: choice
        options:
          - context
          - context-windows
          - path-captures
          - foundation
          - foundation-services
          - mux-companion
          - worktree-state
          - pull-requests-commands
          - pull-requests-bootstrap
          - ssh-recipes
          - ssh-bootstrap
          - ssh-commands
          - pr-sweep
          - codespaces-recipes
          - codespaces-bootstrap
          - logger-recipes
          - logger-bootstrap
          - logger-commands
          - bridge-recipes
          - mcp-recipes
          - mcp-bootstrap
          - bridge-bootstrap
          - bridge-snapshots
          - bridge-commands
          - bridge-contracts
          - bridge-http52-capture
          - bridge-binding
          - vault-activation
          - dispatch-binding
          - dispatch-publication
          - dispatch-maintenance
          - promotion-controls
          - coverage-selection
          - pane-argv
          - generic-mux
          - resume-pane
          - mux-continuity
          - manager-uninstall
          - komodo-recovery
          - manager-suite
          - manager-lifecycle
          - worktrees-git-probes
          - related-knowledge
          - registration-inspection
          - worktrees-runtime-only
          - codespaces-installer
          - codespaces-state-retirement
          - fleet-client-generations
        default: context
      source_sha:
        description: Exact published checkpoint; required for source-pinned native portfolios
        required: false
        type: string
      diagnostic_stacks:
        description: Diagnostic-only copied service fixtures; never native acceptance
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fleet-client-generations-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'fleet-client-generations'
    name: Fleet client generation consumers (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: &fleet-client-generations-env
      UV_PYTHON: "3.12"
    steps: &fleet-client-generations-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify exact installed client consumers in separate bounded requests
        shell: python
        run: |
          import os
          from pathlib import Path
          import shlex
          import sys
          import xml.etree.ElementTree as ET

          source = Path.cwd()
          sys.path.insert(0, str(source / "libs/agent-procutil/src"))
          from agent_procutil.owned_process import run_caller_owned

          def run(arguments, *, env=None, timeout):
              result = run_caller_owned(
                  arguments, cwd=source, env=env, timeout=timeout,
                  max_stdout_bytes=16 * 1024 * 1024, max_stderr_bytes=16 * 1024 * 1024,
              )
              print(result.stdout, end="", flush=True)
              print(result.stderr, end="", file=sys.stderr, flush=True)
              result.check_returncode()
              return result.stdout.strip()

          head = run(["git", "rev-parse", "HEAD"], timeout=30)
          assert head == os.environ["GITHUB_SHA"]
          print(f"qualification-source={head}; native-platform={sys.platform}", flush=True)
          reports = source / ".test-venvs/fleet-client-consumers"
          reports.mkdir(parents=True)
          retained = {"test_artifact_staging.py", "test_client_generation_cli.py"}
          ignored = [
              "--ignore=" + str(path)
              for path in sorted((source / "fleet-manager/tests").glob("test_*.py"))
              if path.name not in retained
          ]
          runner = [sys.executable, "tools/run-standalone-tests.py", "fleet-manager", "--timeout", "120"]

          def environment(arguments):
              return {**os.environ, "PYTEST_ADDOPTS": shlex.join([*ignored, *arguments])}

          run([*runner, "--prepare"], env=environment(["--collect-only"]), timeout=300)
          groups = {
              "admission": "fresh_installed_console_admission or missing_packaged_resource",
              "construct": "actual_installed_console_generation_transitions and construct",
              "register": "actual_installed_console_generation_transitions and register-commands and not unregister-commands",
              "unregister": "actual_installed_console_generation_transitions and unregister-commands",
              "remove": "actual_installed_console_generation_transitions and remove-runtime",
          }
          combined = ET.Element("testsuites")
          for name, expression in groups.items():
              report = reports / (name + ".xml")
              if report.exists():
                  raise RuntimeError("native qualification refuses a retained consumer report")
              run(runner, env=environment(["-k", expression, "--junitxml", str(report)]), timeout=180)
              combined.extend(ET.parse(report).getroot().findall("testsuite"))
          report = reports / "consumer.xml"
          ET.ElementTree(combined).write(report, encoding="utf-8")
          run([
              sys.executable, "-I",
              "tools/clean-room/scenarios/fleet-manager-client-admission/verify.py", str(report),
          ], timeout=30)
      - name: Qualify explicit managed client installation and exact removal
        shell: python
        run: |
          import os
          from pathlib import Path
          import shlex
          import sys
          import xml.etree.ElementTree as ET

          source = Path.cwd()
          sys.path.insert(0, str(source / "libs/agent-procutil/src"))
          from agent_procutil.owned_process import run_caller_owned

          reports = source / ".test-venvs/fleet-client-consumers"
          ignored = [
              "--ignore=" + str(path)
              for path in sorted((source / "fleet-manager/tests").glob("test_*.py"))
              if path.name != "test_client_generation_cli.py"
          ]
          combined = ET.Element("testsuites")
          for transition in ("retry", "forward-missing", "forward-malformed", "higher", "uninstall", "foreign", "legacy", "installed-owner"):
              report = reports / ("managed-" + transition + ".xml")
              if report.exists():
                  raise RuntimeError("native qualification refuses a retained managed report")
              expression = "actual_installed_console_managed_lifecycle and " + transition
              result = run_caller_owned(
                  [sys.executable, "tools/run-standalone-tests.py", "fleet-manager", "--timeout", "120"],
                  cwd=source, timeout=180,
                  env={**os.environ, "PYTEST_ADDOPTS": shlex.join([
                      *ignored, "-k", expression, "--junitxml", str(report),
                  ])},
                  max_stdout_bytes=16 * 1024 * 1024, max_stderr_bytes=16 * 1024 * 1024,
              )
              print(result.stdout, end="", flush=True)
              print(result.stderr, end="", file=sys.stderr, flush=True)
              result.check_returncode()
              combined.extend(ET.parse(report).getroot().findall("testsuite"))
          report = reports / "managed.xml"
          ET.ElementTree(combined).write(report, encoding="utf-8")
          result = run_caller_owned(
              [sys.executable, "-I",
               "tools/clean-room/scenarios/fleet-manager-client-admission/verify.py", str(report), "--managed"],
              cwd=source, timeout=30,
              max_stdout_bytes=16 * 1024 * 1024, max_stderr_bytes=16 * 1024 * 1024,
          )
          print(result.stdout, end="", flush=True)
          print(result.stderr, end="", file=sys.stderr, flush=True)
          result.check_returncode()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-client-consumers-${{ runner.os }}
          path: .test-venvs/fleet-client-consumers/*.xml
          include-hidden-files: true
  fleet-client-generations-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'fleet-client-generations'
    name: Fleet client generation consumers (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    env: *fleet-client-generations-env
    steps: *fleet-client-generations-steps
  coverage-selection-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'coverage-selection'
    name: Coverage auditability selection (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps: &coverage-selection-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Install seasoned qualification tooling
        run: python tools/seasoned_uv.py --uv uv -- --system pytest coverage pytest-json-report pytest-timeout packaging pyyaml
      - name: Qualify current inventory, ordinary coverage and exact execution
        shell: python
        env:
          PYTHONPATH: tools
          CGS_RUN_INTEGRATION_TEST: "1"
        run: |
          import pathlib
          import sys
          sys.path.insert(0, str(pathlib.Path("libs/agent-procutil/src").resolve()))
          from agent_procutil.owned_process import run_caller_owned
          result = run_caller_owned(
              [sys.executable, "-m", "pytest", "-q",
               "tools/test_plugin_test_selection.py",
               "tools/test_coverage_selected_execution.py",
               "tools/test_coverage_guided_selection.py::TestMergeChunkResults",
               "tools/test_coverage_guided_selection.py::TestBaselineCollectionErrorContract"],
              timeout=600, max_stdout_bytes=16 * 1024 * 1024,
              max_stderr_bytes=16 * 1024 * 1024,
          )
          print(result.stdout, end="", flush=True)
          print(result.stderr, end="", file=sys.stderr, flush=True)
          result.check_returncode()
  coverage-selection-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'coverage-selection'
    name: Coverage auditability selection (Windows)
    runs-on: windows-latest
    timeout-minutes: 12
    steps: *coverage-selection-steps
  codespaces-state-retirement-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'codespaces-state-retirement'
    name: CodeSpaces isolated native state retirement (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
      PYTEST_ADDOPTS: "-vv --durations=10"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Prove both native layouts without ambient consumers
        run: >-
          python tools/run-plugin-tests.py agent-codespaces
          --test-file tests/native_uninstall/test_state_preservation.py
          -k "test_native_success_removes_runtime_and_preserves_all_state and pwsh and agent-codespaces"
          --allow-explicit-tiers

  codespaces-installer-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'codespaces-installer'
    name: CodeSpaces canonical and materialized installers (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env: &codespaces-installer-env
      UV_PYTHON: "3.12"
    steps: &codespaces-installer-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Qualify complete canonical and normally materialized installer contracts
        shell: python
        run: |
          import os
          import pathlib
          import sys
          import tempfile
          import time

          source = pathlib.Path.cwd()
          sys.path.insert(0, str(source / "libs" / "agent-procutil" / "src"))
          from agent_procutil.owned_process import run_caller_owned

          started = time.monotonic()
          deadline = started + 7200
          def run(arguments, *, cwd=source, limit):
              remaining = min(limit, deadline - time.monotonic())
              if remaining <= 0:
                  raise TimeoutError("7200-second combined functional envelope exhausted")
              print(f"START elapsed={time.monotonic() - started:.1f}s argv={arguments}", flush=True)
              result = run_caller_owned(
                  arguments, cwd=cwd, timeout=remaining,
                  max_stdout_bytes=16 * 1024 * 1024, max_stderr_bytes=16 * 1024 * 1024,
              )
              print(result.stdout, end="", flush=True)
              print(result.stderr, end="", file=sys.stderr, flush=True)
              result.check_returncode()
              return result.stdout.strip()

          head = run(["git", "rev-parse", "HEAD"], limit=30)
          assert head == os.environ["GITHUB_SHA"]
          print(f"qualification-source={head}; profile=busy-host-functional", flush=True)
          run([
              sys.executable, "tools/seasoned_uv.py", "--uv", "uv", "--",
              "--system", "pytest", "pytest-timeout", "packaging", "pyyaml", "coverage>=7.7",
          ], limit=300)
          run([
              sys.executable, "-m", "pytest", "-q", "--timeout=120",
              "tools/test_materialize_installer_engine.py", "tools/test_run_plugin_tests.py",
              "tools/test_run_tests_in_devcontainer.py",
          ], limit=900)
          runner = [sys.executable, "tools/run-plugin-tests.py", "agent-codespaces",
                    "--test-profile", "busy-host-functional"]
          run([*runner, "--test-file", "tests/test_snapshot_copy_contract.py",
               "--test-file", "tests/test_installer_test_support.py"], limit=2700)
          run([*runner, "--test-file", "tests/test_installer_engine_adoption.py"], limit=2700)
          with tempfile.TemporaryDirectory(prefix="codespaces-installer-") as directory:
              materialized = pathlib.Path(directory) / "materialized"
              run([sys.executable, "tools/materialize_main.py", "--candidate",
                   "--dest", str(materialized)], limit=600)
              run([*runner, "--test-file", "tests/test_installer_engine_adoption.py"],
                  cwd=materialized, limit=2700)
          assert not pathlib.Path(directory).exists()
          assert not run(["git", "status", "--porcelain", "--untracked-files=no"], limit=30)
          print(f"PASS cleanup=confirmed source={head} elapsed={time.monotonic() - started:.1f}s",
                flush=True)
  codespaces-installer-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'codespaces-installer'
    name: CodeSpaces canonical and materialized installers (Windows)
    runs-on: windows-latest
    timeout-minutes: 125
    env: *codespaces-installer-env
    steps: *codespaces-installer-steps
  vault-activation-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'vault-activation'
    name: Vault configuration activation (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps: &vault-activation-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Record exact source
        run: python -c "import os,subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); assert actual == os.environ['GITHUB_SHA']; print('source='+actual)"
      - name: Qualify Vault launcher and cold peer capture
        timeout-minutes: 5
        run: >-
          python tools/run-plugin-tests.py agent-vault --allow-explicit-tiers
          --test-file tests/test_payload_invocation.py
          --test-file tests/test_runtime_activation.py
          -k "scheduled_task_launcher_resolves_slot_at_every_run or cold_namespaced_capture or native_batch_reads_real_cache_without_service or shared_runtime_environment_replaces_every_foreign_route"
          --plugin-timeout 180 --timeout 120 --test-timeout 60
          --junit-dir vault-configuration-critical-junit
      - name: Qualify selected Vault peer without credential or service effects
        timeout-minutes: 5
        run: >-
          python tools/run-plugin-tests.py agent-dispatch
          --test-file tests/test_procutil.py -k vault_peer
          --plugin-timeout 180 --timeout 120 --test-timeout 30
          --junit-dir vault-peer-junit
      - name: Retain Vault launcher and cold peer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-configuration-critical-${{ runner.os }}-${{ github.sha }}
          path: |
            vault-configuration-critical-junit
            vault-peer-junit
          if-no-files-found: warn
      - name: Measure isolated Vault bootstrap cold and current metadata
        run: >-
          python tools/run-plugin-tests.py agent-vault --allow-explicit-tiers
          --test-file tests/test_bootstrap_driver.py
          -k native_bootstrap_performance_samples
          --plugin-timeout 180 --timeout 120 --test-timeout 60
      - name: Qualify Vault public pin before native key publication
        run: >-
          python tools/run-plugin-tests.py agent-vault --allow-explicit-tiers
          --test-file tests/test_ssh_key_install.py
          --plugin-timeout 180 --timeout 120 --test-timeout 60
      - name: Qualify inactive first touch and configured consumers
        run: >-
          python tools/run-plugin-tests.py agent-vault --max-files-per-sub-suite 2
          --test-file tests/test_configuration_layers.py
          --test-file tests/test_installer_readiness.py
          --test-file tests/test_bootstrap_driver.py
          --test-file tests/test_bootstrap_check_reconcile_always_on.py
          --test-file tests/test_runtime_activation.py
          --test-file tests/test_install_snapshot_ps1.py
          --test-file tests/test_service_launch.py
      - name: Qualify accepted activation context under a different queue worker
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use.py -k activation_selectors

  vault-activation-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'vault-activation'
    name: Vault configuration activation (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps: *vault-activation-steps
  related-knowledge-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'related-knowledge'
    name: Bound knowledge related readers (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: &related-knowledge-env
      UV_PYTHON: "3.12"
    steps: &related-knowledge-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Record exact qualification source
        shell: python
        run: |
          import os
          import subprocess
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True,
              creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0),
          ).strip()
          assert actual == os.environ["GITHUB_SHA"]
          print("source=" + actual)
      - name: Qualify canonical related discovery and native read-only policy
        id: readers
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = Path(os.environ["RUNNER_TEMP"]) / "related-knowledge"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              print("RELATED_KNOWLEDGE_REPORTS=" + str(reports), file=output)
          subprocess.run([
              sys.executable, str(Path("tools") / "run-plugin-tests.py"), "agent-worktrees",
              "--test-file", "tests/test_related_knowledge.py",
              "--test-file", "tests/native/test_related_knowledge_native.py",
              "--allow-explicit-tiers", "--junit-dir", str(reports),
          ], check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
          cases = [
              case for report in reports.rglob("*.xml")
              for case in ET.parse(report).getroot().iter("testcase")
          ]
          for variant in ("bare-anchor", "harness-worktree"):
              name = "test_native_bound_knowledge_discovery_is_read_only[" + variant + "]"
              selected = [case for case in cases if case.get("name") == name]
              assert len(selected) == 1, "Missing or ambiguous native reader: " + name
              assert all(selected[0].find(tag) is None for tag in ("skipped", "failure", "error")), name
      - name: Verify dependent configuration consumers
        id: consumers
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path
          reports = Path(os.environ["RUNNER_TEMP"]) / "related-knowledge-consumers"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              print("RELATED_KNOWLEDGE_CONSUMER_REPORTS=" + str(reports), file=output)
          subprocess.run([
              sys.executable, str(Path("tools") / "run-plugin-tests.py"), "agent-worktrees",
              "--test-file", "tests/test_pr_related_binding.py",
              "--test-file", "tests/test_session_context_registry.py",
              "--test-file", "tests/test_session_context_companions.py",
              "--test-file", "tests/test_repos_configuration.py",
              "--junit-dir", str(reports),
          ], check=True, creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
      - uses: actions/upload-artifact@v4
        if: always() && steps.readers.outcome != 'skipped'
        with:
          name: related-knowledge-${{ runner.os }}-${{ github.sha }}
          path: |
            ${{ env.RELATED_KNOWLEDGE_REPORTS }}
            ${{ env.RELATED_KNOWLEDGE_CONSUMER_REPORTS }}
          if-no-files-found: error
  related-knowledge-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'related-knowledge'
    name: Bound knowledge related readers (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env: *related-knowledge-env
    steps: *related-knowledge-steps
  registration-inspection-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.portfolio == 'registration-inspection'
    name: Native registration inspection (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: &registration-inspection-env
      UV_PYTHON: "3.12"
      REGISTRATION_INSPECTION_SOURCE: ${{ inputs.source_sha }}
    steps: &registration-inspection-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Verify the explicitly selected qualification source
        shell: python
        run: |
          import os
          import re
          import subprocess
          expected = os.environ["REGISTRATION_INSPECTION_SOURCE"]
          assert re.fullmatch(r"[0-9a-f]{40}", expected), "Supply the exact source_sha"
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True,
              creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0),
          ).strip()
          assert actual == expected == os.environ["GITHUB_SHA"]
          print("qualification-source=" + actual)
      - name: Qualify native registration readers and actual CLI without mutation
        id: readers
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          reports = Path(os.environ["RUNNER_TEMP"]) / "registration-inspection"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              print("REGISTRATION_INSPECTION_REPORTS=" + str(reports), file=output)
          result = subprocess.run([
              sys.executable, str(Path("tools") / "run-plugin-tests.py"), "agent-worktrees",
              "--test-file", "tests/test_registration_inspection.py",
              "--junit-dir", str(reports),
          ], capture_output=True, text=True, errors="backslashreplace",
              creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
          print(result.stdout, end="", flush=True)
          print(result.stderr, end="", file=sys.stderr, flush=True)
          result.check_returncode()
          cases = [
              case for report in reports.rglob("*.xml")
              for case in ET.parse(report).getroot().iter("testcase")
          ]
          required = {
              "test_actual_neutral_cwd_cli_and_existing_inventory_remain_read_only",
              "test_native_namespace_selection_and_invalid_context_do_not_use_legacy_state",
          }
          assert cases
          for name in required:
              assert len([case for case in cases if case.get("name") == name]) == 1, name
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error"))
      - name: Qualify incoming inspection construction without changing the selected runtime
        id: incoming
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          reports = Path(os.environ["REGISTRATION_INSPECTION_REPORTS"]) / "incoming"
          result = subprocess.run([
