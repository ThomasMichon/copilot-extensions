      - run: python tools/seasoned_uv.py --uv uv -- --system pytest pytest-xdist==3.8.0
      - name: Compare POSIX validation cost with the contribution base
        if: matrix.phase == 'paths' && runner.os == 'Linux'
        shell: bash
        env:
          INSTALLATION_CONTEXT_EXHAUSTIVE_ADAPTERS: "1"
        run: |
          baseline="$(git merge-base HEAD origin/dev)"
          baseline_root="$(mktemp -d "$RUNNER_TEMP/context-base.XXXXXXXX")"
          git archive "$baseline" | tar -x -C "$baseline_root"
          printf 'baseline=%s current=%s\n' "$baseline" "$(git rev-parse HEAD)"
          node='libs/installation-context/tests/test_snapshot_provenance.py::test_runtime_slot_completion_rejects_invalid_immutable_receipt_pid[boolean-True-posix]'
          status=0
          for tree in "$baseline_root" "$GITHUB_WORKSPACE"; do
