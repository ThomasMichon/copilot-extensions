    name: foundation first use (Windows, ${{ matrix.module }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(inputs.portfolio == 'foundation-services' && '["vault_command","vault_bootstrap"]' || '["genesis","vault","vault_command","vault_bootstrap","pull_requests"]') }}
    env:
      UPDATE_DRIVER_FOUNDATION_BUILD: "1"
      UPDATE_DRIVER_NATIVE_FOUNDATION_GENESIS: "1"
      UPDATE_DRIVER_NATIVE_STACKS: ${{ inputs.diagnostic_stacks && (matrix.module == 'vault_command' || matrix.module == 'vault_bootstrap') && '1' || '' }}
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Select runner-owned native scratch
        run: '"AGENT_SCRATCH_ROOT=$env:RUNNER_TEMP" >> $env:GITHUB_ENV'
      - name: Qualify one bounded cold first-use module
        if: matrix.module == 'vault' || matrix.module == 'pull_requests'
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_${{ matrix.module }}.py
          --max-files-per-sub-suite 1 --test-timeout 1200 --timeout 1380
      - name: Prepare explicit production-lifetime test tooling
        if: matrix.module == 'genesis' || matrix.module == 'vault_command' || matrix.module == 'vault_bootstrap'
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_${{ matrix.module }}.py --collect-only
      - name: Qualify production caller-Job loss and restrictive-Job refusal
        if: matrix.module == 'genesis'
        run: python tools/qualify_foundation_lifetime.py first-use
      - name: Qualify default-service command lifetime and restrictive-Job refusal
        if: matrix.module == 'vault_command'
        run: python tools/qualify_foundation_lifetime.py vault-command
      - name: Qualify default-service bootstrap lifetime and restrictive-Job refusal
        if: matrix.module == 'vault_bootstrap'
        run: python tools/qualify_foundation_lifetime.py vault-bootstrap
