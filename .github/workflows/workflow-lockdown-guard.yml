# Enforces the "only ThomasMichon modifies workflows/actions/CODEOWNERS"
# policy (governance: maintainer-tier access model). Branch rulesets alone
# can't express this on a personal (non-Enterprise) account: the
# `file_path_restriction` rule type that would do it natively returns
# `Validation Failed` here (Enterprise-only), and CODEOWNERS review
# requirements are skipped entirely for any actor already bypassing PR
# review (all Maintainers, by design, for req #2's self-merge).
#
# So this is enforced as a required status check instead: a check with no
# bypass actors at all (see the "workflow/CODEOWNERS lockdown" ruleset)
# fails whenever a protected path is touched unless EVERY commit making up
# the PR is attributed to ThomasMichon (both author and committer login).
#
# This checks commit provenance, not `pull_request.user.login` /
# `github.event.sender.login`. An event's `sender` is just whoever triggered
# THAT webhook delivery, not durable evidence of who pushed code -- e.g. a
# collaborator's `synchronize` run could legitimately fail this check, then
# anyone able to close+reopen the same, unchanged PR would fire a new
# `reopened` event whose `sender` is themselves, re-running this check
# against the SAME head SHA and laundering a failing result into a passing
# one with no code having changed. Commit author/committer login is
# evaluated fresh from the actual commit list every time, regardless of
# which event/actor triggered this run, so a close+reopen game changes
# nothing about the outcome.
#
# KNOWN, ACCEPTED RESIDUAL RISK (deliberately not fixed further):
# `author.login` / `committer.login` are GitHub's resolution of the
# commit's plain-text git identity (name + email) against an account -- not
# a cryptographic proof. An already-invited Write collaborator could
# deliberately set
# `git commit --author="ThomasMichon <NNN+ThomasMichon@users.noreply.github.com>"`
# locally and pass this check without ThomasMichon's real involvement. A
# cryptographically verified commit signature (`commit.verification.verified`,
# scoped to a key actually registered to ThomasMichon's account) would close
# this gap, but this repo has decided against setting up commit signing
# (too much operational hassle for the residual risk it closes) -- see
# ThomasMichon/copilot-extensions#4519, declined. This check still closes
# the much more common/likely gaps (a Contributor's own commits, an
# accidental push, a close+reopen game) -- it just doesn't defend against a
# Maintainer-tier collaborator deliberately forging git identity metadata,
# which requires an already-trusted person to actively cheat (and the forged
# commit remains permanently visible in history for after-the-fact audit),
# not an arbitrary outsider.
#
# IMPORTANT: this uses `pull_request_target`, not `pull_request`. A plain
# `pull_request` trigger runs the workflow DEFINITION from the PR's own head
# commit -- so a Write collaborator could edit *this file* within their own
# PR to neuter the check, and the neutered version is exactly what would
# run. `pull_request_target` always runs the trusted definition from the
# repository's ACTUAL default branch (`main` here -- confirmed via the repo
# API; NOT the `dev` branch this repo treats as its own "contribution
# default"), regardless of what the PR head or even `dev` currently
# contains, and still exposes `github.event.pull_request` metadata for the
# untrusted head. This job never checks out or executes PR content -- it
# only reads the PR's file/commit lists via the REST API -- so it carries
# none of the classic `pull_request_target` secret-exfiltration risk (see
# this repo's own `identifier-leak-guard.yml` for the citation on that risk
# class).
#
# BOOTSTRAP ORDER MATTERS: because the trusted copy is loaded from `main`,
# this check cannot report on any PR -- including the one that first adds
# this file to `dev` -- until `main` itself has a copy, which only happens
# after this repo's own promotion pipeline next promotes `dev` to `main`
# (routinely ~10-20 minutes after a `dev` merge). The enforcing ruleset
# ("dev branch policy: workflow/CODEOWNERS lockdown") is therefore created
# `disabled`, and is only flipped to `active` after confirming a real PR's
# `workflow-lockdown-guard` check actually reports post-promotion -- never
# enabled speculatively ahead of that.
#
# `edited` is included in `types` below alongside the usual opened/reopened/
# synchronize: a PR originally opened against a different base branch and
# later RETARGETED to `dev` fires `edited` (with `changes.base` present),
# not any of the other types -- without `edited` here, a retargeted PR
# would sit forever waiting on a required check that never runs. Re-running
# on every other `edited` PR field (title, body, labels) too is harmless --
# the check is small, fast, and always recomputes the same correct result.
name: Workflow lockdown guard

on:
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

env:
  ALLOWED_LOGIN: ThomasMichon

jobs:
  workflow-lockdown-guard:
    name: workflow-lockdown-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check protected-path changes are ThomasMichon-committed
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ALLOWED_LOGIN: ${{ env.ALLOWED_LOGIN }}
        with:
          script: |
            const protectedPrefixes = [
              ".github/workflows/",
              ".github/actions/",
            ];
            const protectedExact = new Set([".github/CODEOWNERS"]);
            const allowedLogin = process.env.ALLOWED_LOGIN;
            const pullNumber = context.payload.pull_request.number;
            // GitHub's "list pull request files"/"list commits" endpoints
            // return at most 3000/250 entries respectively, even across
            // paginated pages -- a PR at or past either cap could have a
            // protected-path change or an unattributed commit past the
            // returned window. Fail closed rather than silently missing it.
            const FILES_HARD_CAP = 3000;
            const COMMITS_HARD_CAP = 250;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            if (files.length >= FILES_HARD_CAP) {
              core.setFailed(
                `This PR's changed-file list hit the GitHub API's ${FILES_HARD_CAP}-file ` +
                  "cap, so a protected-path change could exist outside the returned " +
                  "window. Failing closed -- this ruleset has no bypass actors, so the " +
                  "only way to clear this check is to split this PR into smaller changes.",
              );
              return;
            }

            const isProtected = (name) =>
              protectedExact.has(name) ||
              protectedPrefixes.some((prefix) => name.startsWith(prefix));

            // A rename reports the new path as `filename` and the old path
            // as `previous_filename` -- checking only `filename` would miss
            // a protected file being renamed OUT of a protected path (the
            // change to that protected file's history still happened).
            const touched = files
              .flatMap((f) => [f.filename, f.previous_filename].filter(Boolean))
              .filter(isProtected);

            if (touched.length === 0) {
              core.info("No protected paths touched; nothing to enforce.");
              return;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            if (commits.length >= COMMITS_HARD_CAP) {
              core.setFailed(
                `This PR's commit list hit the GitHub API's ${COMMITS_HARD_CAP}-commit ` +
                  "cap, so an unattributed commit could exist outside the returned " +
                  "window. Failing closed -- this ruleset has no bypass actors, so the " +
                  "only way to clear this check is to squash/rebase this PR to fewer " +
                  "commits.",
              );
              return;
            }

            const unattributed = commits.filter(
              (c) =>
                c.author?.login !== allowedLogin ||
                c.committer?.login !== allowedLogin,
            );

            if (unattributed.length === 0) {
              core.info(
                `Protected path(s) touched (${touched.join(", ")}); all ` +
                  `${commits.length} commit(s) are attributed to ${allowedLogin}.`,
              );
              return;
            }

            const shas = unattributed.map((c) => c.sha.slice(0, 7)).join(", ");
            core.setFailed(
              `Protected paths (${touched.join(", ")}) were touched, but ${unattributed.length} ` +
                `commit(s) (${shas}) are not both authored and committed by ${allowedLogin}. ` +
                "Only commits fully attributed to that account may modify workflows, " +
                "actions, or CODEOWNERS -- ask them to make this change, or split it " +
                "out of this PR.",
            );
