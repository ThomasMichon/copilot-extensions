      BRIDGE_QUALIFICATION_SHELL: bash
    timeout-minutes: 8
    steps: *bridge-ready-steps

  bridge-ready-admission-macos:
    runs-on: macos-latest
    env:
      BRIDGE_QUALIFICATION_SHELL: bash
    timeout-minutes: 8
    steps: *bridge-ready-steps

  vault-ready-admission-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        host: [powershell, pwsh]
    env:
      VAULT_QUALIFICATION_SHELL: ${{ matrix.host }}
    timeout-minutes: 8
    steps: &vault-ready-steps
      - *command-native-checkout
      - *command-native-python
      - *command-native-uv
      - *command-native-interpreters
      - name: Qualify prepared Vault foreground and pinned-cache admission
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_vault_ready_source.py --allow-explicit-tiers
          -k "${{ env.VAULT_QUALIFICATION_SHELL }}"
          --junit-dir qualification-evidence/vault-ready
      - name: Require all Vault command controls and repeated reports without skips
        env:
          QUALIFIED_SHELL: ${{ env.VAULT_QUALIFICATION_SHELL }}
        run: >-
          python -c "import json,os; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/vault-ready').rglob('*.xml')];
          cases=[c for root in roots for c in root.iter('testcase')];
          assert len(cases)==26 and len({c.attrib['name'] for c in cases})==26;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(p.attrib['value']) for root in roots for p in root.iter('property')
          if p.attrib['name']=='vault_command_admission'];
          assert len(reports)==26 and {r['shell'] for r in reports}=={os.environ['QUALIFIED_SHELL']};
          assert {r['materialized'] for r in reports}=={False,True};
          assert all(r['network']=='disabled' and r['runtime_python']=='3.10.20'
          and r['bootstrap_python']=='3.11.18'
          and len(r['samples_seconds'])==(1 if r['scenario'].startswith('missing-')
          or r['scenario']=='pinned-rejected' else 2)
          and r['application_uv_lookups']==(0 if r['scenario'].startswith('missing-')
          else 1 if r['scenario']=='pinned-rejected' else 2)
          and r['pin_validated']==r['scenario'].startswith('pinned')
          and all(v>0 for v in r['samples_seconds']) for r in reports);
          print(json.dumps({'vault_command_admission':reports},sort_keys=True))"

  vault-ready-admission-linux:
    runs-on: ubuntu-latest
    env:
      VAULT_QUALIFICATION_SHELL: bash
    timeout-minutes: 8
    steps: *vault-ready-steps

  vault-ready-admission-macos:
    runs-on: macos-latest
    env:
      VAULT_QUALIFICATION_SHELL: bash
    timeout-minutes: 8
    steps: *vault-ready-steps

  mixed-python:
    runs-on: windows-latest
    # Successful runs take 3.4-4.9 minutes; a 5-minute limit cancelled half of all runs.
    timeout-minutes: 8
    env:
      QUALIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Pin uv to .python-version
        uses: ./.github/actions/pin-uv-python
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
      - name: Supply a real unsupported interpreter only on this disposable runner
        id: old
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'old-managed-python'
          uv python install --no-bin --no-registry cpython@3.9.25
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $oldPython = (uv python find --no-project --system --managed-python --no-python-downloads cpython@3.9.25 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $oldPython) { throw 'The real Python 3.9 qualification prerequisite is unavailable' }
          "python-path=$oldPython" >> $env:GITHUB_OUTPUT
      - name: Bind source and actual interpreter prerequisites
        shell: pwsh
        env:
          TEST_PYTHON39: ${{ steps.old.outputs.python-path }}
        run: |
          python -c "import os,subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); assert actual == os.environ['QUALIFICATION_SHA']; print('source='+actual)"
          & $env:TEST_PYTHON39 -I -S -B -c "import sys; assert sys.version_info[:2] == (3,9); print('old='+sys.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify real old-first installer admission on PS5.1 and pwsh
        env:
          TEST_PYTHON39: ${{ steps.old.outputs.python-path }}
          PYTEST_ADDOPTS: "-rP"
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          --test-file tests/test_installer_admission_python.py
          --junit-dir qualification-evidence/admission
          -k real_python39
      - name: Qualify real daemon-helper selection and original Job cleanup
        env:
          TEST_PYTHON39: ${{ steps.old.outputs.python-path }}
          PYTEST_ADDOPTS: "-rP"
        run: >-
          python tools/run-plugin-tests.py agent-procutil
          --test-file tests/test_daemon_python_selection.py
          --junit-dir qualification-evidence/daemon
          --allow-explicit-tiers -k real_python39
      - name: Require all six actual-interpreter controls without prerequisite skips
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          groups={name:[case for file in Path('qualification-evidence',name).rglob('*.xml')
          for case in ET.parse(file).iter('testcase')] for name in ('admission','daemon')};
          assert {name:len(cases) for name,cases in groups.items()}=={'admission':2,'daemon':4};
          assert all(case.find(tag) is None for cases in groups.values() for case in cases
          for tag in ('error','failure','skipped'));
          print('Six actual-interpreter controls passed without skips')"
      - name: Prepare the managed interpreter in disposable qualification storage
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bootstrap-managed-python'
          uv python install --no-bin --no-registry cpython@3.12.13 cpython@3.11.18
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UV_PYTHON_INSTALL_DIR=$env:UV_PYTHON_INSTALL_DIR" >> $env:GITHUB_ENV
      - name: Preserve Vault managed activation, scheduling, index policy and cold readers
        run: >-
          python tools/run-plugin-tests.py agent-vault
          --test-file tests/test_runtime_activation.py
          --test-file tests/test_powershell_index_reader.py --allow-explicit-tiers
          -k "test_powershell_index_reader or native_cold_activation_qualifies_reader_without_installing or actual_cold_activation_uses_managed_python_without_runtime or schedule_staging_retains_project_for_activation_and_service_snapshot"
          --junit-dir qualification-evidence/native-vault-activation
      - name: Require both Vault activation hosts and all scheduling controls
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/native-vault-activation').rglob('*.xml')
          for c in ET.parse(p).iter('testcase') if c.attrib['classname'].endswith('test_runtime_activation')];
          assert len(cases)==17;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Require all raw and composed Windows index controls
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/native-vault-activation').rglob('*.xml')
          for c in ET.parse(p).iter('testcase') if c.attrib['classname'].endswith('test_powershell_index_reader')];
          assert len(cases)==24;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Qualify uv selection before direct caller-owned worker admission
        run: >-
          python tools/run-plugin-tests.py installation-context
          --test-file tests/test_managed_python_transport.py
          --junit-dir qualification-evidence/managed
          --allow-explicit-tiers
      - name: Require both managed handoff controls on both PowerShell engines
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[case for file in Path('qualification-evidence/managed').rglob('*.xml')
          for case in ET.parse(file).iter('testcase')];
          assert len(cases)==4;
          assert all(case.find(tag) is None for case in cases for tag in ('error','failure','skipped'));
          print('Four managed-interpreter controls passed without skips')"
      - name: Qualify Dispatch readers, query cleanup, generated units and runtime policy
        if: runner.os == 'Windows'
        env:
          UV_PYTHON: ""
          TEST_OLD_PYTHON: ${{ steps.old.outputs.python-path }}
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_dispatch_construction_source.py --allow-explicit-tiers
          --test-file tests/test_service_unit_source.py
          -k "managed_bootstrap_reader or bootstrap_discovery_does_not_hide_invalid_runtime_choice or signed_runtime_floor or selected_base_bootstraps_source_and_construction_without_discovery or managed_service_query_tree or actual_unit_writer_is_accepted_by_daemon_admission"
          --junit-dir qualification-evidence/dispatch-bootstrap-reader
      - name: Require both Dispatch reader hosts and retained runtime-floor controls
        if: runner.os == 'Windows'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          all_cases=[c for p in Path('qualification-evidence/dispatch-bootstrap-reader').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(all_cases)==41;
          cases=[c for c in all_cases if 'managed_service_query_tree' not in c.attrib['name']
          and not c.attrib['classname'].endswith('test_service_unit_source')];
          assert len(cases)==32;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Require all six service-query descendant cleanup controls
        if: runner.os == 'Windows'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[case for file in Path('qualification-evidence/dispatch-bootstrap-reader').rglob('*.xml')
          for case in ET.parse(file).iter('testcase') if 'managed_service_query_tree' in case.attrib['name']];
          assert len(cases)==6;
          assert all(case.find(tag) is None for case in cases for tag in ('error','failure','skipped'))"
      - name: Require all three native generated-unit controls on Windows
        if: runner.os == 'Windows'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/dispatch-bootstrap-reader').rglob('*.xml')
          for c in ET.parse(p).iter('testcase') if c.attrib['classname'].endswith('test_service_unit_source')];
          assert len(cases)==3;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Preserve Codespaces Windows owner ingress
        env:
          UV_PYTHON: "3.12"
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_codespaces_windows_owner_source.py --allow-explicit-tiers
          --junit-dir qualification-evidence/codespaces-windows-owner
      - name: Require all Windows owner controls and repeated offline selections
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/codespaces-windows-owner').rglob('*.xml')];
          cases=[c for root in roots for c in root.iter('testcase')
          if c.attrib['classname'].endswith('test_codespaces_windows_owner_source')];
          assert len(cases)==33;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(p.attrib['value']) for root in roots for p in root.iter('property')
          if p.attrib['name']=='codespaces_windows_owner_ingress'];
          assert len(reports)==2 and {r['shell'] for r in reports}=={'powershell','pwsh'};
          assert all(r['status']=='measured' and r['expected']==r['completed']==len(r['samples_seconds'])==4
          and r['selector_calls']==4 and r['phases']==['cold','cold','warm','warm']
          and all(v>0 for v in r['samples_seconds']) and r['network']=='no-downloads'
          and r['tail_qualification']=='insufficient samples' for r in reports)"
      - name: Qualify Index PowerShell Core readers and actual ingress
        shell: pwsh
        env:
          INDEX_BOOTSTRAP_HOST: pwsh
        run: &index-windows-bootstrap-controls |
          $packets = [ordered]@{
            'raw' = 'raw and (bootstrap_readers or cell)'
            'packaged' = 'packaged and (bootstrap_readers or cell)'
            'driver' = '(actual_entry and driver) or explicit_closed'
          }
          foreach ($packet in $packets.GetEnumerator()) {
            python tools/run-plugin-tests.py payload-invocation `
              --test-file tests/test_index_bootstrap_source.py --allow-explicit-tiers `
              -k "( $($packet.Value) ) and $env:INDEX_BOOTSTRAP_HOST" `
              --junit-dir "qualification-evidence/index-windows-bootstrap/$($env:INDEX_BOOTSTRAP_HOST)/$($packet.Key)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Require all nineteen Index controls and both repeated reader reports
        env:
          INDEX_BOOTSTRAP_HOST: pwsh
        run: &index-windows-bootstrap-verifier >-
          python -c "import json,os; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/index-windows-bootstrap',
          os.environ['INDEX_BOOTSTRAP_HOST']).rglob('*.xml')];
          cases=[c for root in roots for c in root.iter('testcase')];
          assert len(cases)==19 and len({c.attrib['name'] for c in cases})==19;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(p.attrib['value']) for root in roots for p in root.iter('property')
          if p.attrib['name']=='index_windows_bootstrap_performance'];
          assert len(reports)==2 and {r['layout'] for r in reports}=={'raw','packaged'};
          assert all(r['host']==os.environ['INDEX_BOOTSTRAP_HOST'] and r['status']=='measured'
          and r['completed']==len(r['samples_seconds'])==2 and r['network']=='disabled'
          and r['helper_python']=='3.11.18' and r['uv_calls_per_reader']==2 for r in reports);
          print(json.dumps({'index_windows_bootstrap_performance':reports},sort_keys=True))"
      - name: Qualify Index Windows PowerShell readers and actual ingress
        shell: pwsh
        env:
          INDEX_BOOTSTRAP_HOST: powershell.exe
        run: *index-windows-bootstrap-controls
      - name: Require all nineteen Index controls and both repeated reader reports
        env:
          INDEX_BOOTSTRAP_HOST: powershell.exe
        run: *index-windows-bootstrap-verifier
