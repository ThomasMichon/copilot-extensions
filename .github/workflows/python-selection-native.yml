          assert len(cases)==20;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(p.attrib['value']) for root in roots for p in root.iter('property')
          if p.attrib['name']=='bridge_windows_service_performance'];
          assert len(reports)==2 and {r['shell'] for r in reports}=={'powershell','pwsh'};
          assert all(len(r['samples_seconds'])==6 and r['cycles']==2
          and r['selections']==['current','lkg','newest'] and r['network']=='no-downloads'
          and r['runtime']=='managed-venv' for r in reports)"
      - name: Require all seven Vault Windows PowerShell ingress controls
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/windows-service-ingress').rglob('*.xml')];
