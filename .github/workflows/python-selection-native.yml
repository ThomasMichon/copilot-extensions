  index-engine-uv-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps: &index-engine-steps
      - *command-native-checkout
      - *command-native-python
      - *command-native-uv
      - *command-native-interpreters
      - name: Qualify prepared-only Index management on both PowerShell hosts
        if: runner.os == 'Windows'
        env:
          UV_PYTHON: "3.11"
        shell: pwsh
        run: |
          $packets = @('management_admits and (raw-current or packaged-lkg or incomplete)',
                       'management_admits and (missing-uv or private-uv)',
                       'activation_role_requires')
          foreach ($hostName in @('pwsh', 'powershell.exe')) {
            for ($packet = 0; $packet -lt $packets.Count; $packet++) {
              python tools/run-plugin-tests.py payload-invocation `
                --test-file tests/test_index_management_source.py --allow-explicit-tiers `
                -k "( $($packets[$packet]) ) and $hostName" `
                --junit-dir "qualification-evidence/index-windows-management/$hostName/$packet"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Require all sixteen Index management controls and ten repeated selections
        if: runner.os == 'Windows'
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/index-windows-management').rglob('*.xml')];
          cases=[c for root in roots for c in root.iter('testcase')];
          assert len(cases)==16 and len({c.attrib['name'] for c in cases})==16;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(p.attrib['value']) for root in roots for p in root.iter('property')
          if p.attrib['name']=='index_windows_management'];
          assert len(reports)==10 and {r['host'] for r in reports}=={'pwsh','powershell.exe'};
          assert all(r['selector_calls']==(0 if r['scenario'] in {'incomplete','missing-uv'} else 2) for r in reports);
          assert all(r['status']=='measured' and r['completed']==len(r['samples_seconds'])==2
          and all(v>0 for v in r['samples_seconds']) and r['network']=='disabled' for r in reports);
          print(json.dumps({'index_windows_management':reports},sort_keys=True))"

      - name: Qualify prepared Index durable-engine child selection without a model
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_index_engine_launch_source.py --allow-explicit-tiers
          -k "not native_engine_management"
          --junit-dir qualification-evidence/index-engine-child
