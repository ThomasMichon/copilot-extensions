permissions:
  contents: read

jobs:
  command-bootstrap-uv-windows:
    runs-on: windows-latest
    # Successful runs take 3.4-4.9 minutes; a 5-minute limit cancelled half of all runs.
    timeout-minutes: 8
    steps: &command-bootstrap-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
      - name: Prepare isolated managed interpreters, including old PATH Python
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'command-bootstrap-python'
          uv python install --no-bin --no-registry cpython@3.11.18 cpython@3.9.25
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $oldPython = uv python find --no-project --system --managed-python --no-python-downloads cpython@3.9.25
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UV_PYTHON_INSTALL_DIR=$env:UV_PYTHON_INSTALL_DIR" >> $env:GITHUB_ENV
          "TEST_OLD_PYTHON=$oldPython" >> $env:GITHUB_ENV
      - name: Qualify generated ingress and acquisition-free refusals
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_uv_runtime_launch.py
          --allow-explicit-tiers -k "generated_managed_bootstrap or first_use_bootstrap_candidates"
          --junit-dir qualification-evidence/command-bootstrap
      - name: Require each native control
        run: >-
          python -c "import os; from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/command-bootstrap').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          native=[c for c in cases if c.find('skipped') is None];
          assert len(cases)==15 and len(native)==9;
          assert all(c.find(t) is None for c in native for t in ('error','failure'))"
      - name: Preserve Dispatch selected-readiness policy boundaries on PowerShell Core
        if: runner.os == 'Windows'
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_dispatch_construction_source.py --allow-explicit-tiers
          -k "powershell_current_nested_runtime and pwsh"
          --junit-dir qualification-evidence/dispatch-powershell-readiness
      - name: Require all five retained Dispatch Core readiness controls without skips
        if: runner.os == 'Windows'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/dispatch-powershell-readiness').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(cases)==5;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Preserve evaluator, retained selector, configuration, and YAML controls
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_bootstrap_compatibility_source.py --allow-explicit-tiers
          -k "not (missing_newest_candidate_does_not_abort_probe or no_candidate_installed_returns_null_not_throw or canonical_prerequisite_helpers)"
          --junit-dir qualification-evidence/compatibility-bootstrap
      - name: Qualify prepared Vault setup readers without ambient Python
        if: runner.os == 'Windows'
        run: >-
          python tools/run-plugin-tests.py agent-vault
          --test-file tests/test_installer_managed_readers.py --allow-explicit-tiers
          -k powershell_setup_readers
          --junit-dir qualification-evidence/vault-setup-readers
      - name: Require each Vault native reader and explicit-binding control
        if: runner.os == 'Windows'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/vault-setup-readers').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(cases)==16;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Require actual retained and configuration-reader controls
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/compatibility-bootstrap').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(cases)==71;
          groups={name:[c for c in cases if selector in c.attrib['name']] for name,selector in
          [('retained-bootstrap','binstub_publication_retains_managed_bootstrap'),
          ('index-bootstrap','adopted_configuration_reader_ignores_path_python')]};
          assert all(len(groups[name])==count for name,count in [('retained-bootstrap',3),('index-bootstrap',6)]);
          assert all(sum(c.find('skipped') is None for c in groups[name])==count
          for name,count in [('retained-bootstrap',2),('index-bootstrap',4)]);
          assert all(c.find(t) is None for c in cases for t in ('error','failure'))"
      - name: Qualify independent POSIX service ingress and unit ownership controls
        if: runner.os == 'Linux'
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_bridge_service_source.py --allow-explicit-tiers
          --test-file tests/test_vault_service_source.py
          --test-file tests/test_codespaces_owner_source.py
          --test-file tests/test_service_unit_source.py
          --max-files-per-sub-suite 1
          --junit-dir qualification-evidence/posix-services
      - name: Qualify the actual hook and native supervisor handoff
        if: runner.os == 'Windows'
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_budget.py
          --junit-dir qualification-evidence/budget-bootstrap-owner
          --allow-explicit-tiers -k actual_budget_hook
      - name: Require the actual bootstrap hook handoff
        if: runner.os == 'Windows'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[case for file in Path('qualification-evidence/budget-bootstrap-owner').rglob('*.xml')
          for case in ET.parse(file).iter('testcase')];
          assert len(cases)==1;
          assert all(case.find(tag) is None for case in cases for tag in ('error','failure','skipped'))"
      - name: Require all Bridge service controls and offline repeated native launches
        if: runner.os == 'Linux'
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/posix-services').rglob('*.xml')];
          cases=[c for root in roots for c in root.iter('testcase')
          if c.attrib['classname'].endswith('test_bridge_service_source')];
          assert len(cases)==21;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(p.attrib['value']) for root in roots for p in root.iter('property')
          if p.attrib['name']=='bridge_posix_service_performance'];
          assert len(reports)==1;
          assert all(len(r['samples_seconds'])==r['cycles']==2 and r['uv_calls_per_launch']==1
          and r['network']=='no-downloads' and r['runtime']=='managed-venv' for r in reports)"
      - name: Require Vault service publication custody and offline repeated native launches
        if: runner.os == 'Linux'
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/posix-services').rglob('*.xml')];
          cases=[c for root in roots for c in root.iter('testcase')
          if c.attrib['classname'].endswith('test_vault_service_source')];
          assert len(cases)==30;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(p.attrib['value']) for root in roots for p in root.iter('property')
          if p.attrib['name']=='vault_posix_service_performance'];
          assert len(reports)==1;
          assert all(len(r['samples_seconds'])==r['cycles']==2
          and r['network']=='no-downloads' and r['runtime']=='managed-venv' for r in reports)"
      - name: Require all Codespaces owner controls and repeated offline launch evidence
        if: runner.os == 'Linux'
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/posix-services').rglob('*.xml')];
          cases=[c for root in roots for c in root.iter('testcase')
          if c.attrib['classname'].endswith('test_codespaces_owner_source')];
          assert len(cases)==25;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(p.attrib['value']) for root in roots for p in root.iter('property')
          if p.attrib['name']=='codespaces_owner_performance'];
          assert len(reports)==1;
          assert all(len(r['samples_seconds'])==r['cycles']==2
          and r['network']=='no-downloads' and r['runtime']=='managed-venv'
          and r['uv_calls_per_launch']==1 for r in reports)"
      - name: Require all native unit ownership and refusal controls
        if: runner.os == 'Linux'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/posix-services').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')
          if c.attrib['classname'].endswith('test_service_unit_source')];
          assert len(cases)==97;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Prepare independent managed Dispatch POSIX runtime
        if: runner.os == 'Linux'
        run: uv python install --no-bin --no-registry cpython@3.10.20
      - name: Qualify Dispatch POSIX helper, index and construction controls
        if: runner.os == 'Linux'
        run: >-
          python tools/run-plugin-tests.py agent-dispatch
          --test-file tests/test_managed_bootstrap_reader_sh.py
          --test-file tests/test_managed_index_reader_sh.py --allow-explicit-tiers
          --test-file tests/test_managed_runtime_construction_sh.py
          --junit-dir qualification-evidence/dispatch-posix
      - name: Require actual raw and composed Dispatch index controls
        if: runner.os == 'Linux'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          all_cases=[c for p in Path('qualification-evidence/dispatch-posix').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(all_cases)==33;
          cases=[c for c in all_cases if c.attrib['classname'].endswith('test_managed_index_reader_sh')];
          assert len(cases)==10;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Require actual Dispatch POSIX constructors and performance reports
        if: runner.os == 'Linux'
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/dispatch-posix').rglob('*.xml')];
          cases=[c for root in roots for c in root.iter('testcase')
          if c.attrib['classname'].endswith('test_managed_runtime_construction_sh')];
          assert len(cases)==5;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(p.attrib['value']) for root in roots for p in root.iter('property')
          if p.attrib['name']=='dispatch_posix_construction_performance'];
          assert len(reports)==5 and {r['scenario'] for r in reports}=={'raw','packaged','partial','unprepared','uv-failure'};
          assert all(r['status']=='measured' and r['expected']==r['completed']==len(r['samples_seconds'])
          and r['uv_calls_per_construction']==1 for r in reports)"
      - name: Require actual raw and packaged Dispatch POSIX reader controls
        if: runner.os == 'Linux'
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/dispatch-posix').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')
          if c.attrib['classname'].endswith('test_managed_bootstrap_reader_sh')];
          assert len(cases)==18;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(prop.attrib['value']) for p in Path('qualification-evidence/dispatch-posix').rglob('*.xml')
          for prop in ET.parse(p).iter('property') if prop.attrib['name']=='dispatch_posix_reader_performance'];
          assert len(reports)==2 and {r['scenario'] for r in reports}=={'raw','packaged'};
          assert all(r['status']=='measured' and r['expected']==r['completed']==len(r['samples_seconds'])==2
          and r['uv_calls_per_read']==2 for r in reports);
          cold=[json.loads(prop.attrib['value']) for p in Path('qualification-evidence/dispatch-posix').rglob('*.xml')
          for prop in ET.parse(p).iter('property') if prop.attrib['name']=='dispatch_cold_reader_performance'];
          assert len(cold)==2 and {r['entry'] for r in cold}=={'runtime-gate.sh','bootstrap-check.sh'};
          assert all(len(r['samples_seconds'])==2 and r['network']=='disabled' for r in cold)"
      - name: Qualify explicit native helper Python bindings
        run: >-
          python tools/run-plugin-tests.py agent-procutil
          --test-file tests/test_native_helper_python_binding.py --allow-explicit-tiers
