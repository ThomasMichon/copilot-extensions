permissions:
  contents: read

jobs:
  command-bootstrap-uv-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps: &command-bootstrap-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
      - name: Prepare isolated managed interpreters, including old PATH Python
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'command-bootstrap-python'
          uv python install --no-bin --no-registry cpython@3.11.18 cpython@3.9.25
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $oldPython = uv python find --no-project --system --managed-python --no-python-downloads cpython@3.9.25
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UV_PYTHON_INSTALL_DIR=$env:UV_PYTHON_INSTALL_DIR" >> $env:GITHUB_ENV
          "TEST_OLD_PYTHON=$oldPython" >> $env:GITHUB_ENV
      - name: Qualify generated ingress and acquisition-free refusals
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_uv_runtime_launch.py
          --allow-explicit-tiers -k "generated_managed_bootstrap or first_use_bootstrap_candidates"
          --junit-dir qualification-evidence/command-bootstrap
      - name: Require each native control
        run: >-
          python -c "import os; from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/command-bootstrap').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          native=[c for c in cases if c.find('skipped') is None];
          assert len(cases)==15 and len(native)==9;
          assert all(c.find(t) is None for c in native for t in ('error','failure'))"
      - name: Preserve evaluator discovery and adopted selection
        run: >-
          python tools/run-plugin-tests.py agent-codespaces
          --test-file tests/test_bootstrap_python.py --allow-explicit-tiers
          --junit-dir qualification-evidence/evaluator-bootstrap
      - name: Qualify prepared Vault setup readers without ambient Python
        if: runner.os == 'Windows'
        run: >-
          python tools/run-plugin-tests.py agent-vault
          --test-file tests/test_installer_managed_readers.py --allow-explicit-tiers
          -k powershell_setup_readers
          --junit-dir qualification-evidence/vault-setup-readers
      - name: Require each Vault native reader and explicit-binding control
        if: runner.os == 'Windows'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/vault-setup-readers').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(cases)==16;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Qualify retained Dispatch selector publication
        run: >-
          python tools/run-plugin-tests.py agent-dispatch
          --test-file tests/test_retained_bootstrap.py
          --allow-explicit-tiers -k binstub_publication_retains_managed_bootstrap
          --junit-dir qualification-evidence/retained-bootstrap
      - name: Qualify Index configuration admission and missing uv
        run: >-
          python tools/run-plugin-tests.py agent-index
          --test-file tests/test_runtime_gate.py
          --allow-explicit-tiers -k adopted_configuration_reader_ignores_path_python
          --junit-dir qualification-evidence/index-bootstrap
      - name: Require actual retained and configuration-reader controls
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          groups={name:[c for p in Path('qualification-evidence',name).rglob('*.xml')
          for c in ET.parse(p).iter('testcase')] for name in ('retained-bootstrap','index-bootstrap')};
          assert all(len(groups[name])==count for name,count in [('retained-bootstrap',3),('index-bootstrap',6)]);
          assert all(sum(c.find('skipped') is None for c in groups[name])==count
          for name,count in [('retained-bootstrap',2),('index-bootstrap',4)]);
          assert all(c.find(t) is None for cases in groups.values() for c in cases for t in ('error','failure'))"
      - name: Qualify dependency-free YAML block scalars
        run: >-
          python tools/run-plugin-tests.py agent-index
          --test-file tests/test_bootstrap_yaml.py --allow-explicit-tiers
      - name: Qualify prepared Dispatch POSIX helper readers
        if: runner.os == 'Linux'
        run: >-
          python tools/run-plugin-tests.py agent-dispatch
          --test-file tests/test_managed_bootstrap_reader_sh.py --allow-explicit-tiers
          --junit-dir qualification-evidence/dispatch-posix-reader
      - name: Prepare independent managed Dispatch POSIX runtime
        if: runner.os == 'Linux'
        run: uv python install --no-bin --no-registry cpython@3.10.20
      - name: Qualify Dispatch POSIX effective index context
        if: runner.os == 'Linux'
        run: >-
          python tools/run-plugin-tests.py agent-dispatch
          --test-file tests/test_managed_index_reader_sh.py --allow-explicit-tiers
          --junit-dir qualification-evidence/dispatch-posix-index
      - name: Require actual raw and composed Dispatch index controls
        if: runner.os == 'Linux'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/dispatch-posix-index').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(cases)==10;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Qualify managed Dispatch POSIX runtime construction
        if: runner.os == 'Linux'
        run: >-
          python tools/run-plugin-tests.py agent-dispatch
          --test-file tests/test_managed_runtime_construction_sh.py --allow-explicit-tiers
          --junit-dir qualification-evidence/dispatch-posix-construction
      - name: Require actual Dispatch POSIX constructors and performance reports
        if: runner.os == 'Linux'
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/dispatch-posix-construction').rglob('*.xml')];
          cases=[c for root in roots for c in root.iter('testcase')];
          assert len(cases)==5;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(p.attrib['value']) for root in roots for p in root.iter('property')
          if p.attrib['name']=='dispatch_posix_construction_performance'];
          assert len(reports)==5 and {r['scenario'] for r in reports}=={'raw','packaged','partial','unprepared','uv-failure'};
          assert all(r['status']=='measured' and r['expected']==r['completed']==len(r['samples_seconds'])
          and r['uv_calls_per_construction']==1 for r in reports)"
      - name: Require actual raw and packaged Dispatch POSIX reader controls
        if: runner.os == 'Linux'
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/dispatch-posix-reader').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(cases)==7;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(prop.attrib['value']) for p in Path('qualification-evidence/dispatch-posix-reader').rglob('*.xml')
          for prop in ET.parse(p).iter('property') if prop.attrib['name']=='dispatch_posix_reader_performance'];
          assert len(reports)==2 and {r['scenario'] for r in reports}=={'raw','packaged'};
          assert all(r['status']=='measured' and r['expected']==r['completed']==len(r['samples_seconds'])==2
          and r['uv_calls_per_read']==2 for r in reports)"
      - name: Qualify explicit native helper Python bindings
        run: >-
          python tools/run-plugin-tests.py agent-procutil
          --test-file tests/test_native_helper_python_binding.py --allow-explicit-tiers
          --test-file tests/test_managed_venv_construction.py
          --junit-dir qualification-evidence/native-helper-bindings
      - name: Require actual native helper binding controls
        run: >-
          python -c "import os; from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/native-helper-bindings').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          native=[c for c in cases if c.find('skipped') is None];
          assert len(cases)==40 and len(native)==(24 if os.name=='nt' else 28);
          assert all(c.find(t) is None for c in native for t in ('error','failure'))"
      - name: Qualify prepared-only native readers and real managed driver admission
        if: runner.os == 'Linux'
        run: >-
          python tools/run-plugin-tests.py runtime-source
          --test-file tests/test_native_bootstrap_python.py --allow-explicit-tiers
          --junit-dir qualification-evidence/native-bootstrap-readers
      - name: Require all native reader controls on each supported shell
        if: runner.os == 'Linux'
        run: >-
          python -c "import json,os; from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/native-bootstrap-readers').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(cases)==24;
          assert sum(c.find('skipped') is None for c in cases)==(24 if os.name=='nt' else 12);
          assert all(c.find(t) is None for c in cases for t in ('error','failure'));
          reports=[json.loads(prop.attrib['value']) for p in Path('qualification-evidence/native-bootstrap-readers').rglob('*.xml')
          for prop in ET.parse(p).iter('property') if prop.attrib['name'].startswith('native_bootstrap_performance_')];
          assert len(reports)==1;
          assert all(r['expected']==r['completed']==len(r['samples_seconds'])==2 and r['status']=='measured' for r in reports)"
      - name: Preserve stock Windows foundation managed-constructor admission
        if: runner.os == 'Windows'
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_foundation_progress_process.py --allow-explicit-tiers
          -k canonical_prerequisite_helpers
          --junit-dir qualification-evidence/managed-constructor-foundation
      - name: Require actual stock Windows constructor control
        if: runner.os == 'Windows'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/managed-constructor-foundation').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(cases)==1;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Preserve legacy native-stderr discovery compatibility
        if: runner.os == 'Windows'
        run: >-
          python tools/run-plugin-tests.py agent-logger
          --test-file tests/test_install_signed_python_probe.py --allow-explicit-tiers
          --junit-dir qualification-evidence/legacy-signed-probe
      - name: Require both Windows legacy probe hosts
        if: runner.os == 'Windows'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/legacy-signed-probe').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(cases)==4;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Preserve actual Linux lifecycle cleanup with explicit binding
        if: runner.os == 'Linux'
        run: >-
          python tools/run-plugin-tests.py agent-procutil
          --test-file tests/test_daemon_instances_linux.py --allow-explicit-tiers
          -k test_shell_reconciliation_accepts_a_total_budget_above_one_stop_limit
          --junit-dir qualification-evidence/native-helper-cleanup
      - name: Require actual Linux cleanup control
        if: runner.os == 'Linux'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/native-helper-cleanup').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(cases)==1;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Qualify Vault outer POSIX activation and coherent fixture profiles
        if: runner.os == 'Linux'
        run: >-
          python tools/run-plugin-tests.py agent-vault
          --test-file tests/test_runtime_activation.py
          --test-file tests/test_bootstrap_driver.py
          --test-file tests/test_bootstrap_managed_reader.py
          --test-file tests/test_installer_managed_readers.py
          --test-file tests/test_bootstrap_check_reconcile_always_on.py --allow-explicit-tiers
          --junit-dir qualification-evidence/vault-posix-activation
      - name: Require complete POSIX activation and retained native-case collection
        if: runner.os == 'Linux'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/vault-posix-activation').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(cases)==218;
          assert sum(c.find('skipped') is None for c in cases)==182;
          assert all(c.find(t) is None for c in cases for t in ('error','failure'))"
      - name: Qualify raw and packaged effective UV index context
        if: runner.os == 'Linux'
        run: >-
          python tools/run-plugin-tests.py budget-guidance
          --test-file tests/test_installers.py --allow-explicit-tiers
          -k "native_index_reader_matches_uv_working_directory or system_flag_pins_provider_in_actual_launch_context or (posix_installer_bootstraps_with_uv_and_no_ambient_python and (isolated-project or isolated-directory))"
          --junit-dir qualification-evidence/index-working-directory
      - name: Require all eleven actual UV context, provider and caller controls
        if: runner.os == 'Linux'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/index-working-directory').rglob('*.xml')
          for c in ET.parse(p).iter('testcase')];
          assert len(cases)==11;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
  command-bootstrap-uv-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: *command-bootstrap-steps
  budget-uv-launch:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Prepare the addressed interpreter without publishing Python commands
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'budget-managed-python'
          uv python install --no-bin --no-registry cpython@3.13.12 cpython@3.10.20
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UV_PYTHON_INSTALL_DIR=$env:UV_PYTHON_INSTALL_DIR" >> $env:GITHUB_ENV
      - name: Qualify prepared command argv, streams, exit and setup refusal
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_uv_runtime_launch.py
          --junit-dir qualification-evidence/budget-launch
          --allow-explicit-tiers -k "(ps1 or winps or declaration or powershell_early_exit) and not generated_managed_bootstrap"
      - name: Qualify native installer failure and clean retry
        run: >-
          python tools/run-plugin-tests.py budget-guidance
          --test-file tests/test_installers.py
          --junit-dir qualification-evidence/budget-setup
          --allow-explicit-tiers -k "native_failed_install or native_retry or command_path_publication or closed_wheel_uv or raw_checkout_stamped_closure or native_index_reader_matches_uv_working_directory"
      - name: Qualify lock admission before prerequisite preparation
        run: >-
          python tools/run-plugin-tests.py budget-guidance
          --test-file tests/test_install_transaction_lock.py
          --junit-dir qualification-evidence/budget-lock
          --allow-explicit-tiers
          -k "contend_before_snapshot_publication and prerequisites and not bash"
      - name: Require actual command, installer and lock controls
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          groups={name:[case for file in Path('qualification-evidence',name).rglob('*.xml')
          for case in ET.parse(file).iter('testcase')] for name in ('budget-launch','budget-setup','budget-lock')};
          assert {name:len(cases) for name,cases in groups.items()}=={'budget-launch':29,'budget-setup':21,'budget-lock':4};
          assert all(case.find(tag) is None for cases in groups.values() for case in cases
          for tag in ('error','failure','skipped'));
          print('29 command, 21 installer/snapshot/index-context and four prerequisite-lock controls passed without skips')"
      - name: Qualify managed Dispatch construction on Windows PowerShell
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_dispatch_construction_source.py --allow-explicit-tiers
          -k "powershell_construction and not pwsh"
          --junit-dir qualification-evidence/dispatch-powershell-construction
      - name: Require all six Windows PowerShell constructor controls
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/dispatch-powershell-construction').rglob('*.xml')];
          cases=[c for root in roots for c in root.iter('testcase')];
          assert len(cases)==6;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(p.attrib['value']) for root in roots for p in root.iter('property')
          if p.attrib['name']=='dispatch_powershell_construction_performance'];
          assert len(reports)==6 and {(r['shell'],r['scenario']) for r in reports}==
          {('powershell',c) for c in ('raw','packaged','partial','unprepared','uv-failure','explicit')};
          assert all(r['status']=='measured' and r['expected']==r['completed']==len(r['samples_seconds']) for r in reports)"
  budget-uv-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
      - name: Prepare the addressed interpreter without publishing Python commands
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'budget-managed-python'
