          cases=[case for file in Path('qualification-evidence/dispatch-bootstrap-reader').rglob('*.xml')
          for case in ET.parse(file).iter('testcase') if 'managed_service_query_tree' in case.attrib['name']];
          assert len(cases)==6;
          assert all(case.find(tag) is None for case in cases for tag in ('error','failure','skipped'))"
      - name: Require all three native generated-unit controls on Windows
        if: runner.os == 'Windows'
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/dispatch-bootstrap-reader').rglob('*.xml')
          for c in ET.parse(p).iter('testcase') if c.attrib['classname'].endswith('test_service_unit_source')];
          assert len(cases)==3;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Preserve Codespaces Windows owner ingress
        env:
          UV_PYTHON: "3.12"
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_codespaces_windows_owner_source.py --allow-explicit-tiers
          --junit-dir qualification-evidence/codespaces-windows-owner
      - name: Require all Windows owner controls and repeated offline selections
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/codespaces-windows-owner').rglob('*.xml')];
          cases=[c for root in roots for c in root.iter('testcase')
          if c.attrib['classname'].endswith('test_codespaces_windows_owner_source')];
          assert len(cases)==33;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(p.attrib['value']) for root in roots for p in root.iter('property')
          if p.attrib['name']=='codespaces_windows_owner_ingress'];
          assert len(reports)==2 and {r['shell'] for r in reports}=={'powershell','pwsh'};
          assert all(r['status']=='measured' and r['expected']==r['completed']==len(r['samples_seconds'])==4
          and r['selector_calls']==4 and r['phases']==['cold','cold','warm','warm']
          and all(v>0 for v in r['samples_seconds']) and r['network']=='no-downloads'
          and r['tail_qualification']=='insufficient samples' for r in reports)"
      - name: Qualify Index PowerShell Core readers and actual ingress
        shell: pwsh
        env:
          INDEX_BOOTSTRAP_HOST: pwsh
        run: &index-windows-bootstrap-controls |
          $packets = [ordered]@{
            'raw' = 'raw and (bootstrap_readers or cell)'
            'packaged' = 'packaged and (bootstrap_readers or cell)'
            'driver' = '(actual_entry and driver) or explicit_closed'
          }
          foreach ($packet in $packets.GetEnumerator()) {
            python tools/run-plugin-tests.py payload-invocation `
              --test-file tests/test_index_bootstrap_source.py --allow-explicit-tiers `
              -k "( $($packet.Value) ) and $env:INDEX_BOOTSTRAP_HOST" `
              --junit-dir "qualification-evidence/index-windows-bootstrap/$($env:INDEX_BOOTSTRAP_HOST)/$($packet.Key)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Require all nineteen Index controls and both repeated reader reports
        env:
          INDEX_BOOTSTRAP_HOST: pwsh
        run: &index-windows-bootstrap-verifier >-
          python -c "import json,os; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/index-windows-bootstrap',
          os.environ['INDEX_BOOTSTRAP_HOST']).rglob('*.xml')];
          cases=[c for root in roots for c in root.iter('testcase')];
          assert len(cases)==19 and len({c.attrib['name'] for c in cases})==19;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'));
          reports=[json.loads(p.attrib['value']) for root in roots for p in root.iter('property')
          if p.attrib['name']=='index_windows_bootstrap_performance'];
          assert len(reports)==2 and {r['layout'] for r in reports}=={'raw','packaged'};
          assert all(r['host']==os.environ['INDEX_BOOTSTRAP_HOST'] and r['status']=='measured'
          and r['completed']==len(r['samples_seconds'])==2 and r['network']=='disabled'
          and r['helper_python']=='3.11.18' and r['uv_calls_per_reader']==2 for r in reports);
          print(json.dumps({'index_windows_bootstrap_performance':reports},sort_keys=True))"
      - name: Qualify Index Windows PowerShell readers and actual ingress
        shell: pwsh
        env:
          INDEX_BOOTSTRAP_HOST: powershell.exe
        run: *index-windows-bootstrap-controls
      - name: Require all nineteen Index controls and both repeated reader reports
        env:
          INDEX_BOOTSTRAP_HOST: powershell.exe
        run: *index-windows-bootstrap-verifier
