  command-bootstrap-uv-linux:
    runs-on: ubuntu-latest
    # Successful runs take 3.4-4.9 minutes; a 5-minute limit cancelled half of all runs.
    timeout-minutes: 8
    steps: *command-bootstrap-steps
  budget-uv-launch:
    runs-on: windows-latest
    # Successful runs take 3.4-4.9 minutes; a 5-minute limit cancelled half of all runs.
    timeout-minutes: 8
    env:
      PYTEST_ADDOPTS: "--durations=15"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Pin uv to .python-version
        uses: ./.github/actions/pin-uv-python
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
      - name: Prepare the addressed interpreter without publishing Python commands
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'budget-managed-python'
          uv python install --no-bin --no-registry cpython@3.13.12 cpython@3.10.20 cpython@3.11.18
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UV_PYTHON_INSTALL_DIR=$env:UV_PYTHON_INSTALL_DIR" >> $env:GITHUB_ENV
      - name: Qualify native installer retry and fixed-owner readiness
        run: >-
          python tools/run-plugin-tests.py budget-guidance
          --test-file tests/test_installers.py
          --test-file tests/test_bootstrap_check_reconcile_always_on.py
          --junit-dir qualification-evidence/budget-setup
          --allow-explicit-tiers -k "(test_installers.py and
          (native_failed_install or native_retry or command_path_publication or closed_wheel_uv or raw_checkout_stamped_closure or native_index_reader_matches_uv_working_directory)) or
          (test_bootstrap_check_reconcile_always_on.py and
          (driver_submission or driver_failure or automatic_driver or managed_runtime) and not bash)"
      - name: Require actual installer controls
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          all_cases=[case for file in Path('qualification-evidence/budget-setup').rglob('*.xml')
          for case in ET.parse(file).iter('testcase')];
          assert len(all_cases)==41;
          cases=[c for c in all_cases if c.attrib['classname'].endswith('test_installers')];
          assert len(cases)==21;
          assert all(case.find(tag) is None for case in cases for tag in ('error','failure','skipped'))"
      - name: Require actual bootstrap controls on both PowerShell engines
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[case for file in Path('qualification-evidence/budget-setup').rglob('*.xml')
          for case in ET.parse(file).iter('testcase')
          if case.attrib['classname'].endswith('test_bootstrap_check_reconcile_always_on')];
          assert len(cases)==20;
          assert all(case.find(tag) is None for case in cases for tag in ('error','failure','skipped'));
          print('20 native bootstrap admission/readiness controls passed without skips')"
      - name: Qualify prepared commands, Bridge startup and Vault Windows PowerShell ingress
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_uv_runtime_launch.py
          --test-file tests/test_bridge_windows_service_source.py --allow-explicit-tiers
          --test-file tests/test_vault_windows_service_source.py
          -k "test_bridge_windows_service_source.py or
          (test_vault_windows_service_source.py and powershell) or
          (test_uv_runtime_launch.py and (ps1 or winps or declaration or powershell_early_exit) and not generated_managed_bootstrap)"
          --junit-dir qualification-evidence/windows-service-ingress
      - name: Require all prepared command controls
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[c for p in Path('qualification-evidence/windows-service-ingress').rglob('*.xml')
          for c in ET.parse(p).iter('testcase') if c.attrib['classname'].endswith('test_uv_runtime_launch')];
          assert len(cases)==29;
          assert all(c.find(t) is None for c in cases for t in ('skipped','error','failure'))"
      - name: Require both PowerShell hosts and repeated selected-runtime launches
        run: >-
          python -c "import json; from pathlib import Path; import xml.etree.ElementTree as ET;
          roots=[ET.parse(p) for p in Path('qualification-evidence/windows-service-ingress').rglob('*.xml')];
          all_cases=[c for root in roots for c in root.iter('testcase')];
