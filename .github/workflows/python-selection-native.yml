name: Actual mixed-Python native selection

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/python-selection-native.yml
      - libs/agent-procutil/src/agent_procutil/daemon_instances.ps1
      - libs/agent-procutil/src/agent_procutil/daemon_instance_runtime.pyz
      - libs/agent-procutil/tests/test_daemon_python_selection.py
      - libs/installer-engine/bootstrap-uv.ps1
      - libs/installer-engine/bootstrap_uv_capture.py
      - libs/installer-engine/bootstrap-uv.sh
      - libs/installer-engine/installer_dependency_arguments.py
      - libs/installer-engine/installer_dependency_config.py
      - libs/installer-engine/installer_dependency_policy.py
      - libs/installer-engine/installer_pip_index.py
      - libs/payload-invocation/generate.py
      - libs/payload-invocation/template_rendering.py
      - libs/payload-invocation/templates/posix-shim.tmpl
      - libs/payload-invocation/templates/powershell-shim.tmpl
      - libs/payload-invocation/tests/test_uv_runtime_launch.py
      - libs/installer-engine/bootstrap-capture.cs
      - libs/installer-engine/bootstrap-capture.exe
      - libs/installer-engine/bootstrap-capture.ps1
      - tools/build-bootstrap-capture.py
      - plugins/agent-bridge/scripts/resolve-bootstrap-python.ps1
      - plugins/agent-bridge/tests/test_bootstrap_capture_native.py
      - plugins/agent-bridge/tests/fixtures/bootstrap-capture-probe.cs
      - libs/installation-context/tests/test_managed_python_transport.py
      - libs/update-driver/scripts/first-use.ps1
      - libs/update-driver/scripts/first-use.sh
      - libs/update-driver/src/update_driver/first_use.py
      - libs/update-driver/tests/test_first_use_budget.py
      - libs/versioned-runtime/versioned_runtime_native.ps1
      - libs/versioned-runtime/tests/test_runtime_source_native.py
      - plugins/agent-worktrees/scripts/install.ps1
      - plugins/agent-worktrees/tests/test_installer_admission_python.py
      - plugins/budget-guidance/payload-invocation.json
      - plugins/budget-guidance/scripts/install.ps1
      - plugins/budget-guidance/scripts/bootstrap-check.ps1
      - plugins/budget-guidance/scripts/bootstrap-check.sh
      - plugins/budget-guidance/scripts/write-session-guidance.ps1
      - plugins/budget-guidance/scripts/uninstall-runtime.ps1
      - plugins/budget-guidance/scripts/uninstall-runtime.sh
      - plugins/budget-guidance/tests/test_installers.py
      - plugins/budget-guidance/tests/test_native_provider_policy.py
      - plugins/budget-guidance/tests/test_install_transaction_lock.py
      - plugins/budget-guidance/tests/test_managed_uninstall.py
      - plugins/budget-guidance/tests/test_session_guidance.py
      - plugins/budget-guidance/tests/cue_fixture.py
      - plugins/budget-guidance/tests/test_managed_cue.py
      - plugins/budget-guidance/tests/test_bootstrap_check_reconcile_always_on.py
      - tools/test_native_wheel_installers.py

permissions:
  contents: read

jobs:
  budget-uv-launch:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Prepare the addressed interpreter without publishing Python commands
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'budget-managed-python'
          uv python install --no-bin --no-registry cpython@3.13.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UV_PYTHON_INSTALL_DIR=$env:UV_PYTHON_INSTALL_DIR" >> $env:GITHUB_ENV
      - name: Qualify prepared command argv, streams, exit and setup refusal
        run: >-
          python tools/run-plugin-tests.py payload-invocation
          --test-file tests/test_uv_runtime_launch.py
          --junit-dir qualification-evidence/budget-launch
          --allow-explicit-tiers -k "ps1 or winps or declaration or powershell_early_exit"
      - name: Qualify native installer failure and clean retry
        run: >-
          python tools/run-plugin-tests.py budget-guidance
          --test-file tests/test_installers.py
          --junit-dir qualification-evidence/budget-setup
          --allow-explicit-tiers -k "native_failed_install or native_retry or command_path_publication or closed_wheel_uv or raw_checkout_stamped_closure"
      - name: Qualify lock admission before prerequisite preparation
        run: >-
          python tools/run-plugin-tests.py budget-guidance
          --test-file tests/test_install_transaction_lock.py
          --junit-dir qualification-evidence/budget-lock
          --allow-explicit-tiers
          -k "contend_before_snapshot_publication and prerequisites and not bash"
      - name: Require actual command, installer and lock controls
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          groups={name:[case for file in Path('qualification-evidence',name).rglob('*.xml')
          for case in ET.parse(file).iter('testcase')] for name in ('budget-launch','budget-setup','budget-lock')};
          assert {name:len(cases) for name,cases in groups.items()}=={'budget-launch':29,'budget-setup':17,'budget-lock':4};
          assert all(case.find(tag) is None for cases in groups.values() for case in cases
          for tag in ('error','failure','skipped'));
          print('29 command, 17 installer/snapshot and four prerequisite-lock controls passed without skips')"
  budget-uv-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Prepare the addressed interpreter without publishing Python commands
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'budget-managed-python'
          uv python install --no-bin --no-registry cpython@3.13.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UV_PYTHON_INSTALL_DIR=$env:UV_PYTHON_INSTALL_DIR" >> $env:GITHUB_ENV
      - name: Qualify prepared-only managed uninstall on both PowerShell engines
        run: >-
          python tools/run-plugin-tests.py budget-guidance
          --test-file tests/test_managed_uninstall.py
          --junit-dir qualification-evidence/budget-uninstall
          --allow-explicit-tiers -k ps1
      - name: Qualify actual Windows provider version and retained-input launches
        run: >-
          python tools/run-plugin-tests.py budget-guidance
          --test-file tests/test_native_provider_policy.py
          --junit-dir qualification-evidence/budget-provider
          --allow-explicit-tiers -k native_uv_policy_qualification
      - name: Qualify managed cue selection, shared deadline and legacy owner deferral
        run: >-
          python tools/run-plugin-tests.py budget-guidance
          --test-file tests/test_managed_cue.py
          --test-file tests/test_bootstrap_check_reconcile_always_on.py
          --junit-dir qualification-evidence/budget-cue
          --allow-explicit-tiers -k "(powershell_writer or powershell_selector or legacy_reconcile_record) and not bash"
      - name: Require actual uninstall, provider and guidance controls
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          groups={name:[case for file in Path('qualification-evidence',name).rglob('*.xml')
          for case in ET.parse(file).iter('testcase')] for name in ('budget-uninstall','budget-provider','budget-cue')};
          assert {name:len(cases) for name,cases in groups.items()}=={'budget-uninstall':16,'budget-provider':2,'budget-cue':26};
          assert all(case.find(tag) is None for cases in groups.values() for case in cases
          for tag in ('error','failure','skipped'));
          print('16 uninstall, two native provider and 26 managed cue/legacy-owner controls passed without skips')"
  budget-bootstrap-owner:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Prepare the addressed interpreter without publishing Python commands
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'budget-managed-python'
          uv python install --no-bin --no-registry cpython@3.13.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UV_PYTHON_INSTALL_DIR=$env:UV_PYTHON_INSTALL_DIR" >> $env:GITHUB_ENV
      - name: Qualify Budget fixed-owner admission and managed readiness
        run: >-
          python tools/run-plugin-tests.py budget-guidance
          --test-file tests/test_bootstrap_check_reconcile_always_on.py
          --junit-dir qualification-evidence/budget-bootstrap
          --allow-explicit-tiers
          -k "(driver_submission or driver_failure or automatic_driver or managed_runtime) and not bash"
      - name: Qualify the actual hook and native supervisor handoff
        run: >-
          python tools/run-plugin-tests.py update-driver
          --test-file tests/test_first_use_budget.py
          --junit-dir qualification-evidence/budget-bootstrap-owner
          --allow-explicit-tiers -k actual_budget_hook
      - name: Require actual bootstrap controls on both PowerShell engines
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[case for file in Path('qualification-evidence/budget-bootstrap').rglob('*.xml')
          for case in ET.parse(file).iter('testcase')];
          assert len(cases)==20, len(cases);
          assert all(case.find(tag) is None for case in cases for tag in ('error','failure','skipped'));
          owners=[case for file in Path('qualification-evidence/budget-bootstrap-owner').rglob('*.xml')
          for case in ET.parse(file).iter('testcase')];
          assert len(owners)==1, len(owners);
          assert all(case.find(tag) is None for case in owners for tag in ('error','failure','skipped'));
          print('20 native bootstrap admission/readiness controls and actual supervisor handoff passed without skips')"
  mixed-python:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      UV_PYTHON: "3.12"
      QUALIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Supply a real unsupported interpreter only on this disposable runner
        id: old
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          update-environment: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
      - name: Bind source and actual interpreter prerequisites
        shell: pwsh
        env:
          TEST_PYTHON39: ${{ steps.old.outputs.python-path }}
        run: |
          python -c "import os,subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); assert actual == os.environ['QUALIFICATION_SHA']; print('source='+actual)"
          & $env:TEST_PYTHON39 -I -S -B -c "import sys; assert sys.version_info[:2] == (3,9); print('old='+sys.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify real old-first installer admission on PS5.1 and pwsh
        env:
          TEST_PYTHON39: ${{ steps.old.outputs.python-path }}
          PYTEST_ADDOPTS: "-rP"
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          --test-file tests/test_installer_admission_python.py
          --junit-dir qualification-evidence/admission
          -k real_python39
      - name: Qualify real daemon-helper selection and original Job cleanup
        env:
          TEST_PYTHON39: ${{ steps.old.outputs.python-path }}
          PYTEST_ADDOPTS: "-rP"
        run: >-
          python tools/run-plugin-tests.py agent-procutil
          --test-file tests/test_daemon_python_selection.py
          --junit-dir qualification-evidence/daemon
          --allow-explicit-tiers -k real_python39
      - name: Require all six actual-interpreter controls without prerequisite skips
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          groups={name:[case for file in Path('qualification-evidence',name).rglob('*.xml')
          for case in ET.parse(file).iter('testcase')] for name in ('admission','daemon')};
          assert {name:len(cases) for name,cases in groups.items()}=={'admission':2,'daemon':4};
          assert all(case.find(tag) is None for cases in groups.values() for case in cases
          for tag in ('error','failure','skipped'));
          print('Six actual-interpreter controls passed without skips')"
      - name: Prepare the managed interpreter in disposable qualification storage
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bootstrap-managed-python'
          uv python install --no-bin --no-registry cpython@3.12.13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UV_PYTHON_INSTALL_DIR=$env:UV_PYTHON_INSTALL_DIR" >> $env:GITHUB_ENV
      - name: Qualify uv selection before direct caller-owned worker admission
        run: >-
          python tools/run-plugin-tests.py installation-context
          --test-file tests/test_managed_python_transport.py
          --junit-dir qualification-evidence/managed
          --allow-explicit-tiers
      - name: Require both managed handoff controls on both PowerShell engines
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[case for file in Path('qualification-evidence/managed').rglob('*.xml')
          for case in ET.parse(file).iter('testcase')];
          assert len(cases)==4;
          assert all(case.find(tag) is None for case in cases for tag in ('error','failure','skipped'));
          print('Four managed-interpreter controls passed without skips')"
      - name: Qualify null, empty and replacement environment values in both capture modes
        run: >-
          python tools/run-plugin-tests.py runtime-source
          --test-file tests/test_runtime_source_native.py
          --junit-dir qualification-evidence/environment
          --allow-explicit-tiers -k environment_removal
      - name: Require child-only environment semantics on both PowerShell engines
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[case for file in Path('qualification-evidence/environment').rglob('*.xml')
          for case in ET.parse(file).iter('testcase')];
          assert len(cases)==4;
          assert all(case.find(tag) is None for case in cases for tag in ('error','failure','skipped'));
          print('Four native child-environment controls passed without skips')"
      - name: Require the packaged pre-interpreter host to match its reviewed source
        run: python tools/build-bootstrap-capture.py --check
      - name: Qualify original-caller bootstrap selector custody
        run: >-
          python tools/run-plugin-tests.py agent-bridge
          --test-file tests/test_bootstrap_capture_native.py
          --junit-dir qualification-evidence/bootstrap-custody
          --allow-explicit-tiers
      - name: Require all nine original-caller, replacement and negative controls
        run: >-
          python -c "from pathlib import Path; import xml.etree.ElementTree as ET;
          cases=[case for file in Path('qualification-evidence/bootstrap-custody').rglob('*.xml')
          for case in ET.parse(file).iter('testcase')];
          assert len(cases)==9;
          assert all(case.find(tag) is None for case in cases for tag in ('error','failure','skipped'));
          print('Nine native bootstrap custody and replacement controls passed without skips')"
