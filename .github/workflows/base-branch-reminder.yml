# Posts a one-time, read-only-safe reminder comment on a PR that targets
# `main` directly, asking the author to retarget to `dev` -- `main` only
# ever receives automated releases (see docs/pipelines.md > Release &
# Versioning). The independent `main-gate` job below enforces that policy.
#
# Main-targeting PRs do not allocate `ci.yml`. This trusted invocation supplies
# admission and feedback without waiting for fork-code execution approval.
#
# The reminder closes that feedback gap with a narrow, safe
# nudge. It does not weaken `main-gate`, and it does not grant a
# non-collaborator any new capability: it never checks out or executes the
# PR's own code, never runs tests, never requests a review, and its only
# effect is one explanatory comment. Deliberately minimal on purpose -- see
# the operator direction that prompted this file: avoid over-enabling
# functionality for an uninvited contributor by accident.
#
# Uses `pull_request_target` (the same mechanism as workflow-lockdown-guard.yml
# -- see that file's header for the full
# rationale): it runs the TRUSTED workflow definition from the repository's
# actual default branch regardless of the PR author's trust level, and is
# NOT subject to the fork-approval gate that blocks `pull_request`-triggered
# workflows for first-time contributors. This job never checks out the PR's
# head, so it carries none of the usual `pull_request_target`
# secret-exfiltration risk.
#
# This same invocation supplies the main source gate from trusted default-branch
# code and replaces main-PR CI admission and identifier reporting. Main-push
# validation and contributor CI remain unchanged. The identifier scan is scoped:
# only owner-authored, admitted main PRs enter it; uninvited PRs gain no secret
# denylist oracle outside their existing CI approval boundary.
name: Base branch reminder

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  # Serializes the check-existing-comment-then-post sequence per PR: without
  # this, two runs (e.g. `opened` immediately followed by an `edited`) can
  # both list comments before either has posted, both see no marker yet, and
  # both post a reminder. `cancel-in-progress: false` so a run already
  # mid-flight always finishes its own check-then-post instead of being
  # killed partway and leaving an inconsistent GitHub Actions log for no
  # benefit (this job is seconds-long; queuing briefly costs nothing).
  group: base-branch-reminder-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  main-gate:
    name: main source gate
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Check out trusted main history, never the PR tree
        if: github.event.pull_request.user.login == github.repository_owner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fetch the owner's PR commit as Git data only
        if: >-
          github.event.pull_request.user.login == github.repository_owner &&
          !startsWith(github.event.pull_request.head.ref, 'release/promote-')
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git -c core.hooksPath= -c core.fsmonitor=false fetch --no-tags --no-recurse-submodules origin "$HEAD_SHA"
      - name: Admit only generated releases, owner workflow/control transactions, or recognized rollback state
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$HEAD_REF" == release/promote-* && "$PR_AUTHOR" == "$REPO_OWNER" ]]; then
            python -I -B - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          trusted = Path.cwd().resolve(strict=True)
          sys.path.insert(0, str(trusted / "tools"))
          from promotion_control import _blob, _git, _tree

          repository = os.environ["TARGET_REPOSITORY"]
          branch = re.fullmatch(r"release/promote-([1-9][0-9]{0,19})", os.environ["HEAD_REF"])
          base = os.environ["BASE_SHA"]
          if (
              branch is None or os.environ["HEAD_REPOSITORY"] != repository
              or not re.fullmatch(r"[0-9a-f]{40}", base)
          ):
              raise RuntimeError("promotion has no exact same-repository owning run/base")
          response = subprocess.run(
              ["gh", "api", f"repos/{repository}/actions/runs/{branch[1]}"],
              check=True, capture_output=True, text=True, timeout=45,
          )
          run = json.loads(response.stdout)
          if (
              not isinstance(run, dict) or type(run.get("id")) is not int
              or run["id"] != int(branch[1])
              or type(run.get("run_attempt")) is not int or run["run_attempt"] <= 0
              or run.get("path") != ".github/workflows/validate-and-promote.yml"
              or run.get("event") not in ("repository_dispatch", "workflow_dispatch")
              or run.get("head_branch") != "main"
              or not isinstance(run.get("repository"), dict)
              or run["repository"].get("full_name") != repository
              or not isinstance(run.get("head_repository"), dict)
              or run["head_repository"].get("full_name") != repository
              or not isinstance(run.get("head_sha"), str)
              or not re.fullmatch(r"[0-9a-f]{40}", run["head_sha"])
          ):
              raise RuntimeError("promotion owning run is not the canonical trusted Main workflow")
          executing = run["head_sha"]
          _git(trusted, ["merge-base", "--is-ancestor", executing, base])
          source, current = _tree(trusted, executing), _tree(trusted, base)
          for path in (
              ".github/workflows/validate-and-promote.yml",
              ".github/workflows/ci.yml",
          ):
              if path not in source or path not in current:
                  raise RuntimeError("promotion control-generation evidence is missing")
              if _blob(trusted, source[path], limit=1 << 20) != _blob(
                  trusted, current[path], limit=1 << 20,
              ):
                  raise RuntimeError("executing release control differs from current Main control")
          print("Canonical owning run executes the current reviewed Main control generation.")
          PY
            echo "Legitimate promotion-pipeline PR with current executing control -- OK."
            exit 0
          fi
          if [ "$PR_AUTHOR" != "$REPO_OWNER" ]; then
            echo "::error::This PR targets 'main' and is not the promotion pipeline's own PR. main only ever moves via a release/promote-* PR, a workflow-file-only bootstrap PR, or rollback_release.py's own state-commit/revert PR (all by the repo owner). Please retarget this PR's base branch to 'dev' -- see docs/pipelines.md > Release & Versioning."
            exit 1
          fi
          # Merge-base-relative (three-dot semantics), not a literal
          # base_sha..head_sha diff: matches GitHub's own "Files changed"
          # tab and the `pulls.listFiles` API (used by
          # base-branch-reminder.yml's equivalent recognition check) --
          # "what this PR's own commits introduce," not "every difference
          # between the current tips of base and head." A literal two-commit
          # diff would wrongly reject this PR the moment `main` independently
          # gains any unrelated file after this branch forked from it (that
          # file would show up as "removed" relative to head, even though
          # this PR never touched it), and would wrongly accept a PR that
          # re-introduces a change base already carries identically.
          changed="$(git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA")"
          if [ -z "$changed" ]; then
            echo "::error::No changed files detected between base and head -- refusing to land on main."
            exit 1
          fi
          # Third legitimate shape: tools/rollback_release.py's own
          # pause/resume state-commit PR (see that tool's `_write_state_commit`
          # / `_land_via_pr`) -- branch name is always `release-pipeline/
          # state-<epoch ms>` (never reused, never hand-typed), and its diff
          # is never anything but the one pipeline-state JSON file
          # (`.github/release-pipeline-state.json`, `PIPELINE_STATE_PATH` in
          # that tool). Checked by branch-name PATTERN (not exact match --
          # the timestamp varies every run) AND single-file diff content
          # together: neither alone should be enough to widen this narrow exception.
          if [[ "$HEAD_REF" == release-pipeline/state-* \
                && "$changed" == ".github/release-pipeline-state.json" ]]; then
            echo "Automated rollback_release.py state-commit PR -- OK. Files:"
            echo "$changed"
            exit 0
          fi
          # Fourth legitimate shape: tools/rollback_release.py's own
          # `revert` rollback PR (see that tool's `revert`/`_land_via_pr`)
          # -- branch name is always `release-pipeline/rollback-<epoch ms>`
          # (never reused, never hand-typed), generated as a SINGLE
          # mechanical `commit-tree` call that wholesale-restores main's
          # pre-promotion tree. Unlike shape (3), this diff is deliberately
          # NOT single-file (a real tree-wide revert can touch many files),
          # so it cannot be checked by diff content the same way. Branch
          # name and commit count alone are NOT enough here, though -- any
          # owner-authored, single-commit PR could otherwise reuse this
          # prefix to land an arbitrary tree-wide change, since a single
          # hand-authored commit is routine. Verify the actual shape
          # instead: the head's SOLE parent must be this PR's base sha
          # (proving it is a direct, un-rebased child of main's tip at
          # open time, matching `commit-tree -p <main tip>`), and every
          # file it changes relative to the REAL promotion commit's OWN
          # parent must be the one pipeline-state file -- i.e. the
          # revert's tree, aside from that one file, is byte-identical to
          # the commit immediately before the promotion it reverts,
          # exactly what `revert()` constructs. The "real promotion
          # commit" is NOT simply `BASE_SHA^`: the documented operator
          # flow is pause THEN revert, so a pause/resume bookkeeping
          # commit is often main's actual tip by the time `revert` runs,
          # making `BASE_SHA` itself that pause commit and `BASE_SHA^` the
          # promotion commit being reverted, not its parent. Walk
          # `BASE_SHA`'s history for the most recent `promote-*`-tagged
          # commit instead, mirroring `_find_last_promotion_commit`
          # exactly, and compare against THAT commit's parent.
          if [[ "$HEAD_REF" == release-pipeline/rollback-* && "$PR_COMMITS" == "1" ]]; then
            parent_count="$(git rev-list --parents -n 1 "$HEAD_SHA" | wc -w)"
            sole_parent="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || true)"
            if [[ "$parent_count" != "2" || "$sole_parent" != "$BASE_SHA" ]]; then
              echo "::error::This PR's head is not a single, direct child of its base (expected exactly one parent equal to \$BASE_SHA) -- refusing to treat it as an automated rollback_release.py revert."
              exit 1
            fi
            promotion_commit=""
            for sha in $(git log --format=%H "$BASE_SHA"); do
              if git tag --points-at "$sha" | grep -q '^promote-'; then
                promotion_commit="$sha"
                break
              fi
            done
            if [ -z "$promotion_commit" ]; then
              echo "::error::Could not find a tagged promotion commit reachable from this PR's base -- refusing to treat it as an automated rollback_release.py revert."
              exit 1
            fi
            rollback_diff="$(git diff --name-only "$promotion_commit^" "$HEAD_SHA" | grep -v '^\.github/release-pipeline-state\.json$' || true)"
            if [ -n "$rollback_diff" ]; then
              echo "::error::This PR's tree (beyond the pipeline-state file) does not match main's pre-promotion state -- refusing to treat it as an automated rollback_release.py revert. Unexpected diff:"
              echo "::error::$rollback_diff"
              exit 1
            fi
            echo "Automated rollback_release.py revert PR -- OK."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fxq '.github/promotion-control.json'; then
            # Import only the checked-out trusted Main validator. PR objects
            # remain Git blob data; no PR helper or workflow is executed.
            python -I -B - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          trusted = Path.cwd().resolve(strict=True)
          sys.path.insert(0, str(trusted / "tools"))
          from promotion_control import MANIFEST_PATH, _blob, _paths, _tree

          if os.environ["HEAD_REPOSITORY"] != os.environ["TARGET_REPOSITORY"]:
              raise RuntimeError("control transactions must originate in the owner's repository")
          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          if any(not re.fullmatch(r"[0-9a-f]{40}", value) for value in (base, head)):
              raise RuntimeError("control transaction identities must be immutable commits")
          before, after = _tree(trusted, base), _tree(trusted, head)
          changed = {
              path for path in before.keys() | after.keys()
              if before.get(path) != after.get(path)
          }
          if MANIFEST_PATH not in changed or MANIFEST_PATH not in after:
              raise RuntimeError("control activation requires a non-deleted manifest change")
          raw = _blob(trusted, after[MANIFEST_PATH], limit=64 << 10)
          declared = set(_paths(raw)) - {MANIFEST_PATH}
          required = {
              ".github/workflows/ci.yml",
              ".github/workflows/validate-and-promote.yml",
          }
          allowed = required | {".github/workflows/base-branch-reminder.yml"}
          if not required <= declared or not declared <= allowed:
              raise RuntimeError("control manifest must name only the qualified release workflows")
          manifest = json.loads(raw)
          canonical = (json.dumps(manifest, indent=2, sort_keys=True) + "\n").encode("utf-8")
          if manifest["files"] != sorted(declared) or raw != canonical:
              raise RuntimeError("control manifest must use canonical sorted JSON and workflow paths")
          if MANIFEST_PATH in before:
              existing = set(_paths(_blob(trusted, before[MANIFEST_PATH], limit=64 << 10)))
              if not existing <= declared | {MANIFEST_PATH}:
                  raise RuntimeError("control transactions cannot remove an existing declaration")
          protected = declared | {MANIFEST_PATH}
          if not changed <= protected:
              raise RuntimeError("control transaction changes an undeclared or non-control path")
          for path in protected:
              if path not in after:
                  raise RuntimeError("control transactions cannot delete a declared workflow")
              _blob(trusted, after[path], limit=64 << 10 if path == MANIFEST_PATH else 1 << 20)
              parts = path.split("/")
              for length in range(1, len(parts) + 1):
                  prefix = "/".join(parts[:length])
                  aliases = {
                      "/".join(other.split("/")[:length]) for other in after
                      if "/".join(other.split("/")[:length]).casefold() == prefix.casefold()
                  }
                  if aliases != {prefix}:
                      raise RuntimeError("control transaction contains a case-equivalent path alias")
          print("Owner control transaction: canonical manifest and regular workflow blobs verified.")
          PY
            exit 0
          fi
          non_workflow="$(echo "$changed" | grep -v '^\.github/workflows/' || true)"
          if [ -n "$non_workflow" ]; then
            echo "::error::This PR touches file(s) outside .github/workflows/, so it cannot use the workflow-only bootstrap exception:"
            echo "::error::$non_workflow"
            echo "::error::main only ever moves via a release/promote-* PR, a workflow-file-ONLY bootstrap PR, or rollback_release.py's own state-commit/revert PR. Baseline updates target dev. Please retarget this PR's base branch to 'dev' -- see docs/pipelines.md > Release & Versioning."
            exit 1
          fi
          echo "Workflow-file-only bootstrap PR by the repo owner -- OK. Files:"
          echo "$changed"

  scan-and-report:
    name: scan + report
    needs: main-gate
    if: >-
      needs.main-gate.result == 'success' &&
      github.event.pull_request.user.login == github.repository_owner
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - id: guard
        if: steps.checkout.outcome == 'success'
        uses: ./.github/actions/identifier-leak-guard
        continue-on-error: true
        with:
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          facility-identifiers: ${{ secrets.FORBIDDEN_IDS_FACILITY }}
          work-identifiers: ${{ secrets.FORBIDDEN_IDS_WORK }}
      # Must survive failure to load any checked-out local action.
      - name: Report unavailable trusted scanner
        if: always() && (steps.checkout.outcome != 'success' || steps.guard.outcome != 'success')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER),
            });
            if (pr.head.sha !== process.env.PR_HEAD_SHA) {
              core.notice("PR head moved on; skipping stale infrastructure reporting.");
              return;
            }
            await github.rest.checks.create({
              ...context.repo, name: "identifier leak guard",
              head_sha: process.env.PR_HEAD_SHA, status: "completed", conclusion: "failure",
              output: {
                title: "Identifier leak guard unavailable",
                summary: "Trusted checkout or scanner action failed; no scan result is available.",
                text: `Checkout: ${process.env.CHECKOUT_OUTCOME}; action: ${process.env.GUARD_OUTCOME}.`,
              },
            });

  remind:
    name: remind-to-target-dev
    if: github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post a one-time reminder to retarget to dev
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const { PR_AUTHOR, REPO_OWNER, HEAD_REF } = process.env;
            const pull_number = context.payload.pull_request.number;

            // Mirrors this workflow's `main-gate` job -- the exact four shapes
            // that legitimately land on `main` directly (the release
            // pipeline's own PR, a workflow-only bootstrap PR,
            // rollback_release.py's own pause/resume state-commit PR and
            // revert rollback PR).
            // Recognized by SIGNATURE (branch name + diff content, or branch
            // name + commit count for the revert shape, whose diff is
            // deliberately not single-file), the
            // same way `main-gate` itself verifies them, not merely by
            // "author is the repo owner" -- all four shapes do happen to
            // require that today, but checking the signature directly means
            // this stays correct even if this job is later widened to cover
            // every PR against `main` (not just non-owner authors): a
            // future change to the outer author-based scoping can never
            // accidentally start reminding the release pipeline's own
            // automated PRs to retarget.
            async function isLegitimateAutomatedMainPr() {
              if (PR_AUTHOR !== REPO_OWNER) {
                // Every shape below is only ever opened under the repo
                // owner's own PAT; a non-owner author can never match one.
                return false;
              }
              if (HEAD_REF.startsWith("release/promote-")) {
                return true;
              }
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number,
                per_page: 100,
              });
              const changed = files.map((f) => f.filename);
              if (
                HEAD_REF.startsWith("release-pipeline/state-") &&
                changed.length === 1 &&
                changed[0] === ".github/release-pipeline-state.json"
              ) {
                return true;
              }
              if (
                HEAD_REF.startsWith("release-pipeline/rollback-") &&
                context.payload.pull_request.commits === 1
              ) {
                return true;
              }
              if (
                changed.length > 0 &&
                changed.every((name) => name.startsWith(".github/workflows/"))
              ) {
                return true;
              }
              return false;
            }

            if (await isLegitimateAutomatedMainPr()) {
              core.info(
                "Legitimate automated main-targeting PR (release pipeline / workflow-only " +
                  "bootstrap / rollback_release state-commit " +
                  "or revert); skipping reminder.",
              );
              return;
            }

            // Intended scope (unchanged from this workflow's original
            // design): this reminder only ever targets a NON-owner author's
            // ordinary PR against `main`. The signature check above is
            // independent insurance for the four automated shapes
            // specifically -- it is not a replacement for this outer scope
            // guard, and must stay a separate check: dropping this one
            // would also start reminding the repo owner's own ordinary (not
            // one of the five automated-shape) PRs against `main`, which is
            // out of scope for this job (main-gate already gives the owner
            // direct, same-repo CI feedback in that case).
            if (PR_AUTHOR === REPO_OWNER) {
              core.info(`PR author ${PR_AUTHOR} is the repo owner; skipping reminder.`);
              return;
            }

            const marker = "<!-- base-branch-reminder -->";

            // Re-fetch the PR's CURRENT state immediately before posting --
            // the serializing concurrency group above means a queued run can
            // execute minutes after its triggering event, by which time the
            // author may have already retargeted to `dev` or closed the PR.
            // The triggering event's payload is a snapshot from enqueue time,
            // not proof of the current state.
            const { data: current } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });
            if (current.state !== "open" || current.base.ref !== "main") {
              core.info(
                `PR is now state=${current.state} base=${current.base.ref}; no longer needs the reminder.`,
              );
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull_number,
            });
            // Require BOTH the marker AND the posting identity -- the PR
            // author (or anyone else commenting) fully controls their own
            // comment bodies, so the marker string alone is spoofable: a
            // contributor could paste it into any comment to suppress this
            // reminder from ever posting, even though the workflow never
            // actually posted one.
            if (
              comments.some(
                (comment) =>
                  comment.user?.login === "github-actions[bot]" &&
                  comment.body &&
                  comment.body.includes(marker),
              )
            ) {
              core.info("Reminder already posted on this PR; skipping.");
              return;
            }

            const body = [
              marker,
              "Thanks for opening this pull request! This repository's `main` branch only " +
                "ever receives automated releases -- regular contributions target `dev` " +
                "instead (see docs/pipelines.md > Release & Versioning for the full policy, " +
                "and why).",
              "",
              "Could you retarget this PR's base branch to `dev`? Click \"Edit\" next to the " +
                "PR title, change the base branch dropdown to `dev`, and confirm with " +
                '"Change base" -- no need to reopen or recreate the PR.',
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull_number,
              body,
            });
