name: CI

# Fast smoke CI (budget: under ~5 min for a PR).
#
# Design (see tools/run-plugin-tests.py + the repo guards under tools/):
#   * checks         - repo guards + repo-wide ruff F/E9. Cheap (~1 min); always.
#   * test-runner    - Linux/Windows admission + state-isolation contract.
#   * discover       - resolve which plugin suites to run (changed on PR, all on
#                      push to main), split into a fast set (smoke) and the one
#                      heavy plugin (agent-worktrees, ~11 min) handled separately.
#   * smoke          - full suite per fast plugin, in parallel (wall-time ~= the
#                      slowest, agent-bridge ~2 min). fail-fast: false.
#   * worktrees-smoke- agent-worktrees is too slow for the budget, so on PR/push
#                      it only gets a cheap import/collection smoke; its full
#                      suite runs via the manual `full` workflow below.
#   * full           - workflow_dispatch only: every plugin's full suite,
#                      including agent-worktrees, no tight timeout.
#
# `dev` is included in the push trigger for the dev-branch-release-pipeline
# effort's Phase 3 (ThomasMichon/copilot-extensions#3336): a green run of
# THIS workflow on `dev` is what `.github/workflows/validate-and-promote.yml`
# waits on (`workflow_run`) before generating the wholesale-replace commit
# onto `main`. Nobody is asked to target `dev` yet -- see that effort's Plan
# for the sequencing note on when contributor-facing docs actually flip.
#
# See also: .github/workflows/context-handoff-exhaustive.yml -- a SEPARATE
# workflow (not a job here) for the real-git/child-process/lock-race matrix
# under plugins/context-handoff/tests/exhaustive/. It is intentionally its
# own workflow file, not a job in this one: a top-level `schedule` trigger
# applies to EVERY job in whatever workflow it is declared on, so adding it
# here would have put the entire fast/smoke/full matrix on a weekly cron
# too, not just the one exhaustive suite that needs it.

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # `false` (not the prior `true`): a rolling build, not cancel-and-restart.
  # GitHub's default queue:single semantics for a shared group already give
  # exactly this -- at most one run in progress, at most one pending, and a
  # newer push only ever supersedes the *pending* run, never kills the one
  # already in progress. `cancel-in-progress: true` risked starving this
  # workflow entirely under rapid pushes to the same ref (an in-flight run
  # gets killed and restarted from zero every time, so if pushes arrive
  # faster than this suite completes, NO run ever finishes) -- which in turn
  # means Validation Gate/Promote downstream never fire at all
  # (ThomasMichon/copilot-extensions#3592).
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The heavy plugin (~11 min) kept out of the fast lane; runs full only on
  # workflow_dispatch, and gets a collect-only smoke on PR/push.
  HEAVY_PLUGIN: agent-worktrees

jobs:
  main-gate:
    name: main source gate
    # The gate for any PR targeting `main`. Exactly two shapes are legitimate:
    # (1) the promotion pipeline's own PR (a release/promote-<run id> branch,
    #     opened via the APERTURE_RELEASE_TOKEN PAT -- a personal fine-grained
    #     token minted under the maintainer's own account, this repo having no
    #     separate bot identity, so the PR author is ThomasMichon, not
    #     github-actions[bot]); or
    # (2) a workflow-file-ONLY bootstrap PR by the repo owner: workflow_run-
    #     triggered workflows (validate-and-promote.yml itself) always resolve
    #     their own YAML from `main`, never the branch that triggered them, so
    #     a fix to those files must occasionally land on main directly, ahead
    #     of the next real promotion -- the pipeline can't fix itself via its
    #     own not-yet-working promotion path otherwise.
    #
    # Shape (2) is enforced by DIFF CONTENT here, not by admin/human bypass --
    # this is deliberate, prompted by a real incident (an unrelated
    # vision-doc PR landed directly on `main` via `gh pr merge --admin`,
    # stranding content that the next promotion would have silently reverted,
    # ThomasMichon/copilot-extensions#3622-erratum). Admin-merge capability on
    # this repo is legitimate (we're the maintainers) and is NOT being removed
    # here -- but after this check exists, it is never *needed*: a genuine
    # workflow-only bootstrap PR passes this gate on its own, unassisted. Any
    # future reach for `--admin` on a PR this gate rejects is itself the
    # signal something is wrong -- retarget to `dev` instead of overriding.
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only the promotion pipeline's own PR, or a workflow-only bootstrap PR, may land on main
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$HEAD_REF" == release/promote-* && "$PR_AUTHOR" == "ThomasMichon" ]]; then
            echo "Legitimate promotion-pipeline PR -- OK."
            exit 0
          fi
          if [ "$PR_AUTHOR" != "ThomasMichon" ]; then
            echo "::error::This PR targets 'main' and is not the promotion pipeline's own PR. main only ever moves via a release/promote-* PR, or (rarely) a workflow-file-only bootstrap PR by the repo owner. Please retarget this PR's base branch to 'dev' -- see CONTRIBUTING.md > Release & Versioning."
            exit 1
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if [ -z "$changed" ]; then
            echo "::error::No changed files detected between base and head -- refusing to land on main."
            exit 1
          fi
          non_workflow="$(echo "$changed" | grep -v '^\.github/workflows/' || true)"
          if [ -n "$non_workflow" ]; then
            echo "::error::This PR touches file(s) outside .github/workflows/, so it cannot use the workflow-only bootstrap exception:"
            echo "::error::$non_workflow"
            echo "::error::main only ever moves via a release/promote-* PR, or a workflow-file-ONLY bootstrap PR. Please retarget this PR's base branch to 'dev' -- see CONTRIBUTING.md > Release & Versioning."
            exit 1
          fi
          echo "Workflow-file-only bootstrap PR by the repo owner -- OK. Files:"
          echo "$changed"

  checks:
    name: guards + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --upgrade pip pytest pyyaml ruff
      - name: Version consistency
        run: python tools/check-version-consistency.py
      - name: Changefile presence (touched plugins must have a pending changefile; PR-into-dev only)
        # Every plugin whose content -- or a vendored lib it ships -- changes in
        # a PR targeting `dev` must carry a pending changefile (tools/changefile.py),
        # else the promotion pipeline has nothing to bump and the marketplace serves
        # stale code under an unchanged version (silent stale deploy, dotfiles #1025).
        # Scoped to the PR diff so a pre-existing state never blocks unrelated PRs.
        # Replaces the old manual three-file version-bump requirement
        # (tools/check-version-bump.py) now that dev-branch-release-pipeline's CI
        # promotion pipeline (Phase 3) exists to actually consume changefiles.
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev'
        run: python tools/check-changefile-presence.py --base ${{ github.event.pull_request.base.sha }}
      - name: Module size (hard cap + shrink-only baseline, PR diff only)
        # Scoped to files THIS PR's own commits touch (like the changefile-
        # presence step above) -- a PR is never blocked by growth in a file it
        # never touched, which used to happen whenever another already-merged PR
        # grew a shared module faster than the post-merge widen job below
        # could catch up.
        if: github.event_name == 'pull_request'
        run: python tools/check-module-size.py --changed-since ${{ github.event.pull_request.base.sha }}
      - name: Module size (hard cap + shrink-only baseline, full sweep)
        # Every tracked, non-test source module must stay within its line-count
        # cap, or its grandfathered ceiling for pre-existing offenders -- the
        # componentization failure that let queue.py reach ~7,200 lines had no
        # automated guard before this. See CONTRIBUTING.md § Code Style. Runs
        # unconditionally (push/workflow_dispatch too) so the full-tree state
        # this repo's own widen job and doc/watchdog tooling depend on is
        # never scoped away.
        if: github.event_name != 'pull_request'
        run: python tools/check-module-size.py
      - name: Module size guard tests
        run: python -m pytest -q tools/test_check_module_size.py
      - name: No agent-machines consuming-side packages in this repo
        # agent-machines packages declare a CONSUMING repo's own desired
        # machine state (sometimes gated down to a literal machine name);
        # that content belongs exclusively in the repo that adopts the
        # pattern (e.g. the facility's own private control repo), never in
        # copilot-extensions itself -- this repo is public and has no
        # machine of its own to converge. See the guard's own docstring for
        # the live incident that motivated it.
        run: python tools/check-no-agent-machines-packages.py
      - name: No agent-machines consuming-side packages guard tests
        run: python -m pytest -q tools/test_check_no_agent_machines_packages.py
      - name: Module health watchdog tests
        run: python -m pytest -q tools/test_module_health_watchdog.py
      - name: CI failure watchdog tests
        # promotion-failure-reactive-fix-agent effort, Phase 1: the
        # detect+dedup reporting logic validate-and-promote.yml's own
        # report-failure job depends on.
        run: python -m pytest -q tools/test_ci_failure_watchdog.py
      - name: Install contract
        run: python tools/check-install-contract.py
      - name: Install contract guard tests
        run: python -m pytest -q tools/test_check_install_contract.py
      - name: Installer-engine vendoring sync guard tests
        run: python -m pytest -q tools/test_sync_installer_engine.py
      - name: Runtime resolution (marker-only, uniform)
        # Every versioned-runtime plugin must resolve its interpreter the one
        # uniform marker-only way (uniform-runtime-resolution, #765): the
        # junction-free current-version -> last-known-good -> newest-complete-slot
        # chain, never a `.venv`/`venv` link and never a PATH python. --strict
        # fails the build on any regression now that the migration has landed.
        run: python tools/check-runtime-resolution.py --strict
      - name: Marketplace isolation inventory (report-only)
        # Phase 1 of #1096 inventories legacy unqualified roots, generic global
        # plugin commands, PATH-based sibling launches, fixed lifecycle
        # identities, and operative bare commands. It becomes strict only after
        # the producing migration phases have landed.
        run: python tools/check-marketplace-isolation.py
      - name: Marketplace isolation guard tests
        run: python -m pytest -q tools/test_check_marketplace_isolation.py
      - name: Agent Bridge contract registry
        run: python tools/check-agent-bridge-contracts.py
      - name: Agent Bridge contract source coverage (PR diff only)
        if: github.event_name == 'pull_request'
        run: python tools/check-agent-bridge-contracts.py --base ${{ github.event.pull_request.base.sha }}
      - name: Agent Bridge contract registry guard tests
        run: python -m pytest -q tools/test_check_agent_bridge_contracts.py
      - name: Git hook interpreter tests
        run: python -m pytest -q tools/test_hook_interpreter.py
      - name: Payload invocation generated files
        run: python libs/payload-invocation/generate.py --all --check
      - name: Payload invocation foundation tests
        run: >-
          python -m pytest -q
          libs/payload-invocation/tests
          plugins/agent-index/tests/test_command_catalog.py
      - id: installation-context
        name: Detect installation-context changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base"...HEAD | grep -Eq \
            '^(libs/installation-context/|plugins/(agent-codespaces|agent-containers|agent-index|agent-machines|agent-worktrees)/scripts/installation-context/|tools/sync-installation-context.py$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Installation context contract smoke
        if: steps.installation-context.outputs.run == 'true'
        run: >-
          python -m pytest -q --durations=25
          -m installation_context_smoke
          libs/installation-context/tests
      - name: Installation context vendoring
        run: python tools/sync-installation-context.py --check
      - name: Same-cell peer launcher vendoring
        run: >-
          python tools/sync-peer-launch.py --check &&
          python -m pytest -q libs/peer-launch/tests
      - name: Installer readiness contract tests
        run: python -m pytest -q libs/installer-readiness/tests
      - name: Vendored library synchronization
        run: python tools/check-vendored-libs-sync.py
      - name: Windows headless launch invariants
        run: >-
          python tools/check-headless-launch.py &&
          python -m pytest -q tools/test_check_headless_launch.py
      - name: Hook process hygiene
        # PowerShell command hooks already run inside PowerShell. Spawning a
        # second interpreter can surface Default Terminal windows on Windows.
        run: python tools/check-hook-process-hygiene.py
      - name: Skills
        run: python tools/check-skills.py
      - name: Docs consistency
        run: python tools/check-docs-consistency.py
      - name: Runbook references
        run: python tools/check-runbook-references.py
      - name: Trusted self-hosted CI contract
        run: >-
          python tools/check-trusted-ci.py &&
          python -m pytest -q tools/test_check_trusted_ci.py
      - name: Feed neutrality (no hardcoded public package-feed pins)
        # No config/Dockerfile/install-script/CI-workflow file may hardcode a
        # public package-feed URL (pypi.org, registry.npmjs.org,
        # download.pytorch.org, ...) as the only usable endpoint -- this repo
        # runs on machines whose default feed is network-blocked and replaced
        # with an internal mirror. See #2389 / tools/clean-room's
        # --block-public-feeds mode, which reproduces that condition.
        run: >-
          python tools/check-feed-neutrality.py &&
          python -m pytest -q tools/test_check_feed_neutrality.py
      - name: Asyncio timeout handlers (Python 3.10 daemon)
        # The agent-bridge daemon venv is pinned to Python 3.10 (uv venv
        # --python 3.10), where asyncio.wait_for raises asyncio.TimeoutError --
        # NOT the builtin TimeoutError. Flag any wait_for whose handler names the
        # builtin TimeoutError without asyncio.TimeoutError, so the class of bug
        # behind dotfiles#1549 cannot recur unseen (dev-box/CI are 3.11/3.12).
        run: python tools/check-asyncio-timeout-handlers.py
      - name: Internal-identifier guard (PR diff only)
        # Public repo: the denylist is never committed. When the FORBIDDEN_IDS
        # secret is configured this enforces that a PR introduces no forbidden
        # identifier -- scoped to the PR diff (never the whole tree, which would
        # trip on pre-existing content; see the guard's own #541). No-op unless
        # the secret is set. Only meaningful on a PR, so skipped otherwise.
        if: github.event_name == 'pull_request'
        env:
          COPILOT_EXTENSIONS_FORBIDDEN_IDS: ${{ secrets.FORBIDDEN_IDS }}
        run: python tools/check-no-internal-identifiers.py --base ${{ github.event.pull_request.base.sha }}
      - name: Ruff (F, E9)
        run: ruff check --select F,E9 --output-format=github .
      - name: JS unit tests (node --test)
        # JS-only plugins (e.g. context-handoff) ship node --test suites under
        # plugins/<name>/tests/*.test.mjs -- there is no pytest suite to carry
        # them. Run any that exist; a clean no-op when there are none, so this
        # step costs nothing until a plugin adds JS tests.
        #
        # context-handoff's crash-diagnostics.test.mjs deliberately keeps its
        # own required-CI footprint to a small, always-run smoke contract
        # (cheap subprocess cases only); its POSIX-toolchain-dependent attack
        # simulations and its 1 MiB rotation fixture self-gate behind
        # CONTEXT_HANDOFF_CRASH_DIAGNOSTICS_STRESS (unset here, so those cases
        # skip unconditionally in this lane) and only run in the
        # scheduled/dispatch `crash-diagnostics-stress.yml` workflow -- never
        # in required PR CI, regardless of what any given PR touches (an
        # earlier revision of this step instead set that env var whenever a
        # PR's diff touched plugins/context-handoff/, but per review that
        # still put a subprocess-heavy matrix in the required lane instead of
        # using a focused/scheduled split).
        run: |
          shopt -s nullglob
          suites=(plugins/*/tests/*.test.mjs)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "no JS test suites found; skipping"
            exit 0
          fi
          echo "running ${#suites[@]} JS test file(s): ${suites[*]}"
          node --test "${suites[@]}"

  windows-hooks:
    name: Git hooks (Windows)
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main'
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tools/test_hook_interpreter.py

  worktree-manager:
    name: worktree-manager (out-of-plugin)
    # The Worktree Manager is delivered OUTSIDE the plugin pipe, so the
    # per-plugin matrix below never runs its tests. This dedicated job gives it
    # real CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Test worktree-manager
        working-directory: worktree-manager
        run: uv run --extra dev pytest -q

  test-runner-linux:
    name: test runner (ubuntu-latest)
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Test runner admission and isolation
        env:
          PYTHONPATH: libs/single-instance-lease/src
        run: >-
          uv run --with pytest python -m pytest -q
          libs/single-instance-lease/tests/test_lease.py
          tools/test_run_plugin_tests.py

  test-runner-windows:
    name: test runner (windows-latest)
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Test runner admission and isolation
        env:
          PYTHONPATH: libs/single-instance-lease/src
        run: >-
          uv run --with pytest python -m pytest -q
          libs/single-instance-lease/tests/test_lease.py
          tools/test_run_plugin_tests.py

  discover:
    name: discover suites
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main')
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.set.outputs.smoke }}
      heavy: ${{ steps.set.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: set
        name: Resolve target plugins
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODE="--changed --base ${{ github.event.pull_request.base.sha }}"
          else
            MODE="--all"
          fi
          FULL=$(python tools/run-plugin-tests.py $MODE --list)
          SMOKE=$(python tools/run-plugin-tests.py $MODE --exclude "$HEAVY_PLUGIN" --list)
          echo "Full set:  $FULL"
          echo "Fast set:  $SMOKE"
          echo "smoke=$SMOKE" >> "$GITHUB_OUTPUT"
          if echo "$FULL" | python -c "import json,sys,os; sys.exit(0 if os.environ['HEAVY_PLUGIN'] in json.load(sys.stdin) else 1)"; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: ${{ matrix.plugin }}
    needs: discover
    if: needs.discover.outputs.smoke != '[]' && needs.discover.outputs.smoke != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.smoke) }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Agent Bridge contract provenance
        if: matrix.plugin == 'agent-bridge'
        run: git fetch --no-tags --prune --unshallow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Test ${{ matrix.plugin }}
        run: python tools/run-plugin-tests.py ${{ matrix.plugin }}
      - name: Test shared SSH proxy contracts
        if: matrix.plugin == 'agent-bridge'
        env:
          PYTHONPATH: plugins/agent-bridge/libs/ssh-manager/src
        run: >-
          .test-venvs/linux/agent-bridge/bin/python -m pytest -q
          libs/ssh-manager/tests/test_process.py
          libs/ssh-manager/tests/test_proxy.py

  worktrees-smoke:
    name: agent-worktrees (collect-only)
    needs: discover
    if: needs.discover.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Collect-only smoke for ${{ env.HEAVY_PLUGIN }}
        run: python tools/run-plugin-tests.py "$HEAVY_PLUGIN" --collect-only

  worktrees-windows-launch:
    name: agent-worktrees (Windows launch)
    needs: discover
    if: needs.discover.outputs.heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install psmux
        shell: pwsh
        run: |
          $version = "3.3.8"
          $archive = Join-Path $env:RUNNER_TEMP "psmux.zip"
          $destination = Join-Path $env:RUNNER_TEMP "psmux"
          Invoke-WebRequest `
            "https://github.com/psmux/psmux/releases/download/v$version/psmux-v$version-windows-x64.zip" `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = "1ad127ba937194a890b933a73d9b023e297bd73dc742abd841bf159984c2effe"
          if ($actual -ne $expected) {
            throw "psmux archive checksum mismatch"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $psmux = Get-ChildItem -LiteralPath $destination -Filter psmux.exe -Recurse |
            Select-Object -First 1
          if (-not $psmux) {
            throw "psmux.exe not found in release archive"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH `
            -Value $psmux.DirectoryName `
            -Encoding utf8
      - name: Start psmux test session
        shell: pwsh
        run: >-
          psmux new-session -d -s aw-ci --
          powershell.exe -NoProfile -Command "Start-Sleep -Seconds 300"
      - name: Test Windows status-loop launch
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          -k status_daemon_console_root_contains_psmux_descendants
      - name: Stop psmux test session
        if: always()
        shell: pwsh
        run: |
          if (Get-Command psmux -ErrorAction SilentlyContinue) {
            psmux kill-session -t aw-ci 2>$null
          }
          exit 0

  full:
    name: full - ${{ matrix.plugin }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - agent-bridge
          - agent-codespaces
          - agent-containers
          - agent-dispatch
          - agent-logger
          - agent-mcp
          - agent-ssh
          - agent-vault
          - agent-worktrees
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Full suite - ${{ matrix.plugin }}
