  archive-sources-windows:
    name: archive sources (windows-latest)
    needs: discover
    if: contains(fromJson(needs.discover.outputs.smoke || '[]'), 'agent-logger')
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
