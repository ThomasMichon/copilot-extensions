          python tools/run-plugin-tests.py agent-logger
          -k "sessions or session_zip or source_roots or source_publication or chronicle"

  discover:
    name: discover suites
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.promotion_run != '') &&
      (github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main')
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.set.outputs.smoke }}
      heavy: ${{ steps.set.outputs.heavy }}
      standalone_service: ${{ steps.set.outputs.standalone_service }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: set
        name: Resolve target plugins
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODE="--changed --base ${{ github.event.pull_request.base.sha }}"
            if git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- \
              services/index/ plugins/agent-index/ libs/ tools/ \
              .github/workflows/ci.yml .github/workflows/validate-and-promote.yml; then
              echo "standalone_service=false" >> "$GITHUB_OUTPUT"
            else
              echo "standalone_service=true" >> "$GITHUB_OUTPUT"
            fi
          else
            MODE="--all"
            echo "standalone_service=true" >> "$GITHUB_OUTPUT"
          fi
          FULL=$(python tools/run-plugin-tests.py $MODE --list)
          SMOKE=$(python tools/run-plugin-tests.py $MODE --exclude "$HEAVY_PLUGIN" --list)
          echo "Full set:  $FULL"
          echo "Fast set:  $SMOKE"
          echo "smoke=$SMOKE" >> "$GITHUB_OUTPUT"
          if echo "$FULL" | python -c "import json,sys,os; sys.exit(0 if os.environ['HEAVY_PLUGIN'] in json.load(sys.stdin) else 1)"; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: ${{ matrix.plugin }}
    needs: discover
    if: needs.discover.outputs.smoke != '[]' && needs.discover.outputs.smoke != ''
    runs-on: ubuntu-latest
    # Index setup plus its passing split suites exceeded eight minutes;
    # retain the ordinary bound for every other plugin.
    timeout-minutes: ${{ (matrix.plugin == 'agent-dispatch' || matrix.plugin == 'agent-index') && 12 || 8 }}
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.smoke) }}
