# Main-owned metadata only. Source PR CI lives in the reviewed Dev declaration.
# The owning promotion's source-units job is the release's sole test execution.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROMOTION_UNIT_PROFILE: copilot-extensions.main-metadata/v1

jobs:
  main-metadata:
    name: Main metadata only - not unit qualification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Identify the release without replaying validation
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          printf 'Main snapshot: %s\n' "$RELEASE_SHA"
          echo "No tests execute here. Release qualification belongs to the owning promotion's source-units receipt."
