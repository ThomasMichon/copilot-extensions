# Unit-only PR testing. Integration remains in periodic container lanes.
# Push CI admits source metadata; promotion executes its unit coverage once.
name: CI
on:
  pull_request:
    branches-ignore:
    - main
    types:
    - opened
    - reopened
    - synchronize
    - edited
  push:
    branches:
    - main
    - dev
  workflow_dispatch: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
permissions:
  contents: read
env:
  PROMOTION_UNIT_PROFILE: copilot-extensions.promotion-units/v1
jobs:
  checks:
    name: guards + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v9.0.0
      with:
        version: 0.12.6
    - name: Install tooling
      run: python tools/seasoned_uv.py --uv uv -- --system pyyaml ruff packaging "setuptools>=83.0.0" wheel
    - id: dependency-age
      name: Detect dependency declaration and policy changes
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
        elif [ "${{ github.event_name }}" = "push" ]; then
          base="${{ github.event.before }}"
          head="HEAD"
        else
          echo "run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        elif git diff --name-only "$base" "$head" | grep -Eq \
          '(^|/)(pyproject\.toml|package(-lock)?\.json|[^/]*requirements[^/]*\.txt)$|^tools/(check-dependency-age\.py|dependency_age\.py|seasoned_uv\.py|seasoned_public_feed\.py)$|^worktree-manager/scripts/picker-snapshot/install\.py$|^libs/installer-engine/|^\.github/(dependabot\.yml|workflows/ci\.yml)$'; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Seasoned dependency declarations
      if: steps.dependency-age.outputs.run == 'true'
      timeout-minutes: 5
      run: python tools/check-dependency-age.py
    - name: Version consistency
      run: python tools/check-version-consistency.py
    - name: Changefile presence (touched plugins must have a pending changefile; PR-into-dev only)
      if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev'
      run: python tools/check-changefile-presence.py --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}
    - name: Module size (hard cap + shrink-only baseline, PR diff only)
      if: github.event_name == 'pull_request'
      run: python tools/check-module-size.py --changed-since ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}
    - name: Module size (hard cap + shrink-only baseline, full sweep)
      if: github.event_name != 'pull_request'
      run: python tools/check-module-size.py
    - name: Large files (generous image cap, tight default cap, PR diff only)
      if: github.event_name == 'pull_request'
      run: python tools/check-large-files.py --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}
    - name: Large files (full sweep)
      if: github.event_name != 'pull_request'
      run: python tools/check-large-files.py --all
    - name: No agent-machines consuming-side packages in this repo
      run: python tools/check-no-agent-machines-packages.py
    - id: source-ast-impact
      name: Resolve source AST guard inputs
      timeout-minutes: 2
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        python - <<'PY'
        import json
        import os
        import subprocess
        from pathlib import Path
        import sys
        sys.path.insert(0, str(Path("tools").resolve()))
        from promotion_unit_contract import ci_requires_units
        needed = os.environ["EVENT"] != "pull_request" or ci_requires_units(
            os.environ["EVENT"], os.environ["BASE"], os.environ["HEAD"],
            subprocess.check_output,
        )
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write("run=" + str(needed).lower() + "\n")
        print(json.dumps({"run_source_ast_guards": needed}))
        PY
    - name: No sibling plugin writes tracking YAML directly
      if: steps.source-ast-impact.outputs.run == 'true'
      run: python tools/check-no-sibling-tracking-writes.py
    - name: Install contract
      run: python tools/check-install-contract.py
    - name: Runtime resolution (marker-only, uniform)
      run: python tools/check-runtime-resolution.py --strict
    - name: Marketplace isolation inventory (report-only)
      if: github.event_name != 'pull_request'
      run: python tools/check-marketplace-isolation.py
    - name: Agent Bridge contract registry
      run: python tools/check-agent-bridge-contracts.py
    - name: Agent Bridge contract source coverage (PR diff only)
      if: github.event_name == 'pull_request'
      run: python tools/check-agent-bridge-contracts.py --base ${{ github.event.pull_request.base.sha }}
    - name: Payload invocation generated files
      run: python libs/payload-invocation/generate.py --all --check
    - name: Installation context vendoring
      run: python tools/sync-installation-context.py --check
    - name: Bootstrap-killswitch guard vendoring
      run: python tools/sync-bootstrap-killswitch.py --check
    - name: Same-cell peer launcher vendoring
      run: python tools/sync-peer-launch.py --check
    - name: Vendored library synchronization
      run: python tools/check-vendored-libs-sync.py
    - name: Windows headless launch invariants
      if: steps.source-ast-impact.outputs.run == 'true'
      run: python tools/check-headless-launch.py
    - name: Picker inbox discipline
      run: python tools/check-picker-inbox-discipline.py
    - name: Hook process hygiene
      run: python tools/check-hook-process-hygiene.py
    - name: Skills
      run: python tools/check-skills.py
    - name: Changed effort and vision structure
      if: github.event_name == 'pull_request'
      run: python tools/check-effort-vision-structure.py --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}
    - name: Docs consistency
      run: python tools/check-docs-consistency.py
    - name: Runbook references
      run: python tools/check-runbook-references.py
    - name: Trusted self-hosted CI contract
      run: python tools/check-trusted-ci.py
    - name: gh-aw action pin guard
      run: python tools/check-gh-aw-action-pins.py
    - name: gh-aw compiler version guard
      run: python tools/check-gh-aw-compiler-version.py
    - name: Feed neutrality (no hardcoded public package-feed pins)
      run: python tools/check-feed-neutrality.py
    - name: Asyncio timeout handlers (Python 3.10 daemon)
      if: steps.source-ast-impact.outputs.run == 'true'
      run: python tools/check-asyncio-timeout-handlers.py
    - name: Ruff (F, E9)
      run: ruff check --select F,E9 --output-format=github .
  unit-tests:
    name: Eligible units with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.impact.outputs.run }}
      result: ${{ steps.units.outcome }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: impact
      timeout-minutes: 2
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        python - <<'PY'
        import json
        import os
        import subprocess
        from pathlib import Path
        import sys
        sys.path.insert(0, str(Path("tools").resolve()))
        from promotion_unit_contract import ci_requires_units
        needed = ci_requires_units(
            os.environ["EVENT"], os.environ["BASE"], os.environ["HEAD"],
            subprocess.check_output,
        )
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write("run=" + str(needed).lower() + "\n")
        print(json.dumps({"profile": "copilot-extensions.promotion-units/v1", "run_units": needed}))
        PY
    - uses: actions/setup-python@v5
      if: steps.impact.outputs.run == 'true'
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v9.0.0
      if: steps.impact.outputs.run == 'true'
      with:
        version: 0.12.6
    - name: Install seasoned unit tooling
      if: steps.impact.outputs.run == 'true'
      run: python tools/seasoned_uv.py --uv uv -- --system pytest "coverage>=7.7" packaging pyyaml
    - name: Execute only the positively admitted unit packet once
      id: units
      if: steps.impact.outputs.run == 'true'
      run: python tools/run-promotion-unit-tests.py --source-sha "$GITHUB_SHA" --output-dir "$RUNNER_TEMP/promotion-unit-evidence"
    - uses: actions/upload-artifact@v4
      if: steps.impact.outputs.run == 'true'
      with:
        name: promotion-unit-evidence
        path: ${{ runner.temp }}/promotion-unit-evidence/*
        if-no-files-found: error
        retention-days: 7
  pr-gate:
    name: PR gate (required check)
    if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main'
    needs:
    - checks
    - unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Require actual admitted unit evidence when selected
      env:
        RESULTS: ${{ toJson(needs) }}
      run: |
        python - <<'PY'
        import json
        import os
        rows = json.loads(os.environ["RESULTS"])
        if set(rows) != {"checks", "unit-tests"} or any(row["result"] != "success" for row in rows.values()):
            raise RuntimeError("source guard or unit-impact execution failed")
        outputs = rows["unit-tests"]["outputs"]
        selected = outputs.get("run")
        if selected not in ("true", "false"):
            raise RuntimeError("unit selection is missing or invalid")
        expected = "success" if selected == "true" else "skipped"
        if outputs.get("result") != expected:
            raise RuntimeError("selected units did not pass, or unselected work was executed")
        print("Required unit-only PR gate satisfied.")
        PY
