name: Validate and promote dev to main

# Phase 3 of the dev-branch-release-pipeline effort
# (ThomasMichon/copilot-extensions#3336): once CI goes green on `dev`, run
# the broader (target 10-30 min) steady test-suite validation, then --
# only if that validation genuinely passed for a genuine dev commit --
# generate a single wholesale-replace commit and land it on `main` -- never
# a merge of `dev` into `main` -- via tools/promote_release.py. See that
# effort's README (Plan > Phase 3/5) for the full design.
#
# Merged from two separate files (`validation-gate.yml` + `promote.yml`,
# ThomasMichon/copilot-extensions#3592) after #3567 and a same-day follow-up
# regression: the only reason `promote.yml` needed a fragile artifact
# upload/download hand-off for the validated commit SHA was that the two
# stages were separate workflows connected by `workflow_run`, which has no
# native way to pass job outputs across that boundary. As one workflow, the
# `promote` job below reads `needs.gate.outputs.sha` directly -- an ordinary
# same-run job output, always present, never subject to the `head_sha`/
# `head_branch` unreliability `workflow_run` events are documented to have.
# That whole failure class is now structurally impossible for this hop, not
# merely worked around.
#
# Trigger (redesigned 2026-09-29, see `promote-trigger.yml`): this workflow
# is now entered via `repository_dispatch` (from a separate, cheap,
# unthrottled outer workflow) or a human `workflow_dispatch` -- never
# directly by `workflow_run` any more. The direct `workflow_run:
# workflows: ["CI"]` trigger this workflow used to declare fired on every
# "CI" completion repo-wide (`ci.yml` runs on every `pull_request`, not
# just `dev` pushes, and `head_branch` can't be trusted to filter -- see
# `gate` below), which under this repo's real concurrent-PR volume starved
# the single-pending-slot concurrency group below: 10+ consecutive runs in
# a ~20 minute window all declined to promote, confirmed live 2026-09-29
# while chasing why a merged PR hadn't reached `main`.
#
# A first attempt fixed the starvation by moving concurrency down to just
# the `promote` job, letting `full`/`worktree-manager`/`guards-full-sweep`
# run unrestricted -- but review correctly caught that this reopened two
# real invariants the ORIGINAL whole-run serialization existed to provide:
# (1) two different `dev` commits' validations could now finish out of
# order, and `tools/promote_release.py` has no monotonic stale-candidate
# guard -- an older, slower-validating commit's `promote` step could run
# AFTER a newer one's and silently regress `main`; (2) `report-failure`'s
# watchdog does a non-atomic issue lookup-then-create, and the former
# whole-run group was the only thing preventing duplicate tracking issues /
# duplicate fix-agent dispatches on concurrent failures (see
# efforts/active/promotion-failure-reactive-fix-agent/README.md:713-728).
#
# A second attempt tried moving the whole trigger to `workflow_dispatch`
# and having the outer gate call `gh workflow run` -- also wrong, and more
# dangerous: per GitHub's own docs (Events that trigger workflows table),
# `workflow_dispatch` resolves `GITHUB_SHA`/the workflow YAML itself from
# WHICHEVER REF IS DISPATCHED, not the default branch -- unlike
# `workflow_run` (and `repository_dispatch`), which both always resolve
# from `main` regardless of what triggered them. Making this workflow
# `workflow_dispatch`-only would have meant a `dev`-branch copy of this
# very file (a zero-review-required branch) became fully executable,
# including the `promote` job's `APERTURE_RELEASE_TOKEN` secret access --
# exactly the untrusted-YAML risk `report-failure`'s own comment already
# flags for a narrower case, reopened for the whole workflow.
#
# The actual fix: `repository_dispatch` shares `workflow_run`'s
# default-branch-only YAML resolution (confirmed against GitHub's docs,
# not assumed), so `promote-trigger.yml` -- itself still `workflow_run`-
# triggered and cheap/unrestricted -- does the ancestry filter and fires a
# `repository_dispatch` event carrying the validated sha only once it's
# confirmed. This fixes the starvation at its actual source (the raw
# CI-completion firehose never reaches this workflow's own concurrency
# group at all any more) while leaving every job and invariant below
# completely unchanged: `gate` still independently re-verifies ancestry
# (defense-in-depth -- never trust the dispatch payload alone, and a human
# `workflow_dispatch` still needs the same proof against whatever ref they
# ran it on), and the SAME single workflow-level concurrency group still
# serializes the entire validate+promote+report run, preserving both the
# promote-ordering guarantee and `report-failure`'s dedup invariant.
#
# Concurrency: a single top-level group (see below) makes the ENTIRE run --
# validation AND promotion together -- one atomic unit in GitHub's queue.
# With `cancel-in-progress: false`, this is GitHub's documented
# `queue: single` default: at most one (validate+promote) tuple running, at
# most one pending, and a newer trigger only ever cancels the *pending*
# tuple -- never the one currently running. A currently-running tuple always
# runs to completion (success or failure) before the next queued one starts;
# nothing is ever restarted mid-flight. This is a genuine rolling build, not
# the previous split design's "cancel and restart from zero" (`ci.yml`) or
# "full parallelism, no debounce" (the old per-commit validation-gate
# group) -- see the effort Journal entry that proposed this for the full
# reasoning. Now that only `promote-trigger.yml`'s already-filtered
# dispatches (or a human) ever enter this queue, the volume contending for
# it is low enough that this semantics is exactly right again.
on:
  repository_dispatch:
    types: [dev-advanced]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the generated commit + tag to main (default: true)"
        required: false
        default: "true"

concurrency:
  group: validate-and-promote-dev-to-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  gate:
    name: gate (confirm this is a dev commit)
    # This workflow is now `repository_dispatch`/`workflow_dispatch`-only
    # (see the header comment for the 2026-09-29 trigger redesign) --
    # `promote-trigger.yml` is the only automated caller, always
    # dispatching after its own `git merge-base --is-ancestor` proof
    # against `origin/dev`. This job re-proves the identical ancestry fact
    # rather than trusting that caller: a human can also dispatch this
    # workflow directly against any ref, and giving that path special trust
    # `promote-trigger.yml`'s own dispatches don't get would reopen the
    # exact "unreviewed branch promotes straight to main" gap this job's
    # own history (see below) already closed once.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_dev: ${{ steps.check.outputs.is_dev }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          # Resolve the candidate sha per trigger type, then apply the
          # IDENTICAL ancestor proof to all of them -- never trust a
          # dispatch payload alone. For `repository_dispatch`, deliberately
          # ignore `client_payload.sha` and re-resolve `origin/dev`'s LIVE
          # tip at THIS job's own run time instead (fixed after a live
          # review round, 2026-09-29 -- see the effort Journal): pinning to
          # the payload's specific sha reopened a liveness gap --
          # `promote-trigger.yml`'s own filter runs are deliberately
          # unthrottled, so an OLDER commit's dispatch can win
          # `validate-and-promote.yml`'s single-pending-slot race and
          # evict a NEWER commit's already-queued dispatch entirely; the
          # monotonic guard in `tools/promote_release.py` then correctly
          # no-ops on that stale payload, but nothing re-queues the evicted
          # newer commit -- `main` could lag behind indefinitely if no
          # further push ever happens to trigger a fresh dispatch.
          # Resolving `origin/dev`'s tip fresh, right here, sidesteps the
          # whole class of problem: ANY dispatch, stale or not, that
          # reaches this point ends up validating and promoting whatever
          # `dev` actually is *right now* -- an evicted/stale dispatch is
          # never lost, because whichever dispatch happens to trigger this
          # job next always converges on the same, freshest target. This
          # is the same "wholesale-replace catches up everything
          # accumulated" philosophy this whole pipeline already relies on,
          # just applied one hop earlier. `workflow_dispatch`'s own
          # `github.sha` is unchanged (whatever ref a human dispatched
          # against) -- previously short-circuited straight to
          # `is_dev=true` for it, never verified against `dev` at all --
          # safe only by accident, because every downstream promotion call
          # hard-coded `origin/dev` regardless of this job's own `sha`
          # output. Once promotion started trusting `sha` (see the
          # `promote` job's `DEV_SHA`), an operator manually dispatching
          # this workflow from an unreviewed feature/PR branch could
          # promote that branch's own unreviewed content straight to
          # `main`. Requiring the same `git merge-base --is-ancestor`
          # proof for every trigger closes that gap regardless of who/what
          # dispatched this run.
          git fetch origin dev
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            sha="$(git rev-parse origin/dev)"
          else
            sha="${{ github.sha }}"
          fi
          if git merge-base --is-ancestor "$sha" origin/dev; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$sha is not on origin/dev's history -- skipping (workflow_dispatch was run against a non-dev ref, or an unexpected repository_dispatch payload)."
          fi

  full:
    name: full - ${{ matrix.plugin }}
    needs: gate
    if: needs.gate.outputs.is_dev == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - agent-bridge
          - agent-codespaces
          - agent-containers
          - agent-dispatch
          - agent-logger
          - agent-mcp
          - agent-ssh
          - agent-vault
          - agent-worktrees
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.sha }}
      - name: Ensure full history is actually present
        # actions/checkout's fetch-depth: 0 is unreliable when combined with
        # an explicit detached-commit-sha ref (as this job needs, to pin to
        # the exact commit `gate` already validated rather than whatever
        # dev's tip has moved to since) -- confirmed live: agent-bridge's
        # test_session_host_fixture_matches_generation_one (a `git show
        # <historical-sha>:path` test) still failed with the same shallow-
        # clone error even with fetch-depth: 0 set (actions/checkout#1515:
        # an explicit SHA ref can silently produce a single-commit shallow
        # clone regardless of fetch-depth). The prior fix here
        # (`git fetch --prune --unshallow || true`) was itself broken: run
        # against an already-complete clone, `--unshallow` errors out
        # ("does not make sense on a complete repository") and the bare
        # `|| true` silently swallowed that, so the step never actually did
        # anything. Only unshallow when the clone genuinely is shallow, and
        # always also register every remote branch explicitly -- an SHA-ref
        # checkout may leave `origin/*` remote-tracking refs entirely
        # unpopulated, which an unshallow alone would not fix either.
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --prune --unshallow
          fi
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Full suite - ${{ matrix.plugin }}
        run: python tools/run-plugin-tests.py ${{ matrix.plugin }}
      - name: Coverage baseline - ${{ matrix.plugin }} (pilot plugins only)
        # Phase 1 pilot (efforts/active/coverage-guided-ci): coverage
        # collection is wired for one plugin at a time, starting with
        # agent-ssh (smallest in this matrix, 16 test files, but still a
        # real dependency-having plugin -- proves the `project_dir`
        # editable-install path, not just a dependency-free script
        # plugin). Independent of, and in addition to, the trusted
        # `run-plugin-tests.py` run above -- this step's own failure never
        # fails this job (see `continue-on-error` below): a baseline is
        # optional evidence relative to `run-plugin-tests.py`'s own real
        # test outcome, but the `promote` job's own "Verify enrolled
        # coverage baselines were actually collected" step makes an
        # ENROLLED plugin's baseline a hard requirement regardless -- keep
        # this `if:` condition's plugin list in exact sync with that step's
        # own list. Expand both lists together as later pilots prove out.
        if: matrix.plugin == 'agent-ssh'
        continue-on-error: true
        run: |
          python tools/coverage_guided_selection/baseline.py \
            "plugins/${{ matrix.plugin }}/tests" \
            --cov-source "plugins/${{ matrix.plugin }}/src/agent_ssh" \
            --plugin "${{ matrix.plugin }}" \
            --project-dir "plugins/${{ matrix.plugin }}" \
            --measured-commit "${{ needs.gate.outputs.sha }}" \
            --out "coverage-baseline-${{ matrix.plugin }}.json"
      - name: Upload coverage baseline - ${{ matrix.plugin }}
        if: matrix.plugin == 'agent-ssh'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline-${{ matrix.plugin }}
          path: coverage-baseline-${{ matrix.plugin }}.json
          if-no-files-found: ignore
          retention-days: 7

  worktree-manager:
    name: worktree-manager (out-of-plugin, full)
    needs: gate
    if: needs.gate.outputs.is_dev == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.sha }}
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Test worktree-manager
        working-directory: worktree-manager
        run: uv run --extra dev pytest -q

  guards-full-sweep:
    name: guards (full-tree, non-PR-scoped)
    needs: gate
    if: needs.gate.outputs.is_dev == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest pyyaml ruff
      - name: Module size (full sweep, unconditional)
        run: python tools/check-module-size.py
      - name: Version consistency
        run: python tools/check-version-consistency.py
      - name: Vendored library synchronization
        run: python tools/check-vendored-libs-sync.py
      - name: Docs consistency
        run: python tools/check-docs-consistency.py

  report-failure:
    name: report failure (Phase 1 watchdog; detection + dedup only, no fix attempt)
    # Phase 1 of the promotion-failure-reactive-fix-agent effort
    # (efforts/active/promotion-failure-reactive-fix-agent/README.md):
    # detect + dedup a red dev validation run and file/comment a tracking
    # issue -- never attempts a fix.
    #
    # `always()` is REQUIRED here, not optional: GitHub Actions silently ANDs
    # an implicit `success()` onto any job's `if:` unless the expression
    # itself calls a status-check function (`always()`/`failure()`/
    # `success()`/`cancelled()`) -- confirmed via review, this job would
    # otherwise never fire on the exact red run it exists to report, since
    # `full`/`worktree-manager`/`guards-full-sweep` genuinely failing is
    # precisely the case the implicit success() check would skip. This
    # mirrors why `promote` below needs its own `always()` for the same
    # reason.
    #
    # `repository_dispatch`-only, deliberately: `workflow_dispatch` loads
    # the ENTIRE workflow YAML from the dispatched ref (unlike
    # `repository_dispatch`, which -- per GitHub's own docs -- always
    # resolves the workflow file from the default branch, same as the
    # `workflow_run` trigger this job originally relied on before the
    # 2026-09-29 trigger redesign) -- so allowing a dispatch against `dev`
    # would make the whole job definition itself untrusted, not merely the
    # checked-out script. This job doesn't need manual triggering (it
    # exists to react automatically to real validation runs), so the fix is
    # to just never offer that path, rather than trying to harden a job
    # whose own YAML could be attacker-controlled.
    needs: [gate, full, worktree-manager, guards-full-sweep]
    if: >-
      always() &&
      github.event_name == 'repository_dispatch' &&
      needs.gate.outputs.is_dev == 'true' &&
      (needs.full.result == 'failure' ||
       needs.worktree-manager.result == 'failure' ||
       needs.guards-full-sweep.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      issues: write
    # `actions: write` (widened from `actions: read`) is required for the
    # final "Fire the fix-attempt agent" step below -- see that step's own
    # comment and the Phase 2 draft's leading comment block (blocking
    # issue #1) for why an explicit `workflow_dispatch` call, not the
    # watchdog's own `issues: labeled` event, is what actually invokes
    # `ci-failure-fix-attempt.md`'s compiled workflow.
    steps:
      - uses: actions/checkout@v4
        # Deliberately NOT `ref: needs.gate.outputs.sha`: that's the
        # dev commit being diagnosed -- the very thing that just failed
        # validation -- and this job holds `issues: write` + `GH_TOKEN`.
        # Executing `tools/ci_failure_watchdog.py` FROM that untrusted
        # checkout would defeat the whole repository_dispatch/workflow_run
        # trust boundary (the same class of mistake `trusted-ci.yml` was
        # hardened against earlier this session): a compromised dev
        # commit's own copy of this very script could exfiltrate the
        # token or file arbitrary issues/comments.
        #
        # An EXPLICIT `ref:` naming the default branch is required, not
        # merely omitting `ref:` -- a bare checkout resolves differently
        # per trigger type: for `repository_dispatch`/`workflow_run` it
        # lands on the default branch, but a bare checkout under
        # `workflow_dispatch` would resolve to whichever ref was manually
        # dispatched -- moot for this job specifically now that its own
        # `if:` is `repository_dispatch`-only (see above), but naming the
        # default branch explicitly is correct and harmless defense-in-
        # depth regardless of trigger.
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure the tracking label exists
        # `gh issue create --label` fails outright if the label is missing;
        # `label create --force` is idempotent, matching
        # module-health-watchdog.yml's own pattern. GitHub label
        # descriptions are capped at 100 characters -- keep this one
        # under that or the step (and everything after it) fails outright.
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh label create ci-failure-signature
          --color 5319E7
          --description "Red dev validation failure signature; report-only watchdog (no fix attempted)"
          --force
      - name: Detect + dedup + report
        id: watchdog
        # Bootstrap gap: this is a NEW script, so it does not exist on the
        # default branch yet at the moment this PR first merges -- and
        # (unlike a workflow-file change) it cannot ride main-gate's
        # workflow-only bootstrap lane, since it isn't a workflow file.
        # It only reaches the default branch the normal way: the next
        # ordinary green dev->main promotion (any promotion, not
        # necessarily one about this script) carries the whole tree
        # across, same as every other file. Until then, degrade
        # gracefully instead of hard-failing the job on a missing file --
        # this is also a permanent safety net against any future
        # main/dev script-presence mismatch, not just this one-time gap.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f tools/ci_failure_watchdog.py ]; then
            echo "::notice::tools/ci_failure_watchdog.py not yet present on the default branch -- it reaches main via the next ordinary green promotion, same as any other file. Skipping this run's report rather than failing the job."
            exit 0
          fi
          python tools/ci_failure_watchdog.py \
            --run-id "${{ github.run_id }}" \
            --sha "${{ needs.gate.outputs.sha }}" \
            --file-issue
      - name: Fire the fix-attempt agent for any newly filed issue
        # Phase 2 (efforts/active/promotion-failure-reactive-fix-agent,
        # `.github/workflows/ci-failure-fix-attempt.md`) is triggered by
        # `label_command: ci-failure-signature`, which compiles to BOTH an
        # `issues: labeled` event trigger AND a `workflow_dispatch` trigger
        # with an `item_number` input. The `issues: labeled` event is the
        # one the watchdog's own `gh issue create --label` call above
        # produces -- but GitHub suppresses new workflow-triggering events
        # for content created by the default `GITHUB_TOKEN` (the same
        # anti-recursion class the `promote` job below already documents),
        # so that event will NEVER actually fire the fix-attempt workflow.
        # An explicit `gh workflow run` dispatch call, by contrast, is a
        # deliberate API invocation, not an automatically-generated event
        # -- gh-aw's own FAQ documents third parties (Jira, PagerDuty)
        # dispatching workflows this exact way -- so it is NOT subject to
        # that suppression. This step is that explicit dispatch.
        #
        # Only newly FILED issues are dispatched (never a dedup comment on
        # an already-tracked one -- `ci_failure_watchdog.py`'s own
        # `FILED_ISSUE_NUMBERS` list enforces this), so a recurring
        # in-window failure never re-triggers a fix attempt that may
        # already be in flight against the same issue.
        #
        # `always()` is REQUIRED here (real review finding, PR #3916): this
        # step's own default `if:` would otherwise implicitly AND in
        # `success()`, skipping the dispatch whenever the watchdog step
        # itself exits nonzero -- which `main()` can do for reasons
        # unrelated to the signature this step cares about (e.g. a LATER
        # failed job's log fetch failing) even after an EARLIER signature
        # was genuinely filed and its number already written to
        # `GITHUB_OUTPUT`. Losing the dispatch in that case would silently
        # strand a real new issue with no fix attempt.
        if: always() && steps.watchdog.outputs.filed_issue_numbers != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f .github/workflows/ci-failure-fix-attempt.lock.yml ]; then
            echo "::notice::ci-failure-fix-attempt.lock.yml not yet compiled/present on the default branch -- Phase 2 isn't wired live yet. Skipping dispatch."
            exit 0
          fi
          for NUM in ${{ steps.watchdog.outputs.filed_issue_numbers }}; do
            echo "::notice::Dispatching the fix-attempt agent for issue #$NUM"
            gh workflow run ci-failure-fix-attempt.lock.yml \
              --repo "${{ github.repository }}" \
              -f item_number="$NUM"
          done

  promote:
    name: Promote dev -> main
    needs: [gate, full, worktree-manager, guards-full-sweep]
    # `always()`: `full`/`worktree-manager`/`guards-full-sweep` are legitimately
    # `skipped` (not `success`) whenever `gate` found `is_dev == 'false'` --
    # the default implicit `if` (require every `needs` job to have succeeded)
    # would skip THIS job too in that case, when what we actually want is to
    # run the `decide` step below and log why promotion isn't happening.
    if: always()
    runs-on: ubuntu-latest
    environment: main-promotion
    # Environment gating (configured 2026-09-25, repo Settings, not this
    # file): `main-promotion` restricts its deployment_branch_policy to
    # protected branches only (`dev`/`main`) and deliberately carries NO
    # required reviewer -- a required reviewer would pause every real,
    # fully-unattended promotion run waiting on a manual click, which
    # would defeat the whole point of this pipeline.
    #
    # **Migration complete (confirmed live, 2026-09-29):**
    # `APERTURE_RELEASE_TOKEN` is now an ENVIRONMENT secret scoped to
    # `main-promotion` (the repository-level copy has been removed;
    # `gh secret list` no longer shows it) -- the scratch-branch variant of
    # the risk described below is closed: a job that doesn't declare this
    # `environment:` genuinely cannot read the secret at all (confirmed by
    # the exact failure this caused in a sibling workflow,
    # `module-size-baseline-widen.yml`, until it also declared this same
    # `environment:`).
    #
    # **Still open -- the through-`dev` variant:** `dev` is
    # itself one of the two branches this policy allows (it has to be --
    # that's this job's own real ref), and `dev`'s ruleset requires zero
    # approving reviews to merge. A Write collaborator could still merge
    # an ordinary PR into `dev` adding a job that declares this same
    # `environment:` and reach the secret that way. Closing that fully
    # needs either a required reviewer here (ruled out -- breaks
    # unattended promotion) or `require_code_owner_review` on `dev`
    # itself (ruled out -- self-locks every workflow PR in this
    # single-operator repo). See the dev-branch-release-pipeline journal
    # for the full trade-off; this is a named, accepted residual risk,
    # not an oversight.
    #
    # `main` carries a zero-bypass "pull request required" ruleset (a
    # personal GitHub account cannot grant the GitHub Actions app -- or any
    # other actor -- a bypass the way an organization can), so this job can
    # never push to `main` directly. It pushes the generated commit to a
    # throwaway `release/promote-<run id>` branch instead, opens a PR
    # against `main`, and squash-merges it via the `gh` CLI (the same
    # sanctioned path every other change to this repo already lands
    # through) -- then tags the REAL, post-merge commit on `main` (a
    # squash-merge produces a new sha; the pre-merge candidate commit this
    # job built locally is never the thing that actually lands).
    #
    # Token: uses the `APERTURE_RELEASE_TOKEN` environment secret (scoped to
    # `main-promotion`; a fine-grained PAT scoped to this repo, Contents:
    # Read and write + Pull requests: Read and write), NOT the default
    # `github.token`. GitHub
    # never fires other workflow events (including `pull_request`) for
    # content pushed/authored with the default `GITHUB_TOKEN` -- a
    # documented anti-recursion safeguard -- so a `GITHUB_TOKEN`-authored
    # candidate PR never triggers `ci.yml`'s required `main source gate`
    # check and `gh pr merge --auto` sits permanently blocked (confirmed
    # live on the very first real --push run, #3533 -- had to be merged
    # with a manual admin bypass). A PAT-authored push/PR does trigger
    # downstream workflows normally, making the merge genuinely turn-key.
    #
    # Emergency rollback: `python tools/rollback_release.py pause --reason
    # "..." --push` BEFORE `revert --reason "..." --push` -- run by a human
    # operator with their own `gh` credentials (see
    # tools/rollback_release.py's own docstring), not from this workflow.
    # `tools/promote_release.py` itself refuses to run while paused, and
    # refuses to re-promote the exact `dev` state a rollback just reverted
    # (the non-incremental-update guard) unless `--force` is passed after
    # `dev` has moved forward with a real fix.
    env:
      GH_TOKEN: ${{ secrets.APERTURE_RELEASE_TOKEN }}
      CANDIDATE_BRANCH: release/promote-${{ github.run_id }}
    steps:
      - name: Decide whether this run should actually promote
        id: decide
        # Replaces both the artifact hand-off (#3567/#3578) and the old
        # cross-workflow "did Validation Gate's whole run succeed" check --
        # `needs.<job>.result`/`.outputs` are ordinary same-run facts, not
        # event metadata, so there is nothing left here to be unreliable.
        #
        # Deliberately NO `workflow_dispatch` special case any more: it
        # used to fast-path straight to `proceed=true`, skipping both
        # `gate.outputs.is_dev` and the `full`/`worktree-manager`/
        # `guards-full-sweep` result checks below entirely -- meaning a
        # manual dispatch could promote even when those validation jobs
        # failed (or, once `gate` started requiring ancestor proof for
        # dispatch too, ran with an EMPTY `sha`, since `full`/
        # `worktree-manager`/`guards-full-sweep` are skipped by their own
        # `if: needs.gate.outputs.is_dev == 'true'` whenever `gate` finds a
        # non-`dev` ref, but `decide` never checked that). Every trigger
        # now goes through the identical checks below -- manual dispatch
        # is for forcing a promotion RUN, never for bypassing what that
        # run validates.
        run: |
          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::gate job did not succeed (${{ needs.gate.result }}) -- skipping promotion."
            exit 0
          fi
          if [ "${{ needs.gate.outputs.is_dev }}" != "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a validated dev commit -- skipping promotion."
            exit 0
          fi
          # is_dev was true, so full/worktree-manager/guards-full-sweep were
          # NOT skipped by their own `if:` above -- they must have genuinely
          # run and succeeded, or we refuse to promote unvalidated content.
          for r in "${{ needs.full.result }}" "${{ needs.worktree-manager.result }}" "${{ needs.guards-full-sweep.result }}"; do
            if [ "$r" != "success" ]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "::error::Validation did not pass ($r) -- refusing to promote."
              exit 0
            fi
          done
          echo "proceed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.APERTURE_RELEASE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git identity for the generated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Download coverage baselines (pilot plugins only; best-effort)
        if: steps.decide.outputs.proceed == 'true'
        # Not every promotion run has a baseline artifact yet (only the
        # pilot plugin(s) in `full`'s own Coverage-baseline step produce
        # one, and that step is itself best-effort / continue-on-error) --
        # `actions/download-artifact` has no built-in "zero matches is
        # fine" mode for `pattern`, so this step tolerates that itself
        # rather than failing the whole promotion over optional evidence.
        # The NEXT step enforces the real guarantee: any plugin actually
        # enrolled in collection must have produced one, or promotion fails
        # loudly -- this step alone never silently drops that requirement.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: coverage-baseline-*
          path: coverage-baselines
          merge-multiple: true
      - name: Verify enrolled coverage baselines were actually collected
        if: steps.decide.outputs.proceed == 'true'
        # Review finding (PR #4902): `continue-on-error: true` on both the
        # `full` job's own collection step and this job's download step
        # above means every failure point along the way is individually
        # soft -- without this check, collection failing, the artifact
        # never existing, or the download failing would all silently
        # result in promotion succeeding with no baseline recorded at all,
        # defeating the "correlation loop never silently breaks" Behavior
        # for a plugin that IS supposed to have one. This is the one hard
        # gate: an ENROLLED plugin's baseline is REQUIRED, never optional --
        # only a plugin not yet in this list is allowed to have none.
        #
        # Keep this list in exact sync with `full` job's own
        # `if: matrix.plugin == '...'` collection-step condition above --
        # that's the single other place a plugin gets "enrolled".
        run: |
          missing=()
          for plugin in agent-ssh; do
            if [ ! -f "coverage-baselines/${plugin}.json" ]; then
              missing+=("$plugin")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Enrolled plugin(s) missing a collected coverage baseline this run: ${missing[*]} -- refusing to promote without the evidence these plugins are supposed to produce."
            exit 1
          fi
      - name: Promote (push a candidate branch; report-only if push=false)
        id: promote
        if: steps.decide.outputs.proceed == 'true'
        env:
          PUSH_INPUT: ${{ github.event.inputs.push }}
          # Pin to the EXACT commit `gate` validated as a real `dev`
          # ancestor -- the same commit `full`/`worktree-manager`/
          # `guards-full-sweep` checked out and tested -- never a fresh
          # re-resolve of `origin/dev`. This job's own checkout above only
          # fetches (`ref: main` + full history); it never re-runs gate's
          # ancestor check. `full`/`worktree-manager`/`guards-full-sweep`
          # are a genuine 10-30 min validation window by this workflow's
          # own design (see top-of-file comment) -- if new commits (and
          # new changefiles) land on `dev` while those are still running,
          # a bare `origin/dev` re-resolved at THIS checkout would
          # silently be newer than what was validated, sweeping
          # never-validated changefiles into this promotion's consumed/
          # deleted set. Confirmed live: PR #4397 ("clear changefiles
          # consumed by promotion 36394331795") was initially misdiagnosed
          # as deleting two unconsumed changefiles -- that specific alarm
          # was a false positive (the wrong promotion commit was used for
          # comparison), but it surfaced this real structural gap: nothing
          # here actually pinned promotion to what `gate` validated.
          DEV_SHA: ${{ needs.gate.outputs.sha }}
          # `promote_release.py`'s own `measured_commit` consistency check
          # (see `_write_coverage_baselines_into_scratch`) refuses any
          # baseline not measured against this exact `DEV_SHA` -- a stale
          # artifact from a superseded run can never be silently checked
          # in by passing this directory, whether or not it's empty.
          COVERAGE_BASELINES_DIR: coverage-baselines
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$PUSH_INPUT" = "false" ]; then
            python tools/promote_release.py --dev-ref "$DEV_SHA" --main-ref origin/main \
              --coverage-baselines-dir "$COVERAGE_BASELINES_DIR"
            echo "land=false" >> "$GITHUB_OUTPUT"
          else
            python tools/promote_release.py --dev-ref "$DEV_SHA" --main-ref origin/main \
              --push --candidate-branch "$CANDIDATE_BRANCH" \
              --coverage-baselines-dir "$COVERAGE_BASELINES_DIR"
            echo "land=true" >> "$GITHUB_OUTPUT"
            # Consumed changefiles are no longer swept off `dev` by this
            # run: `purge-consumed-changefiles.yml` does that once daily
            # instead, reading `.github/release-pipeline-state.json` off
            # `main` after this run's own "Tag the real post-merge commit"
            # step below updates it -- see that workflow's top-of-file
            # comment for why decoupling the two is safe (bump computation
            # already ignores a changefile that existed at the last
            # recorded promotion's `dev_head`, regardless of whether it's
            # still physically present on `dev`).
          fi
      - name: Land the candidate branch on main via PR + squash-merge
        id: land
        if: steps.promote.outputs.land == 'true'
        run: |
          if ! git ls-remote --exit-code --heads origin "$CANDIDATE_BRANCH" > /dev/null; then
            echo "No candidate branch pushed (nothing to promote) -- skipping."
            echo "candidate_pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "candidate_pushed=true" >> "$GITHUB_OUTPUT"
          # `gh pr create` has no --json/--jq flags (those belong to `gh pr
          # view`/`gh pr list`); it prints the PR URL on success. Extract the
          # number from that URL instead of piping create straight into --jq
          # (confirmed live: this workflow's first real --push run failed
          # here with "unknown flag: --json").
          pr_url=$(gh pr create --base main --head "$CANDIDATE_BRANCH" \
            --title "release: promote dev to main ($CANDIDATE_BRANCH)" \
            --body "Generated by tools/promote_release.py. Do not edit by hand.")
          pr_number=$(basename "$pr_url")
          # `--auto` can race a PR that's already fully mergeable (no
          # pending required check/review left to wait on) and fail with
          # `GraphQL: Pull request is in clean status
          # (enablePullRequestAutoMerge)` -- confirmed live (run
          # 36242397956's changefile-cleanup PR, #3836, stuck open with
          # exactly this error, needing a manual merge). `main` normally
          # has a real pending check (`main source gate`) for `--auto` to
          # wait on, making this race rare but not impossible here too, so
          # apply the same safe fallback: retry as a direct merge, which
          # is exactly what "already clean" means it's safe to do.
          merge_out=$(gh pr merge "$pr_number" --squash --auto 2>&1) || {
            if echo "$merge_out" | grep -qi "is in clean status"; then
              echo "::notice::--auto raced an already-clean PR; merging directly instead."
              gh pr merge "$pr_number" --squash
            else
              echo "$merge_out" >&2
              exit 1
            fi
          }
      - name: Tag the real post-merge commit
        if: steps.promote.outputs.land == 'true' && steps.land.outputs.candidate_pushed == 'true'
        run: |
          git fetch origin main
          new_sha=$(git rev-parse origin/main)
          tag_name="promote-$(date -u +%Y%m%d%H%M%S)-${new_sha:0:8}"
          git tag -a "$tag_name" -m "release: promote dev to main ($CANDIDATE_BRANCH -> $new_sha)" "$new_sha"
          git push origin "$tag_name"
      # Note: consumed changefiles are no longer cleared here. See
      # `purge-consumed-changefiles.yml` (a standalone daily workflow) --
      # `promote_release.py`'s bump computation already ignores a
      # changefile that existed at the last recorded promotion's
      # `dev_head` in `.github/release-pipeline-state.json` on `main`,
      # regardless of whether it's still physically present on `dev`, so
      # decoupling deletion cadence from promotion cadence is safe.
