# Unit-only controller proposal; activation requires its independently reviewed Main transaction.
name: Validate and promote dev to main
on:
  repository_dispatch:
    types:
      - dev-advanced
  workflow_dispatch:
    inputs:
      push:
        description: Publish and land the exact candidate only after all release gates succeed
        required: false
        default: 'true'
      qualification_only:
        description: Manually qualify a replacement while preserving paused pipeline state
        required: false
        type: boolean
        default: false
concurrency:
  group: validate-and-promote-dev-to-main
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  gate:
    name: gate (confirm this is a dev commit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      is_dev: ${{ steps.pause.outputs.normal_paused == 'true' && 'false' || steps.check.outputs.is_dev }}
      sha: ${{ steps.check.outputs.sha }}
      qualification_only: ${{ steps.mode.outputs.qualification_only }}
      main_before: ${{ steps.pause.outputs.main_base }}
    steps:
      - name: Admit paused qualification only from a manual trusted-Main dispatch
        id: mode
        env:
          REQUESTED_QUALIFICATION_ONLY: ${{ inputs.qualification_only }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          RUN_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          case "$REQUESTED_QUALIFICATION_ONLY" in
            true)
              if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] ||
                 [ "$DEFAULT_REF" != "refs/heads/main" ] ||
                 [ "$GITHUB_REF" != "$DEFAULT_REF" ] ||
                 [ "$RUN_SHA" != "$WORKFLOW_SHA" ] ||
                 ! [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Paused qualification requires a manual dispatch of trusted Main."
                exit 1
              fi
              echo "qualification_only=true" >> "$GITHUB_OUTPUT"
              ;;
            false|"") echo "qualification_only=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Invalid qualification-only request."; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: '0'
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: reviewed-helpers
          persist-credentials: false
      - name: Respect paused Main before expensive source validation
        id: pause
        env:
          QUALIFICATION_ONLY: ${{ steps.mode.outputs.qualification_only }}
        run: |
          git fetch --no-tags origin main
          ADMITTED_MAIN="$(git rev-parse --verify refs/remotes/origin/main)"
          export ADMITTED_MAIN
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          main_base = os.environ["ADMITTED_MAIN"]
          if not re.fullmatch(r"[0-9a-f]{40}", main_base):
              raise RuntimeError("invalid admitted Main identity")
          result = subprocess.run(
              ["git", "show", f"{main_base}:.github/release-pipeline-state.json"],
              check=True, capture_output=True, text=True, timeout=30,
          )
          state = json.loads(result.stdout)
          if (
              not isinstance(state, dict)
              or state.get("schema") != "copilot-extensions.release-pipeline-state"
              or type(state.get("version")) is not int or state["version"] != 1
              or type(state.get("paused")) is not bool
          ):
              raise RuntimeError("invalid trusted Main pause state")
          qualification_only = os.environ["QUALIFICATION_ONLY"]
          if qualification_only not in ("true", "false"):
              raise RuntimeError("invalid qualification-only admission")
          normal_paused = state["paused"] and qualification_only == "false"
          promotion = state.get("last_promotion")
          released = promotion.get("dev_head") if isinstance(promotion, dict) else None
          if promotion is not None and (
              not isinstance(released, str) or not re.fullmatch(r"[0-9a-f]{40}", released)
          ):
              raise RuntimeError("invalid trusted Main source identity")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"normal_paused={str(normal_paused).lower()}\n")
              output.write(f"released_source={released or ''}\n")
              output.write(f"main_base={main_base}\n")
          if normal_paused:
              print("::notice::Main is paused; automatic source validation and promotion are deferred.")
          PY
      - name: Require the previous promotion PR to be terminal before new validation
        env:
          GH_TOKEN: ${{ github.token }}
        if: steps.pause.outputs.normal_paused != 'true'
        run: python -I -B reviewed-helpers/tools/promotion_lifecycle.py --repository "$GITHUB_REPOSITORY" --require-idle
      - name: Confirm the admitted source belongs to Dev
        id: check
        if: steps.pause.outputs.normal_paused != 'true'
        env:
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          QUALIFICATION_ONLY: ${{ steps.mode.outputs.qualification_only }}
          RELEASED_SOURCE: ${{ steps.pause.outputs.released_source }}
        run: |
          # Resolve the candidate sha per trigger type, then apply the
          # IDENTICAL ancestor proof to all of them -- never trust a
          # dispatch payload alone. For `repository_dispatch`, deliberately
          # ignore `client_payload.sha` and re-resolve `origin/dev`'s LIVE
          # tip at THIS job's own run time instead (fixed after a live
          # review round, 2026-09-29 -- see the effort Journal): pinning to
          # the payload's specific sha reopened a liveness gap --
          # `promote-trigger.yml`'s own filter runs are deliberately
          # unthrottled, so an OLDER commit's dispatch can win
          # `validate-and-promote.yml`'s single-pending-slot race and
          # evict a NEWER commit's already-queued dispatch entirely; the
          # monotonic guard in `tools/promote_release.py` then correctly
          # no-ops on that stale payload, but nothing re-queues the evicted
          # newer commit -- `main` could lag behind indefinitely if no
          # further push ever happens to trigger a fresh dispatch.
          # Resolving `origin/dev`'s tip fresh, right here, sidesteps the
          # whole class of problem: ANY dispatch, stale or not, that
          # reaches this point ends up validating and promoting whatever
          # `dev` actually is *right now* -- an evicted/stale dispatch is
          # never lost, because whichever dispatch happens to trigger this
          # job next always converges on the same, freshest target.
          # Manual dispatch from the trusted default-branch workflow also
          # resolves the live dev tip: its own generated main SHA is not
          # a dev ancestor. Other refs still undergo the ancestry proof,
          # but cannot enter the default-branch-only artifact signing job.
          # Manual dispatch previously short-circuited straight to
          # `is_dev=true` for it, never verified against `dev` at all --
          # safe only by accident, because every downstream promotion call
          # hard-coded `origin/dev` regardless of this job's own `sha`
          # output. Once promotion started trusting `sha` (see the
          # `promote` job's `DEV_SHA`), an operator manually dispatching
          # this workflow from an unreviewed feature/PR branch could
          # promote that branch's own unreviewed content straight to
          # `main`. Requiring the same `git merge-base --is-ancestor`
          # proof for every trigger closes that gap regardless of who/what
          # dispatched this run.
          git fetch origin dev
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ] || [ "$GITHUB_REF" = "$DEFAULT_REF" ]; then
            sha="$(git rev-parse origin/dev)"
          else
            sha="${{ github.sha }}"
          fi
          if git merge-base --is-ancestor "$sha" origin/dev; then
            if [ "$QUALIFICATION_ONLY" != "true" ] && [ "$sha" = "$RELEASED_SOURCE" ]; then
              echo "is_dev=false" >> "$GITHUB_OUTPUT"
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "::notice::This Dev source is already recorded on Main; no duplicate validation or promotion."
              exit 0
            fi
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$sha is not on origin/dev's history -- skipping (workflow_dispatch was run against a non-dev ref, or an unexpected repository_dispatch payload)."
          fi
      - name: Recheck automatic source retirement after queued admission
        if: github.event_name == 'repository_dispatch' && steps.check.outputs.is_dev == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC_SOURCE: ${{ steps.check.outputs.sha }}
          AUTOMATIC_MAIN: ${{ steps.pause.outputs.main_base }}
        run: python -I -B reviewed-helpers/tools/promotion_lifecycle.py --repository "$GITHUB_REPOSITORY" --require-idle --automatic-source "$AUTOMATIC_SOURCE" --automatic-main "$AUTOMATIC_MAIN"
      - name: Record immutable admitted source
        if: steps.check.outputs.is_dev == 'true' && (github.event_name != 'workflow_dispatch' || inputs.push != 'false')
        env:
          ADMITTED_SOURCE: ${{ steps.check.outputs.sha }}
          ADMITTED_MAIN: ${{ steps.pause.outputs.main_base }}
          ADMISSION_PATH: ${{ runner.temp }}/promotion-admission.json
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source, main = os.environ["ADMITTED_SOURCE"], os.environ["ADMITTED_MAIN"]
          if not all(re.fullmatch(r"[0-9a-f]{40}", value) for value in (source, main)):
              raise RuntimeError("invalid immutable admission inputs")
          record = {
              "schema": "copilot-extensions.promotion-source-admission", "version": 1,
              "source": source, "main_base": main,
              "run": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          if record["run"] <= 0 or record["attempt"] <= 0:
              raise RuntimeError("invalid immutable admission execution")
          Path(os.environ["ADMISSION_PATH"]).write_text(
              json.dumps(record, sort_keys=True) + "\n", encoding="utf-8",
          )
          PY
      - name: Upload immutable admitted source
        if: steps.check.outputs.is_dev == 'true' && (github.event_name != 'workflow_dispatch' || inputs.push != 'false')
        uses: actions/upload-artifact@v4
        with:
          name: promotion-admission-${{ steps.check.outputs.sha }}-${{ steps.pause.outputs.main_base }}
          path: ${{ runner.temp }}/promotion-admission.json
          if-no-files-found: error
  compose-candidate:
    name: Freeze the vendored and version-stamped release candidate
    needs: gate
    if: needs.gate.outputs.is_dev == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_sha: ${{ steps.freeze.outputs.candidate_sha }}
      tree: ${{ steps.freeze.outputs.tree }}
      prepared_at: ${{ steps.freeze.outputs.prepared_at }}
      composed: ${{ steps.freeze.outputs.composed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: '0'
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: reviewed-helpers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.6
      - name: Install seasoned composition tooling
        run: python reviewed-helpers/tools/seasoned_uv.py --uv uv -- --system packaging pyyaml
      - name: Compose once before authoritative release execution
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_SHA: ${{ needs.gate.outputs.sha }}
          MAIN_BEFORE: ${{ needs.gate.outputs.main_before }}
          QUALIFICATION_ONLY: ${{ needs.gate.outputs.qualification_only }}
        run: |
          git fetch origin dev main
          prepared_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          args=(--repo "$GITHUB_WORKSPACE" --dev-ref "$DEV_SHA" --main-ref "$MAIN_BEFORE"
            --promotion-time "$prepared_at" --prepare-candidate-dir "$RUNNER_TEMP/frozen-candidate")
          if [ "$QUALIFICATION_ONLY" = "true" ]; then args+=(--qualification-only); fi
          python reviewed-helpers/tools/promote_release.py "${args[@]}"
          if [ ! -f "$RUNNER_TEMP/frozen-candidate/candidate.json" ]; then
            echo "composed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "composed=true" >> "$GITHUB_OUTPUT"
          python - "$RUNNER_TEMP/frozen-candidate/candidate.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          record = json.loads(Path(sys.argv[1]).read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key in ("candidate_sha", "tree", "prepared_at"):
                  output.write(f"{key}={record[key]}\n")
          PY
      - name: Retain the exact frozen candidate for every downstream consumer
        if: steps.freeze.outputs.composed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frozen-promotion-candidate
          path: ${{ runner.temp }}/frozen-candidate/*
          if-no-files-found: error
          retention-days: 2
  source-units:
    name: Eligible source units with coverage
    needs:
      - gate
      - compose-candidate
    if: needs.gate.outputs.is_dev == 'true' && needs.compose-candidate.outputs.composed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      attempt: ${{ steps.producer.outputs.attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: '0'
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: reviewed-helpers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.12.6
      - name: Install seasoned unit tooling
        run: python tools/seasoned_uv.py --uv uv -- --system pytest "coverage>=7.7" packaging pyyaml
      - name: Retain source version and library policy admission
        run: |
          python tools/check-version-consistency.py
          python tools/check-vendored-libs-sync.py
      - uses: actions/download-artifact@v4
        with:
          name: frozen-promotion-candidate
          path: ${{ runner.temp }}/frozen-candidate
      - name: Import the frozen candidate without recomposition
        env:
          DEV_SHA: ${{ needs.gate.outputs.sha }}
          MAIN_BEFORE: ${{ needs.gate.outputs.main_before }}
          CANDIDATE_SHA: ${{ needs.compose-candidate.outputs.candidate_sha }}
        run: |
          python reviewed-helpers/tools/promotion_frozen_candidate.py \
            --repo "$GITHUB_WORKSPACE" --directory "$RUNNER_TEMP/frozen-candidate" \
            --dev-sha "$DEV_SHA" --main-before "$MAIN_BEFORE" \
            --candidate-sha "$CANDIDATE_SHA" \
            --checkout "$RUNNER_TEMP/candidate"
      - id: producer
        name: Record the actual unit-producing attempt
        run: printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Execute only the admitted candidate units once
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          CANDIDATE_TREE: ${{ needs.compose-candidate.outputs.tree }}
        run: |
          python "$RUNNER_TEMP/candidate/tools/run-promotion-unit-tests.py" \
            --source-sha "$SOURCE_SHA" --development-root "$GITHUB_WORKSPACE" \
            --candidate-tree "$CANDIDATE_TREE" --output-dir "$RUNNER_TEMP/promotion-unit-evidence"
      - id: upload
        name: Upload promotion unit evidence
        uses: actions/upload-artifact@v4
        with:
          name: promotion-unit-evidence
          path: ${{ runner.temp }}/promotion-unit-evidence/*
          if-no-files-found: error
          retention-days: 2
  build-python-artifacts:
    name: Build first-party Python artifacts without signing authority
    needs:
      - gate
      - compose-candidate
    if: needs.gate.outputs.is_dev == 'true' && needs.compose-candidate.outputs.composed == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      exported: ${{ steps.build.outputs.exported }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: reviewed-helpers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Provision hash-pinned metadata validator tooling for export validation
        run: |
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/artifact-validator"
          python reviewed-helpers/tools/seasoned_uv.py --registry-only --uv uv -- --python "$RUNNER_TEMP/artifact-validator/bin/python" \
            --no-config --only-binary :all: --require-hashes \
            --index-url "${ARTIFACT_VALIDATION_INDEX_URL:-https://pypi.org/simple}" -r reviewed-helpers/tools/artifact_validation_requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: frozen-promotion-candidate
          path: ${{ runner.temp }}/frozen-candidate
      - name: Build the frozen tested composition without release authority
        id: build
        env:
          DEV_SHA: ${{ needs.gate.outputs.sha }}
          MAIN_BEFORE: ${{ needs.gate.outputs.main_before }}
          CANDIDATE_SHA: ${{ needs.compose-candidate.outputs.candidate_sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/python-artifacts
          QUALIFICATION_ONLY: ${{ needs.gate.outputs.qualification_only }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_VERIFY_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev main
          "$RUNNER_TEMP/artifact-validator/bin/python" reviewed-helpers/tools/promotion_frozen_candidate.py \
            --repo "$GITHUB_WORKSPACE" --directory "$RUNNER_TEMP/frozen-candidate" \
            --dev-sha "$DEV_SHA" --main-before "$MAIN_BEFORE" \
            --candidate-sha "$CANDIDATE_SHA" \
            --build-artifacts "$ARTIFACT_DIR" --reuse-artifacts-repository "$GITHUB_REPOSITORY"
          if [ -f "$ARTIFACT_DIR/python-artifacts.json" ]; then
            echo "exported=true" >> "$GITHUB_OUTPUT"
          else
            echo "exported=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.exported == 'true'
        with:
          name: unsigned-promotion-python-artifacts
          path: ${{ runner.temp }}/python-artifacts/*
          if-no-files-found: error
          retention-days: '2'
  python-artifacts:
    name: Validate and attest first-party Python artifacts
    needs:
      - gate
      - build-python-artifacts
      - source-units
      - compose-candidate
    if: needs.gate.outputs.is_dev == 'true' && needs.compose-candidate.outputs.composed == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      exported: ${{ needs.build-python-artifacts.outputs.exported }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: reviewed-helpers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Provision hash-pinned metadata validator tooling from trusted sources
        run: |
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/artifact-validator"
          python reviewed-helpers/tools/seasoned_uv.py --registry-only --uv uv -- --python "$RUNNER_TEMP/artifact-validator/bin/python" \
            --no-config --only-binary :all: --require-hashes \
            --index-url "${ARTIFACT_VALIDATION_INDEX_URL:-https://pypi.org/simple}" -r reviewed-helpers/tools/artifact_validation_requirements.txt
      - uses: actions/download-artifact@v4
        if: needs.build-python-artifacts.outputs.exported == 'true'
        with:
          name: unsigned-promotion-python-artifacts
          path: ${{ runner.temp }}/python-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: frozen-promotion-candidate
          path: ${{ runner.temp }}/frozen-candidate
      - name: Validate untrusted bundles using qualified admitted-source helpers
        if: needs.build-python-artifacts.outputs.exported == 'true'
        env:
          DEV_SHA: ${{ needs.gate.outputs.sha }}
          CANDIDATE_SHA: ${{ needs.compose-candidate.outputs.candidate_sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/python-artifacts
          QUALIFICATION_ONLY: ${{ needs.gate.outputs.qualification_only }}
        run: |
          "$RUNNER_TEMP/artifact-validator/bin/python" reviewed-helpers/tools/promotion_frozen_candidate.py \
            --repo "$GITHUB_WORKSPACE" --directory "$RUNNER_TEMP/frozen-candidate" \
            --dev-sha "$DEV_SHA" --main-before "${{ needs.gate.outputs.main_before }}" \
            --candidate-sha "$CANDIDATE_SHA" \
            --validate-artifacts "$ARTIFACT_DIR"
      - name: Attest the validated index and every first-party bundle
        if: needs.build-python-artifacts.outputs.exported == 'true'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: ${{ runner.temp }}/python-artifacts/*
      - uses: actions/upload-artifact@v4
        if: needs.build-python-artifacts.outputs.exported == 'true'
        with:
          name: promotion-python-artifacts
          path: ${{ runner.temp }}/python-artifacts/*
          if-no-files-found: error
          retention-days: '2'
  report-failure:
    name: report failure (Phase 1 watchdog; detection + dedup only, no fix attempt)
    needs:
      - gate
      - source-units
      - build-python-artifacts
      - compose-candidate
      - python-artifacts
      - promote
      - qualify-candidate
      - publish-python-artifacts
      - merge-promotion
    if: "always() && github.event_name == 'repository_dispatch' && needs.gate.outputs.is_dev == 'true' && (\n needs.compose-candidate.result == 'failure' || needs.source-units.result == 'failure' || needs.build-python-artifacts.result == 'failure' ||\n needs.python-artifacts.result == 'failure' ||\n needs.promote.result == 'failure' ||\n needs.qualify-candidate.result == 'failure' ||\n needs.publish-python-artifacts.result == 'failure' ||\n needs.merge-promotion.result == 'failure')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '1'
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure the tracking label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create ci-failure-signature --color 5319E7 --description "Red dev validation failure signature; report-only watchdog (no fix attempted)" --force
      - name: Detect + dedup + report
        id: watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f tools/ci_failure_watchdog.py ]; then
            echo "::notice::tools/ci_failure_watchdog.py not yet present on the default branch -- it reaches main via the next ordinary green promotion, same as any other file. Skipping this run's report rather than failing the job."
            exit 0
          fi
          python tools/ci_failure_watchdog.py \
            --run-id "${{ github.run_id }}" \
            --sha "${{ needs.gate.outputs.sha }}" \
            --file-issue
      - name: Fire the fix-attempt agent for any newly filed issue
        if: always() && steps.watchdog.outputs.filed_issue_numbers != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FILED_ISSUE_NUMBERS: ${{ steps.watchdog.outputs.filed_issue_numbers }}
        run: |
          if [ ! -f .github/workflows/ci-failure-fix-attempt.lock.yml ]; then
            echo "::notice::ci-failure-fix-attempt.lock.yml not yet compiled/present on the default branch -- Phase 2 isn't wired live yet. Skipping dispatch."
            exit 0
          fi
          # Split issue IDs as words, never expand them as filesystem patterns.
          set -f
          for NUM in $FILED_ISSUE_NUMBERS; do
            if ! [[ "$NUM" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid filed issue number -- refusing dispatch."
              exit 1
            fi
          done
          if [ -z "${FILED_ISSUE_NUMBERS//[[:space:]]/}" ]; then
            echo "::notice::No newly filed issues -- skipping dispatch."
            exit 0
          fi
          WORKFLOW_API="repos/$REPO/actions/workflows/ci-failure-fix-attempt.lock.yml"
          STATE="$(gh api "$WORKFLOW_API" --jq .state)"
          case "$STATE" in
            active) ;;
            disabled_*)
              echo "::notice::Fix-attempt workflow is $STATE -- skipping all dispatches."
              exit 0
              ;;
            *)
              echo "::error::Unexpected fix-attempt workflow state: $STATE"
              exit 1
              ;;
          esac
          declare -A DISPATCHED=()
          for NUM in $FILED_ISSUE_NUMBERS; do
            if [[ -n "${DISPATCHED[$NUM]:-}" ]]; then
              continue
            fi
            DISPATCHED[$NUM]=1
            echo "::notice::Dispatching the fix-attempt agent for issue #$NUM"
            if gh workflow run ci-failure-fix-attempt.lock.yml \
              --repo "$REPO" -f item_number="$NUM"; then
              continue
            else
              DISPATCH_EXIT=$?
            fi
            # An operator can disable the workflow after the preflight.
            # Recheck once, without retrying or dispatching the rest of the batch.
            STATE="$(gh api "$WORKFLOW_API" --jq .state)"
            if [[ "$STATE" == disabled_* ]]; then
              echo "::notice::Fix-attempt workflow became $STATE -- skipping remaining dispatches."
              exit 0
            fi
            echo "::error::Fix-attempt dispatch failed; workflow state is $STATE."
            exit "$DISPATCH_EXIT"
          done
  promote:
    name: Promote dev -> main
    needs:
      - gate
      - source-units
      - python-artifacts
      - compose-candidate
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.is_dev == 'true'
    runs-on: ubuntu-latest
    environment: main-promotion
    permissions:
      contents: read
      actions: read
      attestations: read
      pull-requests: read
      checks: read
      statuses: read
    timeout-minutes: 15
    outputs:
      candidate_sha: ${{ steps.promote.outputs.candidate_sha }}
      candidate_branch: ${{ env.CANDIDATE_BRANCH }}
      main_before: ${{ steps.ready.outputs.main_before }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_BRANCH: release/promote-${{ github.run_id }}
    steps:
      - name: Decide whether this run should actually promote
        id: decide
        run: |
          if [ "${{ needs.compose-candidate.outputs.composed }}" = "false" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changed candidate content remains to publish."
            exit 0
          fi
          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::gate job did not succeed (${{ needs.gate.result }}) -- skipping promotion."
            exit 0
          fi
          if [ "${{ needs.gate.outputs.is_dev }}" != "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a validated dev commit -- skipping promotion."
            exit 0
          fi
          # Both the admitted unit packet and signed artifact validation
          # must genuinely succeed; integration is not a release prerequisite.
          for r in "${{ needs.source-units.result }}" "${{ needs.python-artifacts.result }}"; do
            if [ "$r" != "success" ]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "::error::Validation did not pass ($r) -- refusing to promote."
              exit 0
            fi
          done
          echo "proceed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: reviewed-helpers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure git identity for the generated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git --hostname github.com
      - uses: astral-sh/setup-uv@v9.0.0
        if: steps.decide.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Provision hash-pinned metadata validator tooling without release authority
        if: steps.decide.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/artifact-validator"
          python reviewed-helpers/tools/seasoned_uv.py --registry-only --uv uv -- --python "$RUNNER_TEMP/artifact-validator/bin/python" \
            --no-config --only-binary :all: --require-hashes \
            --index-url "${ARTIFACT_VALIDATION_INDEX_URL:-https://pypi.org/simple}" -r reviewed-helpers/tools/artifact_validation_requirements.txt
      - name: Download this run's signed Python artifacts
        if: steps.decide.outputs.proceed == 'true' && needs.python-artifacts.outputs.exported == 'true'
        uses: actions/download-artifact@v4
        with:
          name: promotion-python-artifacts
          path: python-artifacts
      - name: Verify the hosted, pinned promotion signer before using artifact metadata
        if: steps.decide.outputs.proceed == 'true' && needs.python-artifacts.outputs.exported == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/artifact-validator/bin/python" reviewed-helpers/tools/publish_python_artifacts.py verify \
            --repo "$GITHUB_WORKSPACE" --directory python-artifacts \
            --repository "$GITHUB_REPOSITORY" --signer-digest "${{ github.workflow_sha }}" \
            --source-digest "${{ github.sha }}" --source-ref "$GITHUB_REF"
      - uses: actions/download-artifact@v4
        if: steps.decide.outputs.proceed == 'true'
        with:
          name: frozen-promotion-candidate
          path: ${{ runner.temp }}/frozen-candidate
      - name: Promote (push a candidate branch; report-only if push=false)
        id: promote
        if: steps.decide.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.APERTURE_RELEASE_TOKEN }}
          PUSH_INPUT: ${{ github.event.inputs.push }}
          DEV_SHA: ${{ needs.gate.outputs.sha }}
          EXPECTED_CANDIDATE_SHA: ${{ needs.compose-candidate.outputs.candidate_sha }}
          PROMOTION_TIME: ${{ needs.compose-candidate.outputs.prepared_at }}
          QUALIFICATION_ONLY: ${{ needs.gate.outputs.qualification_only }}
        run: |
          args=(--repo "$GITHUB_WORKSPACE" --dev-ref "$DEV_SHA" --main-ref origin/main
            --python-artifacts-dir python-artifacts
            --expected-candidate-sha "$EXPECTED_CANDIDATE_SHA"
            --frozen-candidate-dir "$RUNNER_TEMP/frozen-candidate")
          if [ "$QUALIFICATION_ONLY" = "true" ]; then args+=(--qualification-only); fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$PUSH_INPUT" = "false" ]; then
            land=false
          else
            land=true
            args+=(--push --candidate-branch "$CANDIDATE_BRANCH"
              --promotion-time "$PROMOTION_TIME" --github-output "$GITHUB_OUTPUT")
          fi
          output=$("$RUNNER_TEMP/artifact-validator/bin/python" -I -B - "$GITHUB_WORKSPACE/reviewed-helpers/tools" "${args[@]}" <<'PY'
          import runpy
          import sys
          from pathlib import Path

          tools = Path(sys.argv.pop(1)).resolve(strict=True)
          sys.path.insert(0, str(tools))
          runpy.run_path(str(tools / "promote_release.py"), run_name="__main__")
          PY
          )
          echo "$output"
          echo "land=$land" >> "$GITHUB_OUTPUT"
      - name: Publish and read back exact-candidate artifacts before enabling merge
        id: ready
        if: steps.promote.outputs.land == 'true' && steps.promote.outputs.candidate_sha != ''
        env:
          GH_TOKEN: ${{ secrets.APERTURE_RELEASE_TOKEN }}
          ARTIFACT_VERIFY_TOKEN: ${{ github.token }}
          DEV_SHA: ${{ needs.gate.outputs.sha }}
          CANDIDATE_SHA: ${{ steps.promote.outputs.candidate_sha }}
          QUALIFICATION_ONLY: ${{ needs.gate.outputs.qualification_only }}
        run: |
          remote_ref=$(git ls-remote --heads origin "refs/heads/$CANDIDATE_BRANCH")
          if [ "$(printf '%s\n' "$remote_ref" | cut -f1)" != "$CANDIDATE_SHA" ]; then
            echo "::error::Remote branch does not match the trusted promoter's candidate."
            exit 1
          fi
          git fetch origin "refs/heads/$CANDIDATE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          python - "$CANDIDATE_SHA" "$QUALIFICATION_ONLY" <<'PY'
          import json
          import subprocess
          import sys

          candidate, mode = sys.argv[1:]
          if mode not in ("true", "false"):
              raise RuntimeError("invalid qualification-only admission")
          expected_paused = mode == "true"
          for commit in (candidate, candidate + "^"):
              shown = subprocess.run(
                  ["git", "show", f"{commit}:.github/release-pipeline-state.json"],
                  check=True, capture_output=True, text=True, timeout=30,
              )
              state = json.loads(shown.stdout)
              if not isinstance(state, dict) or state.get("paused") is not expected_paused:
                  raise RuntimeError("candidate must preserve the admitted pipeline pause state")
          PY
          "$RUNNER_TEMP/artifact-validator/bin/python" reviewed-helpers/tools/publish_python_artifacts.py prepare \
            --repo "$GITHUB_WORKSPACE" --directory python-artifacts \
            --repository "$GITHUB_REPOSITORY" --signer-digest "${{ github.workflow_sha }}" \
            --source-digest "${{ github.sha }}" --source-ref "$GITHUB_REF" \
            --candidate-commit "$CANDIDATE_SHA" --dev-head "$DEV_SHA"
          echo "candidate_pushed=true" >> "$GITHUB_OUTPUT"
          printf 'main_before=%s\n' "$(git rev-parse "$CANDIDATE_SHA^")" >> "$GITHUB_OUTPUT"
  qualify-candidate:
    name: Require exact source-unit reuse at the immutable candidate
    needs:
      - gate
      - promote
      - source-units
    if: needs.promote.outputs.candidate_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      qualification_run: ${{ steps.qualify.outputs.qualification_run }}
      qualification_attempt: ${{ steps.qualify.outputs.qualification_attempt }}
      qualification_digest: ${{ steps.qualify.outputs.qualification_digest }}
      qualification_promotion_run: ${{ steps.qualify.outputs.qualification_promotion_run }}
      candidate_sha: ${{ steps.qualify.outputs.candidate_sha }}
      dev_sha: ${{ steps.qualify.outputs.dev_sha }}
      main_before: ${{ steps.qualify.outputs.main_before }}
      control_sha: ${{ steps.qualify.outputs.control_sha }}
      tree: ${{ steps.qualify.outputs.tree }}
      qualification_profile: ${{ steps.qualify.outputs.qualification_profile }}
      qualification_unit_job_id: ${{ steps.qualify.outputs.qualification_unit_job_id }}
      qualification_unit_artifact_id: ${{ steps.qualify.outputs.qualification_unit_artifact_id }}
      qualification_unit_artifact_digest: ${{ steps.qualify.outputs.qualification_unit_artifact_digest }}
      qualification_packet_digest: ${{ steps.qualify.outputs.qualification_packet_digest }}
      qualification_unit_manifest_digest: ${{ steps.qualify.outputs.qualification_unit_manifest_digest }}
      qualification_unit_inputs_digest: ${{ steps.qualify.outputs.qualification_unit_inputs_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: reviewed-helpers
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote.outputs.candidate_sha }}
          path: candidate
          fetch-depth: '0'
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: validated-dev
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the unit packet for exact-ID and archive verification
        uses: actions/download-artifact@v4
        with:
          name: promotion-unit-evidence
          path: ${{ runner.temp }}/promotion-unit-evidence
      - name: Verify the original successful unit execution and all candidate source bytes
        id: qualify
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ needs.promote.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ needs.promote.outputs.candidate_sha }}
          DEV_SHA: ${{ needs.gate.outputs.sha }}
          MAIN_BEFORE: ${{ needs.promote.outputs.main_before }}
          CONTROL_SHA: ${{ github.workflow_sha }}
          UNIT_PRODUCER_ATTEMPT: ${{ needs.source-units.outputs.attempt }}
          UNIT_ARTIFACT_ID: ${{ needs.source-units.outputs.artifact_id }}
          UNIT_ARTIFACT_DIGEST: ${{ needs.source-units.outputs.artifact_digest }}
        run: |
          python -I -B reviewed-helpers/tools/qualify_promotion_candidate.py \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-ref "$CANDIDATE_BRANCH" --candidate-sha "$CANDIDATE_SHA" \
            --candidate-root candidate --dev-root validated-dev \
            --dev-sha "$DEV_SHA" --main-before "$MAIN_BEFORE" --control-sha "$CONTROL_SHA" \
            --promotion-run "$GITHUB_RUN_ID-$UNIT_PRODUCER_ATTEMPT" \
            --profile candidate-units-v3 --unit-packet-dir "$RUNNER_TEMP/promotion-unit-evidence" \
            --unit-manifest tools/promotion-unit-manifest.json \
            --unit-artifact-id "$UNIT_ARTIFACT_ID" --unit-artifact-digest "sha256:${UNIT_ARTIFACT_DIGEST#sha256:}" \
            --receipt "$RUNNER_TEMP/qualification.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: promotion-candidate-qualification
          path: ${{ runner.temp }}/qualification.json
          if-no-files-found: error
          retention-days: '2'
  merge-promotion:
    name: Merge the exact ready candidate without administrator authority
    needs:
      - gate
      - promote
      - qualify-candidate
      - publish-python-artifacts
    if: needs.publish-python-artifacts.outputs.pr_number != '' && needs.qualify-candidate.result == 'success' && needs.publish-python-artifacts.result == 'success' && needs.qualify-candidate.outputs.qualification_run != '' && needs.qualify-candidate.outputs.qualification_attempt != '' && needs.qualify-candidate.outputs.qualification_digest != '' && needs.qualify-candidate.outputs.qualification_promotion_run != '' && needs.publish-python-artifacts.outputs.publication_digest != '' && needs.publish-python-artifacts.outputs.source_release != '' && needs.qualify-candidate.outputs.qualification_profile == 'candidate-units-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    outputs:
      merge_sha: ${{ steps.merged.outputs.merge_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_BRANCH: ${{ needs.promote.outputs.candidate_branch }}
    steps:
      - name: Wait for required checks and merge only the exact ready candidate
        id: merged
        env:
          PROMOTION_PR: ${{ needs.publish-python-artifacts.outputs.pr_number }}
          CANDIDATE_SHA: ${{ needs.promote.outputs.candidate_sha }}
          MAIN_BEFORE: ${{ needs.promote.outputs.main_before }}
          PROMOTION_MERGE_TOKEN: ${{ github.token }}
          DEV_SHA: ${{ needs.gate.outputs.sha }}
          CONTROL_SHA: ${{ github.workflow_sha }}
          QUALIFIED_CANDIDATE: ${{ needs.qualify-candidate.outputs.candidate_sha }}
          QUALIFIED_DEV: ${{ needs.qualify-candidate.outputs.dev_sha }}
          QUALIFIED_MAIN_BEFORE: ${{ needs.qualify-candidate.outputs.main_before }}
          QUALIFIED_CONTROL: ${{ needs.qualify-candidate.outputs.control_sha }}
          QUALIFIED_TREE: ${{ needs.qualify-candidate.outputs.tree }}
          QUALIFICATION_RUN: ${{ needs.qualify-candidate.outputs.qualification_run }}
          QUALIFICATION_ATTEMPT: ${{ needs.qualify-candidate.outputs.qualification_attempt }}
          QUALIFICATION_DIGEST: ${{ needs.qualify-candidate.outputs.qualification_digest }}
          QUALIFICATION_PROMOTION_RUN: ${{ needs.qualify-candidate.outputs.qualification_promotion_run }}
          PUBLICATION_DIGEST: ${{ needs.publish-python-artifacts.outputs.publication_digest }}
          SOURCE_RELEASE: ${{ needs.publish-python-artifacts.outputs.source_release }}
          QUALIFICATION_PROFILE: ${{ needs.qualify-candidate.outputs.qualification_profile }}
          QUALIFICATION_UNIT_JOB: ${{ needs.qualify-candidate.outputs.qualification_unit_job_id }}
          QUALIFICATION_UNIT_ARTIFACT: ${{ needs.qualify-candidate.outputs.qualification_unit_artifact_id }}
          QUALIFICATION_UNIT_ARTIFACT_DIGEST: ${{ needs.qualify-candidate.outputs.qualification_unit_artifact_digest }}
          QUALIFICATION_PACKET_DIGEST: ${{ needs.qualify-candidate.outputs.qualification_packet_digest }}
          QUALIFICATION_UNIT_MANIFEST_DIGEST: ${{ needs.qualify-candidate.outputs.qualification_unit_manifest_digest }}
          QUALIFICATION_UNIT_INPUTS_DIGEST: ${{ needs.qualify-candidate.outputs.qualification_unit_inputs_digest }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time

          WAIT_SECONDS = 8 * 60
          POLL_SECONDS = 30
          qualification_owner = os.environ["QUALIFICATION_PROMOTION_RUN"]
          owner = re.fullmatch(r"([1-9][0-9]{0,19})-([1-9][0-9]{0,9})", qualification_owner)
          execution_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          if (
              owner is None or owner[1] != os.environ["GITHUB_RUN_ID"]
              or not re.fullmatch(r"[1-9][0-9]{0,9}", execution_attempt)
              or int(owner[2]) > int(execution_attempt)
          ):
              raise RuntimeError("qualification does not belong to this promotion generation")
          for qualified, expected in (
              ("QUALIFIED_CANDIDATE", "CANDIDATE_SHA"),
              ("QUALIFIED_DEV", "DEV_SHA"),
              ("QUALIFIED_MAIN_BEFORE", "MAIN_BEFORE"),
              ("QUALIFIED_CONTROL", "CONTROL_SHA"),
          ):
              value = os.environ[qualified]
              if not re.fullmatch(r"[0-9a-f]{40}", value) or value != os.environ[expected]:
                  raise RuntimeError(f"premerge qualification identity mismatch: {qualified}")
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["QUALIFIED_TREE"]):
              raise RuntimeError("premerge qualification has no immutable payload tree")
          for field in ("QUALIFICATION_RUN", "QUALIFICATION_ATTEMPT"):
              if not re.fullmatch(r"[1-9][0-9]{0,19}", os.environ[field]):
                  raise RuntimeError(f"premerge qualification has no valid {field}")
          for field in ("QUALIFICATION_DIGEST", "PUBLICATION_DIGEST"):
              if not re.fullmatch(r"[0-9a-f]{64}", os.environ[field]):
                  raise RuntimeError(f"premerge release has no valid {field}")
          if os.environ["SOURCE_RELEASE"] != f"python-artifacts-{os.environ['DEV_SHA']}":
              raise RuntimeError("published release does not name the qualified source Dev commit")
          merge_token = os.environ.pop("PROMOTION_MERGE_TOKEN")
          if not merge_token:
              raise RuntimeError("promotion merge authority is unavailable")
          read_env = os.environ.copy()
          merge_attempted = False
          merge_error = None
          reconciliation_reads = 0
          identity = f"{os.environ['GITHUB_REPOSITORY']}#{os.environ['PROMOTION_PR']}"
          expected = f"{os.environ['CANDIDATE_BRANCH']} -> main"
          observed = "not yet queried"
          deadline = time.monotonic() + WAIT_SECONDS
          while True:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise TimeoutError(
                      f"{identity} did not merge within {WAIT_SECONDS}s; "
                      f"expected {expected}; observed {observed}"
                  )
              result = subprocess.run(
                  ["gh", "pr", "view", os.environ["PROMOTION_PR"],
                   "--repo", os.environ["GITHUB_REPOSITORY"],
                   "--json", "state,mergeCommit,headRefName,headRefOid,baseRefName,baseRefOid"],
                  check=True, stdout=subprocess.PIPE, text=True,
                  timeout=min(60, remaining),
                  env=read_env,
              )
              pr = json.loads(result.stdout)
              observed = (
                  f"{pr['state']}: {pr['headRefName']} -> {pr['baseRefName']}"
              )
              if (
                  pr["headRefName"] != os.environ["CANDIDATE_BRANCH"]
                  or pr["baseRefName"] != "main"
                  or pr["headRefOid"] != os.environ["CANDIDATE_SHA"]
              ):
                  raise RuntimeError(
                      f"{identity} identity changed; expected {expected}; observed {observed}"
                  )
              if pr["state"] == "MERGED":
                  sha = (pr.get("mergeCommit") or {}).get("oid")
                  if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
                      raise RuntimeError(
                          f"{identity} has no valid merge commit: {sha!r}; observed {observed}"
                      )
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"merge_sha={sha}\n")
                  break
              if pr["state"] != "OPEN":
                  raise RuntimeError(f"{identity} closed without merging; observed {observed}")
              if pr["baseRefOid"] != os.environ["MAIN_BEFORE"]:
                  raise RuntimeError(f"{identity} main advanced after candidate preparation; rebuild required")
              if merge_error is not None:
                  reconciliation_reads += 1
                  if reconciliation_reads >= 2:
                      raise merge_error
                  print(f"{identity}: reconciling an uncertain merge response without another write", flush=True)
                  time.sleep(min(POLL_SECONDS, max(0, deadline - time.monotonic())))
                  continue
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise TimeoutError(f"{identity} exceeded the merge-wait deadline")
              checks = subprocess.run(
                  ["gh", "pr", "checks", os.environ["PROMOTION_PR"],
                   "--repo", os.environ["GITHUB_REPOSITORY"],
                   "--required", "--json", "name,bucket,link"],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
                  timeout=min(60, remaining),
                  env=read_env,
              )
              registration_pending = (
                  checks.returncode == 1
                  and not checks.stdout.strip()
                  and checks.stderr.strip() in (
                      f"no checks reported on the '{os.environ['CANDIDATE_BRANCH']}' branch",
                      f"no required checks reported on the '{os.environ['CANDIDATE_BRANCH']}' branch",
                  )
              )
              if registration_pending:
                  print(f"{identity}: required checks have not registered yet", flush=True)
                  time.sleep(min(POLL_SECONDS, max(0, deadline - time.monotonic())))
                  continue
              if checks.stderr:
                  print(checks.stderr, file=sys.stderr, end="")
              if checks.returncode not in (0, 1, 8):
                  raise subprocess.CalledProcessError(checks.returncode, checks.args)
              required = json.loads(checks.stdout)
              if not isinstance(required, list) or any(
                  not isinstance(check, dict)
                  or check.get("bucket") not in ("pass", "skipping", "pending", "fail", "cancel")
                  for check in required
              ):
                  raise RuntimeError(f"{identity} returned an invalid required-check list")
              failures = [
                  f"{check['name']} ({check['bucket']}): {check['link']}"
                  for check in required if check["bucket"] in ("fail", "cancel", "skipping")
              ]
              if failures:
                  raise RuntimeError(f"{identity} required checks failed: " + "; ".join(failures))
              if checks.returncode == 1:
                  raise subprocess.CalledProcessError(checks.returncode, checks.args)
              if not merge_attempted and required and all(
                  check["bucket"] == "pass" for check in required
              ):
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise TimeoutError(f"{identity} exceeded the merge-wait deadline")
                  rules = subprocess.run(
                      ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/rules/branches/main"],
                      check=True, stdout=subprocess.PIPE, text=True, timeout=min(60, remaining),
                      env=read_env,
                  )
                  strict = any(
                      rule.get("type") == "required_status_checks"
                      and rule.get("parameters", {}).get("strict_required_status_checks_policy") is True
                      and any(check.get("context") == "main source gate"
                              for check in rule["parameters"].get("required_status_checks", []))
                      for rule in json.loads(rules.stdout)
                  )
                  if not strict:
                      raise RuntimeError("main source gate requires strict server-enforced base freshness")
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise TimeoutError(f"{identity} exceeded the merge-wait deadline")
                  qualification = subprocess.run(
                      ["gh", "api",
                       f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['QUALIFICATION_RUN']}"],
                      check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
                      timeout=min(60, remaining),
                      env=read_env,
                  )
                  qualified_run = json.loads(qualification.stdout)
                  if os.environ["QUALIFICATION_PROFILE"] != "candidate-units-v3":
                      raise RuntimeError("the controller requires an explicit candidate-unit v3 receipt")
                  for field in ("QUALIFICATION_UNIT_JOB", "QUALIFICATION_UNIT_ARTIFACT"):
                      if not re.fullmatch(r"[1-9][0-9]{0,19}", os.environ[field]):
                          raise RuntimeError(f"invalid source-unit provider identity: {field}")
                  for field in (
                      "QUALIFICATION_PACKET_DIGEST", "QUALIFICATION_UNIT_MANIFEST_DIGEST",
                      "QUALIFICATION_UNIT_INPUTS_DIGEST",
                  ):
                      if not re.fullmatch(r"[0-9a-f]{64}", os.environ[field]):
                          raise RuntimeError(f"invalid source-unit byte binding: {field}")
                  if not re.fullmatch(r"sha256:[0-9a-f]{64}", os.environ["QUALIFICATION_UNIT_ARTIFACT_DIGEST"]):
                      raise RuntimeError("invalid immutable unit archive digest")
                  if (
                      not isinstance(qualified_run, dict)
                      or type(qualified_run.get("id")) is not int
                      or qualified_run["id"] != int(os.environ["QUALIFICATION_RUN"])
                      or qualified_run["id"] != int(os.environ["GITHUB_RUN_ID"])
                      or type(qualified_run.get("run_attempt")) is not int
                      or qualified_run["run_attempt"] < int(os.environ["QUALIFICATION_ATTEMPT"])
                      or qualified_run.get("event") not in ("workflow_dispatch", "repository_dispatch")
                      or qualified_run.get("head_sha") != os.environ["CONTROL_SHA"]
                      or qualified_run.get("head_branch") != "main"
                      or qualified_run.get("path") != ".github/workflows/validate-and-promote.yml"
                  ):
                      raise RuntimeError("unit producer no longer matches its trusted Main generation")
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise TimeoutError("source-unit provider recheck exceeded the merge deadline")
                  job_result = subprocess.run(
                      ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/jobs/{os.environ['QUALIFICATION_UNIT_JOB']}"],
                      check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
                      timeout=min(60, remaining), env=read_env,
                  )
                  unit_job = json.loads(job_result.stdout)
                  if (
                      not isinstance(unit_job, dict)
                      or type(unit_job.get("id")) is not int
                      or unit_job["id"] != int(os.environ["QUALIFICATION_UNIT_JOB"])
                      or unit_job.get("name") != "Eligible source units with coverage"
                      or type(unit_job.get("run_id")) is not int
                      or unit_job["run_id"] != int(os.environ["QUALIFICATION_RUN"])
                      or type(unit_job.get("run_attempt")) is not int
                      or unit_job["run_attempt"] != int(os.environ["QUALIFICATION_ATTEMPT"])
                      or unit_job.get("head_sha") != os.environ["CONTROL_SHA"]
                      or unit_job.get("status") != "completed" or unit_job.get("conclusion") != "success"
                  ):
                      raise RuntimeError("the original source-unit job is not completed successfully")
                  uploads = [
                      step for step in unit_job.get("steps", [])
                      if isinstance(step, dict) and step.get("name") == "Upload promotion unit evidence"
                  ]
                  if len(uploads) != 1 or uploads[0].get("status") != "completed" or uploads[0].get("conclusion") != "success":
                      raise RuntimeError("source-unit upload no longer matches the successful receipt")
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise TimeoutError("source-unit archive recheck exceeded the merge deadline")
                  artifact_result = subprocess.run(
                      ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{os.environ['QUALIFICATION_UNIT_ARTIFACT']}"],
                      check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
                      timeout=min(60, remaining), env=read_env,
                  )
                  artifact = json.loads(artifact_result.stdout)
                  origin = artifact.get("workflow_run") if isinstance(artifact, dict) else None
                  if (
                      not isinstance(artifact, dict) or type(artifact.get("id")) is not int
                      or artifact["id"] != int(os.environ["QUALIFICATION_UNIT_ARTIFACT"])
                      or artifact.get("name") != "promotion-unit-evidence"
                      or artifact.get("expired") is not False
                      or artifact.get("digest") != os.environ["QUALIFICATION_UNIT_ARTIFACT_DIGEST"]
                      or not isinstance(origin, dict) or type(origin.get("id")) is not int
                      or origin["id"] != int(os.environ["QUALIFICATION_RUN"])
                      or origin.get("head_branch") != "main" or origin.get("head_sha") != os.environ["CONTROL_SHA"]
                  ):
                      raise RuntimeError("the immutable source-unit archive no longer matches its receipt")
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise TimeoutError(f"{identity} exceeded the merge-wait deadline")
                  merge_env = read_env.copy()
                  merge_env["GH_TOKEN"] = merge_token
                  try:
                      subprocess.run(
                          ["gh", "pr", "merge", os.environ["PROMOTION_PR"],
                           "--repo", os.environ["GITHUB_REPOSITORY"], "--squash",
                           "--match-head-commit", os.environ["CANDIDATE_SHA"]],
                          check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
                          timeout=min(60, remaining),
                          env=merge_env,
                      )
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
                      if error.stderr:
                          print(error.stderr, file=sys.stderr, end="")
                      merge_error = error
                  merge_attempted = True
              time.sleep(min(POLL_SECONDS, max(0, deadline - time.monotonic())))
          PY
  publish-python-artifacts:
    name: Publish and read back the qualified source release before merge
    needs:
      - gate
      - python-artifacts
      - promote
      - qualify-candidate
      - source-units
    if: needs.qualify-candidate.result == 'success' && needs.qualify-candidate.outputs.qualification_digest != '' && needs.python-artifacts.outputs.exported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: main-promotion
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
      pull-requests: read
    outputs:
      publication_digest: ${{ steps.publish.outputs.publication_digest }}
      source_release: ${{ steps.publish.outputs.source_release }}
      pr_number: ${{ steps.land.outputs.pr_number }}
    env:
      CANDIDATE_SHA: ${{ needs.promote.outputs.candidate_sha }}
      DEV_SHA: ${{ needs.gate.outputs.sha }}
      MAIN_BEFORE: ${{ needs.promote.outputs.main_before }}
      CANDIDATE_BRANCH: ${{ needs.promote.outputs.candidate_branch }}
      QUALIFICATION_PROMOTION_RUN: ${{ needs.qualify-candidate.outputs.qualification_promotion_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: reviewed-helpers
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote.outputs.candidate_sha }}
          path: candidate
          fetch-depth: '2'
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: validated-dev
          persist-credentials: false
      - name: Download the unit packet for exact-ID and archive verification
        uses: actions/download-artifact@v4
        with:
          name: promotion-unit-evidence
          path: ${{ runner.temp }}/promotion-unit-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Provision hash-pinned metadata validator tooling without release credentials
        run: |
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/artifact-validator"
          python reviewed-helpers/tools/seasoned_uv.py --registry-only --uv uv -- --python "$RUNNER_TEMP/artifact-validator/bin/python" \
            --no-config --only-binary :all: --require-hashes \
            --index-url "${ARTIFACT_VALIDATION_INDEX_URL:-https://pypi.org/simple}" -r reviewed-helpers/tools/artifact_validation_requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: promotion-python-artifacts
          path: python-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: promotion-candidate-qualification
          path: qualification
      - name: Require the exact qualification receipt from this run
        env:
          QUALIFICATION_DIGEST: ${{ needs.qualify-candidate.outputs.qualification_digest }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          expected = os.environ["QUALIFICATION_DIGEST"]
          receipt = Path("qualification/qualification.json")
          if not re.fullmatch(r"[0-9a-f]{64}", expected) or receipt.is_symlink():
              raise RuntimeError("invalid candidate qualification receipt")
          if hashlib.sha256(receipt.read_bytes()).hexdigest() != expected:
              raise RuntimeError("candidate qualification receipt digest mismatch")
          PY
      - name: Prepare complete source subjects from pinned raw Git objects
        run: |
          git fetch origin "$CANDIDATE_SHA"
          python reviewed-helpers/tools/promotion_source_archive.py \
            --repo "$GITHUB_WORKSPACE" --directory "$RUNNER_TEMP/complete-source" \
            --source-index python-artifacts/python-artifacts.json \
            --qualification-receipt qualification/qualification.json
      - name: Attest the complete source and its external generation manifest
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: ${{ runner.temp }}/complete-source/*
      - name: Publish immutable source assets and verify all raw bytes before merge
        id: publish
        env:
          GH_TOKEN: ${{ secrets.APERTURE_RELEASE_TOKEN }}
          ARTIFACT_VERIFY_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git fetch origin "$CANDIDATE_SHA"
          "$RUNNER_TEMP/artifact-validator/bin/python" reviewed-helpers/tools/publish_python_artifacts.py publish-candidate \
            --repo "$GITHUB_WORKSPACE" --directory python-artifacts \
            --repository "$GITHUB_REPOSITORY" --signer-digest "${{ github.workflow_sha }}" \
            --source-digest "${{ github.sha }}" --source-ref "$GITHUB_REF" \
            --candidate-commit "$CANDIDATE_SHA" --dev-head "$DEV_SHA" --main-before "$MAIN_BEFORE" \
            --candidate-root candidate --promotion-run "$QUALIFICATION_PROMOTION_RUN" \
            --qualification-profile candidate-units-v3 \
            --complete-source-dir "$RUNNER_TEMP/complete-source" \
            --unit-packet-dir "$RUNNER_TEMP/promotion-unit-evidence" \
            --unit-manifest tools/promotion-unit-manifest.json --dev-root validated-dev \
            --qualification-receipt qualification/qualification.json --github-output "$GITHUB_OUTPUT"
      - name: Recheck active promotion ownership before opening the qualified PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B reviewed-helpers/tools/promotion_lifecycle.py --repository "$GITHUB_REPOSITORY" --require-idle --candidate-branch "$CANDIDATE_BRANCH" --candidate-sha "$CANDIDATE_SHA"
      - name: Open the already qualified and published candidate PR
        id: land
        env:
          GH_TOKEN: ${{ secrets.APERTURE_RELEASE_TOKEN }}
          PUBLICATION_DIGEST: ${{ steps.publish.outputs.publication_digest }}
          SOURCE_RELEASE: ${{ steps.publish.outputs.source_release }}
          QUALIFICATION_DIGEST: ${{ needs.qualify-candidate.outputs.qualification_digest }}
          QUALIFICATION_RUN: ${{ needs.qualify-candidate.outputs.qualification_run }}
          QUALIFICATION_ATTEMPT: ${{ needs.qualify-candidate.outputs.qualification_attempt }}
        run: |
          acting_user=$(gh api user --jq '.login')
          if [ "$acting_user" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error::Release PR authority does not name the expected repository owner."
            exit 1
          fi
          remote_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$remote_main" != "$MAIN_BEFORE" ]; then
            echo "::error::Main advanced after qualification; refusing to open a stale promotion PR."
            exit 1
          fi
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$CANDIDATE_BRANCH" \
            --base main --state all \
            --json number,headRefOid,headRefName,baseRefName,isCrossRepository,state,author --limit 100)
          pr_number=$(PR_CANDIDATES="$existing" python - <<'PY'
          import json
          import os
          import re

          for field in ("CANDIDATE_SHA", "MAIN_BEFORE", "DEV_SHA"):
              if not re.fullmatch(r"[0-9a-f]{40}", os.environ[field]):
                  raise RuntimeError(f"qualified PR has an invalid {field}")
          for field in ("PUBLICATION_DIGEST", "QUALIFICATION_DIGEST"):
              if not re.fullmatch(r"[0-9a-f]{64}", os.environ[field]):
                  raise RuntimeError(f"qualified PR has no complete {field}")
          for field in ("QUALIFICATION_RUN", "QUALIFICATION_ATTEMPT", "GITHUB_RUN_ATTEMPT"):
              if not re.fullmatch(r"[1-9][0-9]{0,19}", os.environ[field]):
                  raise RuntimeError(f"qualified PR has an invalid {field}")
          owner = re.fullmatch(
              r"([1-9][0-9]{0,19})-([1-9][0-9]{0,9})", os.environ["QUALIFICATION_PROMOTION_RUN"],
          )
          if (
              owner is None or owner[1] != os.environ["GITHUB_RUN_ID"]
              or int(owner[2]) > int(os.environ["GITHUB_RUN_ATTEMPT"])
              or os.environ["CANDIDATE_BRANCH"] != f"release/promote-{owner[1]}"
              or os.environ["SOURCE_RELEASE"] != f"python-artifacts-{os.environ['DEV_SHA']}"
          ):
              raise RuntimeError("qualified PR does not bind this exact promotion generation")
          candidates = json.loads(os.environ["PR_CANDIDATES"])
          if not isinstance(candidates, list) or len(candidates) > 1:
              raise RuntimeError("ambiguous existing promotion PR")
          if candidates:
              pr = candidates[0]
              if (
                  not isinstance(pr, dict)
                  or pr.get("headRefOid") != os.environ["CANDIDATE_SHA"]
                  or pr.get("headRefName") != os.environ["CANDIDATE_BRANCH"]
                  or pr.get("baseRefName") != "main"
                  or not isinstance(pr.get("author"), dict)
                  or pr["author"].get("login") != os.environ["GITHUB_REPOSITORY_OWNER"]
                  or pr.get("isCrossRepository") is not False
                  or pr.get("state") not in ("OPEN", "MERGED")
                  or type(pr.get("number")) is not int or pr["number"] <= 0
              ):
                  raise RuntimeError("existing promotion PR does not match the exact candidate")
              print(pr["number"])
          PY
          )
          if [ -z "$pr_number" ]; then
            pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$CANDIDATE_BRANCH" \
              --title "release: promote dev to main ($CANDIDATE_BRANCH)" \
              --body "Intent: publish already qualified Dev $DEV_SHA. Changes: wholesale generated candidate $CANDIDATE_SHA; do not edit by hand. Validation: exact source-unit evidence from https://github.com/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN (original producing attempt $QUALIFICATION_ATTEMPT), candidate input equivalence, immutable source assets and full raw readback have succeeded before opening this PR. Source artifacts: https://github.com/$GITHUB_REPOSITORY/releases/tag/$SOURCE_RELEASE. Documentation impact: source documentation is included in the generated snapshot. The workflow retains ownership until actual Main merge.")
            pr_number="${pr_url##*/}"
          fi
          [[ "$pr_number" =~ ^[1-9][0-9]{0,19}$ ]] || {
            echo "::error::Qualified promotion PR has no valid provider number."
            exit 1
          }
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
  refresh-promotion-attribution:
    name: Refresh Dev attribution checks after an already qualified landing
    needs:
      - merge-promotion
    if: needs.merge-promotion.outputs.merge_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the bounded idempotent attribution refresh without release qualification
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.merge-promotion.outputs.merge_sha }}
          PROMOTION_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          merged = os.environ["MERGE_SHA"]
          promotion_run = os.environ["PROMOTION_RUN"]
          if not re.fullmatch(r"[0-9a-f]{40}", merged):
              raise RuntimeError("invalid landed promotion snapshot")
          if not re.fullmatch(r"[0-9]{1,20}-[0-9]{1,10}", promotion_run):
              raise RuntimeError("invalid promotion run identity")
          subprocess.run(
              ["gh", "api", "--method", "POST",
               f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/workflow-lockdown-guard.yml/dispatches",
               "--input", "-"],
              input=json.dumps({"ref": "main", "inputs": {
                  "promotion_sha": merged, "promotion_run": promotion_run,
              }}),
              text=True, check=True, timeout=60,
          )
          PY
  record-promotion:
    name: Record the landed commit for an already qualified and published Dev release
    needs:
      - gate
      - merge-promotion
      - publish-python-artifacts
    if: needs.merge-promotion.outputs.merge_sha != '' && needs.publish-python-artifacts.outputs.source_release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    environment: main-promotion
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: '0'
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          path: reviewed-helpers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Idempotently record the landed source release without qualifying or publishing it
        env:
          GH_TOKEN: ${{ secrets.APERTURE_RELEASE_TOKEN }}
          MERGE_SHA: ${{ needs.merge-promotion.outputs.merge_sha }}
          SOURCE_RELEASE: ${{ needs.publish-python-artifacts.outputs.source_release }}
        run: |
          DEV_SHA="${SOURCE_RELEASE#python-artifacts-}"
          [[ "$DEV_SHA" =~ ^[0-9a-f]{40}$ ]]
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git --hostname github.com
          python -B reviewed-helpers/tools/tag_promotion.py \
            --repo "$GITHUB_WORKSPACE" --merge-sha "$MERGE_SHA" --dev-sha "$DEV_SHA" \
            --message "release: record landed main commit for dev $DEV_SHA"
