name: PR rebase full

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: owned PR replay (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Run owned-PR replay and guarded recovery contracts
        env:
          AGENT_WORKTREES_PR_REBASE_EXHAUSTIVE: "1"
          AGENT_WORKTREES_NATIVE_HEADLESS_TEST: "1"
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          -k "owned_pr_rebase or pr_recovery or pr_break_glass or pr_rewrite or pr_publication_state or pr_publish_stale_tip or pr_partial_publish_guard"
          --allow-explicit-tiers
          --subsuite-timeout 1800 --plugin-timeout 1800
  windows:
    name: owned PR replay (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Run owned-PR replay and guarded recovery contracts
        env:
          AGENT_WORKTREES_PR_REBASE_EXHAUSTIVE: "1"
          AGENT_WORKTREES_NATIVE_HEADLESS_TEST: "1"
        run: >-
          python tools/run-plugin-tests.py agent-worktrees
          -k "owned_pr_rebase or pr_recovery or pr_break_glass or pr_rewrite or pr_publication_state or pr_publish_stale_tip or pr_partial_publish_guard"
          --allow-explicit-tiers
          --subsuite-timeout 1800 --plugin-timeout 1800
