# Managed by dotfiles control plane: keeps upstream dependency versions current so
# they flow down to the internal mirror (agent-harness-plugins) via sync.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/plugins/agent-bridge"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "uv"
    directory: "/plugins/agent-codespaces"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "uv"
    directory: "/plugins/agent-containers"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "uv"
    directory: "/plugins/agent-dispatch"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "uv"
    directory: "/plugins/agent-index"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      # jina-v2-base-code (the default embedding model) loads via
      # trust_remote_code and its custom modeling path breaks on transformers
      # 5.x (#114). Hold the <5 ceiling until the default model changes -- do
      # not let Dependabot lift it again (regressed once in #163).
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "uv"
    directory: "/plugins/agent-logger"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "uv"
    directory: "/plugins/agent-machines"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "uv"
    directory: "/plugins/agent-mcp"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "uv"
    directory: "/plugins/agent-ssh"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "uv"
    directory: "/plugins/agent-vault"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "uv"
    directory: "/plugins/agent-worktrees"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
