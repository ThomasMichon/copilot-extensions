{
  "module": "gateway-relay",
  "kind": "transport",
  "summary": "SSH through explicitly enrolled loopback endpoints supplied by an outbound Gateway relay connector.",
  "produces": {
    "ssh_profile": true,
    "keyed_by": "machine-name"
  },
  "inbound_ports": "none",
  "topology": {
    "default": "per-machine",
    "supported": ["per-machine"]
  },
  "capabilities": {
    "install-client": false,
    "emit-profile": true,
    "verify": true,
    "provision-server": false
  }
}
