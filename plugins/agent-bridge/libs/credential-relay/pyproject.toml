[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
agent-procutil = { path = "../agent-procutil" }

[project]
name = "agent-credential-relay"
version = "0.1.6-dev1"
description = "Shared credential relay framework + host-credential sources for Copilot CLI plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Thomas Michon" }
]
# Shared native process ownership; no resident service or plugin is required.
dependencies = ["agent-procutil>=0.1.0.dev7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
