[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-machines"
version = "0.1.21-dev1"
description = "Portable machine setup and restore for Copilot CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "pyyaml>=6.0.3",
    "agent-dropin-registry",
    "agent-plugin-activation",
    "agent-plugin-resolve",
    "agent-procutil",
]

[tool.uv.sources]
# Copilot CLI + Claude plugin resolution -- marketplaces, plugins, repo settings
# (module ``plugin_resolve``). Vendored byte-identical from libs/plugin-resolve;
# shared with agent-worktrees / agent-bridge / agent-codespaces.
agent-plugin-resolve = { path = "libs/plugin-resolve" }
# Strict plugin inventory and activation inspection, removal, and snapshots
# (module ``plugin_activation``). Vendored byte-identically from
# libs/plugin-activation.
agent-plugin-activation = { path = "libs/plugin-activation" }
# Resilient scan authority and decision types required by plugin-activation.
agent-dropin-registry = { path = "libs/dropin-registry" }
# `path` escapes this plugin's own root and resolves live to
# `libs/agent-procutil`, so this `dev`-branch checkout has nothing to keep
# manually in sync -- only a real `main`-branch release
# (tools/materialize_main.py) ever gets a real local copy.
agent-procutil = { path = "libs/agent-procutil" }

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
agent-machines = "agent_machines.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are expected in tests
"tests/test_layout.py" = ["S101", "S603", "S607"]  # fixed git fixture commands
# Vendored byte-identical primitive (install-contract); its subprocess calls to
# mklink are intentional and it must not diverge from the canonical source.
"scripts/versioned_runtime.py" = ["S603", "S607"]
