[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is namespaced (agent-remote-login-shell) to prevent
# dependency-confusion; the import module is ``remote_login_shell``.
# Mirrors agent-procutil / agent-dropin-registry.
name = "agent-remote-login-shell"
version = "0.1.0-dev1"
description = "Shared POSIX login-shell command wrapping for remote SSH exec across Copilot CLI plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
# Pure stdlib (shlex); no runtime dependencies.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert` (pytest).
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
