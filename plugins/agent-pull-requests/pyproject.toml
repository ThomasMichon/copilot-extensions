[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pull-requests"
version = "0.3.0-dev1"
description = "Cross-repository pull-request CLI with agent-worktrees-mediated GitHub auth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "agent-work-coalescing-singleton",
    "agent-procutil",
    "agent-single-instance-lease",
]

[tool.uv.sources]
# Shared coalescing/rendezvous daemon primitive (module
# ``work_coalescing_singleton``) -- resolved live from its canonical path so
# this plugin never vendors its own copy.
agent-work-coalescing-singleton = { path = "libs/work-coalescing-singleton" }
# Windowless subprocess-spawn helpers (module ``agent_procutil``) -- the
# notify dispatch path must never pop a console window on Windows.
agent-procutil = { path = "libs/agent-procutil" }
# OS-lock-backed single-instance guard (module ``single_instance_lease``) --
# ``serve`` must never let two daemons race to bind and both write
# rendezvous, orphaning one silently.
agent-single-instance-lease = { path = "libs/single-instance-lease" }

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
agent-pull-requests = "agent_pull_requests.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
