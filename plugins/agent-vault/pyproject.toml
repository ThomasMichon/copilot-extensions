[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-vault"
version = "0.1.0-dev86"
description = "Local KeePassXC-backed secret store for Copilot CLI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "agent-procutil",
    "agent-zdd",
    "agent-single-instance-lease",
]

[tool.uv.sources]
# Windows-headless process-spawn helpers (module ``agent_procutil``). Vendored
# per plugin; byte-identical src across copies.
agent-procutil = { path = "libs/agent-procutil" }
# zero-downtime cutover primitives -- routing table + cutover orchestrator +
# recovery breadcrumb (module ``zdd``). Vendored per plugin; byte-identical src
# across copies. Lets a vault version bump drain-and-cut-over instead of a hard
# restart, so the unlocked master secret survives (#743).
agent-zdd = { path = "libs/zdd" }
# single-instance lease + supersession self-retire (module
# ``single_instance_lease``). Vendored per plugin; byte-identical src across
# copies. Guards "one active vault per host" and drives the drained predecessor's
# self-retire during a cutover (#743).
agent-single-instance-lease = { path = "libs/single-instance-lease" }

[project.optional-dependencies]
# The persistent on-disk credential cache (opt-in) encrypts entries with Fernet,
# and the seal/unseal envelope-KEK multi-machine system encrypts with AES-256-GCM -- both need
# `cryptography`. Install with `pip install agent-vault[cache]` / `[kek]` (or
# provide cryptography another way); without it the cache degrades to a safe no-op
# and seal/unseal raise a clear error.
cache = ["cryptography>=50.0.0"]
kek = ["cryptography>=50.0.0"]

[project.scripts]
agent-vault = "agent_vault.__main__:main"

[project.entry-points."agent_vault.extensions"]
core-delegation = "agent_vault.core_ext:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts + fake tokens are expected in tests
