[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-guidance"
version = "0.1.0-dev10"
description = "Provider-neutral current AI usage budget posture."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
budget-guidance = "budget_guidance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/versioned_runtime.py" = ["S603", "S607"]

[tool.pytest.ini_options]
markers = [
    "guard: fast structural and installer contract checks",
]
