[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-index"
version = "0.1.0-dev14"
description = "Portable indexing and semantic-search engine for a harness repo and its immediate ecosystem."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "mcp>=1.9,<2.0",
    "agent-zdd",
]

[tool.uv.sources]
# zero-downtime cutover primitives -- the routing table + cutover orchestrator
# (module ``zdd``), extracted from agent-bridge so other services reuse them.
agent-zdd = { path = "libs/zdd" }

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "fastapi",
]
engine = [
    "torch",
    # jina-v2-base-code loads via trust_remote_code; transformers 5.x broke that
    # custom modeling path (#114). Pin below 5 so every host gets the newest
    # working 4.x -- a compat ceiling, not a capability downgrade.
    "transformers>=4.40,<5",
    "sentence-transformers",
    "lancedb",
]

[project.scripts]
agent-index = "agent_index.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts + fake tokens are expected in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
