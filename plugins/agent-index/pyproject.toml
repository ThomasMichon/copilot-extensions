[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-index"
version = "0.1.0-dev135"
description = "Portable indexing and semantic-search engine for a harness repo and its immediate ecosystem."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    # Light, ARM64-friendly base: the CLI entry point, the project-aware
    # transport (a client delegates read commands to the indexer host over SSH),
    # the FastAPI service shell, and adoption config. A CLIENT installs ONLY this
    # -- it runs no local store/engine. The indexing + vector-store stack is the
    # [store] extra (host); the embedding stack is [engine] (host). These base
    # deps all ship Windows-ARM64 wheels, so a client provisions on ARM64 laptops.
    "fastapi>=0.110",
    "uvicorn>=0.52.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "agent-zdd",
    # Windows-headless process-spawn helpers (module ``agent_procutil``); vendored
    # per plugin, byte-identical src across copies.
    "agent-procutil",
    # Structured adoption config (.agent-index/config.yaml: role, indexer
    # designation, routing). Small, pure-Python.
    "pyyaml>=6.0",
]

[tool.uv.sources]
# zero-downtime cutover primitives -- the routing table + cutover orchestrator
# (module ``zdd``), extracted from agent-bridge so other services reuse them.
agent-zdd = { path = "libs/zdd" }
agent-procutil = { path = "libs/agent-procutil" }

[project.optional-dependencies]
store = [
    # The indexing + vector-store stack: reads/writes the LanceDB store and chunks
    # source with tree-sitter (falling back to line-based chunking when a grammar
    # is absent). Provisioned on a HOST only (the light, torch-free SERVICE
    # runtime) -- a client delegates over SSH and never touches the local store,
    # and these have no Windows-ARM64 wheels (an ARM64 client that pulled them
    # backtracked to pylance==0.0.2/pyarrow==8.0.0 and failed to build). The
    # search/indexing modules import them LAZILY, so the light base loads fine
    # without them. The heavy embedding stack is the separate [engine] extra.
    "numpy>=2.2.6",
    "pyarrow>=25.0.1",
    "lancedb",
    "tree-sitter>=0.26.0,<1.0",
    "tree-sitter-python>=0.25.0,<1.0",
    "tree-sitter-javascript>=0.25.0,<1.0",
    "tree-sitter-typescript>=0.23.2,<1.0",
    "tree-sitter-bash>=0.23,<1.0",
    # The legacy `agent-index mcp` stdio MCP server (mcp_app). HOST-side and
    # lazily imported (cmd_mcp) -- a client reaches tools through the agent-mcp
    # `cli` bridge (which spawns `agent-index <sub>`), never `agent-index mcp`.
    # Kept out of the client base because `mcp` pulls `cryptography` (a Rust
    # extension) with no Windows-ARM64 wheel, which fails to build on an ARM64
    # client (#1516).
    "mcp>=2.0,<3.0",
]
dev = [
    "pytest",
    "httpx",
    "fastapi",
    # The test suite exercises the store/indexing/search modules, so dev pulls
    # the [store] extra (self-reference) even though a client runtime does not.
    "agent-index[store]",
]
engine = [
    # The heavy embedding stack -- the durable, persistent ENGINE runtime only,
    # provisioned on the engine host (in a durable venv outside the versioned
    # service runtime). Kept OUT of the service deps so a routine service version
    # cutover never rebuilds torch or reloads the model (effort
    # agent-index-engine-daemon; §warm-durable-engine).
    "torch",
    # jina-v2-base-code loads via trust_remote_code; transformers 5.x broke that
    # custom modeling path (#114). Pin below 5 so every host gets the newest
    # working 4.x -- a compat ceiling, not a capability downgrade. (Dependabot
    # regressed this to >=5.14.1,<6 in #163; the <5 ceiling is enforced in
    # .github/dependabot.yml so it cannot be lifted again while the default model
    # is jina-v2-base-code.)
    "transformers>=4.40,<5",
    "sentence-transformers",
]

[project.scripts]
agent-index = "agent_index.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts + fake tokens are expected in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
