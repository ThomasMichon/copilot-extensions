[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-index"
version = "0.1.0-dev20"
description = "Portable indexing and semantic-search engine for a harness repo and its immediate ecosystem."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "mcp>=1.9,<2.0",
    "agent-zdd",
    # Store + chunking belong to the light, torch-free SERVICE runtime: it
    # reads/writes the LanceDB store and chunks source with tree-sitter (falling
    # back to line-based chunking when a grammar is absent). The heavy embedding
    # stack (torch + ...) is the separate ``engine`` extra, provisioned only on
    # the engine host so a routine service update never rebuilds it (effort
    # agent-index-engine-daemon).
    "lancedb",
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-python>=0.23,<1.0",
    "tree-sitter-javascript>=0.23,<1.0",
    "tree-sitter-typescript>=0.23,<1.0",
    "tree-sitter-bash>=0.23,<1.0",
    # Structured adoption config (.agent-index/config.yaml: role, indexer
    # designation, routing). Small, pure-Python, torch-free -- fine for the light
    # service (effort agent-index-engine-daemon, Phase 6 adoption).
    "pyyaml>=6.0",
]

[tool.uv.sources]
# zero-downtime cutover primitives -- the routing table + cutover orchestrator
# (module ``zdd``), extracted from agent-bridge so other services reuse them.
agent-zdd = { path = "libs/zdd" }

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "fastapi",
]
engine = [
    # The heavy embedding stack -- the durable, persistent ENGINE runtime only,
    # provisioned on the engine host (in a durable venv outside the versioned
    # service runtime). Kept OUT of the service deps so a routine service version
    # cutover never rebuilds torch or reloads the model (effort
    # agent-index-engine-daemon; §warm-durable-engine).
    "torch",
    # jina-v2-base-code loads via trust_remote_code; transformers 5.x broke that
    # custom modeling path (#114). Pin below 5 so every host gets the newest
    # working 4.x -- a compat ceiling, not a capability downgrade.
    "transformers>=4.40,<5",
    "sentence-transformers",
]

[project.scripts]
agent-index = "agent_index.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts + fake tokens are expected in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
