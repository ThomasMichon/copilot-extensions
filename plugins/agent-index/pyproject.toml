[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-index"
version = "0.10.0-dev1"
description = "Portable indexing and semantic-search engine for a harness repo and its immediate ecosystem."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    # Light, ARM64-friendly base: the CLI entry point and the project-aware
    # transport (a client delegates read commands to the indexer host over SSH).
    # A CLIENT installs ONLY this -- it runs no local store/server, and no local
    # embedding engine. The FastAPI/uvicorn/pydantic service shell is the
    # separate [server] extra (see agent-index-server-venv-split); the
    # indexing + vector-store stack is the [store] extra (host); the heavy
    # embedding stack is the separate agent-index-engine package
    # (plugins/agent-index/server/ -- see agent-index-server-package-split).
    # These base deps all ship Windows-ARM64 wheels, so a client provisions on
    # ARM64 laptops.
    "httpx>=0.27",
    "agent-zdd",
    # Windows-headless process-spawn helpers (module ``agent_procutil``); vendored
    # per plugin, byte-identical src across copies.
    "agent-procutil",
    # Structured adoption config (.agent-index/config.yaml: role, indexer
    # designation, routing). Small, pure-Python.
    "pyyaml>=6.0",
    # Shared providers.d scan/classify primitive (external content-domain
    # providers); vendored per plugin, byte-identical src across copies.
    "agent-dropin-registry",
]

[tool.uv.sources]
# zero-downtime cutover primitives -- the routing table + cutover orchestrator
# (module ``zdd``), extracted from agent-bridge so other services reuse them.
agent-zdd = { path = "libs/zdd" }
# `path` escapes this plugin's own root and resolves live to
# `libs/agent-procutil`, so this `dev`-branch checkout has nothing to keep
# manually in sync -- only a real `main`-branch release
# (tools/materialize_main.py) ever gets a real local copy.
agent-procutil = { path = "libs/agent-procutil" }
agent-dropin-registry = { path = "libs/dropin-registry" }

[project.optional-dependencies]
store = [
    # The indexing + vector-store stack: reads/writes the LanceDB store and chunks
    # source with tree-sitter (falling back to line-based chunking when a grammar
    # is absent). Provisioned on a HOST only (the light, torch-free SERVICE
    # runtime) -- a client delegates over SSH and never touches the local store,
    # and these have no Windows-ARM64 wheels (an ARM64 client that pulled them
    # backtracked to pylance==0.0.2/pyarrow==8.0.0 and failed to build). The
    # search/indexing modules import them LAZILY, so the light base loads fine
    # without them. The heavy embedding stack is the separate agent-index-engine
    # package (plugins/agent-index/server/) -- see efforts/active/
    # agent-index-server-package-split.
    "numpy>=2.2.6",
    "pyarrow>=25.0.1",
    "lancedb",
    "tree-sitter>=0.26.0,<1.0",
    "tree-sitter-python>=0.25.0,<1.0",
    "tree-sitter-javascript>=0.25.0,<1.0",
    "tree-sitter-typescript>=0.23.2,<1.0",
    "tree-sitter-bash>=0.25.1,<1.0",
    # The legacy `agent-index mcp` stdio MCP server (mcp_app). HOST-side and
    # lazily imported (cmd_mcp) -- a client reaches tools through the agent-mcp
    # `cli` bridge (which spawns `agent-index <sub>`), never `agent-index mcp`.
    # Kept out of the client base because `mcp` pulls `cryptography` (a Rust
    # extension) with no Windows-ARM64 wheel, which fails to build on an ARM64
    # client (#1516).
    "mcp>=2.0,<3.0",
]
server = [
    # The FastAPI/uvicorn/pydantic HTTP service shell (`agent_index.server`):
    # the actual `/search`/`/reindex`/drain/cutover-routing HTTP surface.
    # Extracted out of BASE so a pure client never installs it -- but as of
    # this extras split, `[server]` is still installed into the SAME shared
    # per-version host venv as `[store]` (`Install-Runtime`'s host role
    # installs `[store,server]` together; see `install.ps1`/`install.sh`).
    # The dedicated, separately-provisioned sibling SERVER venv described by
    # agent-index-server-venv-split (a version-coupled venv distinct from the
    # client/orchestrator venv, not durable like the embedding engine) is
    # still a separate, not-yet-implemented Plan item -- `config.
    # server_venv_python()` is inert scaffolding for it today. Distinct from
    # the separate agent-index-engine package's own tiny RPC shim
    # (agent_index_engine.app, plugins/agent-index/server/ -- note the
    # directory-name collision with THIS extra, purely coincidental:
    # agent-index-engine is the durable embedding daemon, this [server]
    # extra is the version-coupled index/query HTTP service), which
    # declares its own fastapi/uvicorn/pydantic dependency directly rather
    # than relying on this extra.
    "fastapi>=0.110",
    "uvicorn>=0.52.3",
    "pydantic>=2.0",
]
dev = [
    "pytest",
    "httpx",
    # The test suite exercises the store/indexing/search/server modules, so dev
    # pulls the [store]/[server] extras (self-reference) even though a client
    # runtime does not.
    "agent-index[store,server]",
]

[project.scripts]
agent-index = "agent_index.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts + fake tokens are expected in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
