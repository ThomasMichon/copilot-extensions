[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dispatch"
version = "0.12.12-dev1"
description = "Portable agent task-queue + per-host coordinator: a single-writer SQLite work queue so agents coordinate without push latency or an account per agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
    "agent-zdd",
    "agent-procutil",
    "agent-dropin-registry",
    "agent-plugin-activation",
    "agent-plugin-resolve",
    "agent-single-instance-lease",
]

[tool.uv.sources]
# zero-downtime cutover primitives -- the routing table + cutover orchestrator
# (module ``zdd``). This is a `uv`-editable canonical reference
# (vendor-pointer-generalization effort, Phase 1): `path` escapes this
# plugin's own root and resolves live to `libs/zdd`, so this `dev`-branch
# checkout has nothing to keep manually in sync -- only a real
# `main`-branch release (tools/materialize_main.py) ever gets a real local
# copy. The installer-driven graceful daemon cutover still reuses the same
# shared library either way.
agent-zdd = { path = "libs/zdd" }
# `path` escapes this plugin's own root and resolves live to
# `libs/agent-procutil`, so this `dev`-branch checkout has nothing to keep
# manually in sync -- only a real `main`-branch release
# (tools/materialize_main.py) ever gets a real local copy.
agent-procutil = { path = "libs/agent-procutil" }
# Resilient tri-state scans/findings for registrar.d.
agent-dropin-registry = { path = "libs/dropin-registry" }
# Effective plugin enablement and identity-verified root resolution.
agent-plugin-activation = { path = "libs/plugin-activation" }
# Copilot CLI + Claude marketplace/plugin/settings resolution.
agent-plugin-resolve = { path = "libs/plugin-resolve" }
# Single-instance lease (module ``single_instance_lease``). Supplies the
# shared fail-safe supersession decision (``is_superseded``) that
# ``self_retire.py`` wraps. This is a `uv`-editable canonical reference
# (vendor-pointer-generalization effort, Phase 1): `path` escapes this
# plugin's own root and resolves live to `libs/single-instance-lease`, so
# every consumer shares one canonical copy.
agent-single-instance-lease = { path = "libs/single-instance-lease" }

[project.optional-dependencies]
mcp = [
    "mcp>=2.1.1,<3",
]
dev = [
    "pytest>=9.1.1",
    "mcp>=2.1.1,<3",
    "httpx2",
]

[project.scripts]
agent-dispatch = "agent_dispatch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Built-in named worker identities (agent_dispatch.worker_identities); must be
# shipped in the wheel, not just present in an editable/dev checkout.
agent_dispatch = ["identities/*.identity.md"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts + fake tokens are expected in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "guard: fast structural/contract guard tests run automatically in the pre-push hook",
]
