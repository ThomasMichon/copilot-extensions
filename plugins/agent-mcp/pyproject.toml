[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mcp"
version = "0.2.0-dev95"
description = "MCP swiss-army bridge -- wrap an upstream MCP server and apply auth + a decorator stack (filter, rename, defer, code-mode, storage, transform, gate)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "pyyaml>=6.0.3",
    "agent-credential-relay",
    "agent-procutil",
    "agent-single-instance-lease",
]

[tool.uv.sources]
# credential-relay framework + host-credential sources (module ``credential_relay``).
# Vendored locally; resolved from the path, never an index. The injectors reuse the
# az_login / gh_auth / git_credential token-acquisition logic from this lib.
agent-credential-relay = { path = "libs/credential-relay" }
# Windows-headless process-spawn helpers (module ``agent_procutil``). Vendored per
# plugin; byte-identical src across copies.
agent-procutil = { path = "libs/agent-procutil" }
# single-instance lease (module ``single_instance_lease``). Vendored per plugin;
# byte-identical src across copies. The serve session-host acquires it so at most
# one warm multiplexer host runs per AGENT_MCP_HOME, making it safe for the thin
# forwarders to race-spawn it on demand (#744).
agent-single-instance-lease = { path = "libs/single-instance-lease" }

[project.scripts]
agent-mcp = "agent_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The code-mode decorator ships a Node harness alongside the Python package.
"agent_mcp.decorators" = ["*.js"]

[tool.ruff]
target-version = "py310"
line-length = 99

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff.lint]
# S603/S607: subprocess calls to az/gh/git and the wrapped stdio child are intentional.
# S310: urllib.request targets the bridge's configured upstream URL via Request objects.
ignore = ["S603", "S607", "S310"]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts + fake tokens are expected in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
