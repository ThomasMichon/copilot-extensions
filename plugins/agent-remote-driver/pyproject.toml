[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-remote-driver"
version = "0.1.95-dev1"
description = "Independent Copilot execution core and reattachable Session Host"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "agent-copilot-driver-core",
    "agent-plugin-activation",
]

[project.scripts]
agent-remote-driver = "agent_remote_driver_app:main"

[project.optional-dependencies]
sdk = [
    "agent-copilot-driver-core[sdk]",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "setuptools>=83.0.0",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
agent-copilot-driver-core = { path = "libs/copilot-driver-core" }
agent-plugin-activation = { path = "libs/plugin-activation" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.copilot-extensions.application]
setup = []
start = ["__source-start"]
remove = "agent_remote_driver_app.application_removal:main"

[tool.ruff]
target-version = "py310"
line-length = 99
