[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-copilot-driver-core"
version = "0.1.1-dev1"
description = "Independent Copilot execution core and reattachable Session Host"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "agent-procutil",
    "agent-repository-policy",
    "agent-zdd",
    "websockets>=15,<16",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
agent-procutil = { path = "../agent-procutil" }
agent-repository-policy = { path = "../repository-policy" }
agent-zdd = { path = "../zdd" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99
