# ~/.agent-worktrees/repos.yaml -- worktrees repo registry (reference example)
#
# Canonical, copy-pasteable example of the global, machine-wide repo registry.
# Field docs: the agent-worktrees-repos SKILL.md "Schema" section.

srcroot:
  windows: D:\Src
  wsl: ~/src

# Explicit owner-wide routing. Manage with `repos account set/list/unset`.
# Logins describe the operator's accounts, not the upstream publisher.
account_map:
  "github.com:*": operator-work   # preferred identity for otherwise unpinned repos
  example-org: operator-work

repos:
  tooling:
    class: worktree                # reference | singleton | worktree
    remote: "https://github.com/publisher/tooling.git"
    account: operator-public       # exact repo exception, not the publisher
    default_branch: main
    tags: [multi-machine system]               # filter tags for batch ops
    contributing: CONTRIBUTING.md  # read before editing
    windows: D:\Src\tooling
    wsl: ~/src/tooling

  some-upstream-dep:
    class: reference
    remote: "https://github.com/org/some-dep.git"
    windows: D:\Src\some-dep
