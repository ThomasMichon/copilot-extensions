# ~/.agent-worktrees/repos.yaml -- worktrees repo registry (reference example)
#
# Canonical, copy-pasteable example of the global, machine-wide repo registry.
# Field docs: the agent-worktrees-repos SKILL.md "Schema" section.

srcroot:
  windows: D:\Src
  wsl: ~/src

# Decoupled GitHub owner/org -> gh account login. Applies to any repo hosted
# under the owner -- including *orgs* that are not themselves gh accounts
# (github, odsp-microsoft) -- so their repos resolve to the right login instead
# of the org name. Manage with `repos account set/list/unset`. The identities
# below are catalogued in ~/.agent-worktrees/accounts.yaml.
account_map:
  github: ThomasMichon
  odsp-microsoft: tmichon_microsoft

repos:
  copilot-extensions:
    class: worktree                # reference | singleton | worktree
    remote: "https://github.com/ThomasMichon/copilot-extensions.git"
    account: ThomasMichon          # optional; else account_map, else remote owner
    default_branch: main
    tags: [multi-machine system]               # filter tags for batch ops
    contributing: CONTRIBUTING.md  # read before editing
    windows: D:\Src\copilot-extensions   # per-platform checkout paths
    wsl: ~/src/copilot-extensions

  some-upstream-dep:
    class: reference
    remote: "https://github.com/org/some-dep.git"
    windows: D:\Src\some-dep
