# <repo>/.agent-worktrees/related.yaml -- per-project related repos (reference example)
#
# Canonical, copy-pasteable example. A committed, in-repo file recording -- from
# THIS repo's point of view -- the other repos relevant to it, and where to work
# on them. Keys are names in the global repos.yaml registry. Field docs: the
# agent-worktrees-related SKILL.md. Managed by `agent-worktrees related ...`.

primary: example-web                 # the default/primary related repo
related:
  example-web:
    role: product                 # product|dependency|consumer|tooling|docs|sibling
    summary: "Primary product monorepo we ship changes to."
    doc: related/example-web.md      # narrative, relative to .agent-worktrees/
    locus:
      preferred: codespace        # local | machine:<key> | codespace | container
      machines: [dev6]            # boxes the repo is available on (optional)
      # CodeSpace venue -- cloud, usable from ANY machine.
      codespace: { repo: org/example-web-codespaces,
                   machine: largePremiumLinux256gb, location: EastUs,
                   workspace_folder: /workspaces/example-web }
      # Container venue -- a local Docker dev-container fleet, scoped to the
      # boxes that host it (`machines` restricts where it can run).
      container: { repo: org/example-web-codespaces,
                   workspace_folder: /workspaces/example-web,
                   machines: [dev6] }
    delegate: { via: agent-codespaces }   # agent-bridge | agent-codespaces | agent-containers | none
    # Related-repo plugins are copied from the dispatch host's installed
    # payload and passed to the destination as --plugin-dir. Git-backed and
    # repo-local marketplaces both work when installed on the dispatch host.
    plugins:
      - { source: example-web-agent@example-marketplace }
    # Ownership posture: contribution/authority (who maintains it, who
    # reviews it) -- NOT the AI-attribution axis (see `audience` below for
    # that). Derived ONCE at registration from the operator's own gh account
    # logins + the remote, then authoritative; an explicit value always wins
    # over the derivation.
    #   owned    -- operator wholly owns it (own gh namespace, or marked so)
    #   internal -- org-internal, not owned (e.g. an enterprise ADO org repo)
    #   external -- public/external, not owned
    ownership: external
    owner: octocat                        # resolving operator account login (optional)
    # Audience: who can read what gets published here -- the axis that
    # drives the AI-attribution decision, orthogonal to `ownership` above (an
    # operator-owned repo can still be `public`; a third-party repo could be
    # a `private` invited-collaborator-only fork). Never derived
    # automatically -- set explicitly when it matters; omitted means
    # "unclassified" and consumers judge the target themselves rather than
    # silently assuming the disclosure-exempt case.
    #   public    -- visible on the public internet. Disclosure applies by
    #                default.
    #   internal  -- org-internal (enterprise ADO, internal Gitea): visible to
    #                coworkers/org members, not the public internet.
    #                Disclosure applies by default, same as public.
    #   private   -- not visible beyond the operator (and explicitly invited
    #                collaborators). Disclosure is not required, but this
    #                must be a positive, verified classification -- never a
    #                default assumed in the absence of evidence.
    audience: public
    # Optional per-repo AI-attribution override, consumed by the
    # ai-attribution plugin. Both keys default to the audience-derived
    # policy (true for public/internal/unclassified, false for private) when
    # omitted; an explicit value here only ever narrows disclosure (turns it
    # OFF for a case the operator has consciously decided doesn't need it),
    # never widens it beyond what the audience already requires.
    ai_attribution:
      disclose_on_open: false             # e.g. the operator opens issues/PRs here directly
      disclose_on_reply: true             # but still discloses when replying to others' threads
  copilot-extensions:
    role: tooling
    summary: "Source of the plugins this control plane drives."
    doc: related/copilot-extensions.md
    locus: { preferred: machine:dev6, machines: [dev6, cloud1] }
    delegate: { via: agent-bridge }
    ownership: owned                       # operator's own gh namespace
