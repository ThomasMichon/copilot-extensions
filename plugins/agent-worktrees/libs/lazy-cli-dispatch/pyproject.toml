[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is namespaced (agent-lazy-cli-dispatch, not the
# squattable "lazy-cli-dispatch") to prevent dependency-confusion; the
# import module is ``lazy_cli_dispatch``. Mirrors agent-procutil / agent-
# ssh-manager.
name = "agent-lazy-cli-dispatch"
version = "0.1.0-dev1"
description = "Shared two-phase (argv-peek, lazy-import-by-table) fast-dispatch mechanism for agent-* Copilot CLI entry roots"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
# Pure stdlib (argparse + importlib); no runtime dependencies.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert` (pytest).
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
