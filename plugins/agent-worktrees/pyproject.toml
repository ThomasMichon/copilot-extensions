[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-worktrees"
version = "1.5.5-dev76"
description = "Worktree isolation system for concurrent Copilot CLI sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "websocket-client>=1.8.0",
    "agent-config-migrate",
    "agent-plugin-resolve",
    "agent-procutil",
    "agent-dropin-registry",
    "agent-plugin-activation",
    "agent-single-instance-lease",
]

[tool.uv.sources]
# Always resolve the vendored config-schema-migration lib from the local path,
# never an index. Distribution name is namespaced (agent-config-migrate, not the
# squattable "config-migrate") to prevent dependency-confusion; the import
# module stays ``config_migrate``.
agent-config-migrate = { path = "libs/config-migrate" }
# Copilot CLI + Claude plugin resolution -- marketplaces, plugins, repo settings
# (module ``plugin_resolve``). Shared with agent-bridge / agent-codespaces.
agent-plugin-resolve = { path = "libs/plugin-resolve" }
# Shared Windows-headless / detached process-spawn kwargs (module
# ``agent_procutil``). Vendored per plugin; byte-identical src across copies.
agent-procutil = { path = "libs/agent-procutil" }
# Resilient scan authority, entry decisions, and bounded warning tracking for
# filesystem registries (module ``dropin_registry``).
agent-dropin-registry = { path = "libs/dropin-registry" }
# Effective global-or-adopted-project plugin eligibility and identity-verified
# roots for attributed registry entries (module ``plugin_activation``).
agent-plugin-activation = { path = "libs/plugin-activation" }
# Single-instance lease (module ``single_instance_lease``). Vendored per
# plugin; byte-identical src across copies. Guards "one active classify pass
# per project per host" (plugin-process-hygiene Phase 4c, #2315): a losing
# caller waits for the winner's pass to finish, then reads its repaired
# session-render cache instead of racing it or falling back to a wrong
# heuristic.
agent-single-instance-lease = { path = "libs/single-instance-lease" }

[project.scripts]
agent-worktrees = "agent_worktrees.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "guard: fast structural/contract guard tests (marketplace + picker integrity) run automatically in the pre-push hook; the full suite runs in CI",
]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Ported TUI rendering engine: intentional box/arrow glyphs (â€¹ â€º â—€ â–¶ etc.) trip
# the ambiguous-unicode checks (RUF001-003), and the dense render loops use
# tuple-unpacking where not every field is read (B007/RUF005/RUF059). These are
# faithful to the design prototype and harmless in a self-contained UI module.
"src/agent_worktrees/picker_tui/engine.py" = [
    "RUF001", "RUF002", "RUF003", "B007", "RUF005", "RUF059",
]

[tool.setuptools.packages.find]
where = ["src"]
