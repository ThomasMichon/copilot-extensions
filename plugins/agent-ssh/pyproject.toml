[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ssh"
version = "0.1.0-dev75"
description = "SSH profile emitter, verifier, and transport-provider contract for the agent fabric"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "pyyaml>=6.0.3",
    "agent-procutil",
    "agent-dropin-registry",
]

[tool.uv.sources]
# Shared Windows-headless / detached process-spawn kwargs, vendored per plugin
# (byte-identical src across copies; see tools/check-vendored-libs-sync.py).
agent-procutil = { path = "libs/agent-procutil" }
# Tri-state managed-fragment scans and bounded operational warnings.
agent-dropin-registry = { path = "libs/dropin-registry" }

[project.scripts]
agent-ssh = "agent_ssh.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "jsonschema>=4.26.0",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]

[tool.pytest.ini_options]
markers = [
    "guard: fast structural and contract checks",
]
