[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ssh-manager"
version = "0.1.0-dev27"
description = "Shared SSH ControlMaster connection multiplexer for Copilot CLI plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = ["agent-procutil"]

[tool.uv.sources]
# ssh-manager is itself consumed as a `uv`-editable canonical reference by
# every plugin (vendor-pointer-generalization effort, Phase 1); its own
# dependency on agent-procutil must resolve `editable = true` too, or a
# consumer that ALSO depends on agent-procutil directly (with its own
# `editable = true` entry) hits a uv resolution conflict: the same file
# path required both editable (via the consumer's direct dependency) and
# non-editable (via this transitive one) at once.
agent-procutil = { path = "../agent-procutil" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires real SSH host (set SSH_MANAGER_INTEGRATION_HOST)",
]
