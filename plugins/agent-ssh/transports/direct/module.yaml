# First-party in-box transport: plain SSH to a routable address, only where
# inbound is permitted. It ships NO proxy_command recipe -> the core emits plain
# `Host` blocks with no ProxyCommand. Self-contained (the OpenSSH client is the
# common floor; nothing to install and no provider/multi-machine system config), so it ships
# in-box alongside dtssh. A machine opts into it via its registry `transport: direct`.
module: direct
kind: transport
summary: Plain SSH to a routable address (no tunnel).
produces:
  ssh_profile: true
  keyed_by: machine-name
inbound_ports: some          # a direct/listening transport is the deliberate exception
topology:
  default: per-machine
  supported: [per-machine]
capabilities:
  install-client: false      # OpenSSH client is the common floor; nothing extra
  emit-profile: true
  verify: true
  provision-server: false
# no proxy_command: direct dials the host itself.
