module: dtssh
kind: transport
summary: Zero-inbound real-user interactive reach through dtssh over Microsoft Dev Tunnels.
# First-party in-box transport (self-contained: the public `dtssh` tool over the
# public Microsoft Dev Tunnels service; operator identity is injected at deploy
# time, so there is no non-public provider/facility config to externalize).
# agent-ssh's public contract exposes {hostname}, not a provider-specific
# {tunnel}. The deploy glue resolves the live dtssh tunnel id and writes it into
# each normalized machine record's hostname field.
proxy_command: "{proxy_binary} proxy {hostname} --port {port}"
proxy_binary_default: dtssh
produces:
  ssh_profile: true
  keyed_by: machine-name
inbound_ports: none          # dtssh hosts an outbound Microsoft Dev Tunnel; no inbound firewall port
topology:
  default: per-machine
  supported: [per-machine]
capabilities:
  install-client: true
  emit-profile: true
  verify: true
  provision-server: true     # transport-owned host setup; entrypoint is scripts/install-host.*
config_schema: schema/config.schema.json
entrypoints:
  install-client:
    posix: scripts/install-client.sh
    windows: scripts/install-client.ps1
  provision-server:
    posix: scripts/install-host.sh
    windows: scripts/install-host.ps1
