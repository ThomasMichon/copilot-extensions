# ~/.agent-logger/config.yaml -- session-sync configuration (reference example)
#
# Canonical, copy-pasteable example showing every sync target. Pick ONE with
# `sync.target` and keep the matching block under `sync.targets`. Field docs:
# the session-sync-setup SKILL.md. Verify with `session-sync doctor`.
#
# Repositories that need their own log tree/format should commit a repo-local
# `.agent-logger.yaml` with a `log:` block instead of putting repo-specific
# layout here. Machine-local config remains the place for sync targets.

sync:
  target: local                 # local | onedrive | ssh | ssh-tunnel | ingest
  source: null                  # null => ~/.copilot
  retention_days: 90            # or "infinite" to keep everything
  repo_allowlist: []            # include matching repos only; [] => all
  repo_allowlist_fail_closed: false
  repo_denylist: []             # exclude matching repos
  harness_repos: []             # origin.json derivation for downstream routing
  # Cold-session compaction (opt-in). Archive very old, inactive sessions into
  # a compressed store to reclaim space. Run by `session-sync compact` (local)
  # and `session-sync compact-hub` (the OneDrive/local hub backlog); with
  # `enabled: true`, `session-sync run` also pushes the archive store to the
  # hub and reconciles away the uncompressed duplicates.
  compact:
    enabled: false              # opt-in
    codec: targz                # tar.gz (stdlib); pluggable (zstd later)
    min_age_days: 30            # only sessions at least this old
    require_untracked_worktree: true  # skip sessions of picker-tracked worktrees
    archive_root: null          # null => <home>/archived-sessions (out of ~/.copilot)
  notify:
    url: null                   # optional post-push HTTP POST; {machine} expands
    bearer_token_file: null
    timeout: 5

  targets:
    # Local (default) -- explicit path.
    local:
      path: ~/SessionArchive

    # OneDrive hub.
    onedrive:
      subfolder: Apps/agent-logger/sessions
      # root: C:/Users/<you>/OneDrive   # set if no OneDrive* env var / ~/OneDrive

    # SSH to a host you control.
    ssh:
      host: user@hub.example.com
      remote_path: /srv/copilot-sessions
      proxy_jump: jump.example.com      # optional

    # SSH routed through a jump host.
    ssh-tunnel:
      host: user@hub.example.com
      remote_path: /srv/copilot-sessions
      tunnel_host: jump.example.com

    # Ingest -- push to a processing service's rsync-daemon sink.
    ingest:
      url: rsync://hub.example.com/sessions       # or host::module/path
      password_file: ~/.agent-logger/rsync.pass   # optional
      notify_url: https://hub.example.com/api/notify?machine={machine}  # optional

# Optional global fallback for repos with no repo-local .agent-logger.yaml.
log:
  root: null
  path_template: "{year}/{month}/{day} {hhmmss} {title}.md"
  timezone: null
  note_marker: "SESSION NOTE:"
  template: null
  narration_style: null
  exemplars: null
  closing_remark: null
