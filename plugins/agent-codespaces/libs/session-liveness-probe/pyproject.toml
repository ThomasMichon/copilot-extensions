[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is namespaced (agent-session-liveness-probe, not the
# squattable "session-liveness-probe") to prevent dependency-confusion; the
# import module is ``session_liveness_probe``. Mirrors agent-procutil /
# agent-ssh-manager.
name = "agent-session-liveness-probe"
version = "0.1.0-dev3"
description = "Shared Copilot CLI session-liveness probe (inuse.*.lock + /proc backstop), transport-agnostic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
# Pure stdlib (re + uuid + dataclasses); no runtime dependencies.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert` (pytest).
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
