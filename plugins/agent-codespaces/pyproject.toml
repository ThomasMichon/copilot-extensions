[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-codespaces"
version = "0.5.16-dev1"
description = "GitHub Codespaces lifecycle management, SSH transport, and credential relay"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "pyyaml>=6.0.3",
    "agent-ssh-manager",
    "agent-credential-relay",
    "agent-config-migrate",
    "agent-plugin-resolve",
    "agent-procutil",
    "agent-dropin-registry",
    "agent-plugin-activation",
    "agent-venue-copilot",
    "agent-zdd",
    "agent-session-liveness-probe",
    "agent-single-instance-lease",
]

[tool.uv.sources]
# Always resolve the vendored lib from the local path, never an index.
# The distribution is named agent-ssh-manager (not the squatted PyPI name
# "ssh-manager") to prevent dependency-confusion; the import module stays
# ``ssh_manager``. This is a `uv`-editable canonical reference
# (vendor-pointer-generalization effort, Phase 1): `path` escapes this
# plugin's own root and resolves live to `libs/ssh-manager`, so this
# `dev`-branch checkout has nothing to keep manually in sync -- only a
# real `main`-branch release (tools/materialize_main.py) ever gets a real
# local copy.
agent-ssh-manager = { path = "libs/ssh-manager" }
# credential-relay framework + host-credential sources (module ``credential_relay``).
# This is a `uv`-editable canonical reference (vendor-pointer-generalization
# effort, Phase 1): `path` escapes this plugin's own root and resolves live
# to `libs/credential-relay`, so this `dev`-branch checkout has nothing to
# keep manually in sync -- only a real `main`-branch release
# (tools/materialize_main.py) ever gets a real local copy.
agent-credential-relay = { path = "libs/credential-relay" }
# config schema versioning + migration (module ``config_migrate``). This is
# a `uv`-editable canonical reference (vendor-pointer-generalization
# effort, Phase 1): `path` escapes this plugin's own root and resolves
# live to `libs/config-migrate`, so every consumer shares one canonical
# copy.
agent-config-migrate = { path = "libs/config-migrate" }
# Copilot CLI + Claude plugin resolution -- marketplaces, plugins, repo settings
# (module ``plugin_resolve``). Shared with agent-bridge.
agent-plugin-resolve = { path = "libs/plugin-resolve" }
# Windows-headless process-spawn helpers (module ``agent_procutil``). This
# is a `uv`-editable canonical reference (vendor-pointer-generalization
# effort, Phase 1 -- converted early as a prerequisite for `ssh-manager`'s
# own conversion, which depends on it): `path` escapes this plugin's own
# root and resolves live to `libs/agent-procutil`, so this `dev`-branch
# checkout has nothing to keep manually in sync -- only a real
# `main`-branch release (tools/materialize_main.py) ever gets a real
# local copy.
agent-procutil = { path = "libs/agent-procutil" }
# Resilient scan authority, entry decisions, and bounded warning tracking for
# config.d (module ``dropin_registry``).
agent-dropin-registry = { path = "libs/dropin-registry" }
# Effective global-or-adopted-project plugin eligibility and identity-verified
# roots for active manifest declarations and attributed compatibility pointers.
agent-plugin-activation = { path = "libs/plugin-activation" }
# Provider-agnostic reserve/connect/release orchestration for the venue
# `copilot` verb (module ``venue_copilot``). This is a `uv`-editable
# canonical reference (vendor-pointer-generalization effort, Phase 1):
# `path` escapes this plugin's own root and resolves live to
# `libs/venue-copilot`, so this `dev`-branch checkout has nothing to keep
# manually in sync -- only a real `main`-branch release
# (tools/materialize_main.py) ever gets a real local copy.
agent-venue-copilot = { path = "libs/venue-copilot" }
# Routing-table reader (module ``zdd``) -- used read-only, without importing
# agent_bridge, to resolve the host daemon's own live API port for the
# `copilot` verb's daemon-port reverse forward. Shared with agent-bridge/
# agent-containers.
agent-zdd = { path = "libs/zdd" }
# Transport-agnostic Copilot CLI session-liveness probe (inuse.*.lock +
# /proc backstop, module ``session_liveness_probe``). This is a
# `uv`-editable canonical reference (vendor-pointer-generalization effort,
# Phase 1): `path` escapes this plugin's own root and resolves live to
# `libs/session-liveness-probe`, so this `dev`-branch checkout has nothing
# to keep manually in sync -- only a real `main`-branch release
# (tools/materialize_main.py) ever gets a real local copy.
agent-session-liveness-probe = { path = "libs/session-liveness-probe" }
# OS-held lock (module ``single_instance_lease``): one transcript-mirror pass
# per CodeSpace across Connection Owners. Shared with agent-bridge/agent-dispatch.
agent-single-instance-lease = { path = "libs/single-instance-lease" }

[project.scripts]
agent-codespaces = "agent_codespaces.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_codespaces = [
    "codespace_assets/ado-auth-helper-relay",
    "codespace_assets/ado-auth-helper-wrapper",
    "codespace_assets/auth-error-policy.instructions.md",
]

[tool.ruff]
target-version = "py310"
line-length = 99

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff.lint]
ignore = ["S603"]  # subprocess calls to gh CLI are intentional
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "guard: fast structural/contract guard tests run automatically in the pre-push hook; the full suite runs in CI",
]
