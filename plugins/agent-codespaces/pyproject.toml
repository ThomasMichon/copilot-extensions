[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-codespaces"
version = "0.4.7-dev2"
description = "GitHub Codespaces lifecycle management, SSH transport, and credential relay"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "pyyaml>=6.0.3",
    "agent-ssh-manager",
    "agent-credential-relay",
    "agent-config-migrate",
    "agent-plugin-resolve",
    "agent-procutil",
    "agent-dropin-registry",
    "agent-plugin-activation",
    "agent-venue-copilot",
    "agent-zdd",
    "agent-session-liveness-probe",
]

[tool.uv.sources]
# Always resolve the vendored lib from the local path, never an index.
# The distribution is named agent-ssh-manager (not the squatted PyPI name
# "ssh-manager") to prevent dependency-confusion; the import module stays
# ``ssh_manager``.
agent-ssh-manager = { path = "libs/ssh-manager" }
# credential-relay framework + host-credential sources (module ``credential_relay``).
agent-credential-relay = { path = "libs/credential-relay" }
# config schema versioning + migration (module ``config_migrate``).
agent-config-migrate = { path = "libs/config-migrate" }
# Copilot CLI + Claude plugin resolution -- marketplaces, plugins, repo settings
# (module ``plugin_resolve``). Shared with agent-bridge.
agent-plugin-resolve = { path = "libs/plugin-resolve" }
# Windows-headless process-spawn helpers (module ``agent_procutil``). Vendored
# per plugin; byte-identical src across copies.
agent-procutil = { path = "libs/agent-procutil" }
# Resilient scan authority, entry decisions, and bounded warning tracking for
# config.d (module ``dropin_registry``).
agent-dropin-registry = { path = "libs/dropin-registry" }
# Effective global-or-adopted-project plugin eligibility and identity-verified
# roots for active manifest declarations and attributed compatibility pointers.
agent-plugin-activation = { path = "libs/plugin-activation" }
# Provider-agnostic reserve/connect/release orchestration for the venue
# `copilot` verb (module ``venue_copilot``). Shared with agent-containers.
agent-venue-copilot = { path = "libs/venue-copilot" }
# Routing-table reader (module ``zdd``) -- used read-only, without importing
# agent_bridge, to resolve the host daemon's own live API port for the
# `copilot` verb's daemon-port reverse forward. Shared with agent-bridge/
# agent-containers.
agent-zdd = { path = "libs/zdd" }
# Transport-agnostic Copilot CLI session-liveness probe (inuse.*.lock +
# /proc backstop, module ``session_liveness_probe``). Shared with
# agent-containers.
agent-session-liveness-probe = { path = "libs/session-liveness-probe" }

[project.scripts]
agent-codespaces = "agent_codespaces.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_codespaces = [
    "codespace_assets/ado-auth-helper-relay",
    "codespace_assets/ado-auth-helper-wrapper",
    "codespace_assets/auth-error-policy.instructions.md",
]

[tool.ruff]
target-version = "py310"
line-length = 99

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff.lint]
ignore = ["S603"]  # subprocess calls to gh CLI are intentional
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "guard: fast structural/contract guard tests run automatically in the pre-push hook; the full suite runs in CI",
]
