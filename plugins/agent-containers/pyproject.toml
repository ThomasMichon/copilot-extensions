[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-containers"
version = "0.1.3-dev2"
description = "Local Docker dev-container fleet management, lease broker, and agent-bridge container: namespace resolver"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "pyyaml>=6.0.3",
    "agent-ssh-manager",
    "agent-credential-relay",
    "agent-config-migrate",
    "agent-procutil",
    "agent-venue-copilot",
    "agent-zdd",
    "agent-session-liveness-probe",
]

[tool.uv.sources]
# Shared OpenSSH process/config primitives used by the trusted-fleet
# transport. This is a `uv`-editable canonical reference
# (vendor-pointer-generalization effort, Phase 1): `path` escapes this
# plugin's own root and resolves live to `libs/ssh-manager`, so this
# `dev`-branch checkout has nothing to keep manually in sync -- only a
# real `main`-branch release (tools/materialize_main.py) ever gets a real
# local copy.
agent-ssh-manager = { path = "../../libs/ssh-manager", editable = true }
# credential-relay framework + host-credential sources (module ``credential_relay``).
# This is a `uv`-editable canonical reference (vendor-pointer-generalization
# effort, Phase 1): `path` escapes this plugin's own root and resolves live
# to `libs/credential-relay`, so this `dev`-branch checkout has nothing to
# keep manually in sync -- only a real `main`-branch release
# (tools/materialize_main.py) ever gets a real local copy.
agent-credential-relay = { path = "../../libs/credential-relay", editable = true }
# config schema versioning + migration (module ``config_migrate``). This is
# a `uv`-editable canonical reference (vendor-pointer-generalization
# effort, Phase 1): `path` escapes this plugin's own root and resolves
# live to `libs/config-migrate`, so every consumer shares one canonical
# copy.
agent-config-migrate = { path = "../../libs/config-migrate", editable = true }
# Windows-headless process-spawn helpers (module ``agent_procutil``). This
# is a `uv`-editable canonical reference (vendor-pointer-generalization
# effort, Phase 1 -- converted early as a prerequisite for `ssh-manager`'s
# own conversion, which depends on it): `path` escapes this plugin's own
# root and resolves live to `libs/agent-procutil`, so this `dev`-branch
# checkout has nothing to keep manually in sync -- only a real
# `main`-branch release (tools/materialize_main.py) ever gets a real
# local copy.
agent-procutil = { path = "../../libs/agent-procutil", editable = true }
# Provider-agnostic reserve/connect/release orchestration for the venue
# `copilot` verb (module ``venue_copilot``). This is a `uv`-editable
# canonical reference (vendor-pointer-generalization effort, Phase 1):
# `path` escapes this plugin's own root and resolves live to
# `libs/venue-copilot`, so this `dev`-branch checkout has nothing to keep
# manually in sync -- only a real `main`-branch release
# (tools/materialize_main.py) ever gets a real local copy.
agent-venue-copilot = { path = "../../libs/venue-copilot", editable = true }
# Routing-table reader (module ``zdd``) -- used read-only, without importing
# agent_bridge, to resolve the host daemon's own live API port for the
# `copilot` verb's daemon-port reverse forward. Shared with agent-bridge/
# agent-codespaces.
agent-zdd = { path = "../../libs/zdd", editable = true }
# Transport-agnostic Copilot CLI session-liveness probe (inuse.*.lock +
# /proc backstop, module ``session_liveness_probe``). This is a
# `uv`-editable canonical reference (vendor-pointer-generalization effort,
# Phase 1): `path` escapes this plugin's own root and resolves live to
# `libs/session-liveness-probe`, so this `dev`-branch checkout has nothing
# to keep manually in sync -- only a real `main`-branch release
# (tools/materialize_main.py) ever gets a real local copy.
agent-session-liveness-probe = { path = "../../libs/session-liveness-probe", editable = true }

[project.scripts]
agent-containers = "agent_containers.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[project.optional-dependencies]
provider-exec = [
    "paramiko>=4.0.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff.lint]
# S603/S607: subprocess calls to docker/gh CLI are intentional.
# S310: urllib.request.urlopen targets the fixed localhost agent-bridge URL
#       via constructed Request objects (no untrusted scheme).
ignore = ["S603", "S607", "S310"]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are expected in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
