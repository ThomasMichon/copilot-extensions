[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-containers"
version = "0.1.2-dev117"
description = "Local Docker dev-container fleet management, lease broker, and agent-bridge container: namespace resolver"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Thomas Michon" }
]
dependencies = [
    "pyyaml>=6.0.3",
    "agent-ssh-manager",
    "agent-credential-relay",
    "agent-config-migrate",
    "agent-procutil",
]

[tool.uv.sources]
# Shared OpenSSH process/config primitives used by the trusted-fleet transport.
agent-ssh-manager = { path = "libs/ssh-manager" }
# credential-relay framework + host-credential sources (module ``credential_relay``).
# Vendored locally; resolved from the path, never an index.
agent-credential-relay = { path = "libs/credential-relay" }
# config schema versioning + migration (module ``config_migrate``).
agent-config-migrate = { path = "libs/config-migrate" }
# Windows-headless process-spawn helpers (module ``agent_procutil``). Vendored
# per plugin; byte-identical src across copies.
agent-procutil = { path = "libs/agent-procutil" }

[project.scripts]
agent-containers = "agent_containers.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 99

[project.optional-dependencies]
provider-exec = [
    "paramiko>=4.0.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff.lint]
# S603/S607: subprocess calls to docker/gh CLI are intentional.
# S310: urllib.request.urlopen targets the fixed localhost agent-bridge URL
#       via constructed Request objects (no untrusted scheme).
ignore = ["S603", "S607", "S310"]
select = ["E", "F", "W", "I", "UP", "S", "B", "A", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are expected in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
