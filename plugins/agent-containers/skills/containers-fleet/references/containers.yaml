# containers.yaml -- agent-containers fleet configuration (starter example)
#
# Looked up from $AGENT_CONTAINERS_CONFIG, ./containers.yaml,
# ~/.agent-containers/containers.yaml, then (only when agent-worktrees is present
# and bound to external state) a knowledge-overlay containers.yaml.

schema_version: 1

# Global defaults; fleets may override workspace_folder, exec_user, and
# acp_command individually.
exec_user: vscode
workspace_folder: /workspace
forward_gh_token: true
image_prefixes:
  - vsc-                              # fallback discovery for VS Code devcontainers

# Credential relay for container exec sessions. Enabled by default in code.
relay:
  enabled: true
  host: host.docker.internal
  port: 9857
  deploy_ado: false                   # optional ado-auth-helper shim
  azure_resources:
    - "*"                             # any Azure scope, gated by per-container token

# Optional: reproduce a designated dotfiles repo inside every fleet container,
# Codespaces-style (docker cp to target, then optional install command).
# Per-user / optional -- omit `repo` to skip entirely.
dotfiles:
  repo: D:/Src/dotfiles                  # host path to the dotfiles repo
  target: /workspaces/.codespaces/.persistedshare/dotfiles   # default
  install_command: bash install.sh       # run in `target` as the remote user; "" skips

# Optional: copy a separate control-plane harness checkout into the container
# for reference at /workspaces/<basename>. No install step by default.
harness:
  repo: D:/Src/control-plane
  # install_command: ""                  # omitted/empty means no install

fleets:
  myrepo:
    repo: your-org/your-repo
    devcontainer_path: D:/Src/myrepo-devcontainer   # dir holding .devcontainer/
    # Needed when the spec is NOT at the default
    # .devcontainer/devcontainer.json -- passed to the devcontainer CLI as
    # --config. Relative paths resolve against devcontainer_path.
    devcontainer_config: .devcontainer/docker/devcontainer.json
    size: 1                              # number of warm containers in the fleet
    name_prefix: myrepo                  # default is the fleet name
    workspace_folder: /workspaces/myrepo # overrides the global workspace for ACP
    exec_user: vscode                    # overrides the global exec user
    # acp_command: "cd /workspaces/myrepo && copilot --acp --stdio --allow-all-tools"
    code_model: clone                    # Model A; mount is not implemented here

  image-only:
    # Alternative backend: docker run + sleep infinity. The image must already
    # contain the user/tooling needed by acp_command.
    image: myregistry/my-agent-image:latest
    size: 1
    exec_user: root
